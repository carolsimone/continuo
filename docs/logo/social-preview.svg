    <ellipse cx="-40" cy="40" rx="160" ry="160" fill="#06B6D4" opacity="0.18" filter="blur(45px)"/>
    <ellipse cx="-70" cy="-60" rx="130" ry="130" fill="#A855F7" opacity="0.2" filter="blur(40px)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -180 -140 C -250 -40, -220 180, 20 220 C 130 240, 220 150, 180 50" stroke="url(#orbitGrad1)" stroke-width="2.5" opacity="0.65"/>
      <path d="M 170 -80 C 230 40, 160 210, -60 220 C -210 230, -240 60, -160 -120" stroke="url(#orbitGrad2)" stroke-width="2" opacity="0.5"/>
      <path d="M -220 -30 C -220 120, -100 230, 80 200" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    </g>
    <g fill="#FFFFFF" filter="url(#starGlow)">
      <circle cx="-165" cy="-85" r="2.2" opacity="0.9"/>
      <circle cx="-190" cy="45" r="1.8" opacity="0.75"/>
      <circle cx="-140" cy="140" r="2.5" opacity="0.9"/>
      <circle cx="-110" cy="180" r="1.5" opacity="0.8"/>
      <circle cx="-40" cy="210" r="2" opacity="0.85"/>
      <circle cx="60" cy="205" r="1.5" opacity="0.7"/>
      <circle cx="150" cy="150" r="2" opacity="0.85"/>
      <circle cx="170" cy="-115" r="1.8" opacity="0.75"/>
      <circle cx="-90" cy="-175" r="2.2" opacity="0.9"/>
      <circle cx="-25" cy="-195" r="1.5" opacity="0.8"/>
      <circle cx="-120" cy="-30" r="1.2" opacity="0.6"/>
      <circle cx="-145" cy="80" r="1.4" opacity="0.7"/>
      <circle cx="20" cy="160" r="1.2" opacity="0.6"/>
    </g>
    <g fill="none" stroke="#38BDF8" stroke-opacity="0.14" stroke-linecap="round">
      <path d="M 125 -125 A 176 176 0 1 0 125 125" stroke-width="22"/>
      <path d="M 90 -90 A 128 128 0 1 0 90 90" stroke-width="22"/>
      <path d="M 56 -56 A 80 80 0 1 0 56 56" stroke-width="22"/>
    </g>
    <g fill="none" stroke="url(#neonGradient)" stroke-linecap="round" filter="url(#plasmaGlow)">
      <path d="M 125 -125 A 176 176 0 1 0 125 125" stroke-width="15"/>
      <path d="M 90 -90 A 128 128 0 0 0 -22 -126" stroke-width="15"/>
      <path d="M -60 -113 A 128 128 0 0 0 -126 -22" stroke-width="15"/>
      <path d="M -126 22 A 128 128 0 0 0 -30 124" stroke-width="15"/>
      <path d="M 22 126 A 128 128 0 0 0 90 90" stroke-width="15"/>
      <path d="M 56 -56 A 80 80 0 0 0 -56 -56" stroke-width="15"/>
      <path d="M -78 -18 A 80 80 0 0 0 -78 18" stroke-width="15"/>
      <path d="M -56 56 A 80 80 0 0 0 56 56" stroke-width="15"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.65">
      <path d="M 125 -125 A 176 176 0 1 0 125 125" stroke-width="3"/>
      <path d="M 90 -90 A 128 128 0 0 0 -22 -126" stroke-width="3"/>
      <path d="M -60 -113 A 128 128 0 0 0 -126 -22" stroke-width="3"/>
      <path d="M -126 22 A 128 128 0 0 0 -30 124" stroke-width="3"/>
      <path d="M 22 126 A 128 128 0 0 0 90 90" stroke-width="3"/>
      <path d="M 56 -56 A 80 80 0 0 0 -56 -56" stroke-width="3"/>
      <path d="M -78 -18 A 80 80 0 0 0 -78 18" stroke-width="3"/>
      <path d="M -56 56 A 80 80 0 0 0 56 56" stroke-width="3"/>
    </g>
  </g>
</svg>
