<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="bgGlow" cx="72%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#121633"/>
      <stop offset="55%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <filter id="plasmaGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b3"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="25%" stop-color="#818CF8"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <g transform="translate(100, 145)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#06B6D4"/>
    <text x="28" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em">CONTROL PLANE FOR DATA</text>
    <text x="0" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="76" font-weight="800" letter-spacing="-0.03em">continuo</text>
    <text x="0" y="146" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="23" font-weight="500">A control plane for data pipelines.</text>
    <text x="0" y="182" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400">Orchestrates dbt &amp; Python without declared dependencies, auto-fixing broken builds.</text>
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="156" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="14" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="12" font-weight="500">⚡ Code-Inferred DAG</text>
      <rect x="166" y="0" width="168" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="180" y="22" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="12" font-weight="500">🛡️ Blue/Green Validate</text>
      <rect x="344" y="0" width="162" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="358" y="22" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="12" font-weight="500">🤖 LLM Fix Proposals</text>
      <rect x="516" y="0" width="138" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="530" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="12" font-weight="500">💬 UI Chat Agent</text>
    </g>
  </g>
  <g transform="translate(960, 320)">
