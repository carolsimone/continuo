<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121633"/>
      <stop offset="60%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <filter id="iconPlasmaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconStarGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="sglow"/>
      <feMerge>
        <feMergeNode in="sglow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="iconNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="25%" stop-color="#818CF8"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
