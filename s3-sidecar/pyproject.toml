[project]
name = "s3-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# Scripts live at the sidecar root; tests do bare `import compile_uploader` etc.
pythonpath = ["."]
