# enola cluster config: one `service` node per service directory, so
# service-to-service queries (impact, find_path, crossrepo edges) work.
# A root-level snapshot would collapse every service into one node.
#
# Rebuild the snapshot:  enola --generate enola-cluster.yaml
# Entries in `repos:` resolve relative to this file; each store is written to
# <service>/.enola (gitignored).
ignore:
  - "**/vendor/**"
  - "**/*_test.go"
  - "**/*.pb.go"
  - "**/mocks/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
  - "**/site-packages/**"
  - "**/.pytest_cache/**"
  - "**/*_test.py"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/.git/**"
  - "**/.enola/**"
  - "**/.worktrees/**"
  - "**/tests/**"
extractors:
  - go
  - python
  - typescript
  - grpc
  - manifests
renderers:
  - llm_context
output:
  dir: ".enola"
  max_context_tokens: 16000
repos:
  - agent-chat
  - agent-remediation
  - cli
  - dbt
  - dead-letter-controller
  - egress-proxy
  - execution-controller
  - orchestrator
  - pkg
  - release-controller
  - remediation
  - s3-sidecar
  - state
  - topology-controller
  - ui
