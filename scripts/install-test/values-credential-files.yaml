# Install-test fixture: every service reads its credentials from files. The
# chart projects each Secret key the service needs into the pod's
# continuo-credentials volume at /var/run/secrets/continuo and sets <VAR>_FILE;
# no credential is in any container's environment. lint.sh asserts that, and
# compares this render with the same values in env delivery so no credential is
# dropped on the way. The LLM and GitHub keys have values here because a file
# delivery leaves out a key the chart knows is empty, which env delivery keeps
# as an empty variable.
credentials:
  delivery: file

llm:
  apiKey: fixture-llm-api-key

github:
  token: fixture-github-token
  appPrivateKey: fixture-github-app-private-key
