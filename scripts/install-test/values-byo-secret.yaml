# Install-test fixture: BYO datastores with credentials from a pre-created
# Secret (run.sh creates `continuo-datastores` in the namespace before helm
# install, mirroring an operator whose secret manager provisions it).
# MinIO and Dex stay bundled: this leg isolates the three BYO datastores.
postgresql:
  enabled: false
externalDatabase:
  host: byo-postgres
  port: 5432
  username: continuo
  existingSecret: continuo-datastores
  existingSecretPasswordKey: postgres-password
  # The fixture Postgres has no TLS configured.
  sslMode: disable
redis:
  enabled: false
externalRedis:
  host: byo-redis
  port: 6379
  existingSecret: continuo-datastores
  existingSecretPasswordKey: redis-password
neo4j:
  enabled: false
externalNeo4j:
  uri: bolt://byo-neo4j:7687
  username: neo4j
  existingSecret: continuo-datastores
  existingSecretPasswordKey: neo4j-password

validation:
  # externalDatabase password lives in an existingSecret, which the chart cannot inline
  # into a chart-created warehouse Secret; supply your own Secret name instead.
  createWarehouseSecret: false
  warehouseSecret: continuo-warehouse-validation
