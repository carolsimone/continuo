syntax = "proto3";

package remediation.v1;

option go_package = "github.com/carolsimone/continuo/remediation-agent/api/remediation/v1;remediationv1";

// RemediationProposals serves the proposal read-path and pull-request lifecycle
// for the remediation-agent. The UI reads proposals via ListProposals/GetProposal
// and drives the PR workflow via BeginPullRequest/RecordPullRequest/FailPullRequest.
service RemediationProposals {
  // ListProposals returns proposals filtered by status, pr_state, and limit.
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  // GetProposal returns a single proposal by ID.
  rpc GetProposal(GetProposalRequest) returns (Proposal);
  // BeginPullRequest atomically claims a proposal for PR creation and returns
  // the data needed to open a GitHub pull-request.
  rpc BeginPullRequest(BeginPullRequestRequest) returns (BeginPullRequestResponse);
  // RecordPullRequest stores the PR URL, number, and opener after a PR is opened.
  rpc RecordPullRequest(RecordPullRequestRequest) returns (RecordPullRequestResponse);
  // FailPullRequest marks a proposal's PR attempt as failed.
  rpc FailPullRequest(FailPullRequestRequest) returns (FailPullRequestResponse);
}

// Proposal is a read-only projection of a remediation proposal row, including
// all PR-lifecycle columns. Fields mirror proposal.View (snake_case).
message Proposal {
  string id = 1;
  string source = 2;
  string release_id = 3;
  string node_id = 4;
  string error_signature = 5;
  int32 attempt = 6;
  string status = 7;
  string confidence = 8;
  string rationale = 9;
  string proposed_sql_uri = 10;
  string diff_uri = 11;
  string candidate_fix_sql_uri = 12;
  string candidate_fix_diff_uri = 13;
  bool source_resolved = 14;
  string repo = 15;
  string commit_sha = 16;
  string file_path = 17;
  string model = 18;
  // created_at is an RFC3339-formatted timestamp string.
  string created_at = 19;
  string pr_url = 20;
  int32 pr_number = 21;
  string pr_state = 22;
  // pr_opened_at is an RFC3339-formatted timestamp string, empty when not yet set.
  string pr_opened_at = 23;
  string pr_opened_by = 24;
  // pr_closed_at is an RFC3339-formatted timestamp string, empty until the PR
  // reaches a terminal outcome (pr_state 'merged' or 'rejected').
  string pr_closed_at = 25;
}

// ListProposalsRequest filters the proposal list. Empty fields are ignored.
message ListProposalsRequest {
  string status = 1;
  string pr_state = 2;
  int32 limit = 3;
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
}

message GetProposalRequest {
  string id = 1;
}

// BeginPullRequestRequest identifies the proposal to claim for PR creation.
message BeginPullRequestRequest {
  string id = 1;
}

// BeginPullRequestResponse carries all data needed to open a GitHub pull-request.
message BeginPullRequestResponse {
  string proposal_id = 1;
  string repo = 2;
  string commit_sha = 3;
  string file_path = 4;
  string proposed_sql_uri = 5;
  string diff_uri = 6;
  string release_id = 7;
  string node_id = 8;
  int32 attempt = 9;
  string rationale = 10;
  string confidence = 11;
  string model = 12;
  // branch is the git branch name to open the PR from.
  string branch = 13;
  // claimed_at is an RFC3339-formatted timestamp string: the pr_claimed_at
  // value this claim actually persisted. FailPullRequest must echo it back
  // so the repository's compare-and-set only releases this exact claim,
  // never a fresher one taken by someone else since.
  string claimed_at = 14;
}

// RecordPullRequestRequest stores the PR metadata after a PR is opened.
message RecordPullRequestRequest {
  string id = 1;
  string pr_url = 2;
  int32 pr_number = 3;
  string opened_by = 4;
}

message RecordPullRequestResponse {}

// FailPullRequestRequest identifies the proposal whose PR attempt failed.
message FailPullRequestRequest {
  string id = 1;
  // claimed_at is an RFC3339-formatted timestamp string: the claimed_at
  // BeginPullRequest returned for this claim. The repository compares it
  // against the row's current pr_claimed_at before resetting anything, so a
  // claim already released and re-claimed by someone else is left untouched
  // instead of being reset out from under its new owner.
  string claimed_at = 2;
}

message FailPullRequestResponse {
  // released reports whether this call's compare-and-set matched and reset
  // the claim. false means the claim had already moved on — recorded, or
  // already failed by another caller — by the time this call ran; that is
  // not an error.
  bool released = 1;
}
