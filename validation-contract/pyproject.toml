[project]
version = "0.3.0"
name = "continuo-validation-contract"
description = "The continuo validation runner contract: the WarehouseAdapter port and result-block wire format."
authors = [{ name = "Simone Carolini" }]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = ["ruff==0.16.0", "mypy==1.18.2"]
test = ["pytest==9.1.1", "pytest-cov==4.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_validation_contract"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "D"]
ignore = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--tb=short"
