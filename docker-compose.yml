services:

  postgres:
    image: postgres:16.4
    # You avoid it to store anything in memory, which is what I want in tests.
    # I do to avoid having the issue "no space left on the device" when running tests.
    # I can also increase colima disk size to n GB.
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # POSTGRES_DB removed - databases created by init script
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

  # One-shot: runs every service's Flyway migrations as the migration login
  # continuo_svc, then lets each service's login connect to its own database,
  # grants it read and write on its tables and checks it holds nothing more.
  # The same image and script (db/migrate-all.sh) as the chart's migrate job;
  # db/init-databases.sh creates the logins with their local passwords.
  migrations:
    build:
      context: ./db
      dockerfile: Dockerfile.migrate
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      - CONTINUO_PG_LOGINS=run_controller=continuo_run_controller execution=continuo_execution_controller release=continuo_release_controller agent_chat=continuo_agent_chat remediation=continuo_remediation agent_remediation=continuo_agent_remediation dead_letter=continuo_dead_letter_controller
    depends_on:
      - postgres
    restart: "no"

  redis:
    image: redis:7.2-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    # Disable all persistence (both RDB snapshots and AOF) to avoid
    # "No space left on device" errors when Colima's virtual disk is tight.
    # Each service signs in as its own login, from the ACL file the streams
    # generator writes (compose/redis-users.acl): every login has the local
    # password local-<login>, and the default user keeps the password
    # continuo for the test suites and the e2e harness.
    command: redis-server --appendonly no --save "" --aclfile /c/redis-users.acl
    volumes:
      - ./compose:/c:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "continuo", "ping"]
      interval: 10s
      timeout: 5s

  neo4j:
    image: neo4j:5.26.28-community
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"  # HTTP
      - "${NEO4J_HOST_PORT:-7687}:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/atlas_password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  run-controller:
    build:
      context: .
      dockerfile: run-controller/Dockerfile.dev
    container_name: run-controller
    depends_on:
      postgres:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      - METRICS_PORT=9464
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - POSTGRES_DB=continuo_run_controller
      - POSTGRES_USER=continuo_run_controller
      - POSTGRES_PASSWORD=local-continuo_run_controller
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_SSLMODE=disable
      - LOG_LEVEL=INFO
      - ENV=local
      - HEALTH_PORT=8082
      - GRPC_PORT=50051
      - REDIS_ADDR=redis:6379
      - REDIS_USERNAME=continuo_run_controller
      - REDIS_PASSWORD=local-continuo_run_controller
      - REDIS_ACL_MODE=perService
      - MAINTENANCE_ENABLED=false
      # The chart's runs.taskMaxRetries and runs.taskTimeoutHours defaults.
      - TASK_MAX_RETRIES=2
      - TASK_TIMEOUT_SECONDS=86400
    ports:
      - "8082:8082"   # Health check HTTP
      - "50051:50051" # gRPC
    volumes:
      - ./run-controller:/app/run-controller
      - ./execution-controller:/app/execution-controller
      - ./catalog:/app/catalog
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
    networks:
      - default
    tty: true

  execution-controller:
    build:
      context: .
      dockerfile: execution-controller/Dockerfile.dev
    image: continuo-execution-controller:latest
    container_name: execution-controller
    depends_on:
      postgres:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      - METRICS_PORT=9464
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=continuo_execution_controller
      - REDIS_PASSWORD=local-continuo_execution_controller
      - REDIS_ACL_MODE=perService
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_execution
      - POSTGRES_USER=continuo_execution_controller
      - POSTGRES_PASSWORD=local-continuo_execution_controller
      # Kubernetes
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - K8S_NAMESPACE=default
      - MAX_CONCURRENT_JOBS=50
      # A pod has 3 minutes to start a container; the chart default is 15.
      - JOB_START_TIMEOUT_SECONDS=180
      # A finished Job and its pod are deleted 30 minutes after they finish,
      # the chart's execution.jobTTLMinutes default.
      - JOB_TTL_SECONDS=1800
      # The chart's execution.kubeClientQPS and execution.kubeClientBurst defaults.
      - K8S_CLIENT_QPS=50
      - K8S_CLIENT_BURST=100
      # Validation, seed-build and compile Jobs run up to the chart's default
      # runs.taskTimeoutHours.
      - TASK_TIMEOUT_SECONDS=86400
      - LOG_TAIL_LINES=50
      - ERROR_MESSAGE_MAX_LENGTH=4096
      # The validation image is a published external image; scripts/setup.sh
      # side-loads it into the kind node cache, so validation pods must use the
      # cached image. Production omits this and defaults to Always.
      - VALIDATION_IMAGE_PULL_POLICY=IfNotPresent
      - VALIDATION_IMAGE=ghcr.io/carolsimone/continuo-python-runtime-postgres:v0.12.0
      # Warehouse credentials for validation pods come from this Secret (envFrom).
      - VALIDATION_WAREHOUSE_SECRET=continuo-warehouse-validation
      # Job pods read the S3 key pair from this Secret in the kind cluster
      # (keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY).
      - JOB_S3_SECRET_NAME=continuo-job-s3
      - S3_SIDECAR_IMAGE=s3-sidecar:latest
      # dbt command dialect (per-service command templates for K8s Jobs)
      - DBT_COMMANDS_CONFIG_PATH=/etc/continuo/dbt-commands.yaml
      # S3: log/result uploads by this process, and credentials forwarded into
      # validation and compile pods. Compose-network DNS; in-kind pods use the
      # docker-bridge equivalents from tests/e2e/k8s/execution-controller-deployment.yaml.
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      # Application
      - HTTP_PORT=8084
      - LOG_LEVEL=INFO
    ports:
      - "8084:8084"   # Health check HTTP
    volumes:
      - ./run-controller:/app/run-controller
      - ./execution-controller:/app/execution-controller
      - ./catalog:/app/catalog
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
      - ./config/dbt-commands.yaml:/etc/continuo/dbt-commands.yaml:ro
    networks:
      - default
      - kind
    tty: true

  catalog:
    build:
      context: .
      dockerfile: catalog/Dockerfile.dev
    container_name: catalog
    depends_on:
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      - METRICS_PORT=9464
      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=atlas_password
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=continuo_catalog
      - REDIS_PASSWORD=local-continuo_catalog
      - REDIS_ACL_MODE=perService
      # Object storage — the version-ingestion consumer reads each release's
      # code-bundle document
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      # Backup — the chart's catalog.backup.* values (deploy/continuo/values.yaml)
      - CATALOG_BACKUP_ENABLED=true
      - CATALOG_BACKUP_SCHEDULE=0 2 * * *
      - CATALOG_BACKUP_KEEP=7
      # Application
      - GRPC_PORT=50052
      - HTTP_PORT=8087
      - ENV=local
      - LOG_LEVEL=INFO
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
    ports:
      - "8087:8087"   # Health check HTTP
      - "50052:50052" # gRPC
    volumes:
      - ./run-controller:/app/run-controller
      - ./execution-controller:/app/execution-controller
      - ./pkg:/app/pkg
      - ./catalog:/app/catalog
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./dead-letter-controller:/app/dead-letter-controller
      - ./cli:/app/cli
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - kind
    tty: true

  release-controller:
    build:
      context: .
      dockerfile: release-controller/Dockerfile.dev
    container_name: release-controller
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      - METRICS_PORT=9464
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_release_controller
      - POSTGRES_PASSWORD=local-continuo_release_controller
      - POSTGRES_DB=continuo_release
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=continuo_release_controller
      - REDIS_PASSWORD=local-continuo_release_controller
      - REDIS_ACL_MODE=perService
      - RELEASE_CONTROLLER_HTTP_PORT=8088
      - LOG_LEVEL=INFO
      - S3_BUCKET=continuo
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AGENT_REMEDIATION_GRPC_ADDR=agent-remediation:50054
      - MAINTENANCE_ENABLED=false
    ports:
      - "8088:8088"
    networks:
      - default

  remediation:
    build:
      context: .
      dockerfile: remediation/Dockerfile.dev
    container_name: remediation
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      - METRICS_PORT=9464
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_remediation
      - POSTGRES_PASSWORD=local-continuo_remediation
      - POSTGRES_DB=continuo_remediation
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=continuo_remediation
      - REDIS_PASSWORD=local-continuo_remediation
      - REDIS_ACL_MODE=perService
      - REMEDIATION_HTTP_PORT=8090
      - LOG_LEVEL=INFO
      - S3_BUCKET=continuo
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      # Host port 8093 avoids collision with ui which also binds 8090.
      # The container-internal port remains 8090 (REMEDIATION_HTTP_PORT).
      - "8093:8090"
    networks:
      - default

  agent-remediation:
    build:
      context: .
      dockerfile: agent-remediation/Dockerfile.dev
    container_name: agent-remediation
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      stub-llm:
        condition: service_started
      stub-github:
        condition: service_started
      release-controller:
        condition: service_started
      egress-proxy:
        condition: service_started
    environment:
      - METRICS_PORT=9464
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_agent_remediation
      - POSTGRES_PASSWORD=local-continuo_agent_remediation
      - POSTGRES_DB=continuo_agent_remediation
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=continuo_agent_remediation
      - REDIS_PASSWORD=local-continuo_agent_remediation
      - REDIS_ACL_MODE=perService
      - AGENT_REMEDIATION_HTTP_PORT=8092
      - AGENT_REMEDIATION_GRPC_PORT=50054
      - AGENT_REMEDIATION_MAX_ATTEMPTS=3
      - LOG_LEVEL=INFO
      - REMEDIATION_PR_POLL_INTERVAL=${REMEDIATION_PR_POLL_INTERVAL:-5s}
      - REMEDIATION_PR_OPENING_GRACE_PERIOD=${REMEDIATION_PR_OPENING_GRACE_PERIOD:-15s}
      - S3_BUCKET=continuo
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - CONTINUO_CATALOG_ADDR=catalog:50052
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_API_KEY=${LLM_API_KEY:-stub}
      - LLM_MODEL=${LLM_MODEL:-stub-model}
      # Unset: the e2e stub. Set it empty in .env (LLM_BASE_URL=) to call the
      # public API of LLM_PROVIDER=anthropic|openai.
      - LLM_BASE_URL=${LLM_BASE_URL-http://stub-llm:9100}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_BASE_URL=${GITHUB_BASE_URL:-http://stub-github:9200}
      - SERVICE_REPO_MAP_PATH=/etc/continuo/service_repos.yaml
      # sqlglot dialect continuo-runtime packages python-node fix proposals
      # with. Mirrors the chart's validation.engine; the local stack runs
      # Postgres, same as topology-controller's WAREHOUSE_ENGINE.
      - WAREHOUSE_ENGINE=postgres
      - RELEASE_CONTROLLER_URL=http://release-controller:8088
      - VERIFICATION_TIMEOUT=${VERIFICATION_TIMEOUT:-20m}
      - VERIFICATION_POLL_INTERVAL=${VERIFICATION_POLL_INTERVAL:-5s}
      - MAINTENANCE_ENABLED=false
      # Outbound HTTP (the LLM, GitHub, release-controller, S3) goes through
      # egress-proxy except to the stack's own services, which are reached
      # directly. stub-llm and stub-github are deliberately absent from
      # NO_PROXY: they are allowlisted egress destinations. The Go module hosts
      # are listed so `go run` in this container can still fetch modules.
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      - NO_PROXY=localhost,127.0.0.1,::1,postgres,redis,minio,catalog,release-controller,proxy.golang.org,sum.golang.org,storage.googleapis.com
    volumes:
      # The local stack runs on the e2e map, which adds the suite's fixture
      # services to the demo ones. The map agent-remediation documents for
      # operators (agent-remediation/config/service_repos.yaml) and the one
      # the chart ships (deploy/continuo/files/service_repos.yaml) stay free
      # of test fixtures.
      - ./tests/e2e/config/service_repos.yaml:/etc/continuo/service_repos.yaml:ro
    ports:
      # Host port 8094 avoids collision with other services.
      # The container-internal port remains 8092 (AGENT_REMEDIATION_HTTP_PORT).
      - "8094:8092"
      - "50054:50054" # gRPC
    networks:
      - default

  dead-letter-controller:
    build:
      context: .
      dockerfile: dead-letter-controller/Dockerfile.dev
    container_name: dead-letter-controller
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    environment:
      - METRICS_PORT=9464
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_dead_letter_controller
      - POSTGRES_PASSWORD=local-continuo_dead_letter_controller
      - POSTGRES_DB=continuo_dead_letter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=continuo_dead_letter_controller
      - REDIS_PASSWORD=local-continuo_dead_letter_controller
      - REDIS_ACL_MODE=perService
      - DEAD_LETTER_HTTP_PORT=8096
      - DEAD_LETTER_GRPC_PORT=50055
      - LOG_LEVEL=INFO
      - STREAM_TRIM_ENABLED=true
      - STREAM_RETENTION=72h
      - MAINTENANCE_ENABLED=false
    ports:
      - "8096:8096"
      - "50055:50055"
    networks:
      - default

  # One-shot: creates every Redis stream and consumer group of the release
  # under the continuo: prefix, then exits. Consumers wait up to five minutes
  # for their groups, so no service depends on it. It builds from
  # dead-letter-controller's Dockerfile and runs from the source baked into
  # that image, so plain `docker compose up streams-init` runs the code of the
  # last build; `make test-deps-up` rebuilds it first.
  streams-init:
    build:
      context: .
      dockerfile: dead-letter-controller/Dockerfile.dev
    working_dir: /app/dead-letter-controller
    command: go run ./cmd/streams-init
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_USERNAME=continuo_redis_migrate
      - REDIS_PASSWORD=local-continuo_redis_migrate
      - REDIS_ACL_MODE=perService
      - LOG_LEVEL=INFO
    restart: "no"
    networks:
      - default

  egress-proxy:
    build:
      context: .
      dockerfile: egress-proxy/Dockerfile.dev
    container_name: egress-proxy
    environment:
      - METRICS_PORT=9464
      - LOG_LEVEL=INFO
      - EGRESS_PROXY_LISTEN_PORT=3128
      - EGRESS_PROXY_HEALTH_PORT=8093
      - EGRESS_ALLOWLIST_PATH=/etc/egress-proxy/allowlist.yaml
    volumes:
      - ./tests/e2e/config/egress-allowlist.yaml:/etc/egress-proxy/allowlist.yaml:ro
    # No host ports: the agents and the e2e container reach it by its compose
    # name, and host 8093 is taken by remediation.
    networks:
      - default

  stub-llm:
    build:
      context: ./tests/e2e/stub-llm
    container_name: stub-llm
    ports:
      - "9100:9100"
    networks:
      - default

  stub-github:
    build:
      context: ./tests/e2e/stub-github
    container_name: stub-github
    environment:
      # The working tree stub-github serves from GET /repos/{o}/{r}/tarball/{ref}.
      # agent-remediation fetches a whole repository checkout there when it
      # repairs a python node, whose declaring contract yaml has no recorded
      # path and so has to be searched for across the tree.
      - REPO_FIXTURE_DIR=/fixtures/repo
    volumes:
      - ./tests/e2e/fixtures/py-remediation-repo:/fixtures/repo:ro
    ports:
      - "9200:9200"
    networks:
      - default

  agent-chat:
    build:
      context: .
      dockerfile: agent-chat/Dockerfile.dev
    container_name: agent-chat
    depends_on:
      postgres:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      run-controller:
        condition: service_started
      catalog:
        condition: service_started
      stub-llm:
        condition: service_started
      redis:
        condition: service_started
      egress-proxy:
        condition: service_started
    environment:
      - METRICS_PORT=9464
      - POSTGRES_DB=continuo_agent_chat
      - POSTGRES_USER=continuo_agent_chat
      - POSTGRES_PASSWORD=local-continuo_agent_chat
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_SSLMODE=disable
      - GRPC_PORT=50053
      - HEALTH_PORT=8091
      - CONTINUO_RUN_CONTROLLER_ADDR=run-controller:50051
      - CONTINUO_CATALOG_ADDR=catalog:50052
      - CONTINUO_DEAD_LETTER_ADDR=dead-letter-controller:50055
      - REDIS_ADDR=redis:6379
      - REDIS_USERNAME=continuo_agent_chat
      - REDIS_PASSWORD=local-continuo_agent_chat
      - REDIS_ACL_MODE=perService
      - CHAT_MAX_CONCURRENT_SESSIONS=100
      - LOG_LEVEL=INFO
      - ENV=local
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_API_KEY=${LLM_API_KEY:-stub}
      - LLM_MODEL=${LLM_MODEL:-stub-model}
      # Unset: the e2e stub. Set it empty in .env (LLM_BASE_URL=) to call the
      # public API of LLM_PROVIDER=anthropic|openai.
      - LLM_BASE_URL=${LLM_BASE_URL-http://stub-llm:9100}
      # Outbound HTTP (the LLM) goes through egress-proxy. The gRPC dials to
      # run-controller, catalog and dead-letter-controller, which
      # agent-chat's continuo CLI subprocess inherits, are the stack's own
      # services and bypass it. stub-llm is deliberately absent from NO_PROXY:
      # it is an allowlisted egress destination. The Go module hosts are listed
      # so `go run` in this container can still fetch modules. minio is the S3
      # endpoint agent-chat is given when its archive is enabled; it is the
      # stack's own service and bypasses the proxy.
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      - NO_PROXY=localhost,127.0.0.1,::1,postgres,redis,run-controller,catalog,dead-letter-controller,proxy.golang.org,sum.golang.org,storage.googleapis.com,minio
    ports:
      - "8091:8091"
      - "50053:50053"
    volumes:
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./pkg:/app/pkg
      - ./go.work:/app/go.work
    networks:
      - default
    tty: true

  e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    container_name: e2e
    depends_on:
      run-controller:
        condition: service_started
      catalog:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      ui:
        condition: service_started
      dbt-compile-and-load:
        condition: service_started
    environment:
      - CATALOG_HOST=catalog
      - RUN_CONTROLLER_HOST=run-controller
      - REDIS_HOST=redis
      - NEO4J_HOST=neo4j
      - POSTGRES_HOST=postgres
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - UI_HTTP_BASE=http://ui:8090
    volumes:
      - ./kubeconfig:/app/kubeconfig
      - ./tests/e2e:/app/tests/e2e
      - ./run-controller:/app/run-controller
      - ./catalog:/app/catalog
      - ./execution-controller:/app/execution-controller
      - ./pkg:/app/pkg
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./dead-letter-controller:/app/dead-letter-controller
      - ./cli:/app/cli
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - kind
    profiles:
      - e2e
    tty: true

  ui:
    build:
      context: ./ui
    container_name: ui
    depends_on:
      run-controller:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      release-controller:
        condition: service_started
      stub-github:
        condition: service_started
    environment:
      - RUN_CONTROLLER_GRPC_ADDR=run-controller:50051
      - CATALOG_GRPC_ADDR=catalog:50052
      - PORT=8090
      - NODE_ENV=production
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - RELEASE_CONTROLLER_URL=http://release-controller:8088
      - AUTH_MODE=dev
      - AGENT_CHAT_GRPC_ADDR=agent-chat:50053
      - CHAT_BRIDGE_ENABLED=true
      - REMEDIATION_GRPC_ADDR=agent-remediation:50054
      - GITHUB_APP_ID=1
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_APP_INSTALLATION_ID=1
      - GITHUB_API_BASE_URL=http://stub-github:9200
      - CI_AUTH_CONFIG_PATH=/app/ci-auth/ci-auth.json
      - MAINTENANCE_ENABLED=false
    ports:
      - "8090:8090"
    volumes:
      - ./ui/config:/app/config:ro
      - ./tests/e2e/ci-auth.json:/app/ci-auth/ci-auth.json:ro
    networks:
      - default

  dex:
    image: dexidp/dex:v2.41.1
    container_name: dex
    profiles: ["auth-e2e"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./tests/e2e/dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      - default

  ui-auth:
    build:
      context: ./ui
    container_name: ui-auth
    profiles: ["auth-e2e"]
    depends_on:
      run-controller:
        condition: service_started
      redis:
        condition: service_started
      dex:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      release-controller:
        condition: service_started
      stub-github:
        condition: service_started
    environment:
      - RUN_CONTROLLER_GRPC_ADDR=run-controller:50051
      - CATALOG_GRPC_ADDR=catalog:50052
      - PORT=8090
      - NODE_ENV=production
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - RELEASE_CONTROLLER_URL=http://release-controller:8088
      - AUTH_MODE=oidc
      - AUTH_OIDC_ISSUER_URL=http://dex:5556/dex
      - AUTH_OIDC_CLIENT_ID=continuo-ui
      - AUTH_OIDC_CLIENT_SECRET=e2e-secret
      - AUTH_PUBLIC_URL=http://ui-auth:8090
      - AUTH_OPERATOR_EMAILS=operator@example.com
      - AUTH_VIEWER_EMAILS=viewer@example.com
      - REDIS_URL=redis://redis:6379
      - REDIS_USERNAME=continuo_ui
      - REDIS_PASSWORD=local-continuo_ui
      - REDIS_ACL_MODE=perService
      - CI_AUTH_CONFIG_PATH=/app/ci-auth/ci-auth.json
      - CI_AUTH_ALLOW_INSECURE_ISSUER=true
      - MAINTENANCE_ENABLED=false
    volumes:
      - ./ui/config:/app/config:ro
      - ./tests/e2e/ci-auth.json:/app/ci-auth/ci-auth.json:ro
    networks:
      - default

  # Same MinIO server/client images the Helm chart bundles
  # (deploy/continuo/values.yaml minio.image / minio.mcImage), so the local
  # stack exercises the object store a real install runs. Served from this
  # project's own ghcr mirror because upstream MinIO gates its quay.io images
  # behind authentication. The entrypoint runs the `minio` binary directly
  # (bypassing the image's own wrapper) with the :9001 console, like upstream.
  # Data goes under /bitnami/minio/data — the one path this image pre-creates
  # writable for its non-root default user; compose has no fsGroup to make an
  # arbitrary path writable (the chart mounts a PVC at /data and uses fsGroup).
  minio:
    image: ghcr.io/carolsimone/continuo-minio:2025.7.23
    entrypoint: ["minio"]
    command: ["server", "/bitnami/minio/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket provisioner: creates the continuo bucket and installs the
  # 30-day expiry lifecycle rules. `mc ilm import` replaces the full rule set,
  # so re-running the service is idempotent. Services that read or write S3 at
  # startup depend on this completing, not merely on minio being healthy.
  #
  # There is no age rule on code-bundles/ or tenants/: they hold the code bundle
  # and topology artifact of the live release, which external consumers read
  # (docs/read-contract.md), and an age rule cannot tell a live release from an
  # old one. release-controller deletes a release's objects when its retention
  # prunes the release, and never for current_prod or a service_prod release.
  # scripts/check-read-retention.sh fails a rule on either prefix.
  minio-init:
    image: ghcr.io/carolsimone/continuo-mc:2025.7.21
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/continuo
        mc ilm import local/continuo <<'EOF'
        {
          "Rules": [
            {"ID": "expire-candidate-sql-30d", "Filter": {"Prefix": "candidate-sql/"}, "Status": "Enabled", "Expiration": {"Days": 30}},
            {"ID": "expire-logs-30d", "Filter": {"Prefix": "logs/"}, "Status": "Enabled", "Expiration": {"Days": 30}}
          ]
        }
        EOF

  topology-controller:
    build:
      context: ./topology-controller
      dockerfile: Dockerfile.dev
    container_name: topology-controller
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_USERNAME: continuo_topology_controller
      REDIS_PASSWORD: local-continuo_topology_controller
      REDIS_ACL_MODE: perService
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: continuo
      S3_ENV: local
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      # SQL dialect for dependency resolution and the candidate-schema rewrite,
      # and the engine's system relations (information_schema and the pg_*
      # schemas on Postgres), which never become nodes, resolve to a node or
      # move to the candidate schema. Mirrors the chart's validation.engine; the
      # local stack runs Postgres.
      WAREHOUSE_ENGINE: postgres
      LOG_LEVEL: INFO
      METRICS_PORT: "9464"
    volumes:
      - ./pkg:/app/pkg:ro
    depends_on:
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  dbt-compile-and-load:
    build:
      context: ./dbt
      dockerfile: Dockerfile.upload
    container_name: dbt-compile-and-load
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - path: ./dbt/.env.hetzner
        required: false
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_dbt
      - POSTGRES_USER=continuo_warehouse
      - POSTGRES_PASSWORD=local-continuo_warehouse
      # Per-service image tags recorded in compiled manifests. The e2e resolves
      # the dbt job image_tag from the release-controller service_prod table (seeded
      # by setup.sh / provision-k8s-test-env.sh with the real content-hash tags), so
      # this value only satisfies the topology-controller's A1 publish-boundary
      # validator, which rejects a batch whose image_tag is empty. setup.sh exports
      # the real per-service tags before `docker compose up`; the placeholder default
      # only keeps a bare `docker compose up` from tripping the validator.
      - IMAGE_TAG_PER_SERVICE=${IMAGE_TAG_PER_SERVICE:-service-1=e2e-local,service-2=e2e-local,service-3=e2e-local}
    volumes:
      - ./dbt/services:/app/services

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  kind:
    external: true
    name: kind