    ports:
      - "8090:8090"
    volumes:
      - ./ui-service/config:/app/config:ro
    networks:
      - default

  dex:
    image: dexidp/dex:v2.41.1
    container_name: dex
    profiles: ["auth-e2e"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./tests/e2e/dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      - default

  ui-auth:
    build:
      context: ./ui-service
      network: host
    container_name: ui-auth
    profiles: ["auth-e2e"]
    depends_on:
      - state
      - redis
      - dex
      - localstack
      - release-controller
    environment:
      - STATE_GRPC_ADDR=state:50051
      - ORCHESTRATOR_GRPC_ADDR=orchestrator:50052
      - PORT=8090
      - NODE_ENV=production
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - RELEASE_CONTROLLER_URL=http://release-controller:8088
      - AUTH_MODE=oidc
      - AUTH_OIDC_ISSUER_URL=http://dex:5556/dex
      - AUTH_OIDC_CLIENT_ID=continuo-ui
      - AUTH_OIDC_CLIENT_SECRET=e2e-secret
      - AUTH_PUBLIC_URL=http://ui-auth:8090
      - AUTH_OPERATOR_EMAILS=operator@example.com
      - AUTH_VIEWER_EMAILS=viewer@example.com
      - REDIS_URL=redis://:continuo@redis:6379
    volumes:
      - ./ui-service/config:/app/config:ro
    networks:
      - default

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d

  manifest-controller:
    build:
      context: ./manifest-controller
      dockerfile: Dockerfile.dev
    container_name: manifest-controller
    environment:
      REDIS_URL: redis://:continuo@redis:6379
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: continuo
      S3_ENV: local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./pkg:/app/pkg:ro
    depends_on:
      redis:
        condition: service_started
      localstack:
        condition: service_healthy

  dbt-compile-and-load:
    build:
      context: ./dbt
      dockerfile: Dockerfile.upload
    container_name: dbt-compile-and-load
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - path: ./dbt/.env.hetzner
        required: false
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      - DBT_POSTGRES_HOST=postgres
      - DBT_POSTGRES_PORT=5432
      - DBT_POSTGRES_DB=continuo_dbt
      - DBT_POSTGRES_USER=continuo_svc
      - DBT_POSTGRES_PASSWORD=continuo
      # Per-service image tags recorded in compiled manifests. The e2e resolves
      # the dbt job image_tag from the release-controller service_prod table (seeded
      # by setup.sh / provision-k8s-test-env.sh with the real content-hash tags), so
      # this value only satisfies the manifest-controller's A1 publish-boundary
      # validator, which rejects a batch whose image_tag is empty. setup.sh exports
      # the real per-service tags before `docker compose up`; the placeholder default
      # only keeps a bare `docker compose up` from tripping the validator.
      - IMAGE_TAG_PER_SERVICE=${IMAGE_TAG_PER_SERVICE:-service-1=e2e-local,service-2=e2e-local,service-3=e2e-local}
    volumes:
      - ./dbt/services:/app/services

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  kind:
    external: true
    name: kind