services:

  postgres:
    image: postgres:16.4
    # You avoid it to store anything in memory, which is what I want in tests.
    # I do to avoid having the issue "no space left on the device" when running tests.
    # I can also increase colima disk size to n GB.
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # POSTGRES_DB removed - databases created by init script
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

  flyway-state:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_state -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/state:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-executor:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_executor -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/executor:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-orchestrator:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_orchestrator -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/orchestrator:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-k8s:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_k8s -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/k8s:/flyway/sql
    depends_on:
      - postgres
    tty: true

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    # Disable all persistence (both RDB snapshots and AOF) to avoid
    # "No space left on device" errors when Colima's virtual disk is tight.
    command: redis-server --appendonly no --save "" --requirepass continuo
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "continuo", "ping"]
      interval: 10s
      timeout: 5s

  neo4j:
    image: neo4j:5.15.0-community
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/atlas_password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  state:
    build:
      context: .
      dockerfile: state/Dockerfile.dev
    container_name: state
    depends_on:
      - postgres
      - redis
    environment:
      - POSTGRES_DB=continuo_state
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_SSLMODE=disable
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - LOG_LEVEL=INFO
      - ENV=local
      - HEALTH_PORT=8082
      - GRPC_PORT=50051
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=continuo
      - REDIS_STREAM_SCHEDULER_STARTED=scheduler.started:v1
      - REDIS_STREAM_SCHEDULES_LOADED=schedules.loaded:v1
      - REDIS_STREAM_RUN_ENTRIES_DISPATCHED=run.entries.dispatched:v1
      - REDIS_STREAM_RUN_RERUN_DISPATCHED=run.rerun.dispatched:v1
      - REDIS_STREAM_TASK_STATUS_UPDATED=task.status.updated:v1
      - REDIS_STREAM_TASK_EXECUTION_RECORDED=task.execution.recorded:v1
      - SCHEDULES_CONFIG_PATH=/etc/continuo/schedules.yaml
    ports:
      - "8082:8082"   # Health check HTTP
      - "50051:50051" # gRPC
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./orchestrator:/app/orchestrator
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
      - ./config/schedules.yaml:/etc/continuo/schedules.yaml:ro
    networks:
      - default
    tty: true

  executor-controller:
    build:
      context: .
      dockerfile: executor-controller/Dockerfile.dev
    image: continuo-executor-controller:latest
    container_name: executor-controller
    depends_on:
      - postgres
      - redis
      - neo4j
    environment:
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - REDIS_CONSUMER_STREAM=query.model:v1
      - REDIS_CONSUMER_RETRY_STREAM=retry.task:v1
      - REDIS_CONSUMER_GROUP=executor_controller_consumers
      - REDIS_PRODUCER_STREAM=node.deployed:v1
      - REDIS_STATUS_STREAM=task.status.updated:v1
      - SCHEDULE_CANCELLED_STREAM=schedule.cancelled:v1
      - SCHEDULE_CANCELLED_GROUP=executor-schedule-cancelled
      - CANCELLED_SCHEDULES_TTL_HOURS=24
      - CANCELLED_SCHEDULES_SWEEP_INTERVAL_MINUTES=60
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_executor
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # Kubernetes
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - K8S_NAMESPACE=default
      # dbt PostgreSQL target (forwarded to K8s job pods)
      - DBT_POSTGRES_DB=continuo_dbt
      # Application
      - HTTP_PORT=8084
      - ENV=local
      - LOG_LEVEL=INFO
    ports:
      - "8084:8084"   # Health check HTTP
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./orchestrator:/app/orchestrator
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
    networks:
      - default
      - kind
    tty: true

  k8s-controller:
    build:
      context: .
      dockerfile: k8s-controller/Dockerfile.dev
    image: continuo-k8s-controller:latest
    container_name: k8s-controller
    depends_on:
      - postgres
      - redis
      - state
      - localstack
    environment:
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - REDIS_CONSUMER_DEPLOYED_STREAM=node.deployed:v1
      - REDIS_CONSUMER_CHECK_STREAM=check.k8s:v1
      - REDIS_CONSUMER_GROUP=k8s_controller_consumers
      - REDIS_PRODUCER_CHECK_STREAM=check.k8s:v1
      - REDIS_PRODUCER_RETRY_STREAM=retry.task:v1
      - REDIS_PRODUCER_FAILED_STREAM=task.failed:v1
      - REDIS_PRODUCER_UPDATE_TABLE_STREAM=node.updated:v1
      - SCHEDULE_CANCELLED_STREAM=schedule.cancelled:v1
      - SCHEDULE_CANCELLED_GROUP=k8s-schedule-cancelled
      - CANCELLED_SCHEDULES_TTL_HOURS=24
      - CANCELLED_SCHEDULES_SWEEP_INTERVAL_MINUTES=60
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_k8s
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # State Service
      - STATE_SERVICE_GRPC_ADDR=state:50051
      # Kubernetes
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - K8S_NAMESPACE=default
      # S3 / LocalStack
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - LOG_TAIL_LINES=50
      # Application
      - K8S_CHECK_DELAY_SECONDS=30
      - ERROR_MESSAGE_MAX_LENGTH=4096
      - HTTP_PORT=8085
      - ENV=local
      - LOG_LEVEL=INFO
    ports:
      - "8085:8085"   # Health check HTTP
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./orchestrator:/app/orchestrator
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
    networks:
      - default
      - kind
    tty: true

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile.dev
    container_name: orchestrator
    depends_on:
      - postgres
      - redis
      - state
      - flyway-orchestrator
      - neo4j
    environment:
      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=atlas_password
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      # Consumer streams
      - NODE_UPDATED_STREAM=node.updated:v1
      - NODE_UPDATED_GROUP=orchestrator_node_updated
      - MANIFEST_LOADED_STREAM=manifest.loaded:v1
      - MANIFEST_LOADED_GROUP=orchestrator_manifest_loaded
      - INITIALIZE_RUN_STREAM=initialize.run:v1
      - INITIALIZE_RUN_GROUP=orchestrator_initialize_run
      - SCHEDULER_STARTED_STREAM=scheduler.started:v1
      - SCHEDULER_STARTED_GROUP=orchestrator_scheduler_started
      - RERUN_STREAM=rerun:v1
      - RERUN_GROUP=orchestrator_rerun
      - RUN_FINALIZED_STREAM=run.finalized:v1
      - RUN_FINALIZED_GROUP=orchestrator-run-finalized
      - SCHEDULE_CANCELLED_STREAM=schedule.cancelled:v1
      - SCHEDULE_CANCELLED_GROUP=orchestrator-schedule-cancelled
      - CANCELLED_SCHEDULES_TTL_HOURS=24
      - CANCELLED_SCHEDULES_SWEEP_INTERVAL_MINUTES=60
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_orchestrator
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # Application
      - GRPC_PORT=50052
      - HTTP_PORT=8087
      - ENV=local
      - LOG_LEVEL=INFO
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
    ports:
      - "8087:8087"   # Health check HTTP
      - "50052:50052" # gRPC
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./pkg:/app/pkg
      - ./orchestrator:/app/orchestrator
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - kind
    tty: true

  e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    container_name: e2e
    depends_on:
      state:
        condition: service_started
      orchestrator:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      ui:
        condition: service_started
      dbt-compile-and-load:
        condition: service_started
    environment:
      - ORCHESTRATOR_HOST=orchestrator
      - STATE_HOST=state
      - REDIS_HOST=redis
      - NEO4J_HOST=neo4j
      - POSTGRES_HOST=postgres
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - UI_HTTP_BASE=http://ui:8090
    volumes:
      - ./kubeconfig:/app/kubeconfig
      - ./tests/e2e:/app/tests/e2e
      - ./state:/app/state
      - ./orchestrator:/app/orchestrator
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./pkg:/app/pkg
      - ./go.work:/app/go.work
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - kind
    profiles:
      - e2e
    tty: true

  ui:
    build:
      context: ./ui-service
      network: host
    container_name: ui
    depends_on:
      - state
      - localstack
      - redis
    environment:
      - STATE_GRPC_ADDR=state:50051
      - ORCHESTRATOR_GRPC_ADDR=orchestrator:50052
      - PORT=8090
      - NODE_ENV=production
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - REDIS_URL=redis://:continuo@redis:6379
    ports:
      - "8090:8090"
    volumes:
      - ./ui-service/config:/app/config:ro
    networks:
      - default

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d

  manifest-controller:
    build:
      context: ./manifest-controller
      dockerfile: Dockerfile.dev
    container_name: manifest-controller
    environment:
      REDIS_URL: redis://:continuo@redis:6379
      REDIS_STREAM: "update.graph:v1"
      REDIS_GROUP: manifest-controller
      REDIS_OUTPUT_STREAM: "manifest.loaded:v1"
      REGISTRY_PATH: /data/registry.csv
      MANIFESTS_BASE: /manifests
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: continuo
      S3_ENV: local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./dbt/services:/manifests:ro
      - manifest-registry:/data
    depends_on:
      redis:
        condition: service_started
      localstack:
        condition: service_healthy

  dbt-compile-and-load:
    build:
      context: ./dbt
      dockerfile: Dockerfile.upload
    container_name: dbt-compile-and-load
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - path: ./dbt/.env.hetzner
        required: false
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      - DBT_POSTGRES_HOST=postgres
      - DBT_POSTGRES_PORT=5432
      - DBT_POSTGRES_DB=continuo_dbt
      - DBT_POSTGRES_USER=continuo_svc
      - DBT_POSTGRES_PASSWORD=continuo
      - IMAGE_TAG_PER_SERVICE=${IMAGE_TAG_PER_SERVICE:-}
    volumes:
      - ./dbt/services:/app/services

volumes:
  neo4j_data:
  neo4j_logs:
  manifest-registry:

networks:
  kind:
    external: true
    name: kind