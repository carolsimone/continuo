services:

  postgres:
    image: postgres:16.4
    # You avoid it to store anything in memory, which is what I want in tests.
    # I do to avoid having the issue "no space left on the device" when running tests.
    # I can also increase colima disk size to n GB.
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # POSTGRES_DB removed - databases created by init script
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

  flyway-state:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_state -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/state:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-executor:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_executor -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/executor:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-orchestrator:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_orchestrator -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/orchestrator:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-k8s:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_k8s -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/k8s:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-release:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_release -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/release:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-agent-chat:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_agent_chat -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/agent_chat:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-remediation:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_remediation -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/remediation:/flyway/sql
    depends_on:
      - postgres
    tty: true

  flyway-agent-remediation:
    image: flyway/flyway
    command: migrate -url=jdbc:postgresql://postgres:5432/continuo_agent_remediation -user=continuo_svc -password=continuo -connectRetries=30
    volumes:
      - ./db/migration/agent_remediation:/flyway/sql
    depends_on:
      - postgres
    tty: true

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    # Disable all persistence (both RDB snapshots and AOF) to avoid
    # "No space left on device" errors when Colima's virtual disk is tight.
    command: redis-server --appendonly no --save "" --requirepass continuo
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "continuo", "ping"]
      interval: 10s
      timeout: 5s

  neo4j:
    image: neo4j:5.15.0-community
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/atlas_password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  state:
    build:
      context: .
      dockerfile: state/Dockerfile.dev
    container_name: state
    depends_on:
      - postgres
      - redis
    environment:
      - POSTGRES_DB=continuo_state
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_SSLMODE=disable
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - LOG_LEVEL=INFO
      - ENV=local
      - HEALTH_PORT=8082
      - GRPC_PORT=50051
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=continuo
      - REDIS_STREAM_SCHEDULER_STARTED=scheduler.started:v1
      - REDIS_STREAM_SCHEDULES_LOADED=schedules.loaded:v1
      - REDIS_STREAM_RUN_ENTRIES_DISPATCHED=run.entries.dispatched:v1
      - REDIS_STREAM_RUN_ENTRIES_DISPATCH_FAILED=run.entries.dispatch_failed:v1
      - REDIS_STREAM_TASK_STATUS_UPDATED=task.status.updated:v1
      - REDIS_STREAM_TASK_EXECUTION_RECORDED=task.execution.recorded:v1
      - SCHEDULES_CONFIG_PATH=/etc/continuo/schedules.yaml
    ports:
      - "8082:8082"   # Health check HTTP
      - "50051:50051" # gRPC
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./orchestrator:/app/orchestrator
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
      - ./config/schedules.yaml:/etc/continuo/schedules.yaml:ro
    networks:
      - default
    tty: true

  executor-controller:
    build:
      context: .
      dockerfile: executor-controller/Dockerfile.dev
    image: continuo-executor-controller:latest
    container_name: executor-controller
    depends_on:
      - postgres
      - redis
      - neo4j
      - localstack
    environment:
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - CANCELLED_SCHEDULES_TTL_HOURS=24
      - CANCELLED_SCHEDULES_SWEEP_INTERVAL_MINUTES=60
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_executor
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # Kubernetes
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - K8S_NAMESPACE=default
      - MAX_CONCURRENT_JOBS=50
      # The validation image is a published external image (continuo-python-runtime);
      # scripts/setup.sh (dev) and tests/e2e/provision-k8s-test-env.sh (e2e) each
      # pull it and side-load it into the local kind node cache, so validation pods
      # must use the cached image. PullAlways would fail with ErrImagePull locally;
      # production omits this and defaults to Always.
      - VALIDATION_IMAGE_PULL_POLICY=IfNotPresent
      - VALIDATION_IMAGE=ghcr.io/carolsimone/continuo-python-runtime-postgres:v0.4.0
      # Warehouse credentials for the validation pod come from this operator-owned
      # Secret (envFrom). scripts/setup.sh creates it in the kind cluster.
      - VALIDATION_WAREHOUSE_SECRET=continuo-warehouse-validation
      - S3_SIDECAR_IMAGE=s3-sidecar:latest
      # dbt command dialect (per-service command templates for K8s Jobs)
      - DBT_COMMANDS_CONFIG_PATH=/etc/continuo/dbt-commands.yaml
      # S3 credentials forwarded into both the validation pod (which fetches
      # CANDIDATE_SQL_URI itself) and the compile pod's s3-sidecar (manifest upload).
      # Points at LocalStack on the compose network. NOTE: like POSTGRES_HOST above,
      # this is a compose-network DNS name — it serves this process's own use and
      # is NOT resolvable from in-kind pods. The e2e dispatches via the kind deployment
      # (tests/e2e/k8s/executor-controller-deployment.yaml), which supplies the
      # docker-bridge-IP equivalents that in-kind pods can reach.
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      # Application
      - HTTP_PORT=8084
      - ENV=local
      - LOG_LEVEL=INFO
    ports:
      - "8084:8084"   # Health check HTTP
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./orchestrator:/app/orchestrator
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
      - ./config/dbt-commands.yaml:/etc/continuo/dbt-commands.yaml:ro
    networks:
      - default
      - kind
    tty: true

  k8s-controller:
    build:
      context: .
      dockerfile: k8s-controller/Dockerfile.dev
    image: continuo-k8s-controller:latest
    container_name: k8s-controller
    depends_on:
      - postgres
      - redis
      - state
      - localstack
    environment:
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - CANCELLED_SCHEDULES_TTL_HOURS=24
      - CANCELLED_SCHEDULES_SWEEP_INTERVAL_MINUTES=60
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_k8s
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # State Service
      - STATE_SERVICE_GRPC_ADDR=state:50051
      # Kubernetes
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - K8S_NAMESPACE=default
      # S3 / LocalStack
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - LOG_TAIL_LINES=50
      # Application
      - K8S_CHECK_DELAY_SECONDS=10
      - ERROR_MESSAGE_MAX_LENGTH=4096
      - HTTP_PORT=8085
      - ENV=local
      - LOG_LEVEL=INFO
    ports:
      - "8085:8085"   # Health check HTTP
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./orchestrator:/app/orchestrator
      - ./pkg:/app/pkg
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock  # For testcontainers
    networks:
      - default
      - kind
    tty: true

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile.dev
    container_name: orchestrator
    depends_on:
      - postgres
      - redis
      - state
      - flyway-orchestrator
      - neo4j
      - localstack
    environment:
      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=atlas_password
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - CANCELLED_SCHEDULES_TTL_HOURS=24
      - CANCELLED_SCHEDULES_SWEEP_INTERVAL_MINUTES=60
      # State gRPC (for watchdog) — same name the Helm chart exposes globally
      - STATE_GRPC_ADDR=state:50051
      # Dispatch watchdog — explicit at production defaults (also the
      # config.go fallback). Do NOT lower NO_PROGRESS_MINUTES here: a
      # value below the longest realistic create→running latency (image
      # pull + pod schedule on a fresh kind cluster) cancels real e2e
      # schedules. TestWatchdog_TerminatesStuckSchedule seeds
      # task_tracker rows with stale created_at instead.
      - ORCHESTRATOR_WATCHDOG_ENABLED=true
      - ORCHESTRATOR_WATCHDOG_INTERVAL_SECONDS=60
      - ORCHESTRATOR_WATCHDOG_NO_PROGRESS_MINUTES=30
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_orchestrator
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # Object storage — the version-ingestion consumer reads each release's
      # code-bundle document
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      # Application
      - GRPC_PORT=50052
      - HTTP_PORT=8087
      - ENV=local
      - LOG_LEVEL=INFO
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
    ports:
      - "8087:8087"   # Health check HTTP
      - "50052:50052" # gRPC
    volumes:
      - ./state:/app/state
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./pkg:/app/pkg
      - ./orchestrator:/app/orchestrator
      - ./tests/e2e:/app/tests/e2e
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./kubeconfig:/app/kubeconfig
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - kind
    tty: true

  release-controller:
    build:
      context: .
      dockerfile: release-controller/Dockerfile.dev
    container_name: release-controller
    depends_on:
      - postgres
      - redis
      - flyway-release
      - localstack
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      - POSTGRES_DB=continuo_release
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - RELEASE_CONTROLLER_HTTP_PORT=8088
      - S3_BUCKET=continuo
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "8088:8088"
    networks:
      - default

  remediation:
    build:
      context: .
      dockerfile: remediation/Dockerfile.dev
    container_name: remediation
    depends_on:
      - postgres
      - redis
      - flyway-remediation
      - localstack
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      - POSTGRES_DB=continuo_remediation
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - REMEDIATION_HTTP_PORT=8090
      - S3_BUCKET=continuo
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      # Host port 8093 avoids collision with ui which also binds 8090.
      # The container-internal port remains 8090 (REMEDIATION_HTTP_PORT).
      - "8093:8090"
    networks:
      - default

  agent-remediation:
    build:
      context: .
      dockerfile: agent-remediation/Dockerfile.dev
    container_name: agent-remediation
    depends_on:
      - postgres
      - redis
      - flyway-agent-remediation
      - localstack
      - stub-llm
      - stub-github
      - release-controller
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      - POSTGRES_DB=continuo_agent_remediation
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=continuo
      - AGENT_REMEDIATION_HTTP_PORT=8092
      - AGENT_REMEDIATION_GRPC_PORT=50054
      - AGENT_REMEDIATION_MAX_ATTEMPTS=3
      - REMEDIATION_PR_POLL_INTERVAL=${REMEDIATION_PR_POLL_INTERVAL:-5s}
      - REMEDIATION_PR_OPENING_GRACE_PERIOD=${REMEDIATION_PR_OPENING_GRACE_PERIOD:-15s}
      - S3_BUCKET=continuo
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - CONTINUO_ORCHESTRATOR_ADDR=orchestrator:50052
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_API_KEY=${LLM_API_KEY:-stub}
      - LLM_MODEL=${LLM_MODEL:-stub-model}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://stub-llm:9100}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_BASE_URL=${GITHUB_BASE_URL:-http://stub-github:9200}
      - SERVICE_REPO_MAP_PATH=/etc/continuo/service_repos.yaml
      # sqlglot dialect continuo-runtime packages python-node fix proposals
      # with. Mirrors the chart's validation.engine; the local stack runs
      # Postgres, same as topology-controller's WAREHOUSE_ENGINE.
      - WAREHOUSE_ENGINE=postgres
      - RELEASE_CONTROLLER_URL=http://release-controller:8088
      - SHADOW_VERIFY_TIMEOUT=${SHADOW_VERIFY_TIMEOUT:-20m}
      - SHADOW_VERIFY_POLL_INTERVAL=${SHADOW_VERIFY_POLL_INTERVAL:-5s}
    volumes:
      - ./agent-remediation/config/service_repos.yaml:/etc/continuo/service_repos.yaml:ro
    ports:
      # Host port 8094 avoids collision with other services.
      # The container-internal port remains 8092 (AGENT_REMEDIATION_HTTP_PORT).
      - "8094:8092"
      - "50054:50054" # gRPC
    networks:
      - default

  stub-llm:
    build:
      context: ./tests/e2e/stub-llm
    container_name: stub-llm
    ports:
      - "9100:9100"
    networks:
      - default

  stub-github:
    build:
      context: ./tests/e2e/stub-github
    container_name: stub-github
    environment:
      # The working tree stub-github serves from GET /repos/{o}/{r}/tarball/{ref}.
      # agent-remediation fetches a whole repository checkout there when it
      # repairs a python node, whose declaring contract yaml has no recorded
      # path and so has to be searched for across the tree.
      - REPO_FIXTURE_DIR=/fixtures/repo
    volumes:
      - ./tests/e2e/fixtures/py-remediation-repo:/fixtures/repo:ro
    ports:
      - "9200:9200"
    networks:
      - default

  agent-chat:
    build:
      context: .
      dockerfile: agent-chat/Dockerfile.dev
    container_name: agent-chat
    depends_on:
      - postgres
      - flyway-agent-chat
      - state
      - orchestrator
      - stub-llm
      - redis
    environment:
      - POSTGRES_DB=continuo_agent_chat
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_SSLMODE=disable
      - GRPC_PORT=50053
      - HEALTH_PORT=8091
      - CONTINUO_STATE_ADDR=state:50051
      - CONTINUO_ORCHESTRATOR_ADDR=orchestrator:50052
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=continuo
      - CHAT_MAX_CONCURRENT_SESSIONS=100
      - LOG_LEVEL=INFO
      - ENV=local
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_API_KEY=${LLM_API_KEY:-stub}
      - LLM_MODEL=${LLM_MODEL:-stub-model}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://stub-llm:9100}
    ports:
      - "8091:8091"
      - "50053:50053"
    volumes:
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - ./pkg:/app/pkg
      - ./go.work:/app/go.work
    networks:
      - default
    tty: true

  e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    container_name: e2e
    depends_on:
      state:
        condition: service_started
      orchestrator:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      ui:
        condition: service_started
      dbt-compile-and-load:
        condition: service_started
    environment:
      - ORCHESTRATOR_HOST=orchestrator
      - STATE_HOST=state
      - REDIS_HOST=redis
      - NEO4J_HOST=neo4j
      - POSTGRES_HOST=postgres
      - KUBECONFIG=/app/kubeconfig/kubeconfig.yaml
      - UI_HTTP_BASE=http://ui:8090
    volumes:
      - ./kubeconfig:/app/kubeconfig
      - ./tests/e2e:/app/tests/e2e
      - ./state:/app/state
      - ./orchestrator:/app/orchestrator
      - ./executor-controller:/app/executor-controller
      - ./k8s-controller:/app/k8s-controller
      - ./pkg:/app/pkg
      - ./go.work:/app/go.work
      - ./agent-chat:/app/agent-chat
      - ./agent-remediation:/app/agent-remediation
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - kind
    profiles:
      - e2e
    tty: true

  ui:
    build:
      context: ./ui
      network: host
    container_name: ui
    depends_on:
      - state
      - localstack
      - release-controller
      - stub-github
    environment:
      - STATE_GRPC_ADDR=state:50051
      - ORCHESTRATOR_GRPC_ADDR=orchestrator:50052
      - PORT=8090
      - NODE_ENV=production
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - RELEASE_CONTROLLER_URL=http://release-controller:8088
      - AUTH_MODE=dev
      - AGENT_CHAT_GRPC_ADDR=agent-chat:50053
      - CHAT_BRIDGE_ENABLED=true
      - REMEDIATION_GRPC_ADDR=agent-remediation:50054
      - GITHUB_APP_ID=1
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_APP_INSTALLATION_ID=1
      - GITHUB_API_BASE_URL=http://stub-github:9200
    ports:
      - "8090:8090"
    volumes:
      - ./ui/config:/app/config:ro
    networks:
      - default

  dex:
    image: dexidp/dex:v2.41.1
    container_name: dex
    profiles: ["auth-e2e"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./tests/e2e/dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      - default

  ui-auth:
    build:
      context: ./ui
      network: host
    container_name: ui-auth
    profiles: ["auth-e2e"]
    depends_on:
      - state
      - redis
      - dex
      - localstack
      - release-controller
    environment:
      - STATE_GRPC_ADDR=state:50051
      - ORCHESTRATOR_GRPC_ADDR=orchestrator:50052
      - PORT=8090
      - NODE_ENV=production
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=continuo
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - RELEASE_CONTROLLER_URL=http://release-controller:8088
      - AUTH_MODE=oidc
      - AUTH_OIDC_ISSUER_URL=http://dex:5556/dex
      - AUTH_OIDC_CLIENT_ID=continuo-ui
      - AUTH_OIDC_CLIENT_SECRET=e2e-secret
      - AUTH_PUBLIC_URL=http://ui-auth:8090
      - AUTH_OPERATOR_EMAILS=operator@example.com
      - AUTH_VIEWER_EMAILS=viewer@example.com
      - REDIS_URL=redis://:continuo@redis:6379
    volumes:
      - ./ui/config:/app/config:ro
    networks:
      - default

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d

  topology-controller:
    build:
      context: ./topology-controller
      dockerfile: Dockerfile.dev
    container_name: topology-controller
    environment:
      REDIS_URL: redis://:continuo@redis:6379
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: continuo
      S3_ENV: local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # SQL dialect for dependency resolution and the candidate-schema rewrite.
      # Mirrors the chart's validation.engine; the local stack runs Postgres.
      WAREHOUSE_ENGINE: postgres
    volumes:
      - ./pkg:/app/pkg:ro
    depends_on:
      redis:
        condition: service_started
      localstack:
        condition: service_healthy

  dbt-compile-and-load:
    build:
      context: ./dbt
      dockerfile: Dockerfile.upload
    container_name: dbt-compile-and-load
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - path: ./dbt/.env.hetzner
        required: false
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=continuo_dbt
      - POSTGRES_USER=continuo_svc
      - POSTGRES_PASSWORD=continuo
      # Per-service image tags recorded in compiled manifests. The e2e resolves
      # the dbt job image_tag from the release-controller service_prod table (seeded
      # by setup.sh / provision-k8s-test-env.sh with the real content-hash tags), so
      # this value only satisfies the topology-controller's A1 publish-boundary
      # validator, which rejects a batch whose image_tag is empty. setup.sh exports
      # the real per-service tags before `docker compose up`; the placeholder default
      # only keeps a bare `docker compose up` from tripping the validator.
      - IMAGE_TAG_PER_SERVICE=${IMAGE_TAG_PER_SERVICE:-service-1=e2e-local,service-2=e2e-local,service-3=e2e-local}
    volumes:
      - ./dbt/services:/app/services

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  kind:
    external: true
    name: kind