syntax = "proto3";
package orchestrator.v1;
option go_package = "github.com/carolsimone/continuo/cli/proto/orchestrator/v1;orchestratorv1";
import "google/protobuf/timestamp.proto";

service OrchestratorQuery {
  rpc GetScheduleGraph(GetScheduleGraphRequest) returns (GetScheduleGraphResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRunGraph(GetRunGraphRequest) returns (GetRunGraphResponse);
  rpc ListActiveRunDrifts(ListActiveRunDriftsRequest) returns (ListActiveRunDriftsResponse);
  rpc ListScheduleTopologies(ListScheduleTopologiesRequest)
      returns (ListScheduleTopologiesResponse);
  rpc GetNodeAncestry(GetNodeAncestryRequest) returns (GetNodeAncestryResponse);

  // GetNodeVersions returns a node's recorded code-version history, newest
  // first (ordered by promoted_at). An unknown unique_id is NOT_FOUND; a
  // known node with no recorded history returns an empty versions list —
  // that is a valid, non-error answer.
  rpc GetNodeVersions(GetNodeVersionsRequest) returns (GetNodeVersionsResponse);
  // GetNodeVersionDiff renders the diff between two named versions of one
  // node. from_seq/to_seq are stable per-node handles used to address a
  // version — they are NOT a chronological ordering, and neither is required
  // to be the newer of the pair. An unknown unique_id, or a seq that node has
  // no recorded version for, is NOT_FOUND.
  rpc GetNodeVersionDiff(GetNodeVersionDiffRequest) returns (GetNodeVersionDiffResponse);
  // GetUpstreamChanges returns the node's transitive ancestors' most recent
  // code change, most-recently-changed first. Results are capped at the 5
  // most-recently-changed ancestors, and each diff is independently capped
  // at 8 KiB with truncated set on the diffs that were cut — consumers size
  // prompts against both caps. An unknown unique_id is NOT_FOUND; a node
  // with no changed ancestors returns an empty changes list.
  rpc GetUpstreamChanges(GetUpstreamChangesRequest) returns (GetUpstreamChangesResponse);
  // GetCodeUnitVersions returns a shared-code unit's version chain, newest
  // first. Exactly one of unit_id/unique_id must be set: unit_id queries one
  // unit directly, unique_id resolves the node's current units first and
  // returns each of their chains concatenated. An unknown unit_id/unique_id
  // is NOT_FOUND; a known unit with no recorded history returns an empty
  // versions list.
  rpc GetCodeUnitVersions(GetCodeUnitVersionsRequest) returns (GetCodeUnitVersionsResponse);
  // GetNodeRunHistory returns runs that executed the node, newest first. An
  // unknown unique_id is NOT_FOUND; a known node with no runs yet returns an
  // empty runs list.
  rpc GetNodeRunHistory(GetNodeRunHistoryRequest) returns (GetNodeRunHistoryResponse);
}

message TableNode {
  string table_name = 1;
  string schema_name = 2;
  string service_name = 3;
  string owner = 4;
  string schedule_name = 5;
  Criticality criticality = 6;
  google.protobuf.Timestamp last_updated_at = 7;
  google.protobuf.Timestamp created_at = 8;
  string node_type = 9;
  string status = 10;
}

enum Criticality {
  CRITICALITY_UNSPECIFIED = 0;
  CRITICALITY_REGULATORY = 1;
  CRITICALITY_CORE = 2;
  CRITICALITY_SECONDARY = 3;
}

message GraphEdge {
  string from_node_id = 1;
  string to_node_id = 2;
}

message GetScheduleGraphRequest { string schedule_name = 1; }
message GetScheduleGraphResponse {
  repeated TableNode nodes              = 1;
  repeated GraphEdge edges              = 2;
  // topology_generation is :TopologyRoot.topology_generation at query time.
  // Returns 0 when the singleton is missing or the property is unset; consumers
  // MUST treat 0 as "generation unknown", not "generation zero".
  int64 topology_generation             = 3;
}

message ListRunsRequest {
  string schedule_name = 1;
  // page_size bounds the rows returned. Server clamps to [1, 200]; 0 (unset)
  // defaults to 50. Mirrors the StateService.ListNodes pagination contract.
  int32 page_size = 2;
  // page_offset skips this many rows before the page. Negative values are
  // treated as 0.
  int32 page_offset = 3;
}
message ListRunsResponse {
  repeated RunSummary runs = 1;
  // total_count is the number of completed runs matching schedule_name,
  // independent of page_size/page_offset, so callers can paginate.
  int32 total_count = 2;
}
message RunSummary {
  string run_id = 1;
  string schedule_name = 2;
  string terminal_status = 3;
  string created_at = 4;
  string completed_at = 5;
}

message GetRunGraphRequest { string run_id = 1; }
message GetRunGraphResponse {
  repeated TableNode nodes = 1;
  repeated GraphEdge edges = 2;
  // run_topology_generation is the value stamped on the :Run node at
  // SnapshotGraph time (orchestrator/adapters/neo4j/run_repository.go:91-99).
  // Returns 0 when the run does not exist or pre-dates topology tracking;
  // consumers MUST treat 0 as "drift unknown", not "no drift".
  int64 run_topology_generation = 3;
  // latest_topology_generation is the orchestrator's current
  // topology_state.topology_generation (Postgres singleton).
  int64 latest_topology_generation = 4;
}

message ListActiveRunDriftsRequest {}
message ListActiveRunDriftsResponse {
  // latest_topology_generation matches the value in GetRunGraphResponse.
  int64 latest_topology_generation = 1;
  repeated ActiveRunDrift active_runs = 2;
}
message ActiveRunDrift {
  string schedule_name = 1;
  string run_id = 2;
  int64 run_topology_generation = 3;
}

message ListScheduleTopologiesRequest {}

message ListScheduleTopologiesResponse {
  repeated ScheduleTopologySummary schedules = 1;
}

message ScheduleTopologySummary {
  string schedule_name                       = 1;
  int32  node_count                          = 2;
  google.protobuf.Timestamp last_updated_at  = 3;
}

message GetNodeAncestryRequest {
  string node_unique_id = 1;  // :Table unique_id (schema.table) of the failed node
  int32  max_depth      = 2;  // 0 = full ancestry closure; >0 caps hops from the node
}

message GetNodeAncestryResponse {
  repeated AncestorNode ancestors = 1;  // node itself at depth 0, then upstreams; changed_at DESC nulls last
}

message AncestorNode {
  string unique_id    = 1;
  string schema_name  = 2;
  string table_name   = 3;
  string service_name = 4;
  string node_type    = 5;
  int32  depth        = 6;  // 0 = the queried node itself; 1 = direct upstream; ...
  string last_commit_sha = 7;   // "" when unknown (pre-tracking)
  string last_repo       = 8;   // "" when unknown
  google.protobuf.Timestamp last_changed_at = 9;  // unset when unknown
  string last_release_id = 10;  // "" when unknown
  string file_path       = 11;  // dbt original_file_path (project-relative); "" if not captured
}

// VersionView is one recorded code state of a node: identity and hash parts,
// the provenance stamp, and the code itself.
message VersionView {
  string unique_id = 1;
  int64 version_seq = 2;
  string content_hash = 3;
  string source_hash = 4;
  string shared_code_hash = 5;
  string config_hash = 6;
  string runtime = 7;
  string raw_code = 8;
  // compiled_code may be truncated to a server-side byte cap; compiled_truncated
  // is set when it was cut.
  string compiled_code = 9;
  bool compiled_truncated = 10;
  string config_json = 11;
  string repo = 12;
  string commit_sha = 13;
  string release_id = 14;
  string promoted_at = 15;  // RFC3339
  bool healed = 16;
  bool backfilled = 17;
  // is_current marks the version the node runs now. Exactly one version in a
  // chain walk carries it; a node whose :Table was retired has none.
  bool is_current = 18;
}

// VersionDiff is a server-rendered comparison of two versions of one node.
// The diffs are rendered server-side so every caller sees the same thing.
message VersionDiff {
  string unique_id = 1;
  VersionView from = 2;
  VersionView to = 3;
  // raw_code_diff is a unified diff of raw_code; "" when the source is
  // unchanged.
  string raw_code_diff = 4;
  // config_diff is a unified diff over the canonical (sorted-key, indented)
  // config JSON; "" when unchanged.
  string config_diff = 5;
  bool source_changed = 6;
  bool shared_code_changed = 7;
  bool config_changed = 8;
  // truncated is set when either diff above was cut to the per-diff 8 KiB
  // byte cap.
  bool truncated = 9;
}

// UpstreamChange is one ancestor of a node together with its most recent
// code change.
message UpstreamChange {
  string unique_id = 1;
  int32 depth = 2;
  VersionDiff diff = 3;
}

// UnitVersionView is one recorded state of a shared-code unit.
message UnitVersionView {
  string unit_id     = 1;
  string checksum    = 2;
  string source      = 3;
  string repo        = 4;
  string commit_sha  = 5;
  string release_id  = 6;
  string promoted_at = 7;  // RFC3339
  bool   is_current  = 8;
}

// RunExecution is one run that executed a node, with the code it actually
// ran.
message RunExecution {
  string run_id        = 1;
  string task_id       = 2;
  string status        = 3;
  string schedule_name = 4;
  string operation     = 5;
  string image_tag     = 6;
  // content_hash is the code the run executed, stamped on the :EXECUTES edge
  // at snapshot time. Empty for runs that predate the stamp.
  string content_hash = 7;
  string created_at   = 8;  // RFC3339
  string completed_at = 9;  // RFC3339, "" while the run has not finished
}

message GetNodeVersionsRequest {
  string unique_id = 1;
  // limit bounds the number of versions returned, newest first. <= 0
  // defaults to 20; values above 200 are clamped to it.
  int32 limit = 2;
}
message GetNodeVersionsResponse {
  repeated VersionView versions = 1;
}

message GetNodeVersionDiffRequest {
  string unique_id = 1;
  int64 from_seq = 2;
  int64 to_seq = 3;
}
message GetNodeVersionDiffResponse {
  VersionDiff diff = 1;
}

message GetUpstreamChangesRequest {
  string unique_id = 1;
  // depth bounds how many hops upstream to walk; <= 0 defaults to 3 hops
  // server-side. Server-validated: depth above 10 is rejected as invalid.
  int32 depth = 2;
  // since is an RFC3339 timestamp; ancestors whose newest version predates it
  // are excluded. "" (empty) applies no time filter.
  string since = 3;
}
message GetUpstreamChangesResponse {
  repeated UpstreamChange changes = 1;
}

// GetCodeUnitVersionsRequest addresses a shared-code unit's version chain by
// exactly one of unit_id or unique_id — never both, never neither.
message GetCodeUnitVersionsRequest {
  // unit_id queries one unit's chain directly. Mutually exclusive with
  // unique_id.
  string unit_id = 1;
  // unique_id resolves the node's current units first and returns each of
  // their chains concatenated in resolution order. Mutually exclusive with
  // unit_id.
  string unique_id = 2;
  // limit bounds the number of versions returned per unit, newest first.
  // <= 0 defaults to 20; values above 200 are clamped to it.
  int32 limit = 3;
}
message GetCodeUnitVersionsResponse {
  repeated UnitVersionView versions = 1;
}

message GetNodeRunHistoryRequest {
  string unique_id = 1;
  // limit bounds the number of runs returned, newest first. <= 0 defaults to
  // 20; values above 200 are clamped to it.
  int32 limit = 2;
}
message GetNodeRunHistoryResponse {
  repeated RunExecution runs = 1;
}
