syntax = "proto3";

package run.v1;

option go_package = "github.com/carolsimone/continuo/run-controller/proto/run/v1;runv1";

import "google/protobuf/timestamp.proto";

// RunService is the public API for runs, their tasks and attempts, the
// schedules that start them and the topology of the live release.
//
// Statuses travel as the lowercase strings of the run_status and task_status
// vocabularies and an operation as a string of the operation vocabulary, all
// declared in pkg/streams/contract.yaml.
//
// The tenant of a call is the one the caller's identity carries; no request
// names it. Every error below is a gRPC status code. A call whose request
// fields are missing or malformed is INVALID_ARGUMENT, and a failure of state
// itself, or a request that reaches it without a tenant, is INTERNAL; the lists
// below name the other codes of each RPC. A run of another tenant
// is a run that does not exist: NOT_FOUND where an RPC names NOT_FOUND, and an
// empty result where it returns one.
//
// The commands that start a run (StartRun, TriggerRerun, TriggerRebase and
// TriggerSingleNodeRun) and CancelActiveRun are idempotent per request_id. The
// first call with an id does its work. A retry with the same id and the same
// parameters writes nothing and answers with the run the first call created or
// cancelled. The same id with other parameters is ALREADY_EXISTS ("request_id
// reused with different parameters"). A call that is refused stores nothing,
// so its id may be sent again. Concurrent calls of one id serialise on it; a
// call that keeps losing the id to concurrent calls that then roll back is
// ABORTED, and the same call may be sent again with the same request_id. An
// id is remembered for at least 30 days. A request_id is a UUID and is
// required: an empty or malformed one is INVALID_ARGUMENT.
//
// While maintenance mode is on, every command that starts a run or changes a
// schedule is refused with UNAVAILABLE. Cancels and reads, PreviewSchedule
// among them, are not.
service RunService {
  // ==========================================================================
  // Commands
  // ==========================================================================

  // StartRun creates a run of a schedule's nodes in the live release and
  // dispatches its ready tasks in the transaction that creates it. The run's
  // kind is trigger. A test of a schedule none of whose nodes has data tests
  // is not refused: the run is created, ends skipped with no task, and its id
  // is returned.
  // Errors:
  //   INVALID_ARGUMENT    - empty schedule_name or one longer than 50
  //                         characters, the longest a run carries, an unknown
  //                         operation, or full_refresh, which targets a single
  //                         node only.
  //   NOT_FOUND           - no model of the tenant's live release carries the
  //                         schedule_name, and it has no cron.
  //   FAILED_PRECONDITION - the schedule already has an active run, or its
  //                         selection cannot make a valid run: no release is
  //                         live, the live release holds no node of the
  //                         schedule, or a node to run has a node type the
  //                         node_type vocabulary does not declare.
  //   ALREADY_EXISTS      - request_id reused with different parameters.
  //   ABORTED             - concurrent calls of the same request_id kept
  //                         rolling back; send it again with the same
  //                         request_id.
  //   UNAVAILABLE         - maintenance mode is on.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);

  // TriggerRerun creates a run that re-executes a failed or cancelled run's
  // tasks that did not succeed, and their descendants, on the source run's
  // release, and dispatches the ready ones in the transaction that creates it.
  // The new run keeps the source's schedule_name.
  // Errors:
  //   INVALID_ARGUMENT    - source_run_id is empty or not a UUID.
  //   NOT_FOUND           - source_run_id names no run.
  //   FAILED_PRECONDITION - the source is not failed or cancelled, names no
  //                         release, is a test run, leaves nothing to
  //                         re-execute, or its schedule already has an active
  //                         run.
  //   ALREADY_EXISTS      - request_id reused with different parameters.
  //   ABORTED             - concurrent calls of the same request_id kept
  //                         rolling back; send it again with the same
  //                         request_id.
  //   UNAVAILABLE         - maintenance mode is on.
  rpc TriggerRerun(TriggerRerunRequest) returns (TriggerRerunResponse);

  // TriggerSingleNodeRun creates a synthesised single-node run that executes
  // exactly one task with no downstream pickup. The required metadata_source
  // field of the request selects one of two modes:
  //   - "latest": the node as the live release holds it.
  //   - "snapshot_of_run": the node as the release of the source run holds it;
  //     requires source_run_id.
  // The run holds no schedule, so an active run of the node's schedule does
  // not refuse it.
  // Errors:
  //   INVALID_ARGUMENT    - an empty service_name, schema_name or table_name,
  //                         an empty or unknown metadata_source,
  //                         "snapshot_of_run" without a UUID source_run_id,
  //                         "latest" with a non-empty source_run_id, an
  //                         unknown operation, or a full_refresh of a node
  //                         type that cannot be rebuilt from scratch.
  //   NOT_FOUND           - the source run, or its task for the identity,
  //                         does not exist; or no release is live for
  //                         "latest"; or the release holds no such node of
  //                         that service.
  //   FAILED_PRECONDITION - "snapshot_of_run" with a source run that is not
  //                         terminal or names no release; or a test of a node
  //                         with no data tests; or a node type the node_type
  //                         vocabulary does not declare.
  //   ALREADY_EXISTS      - request_id reused with different parameters.
  //   ABORTED             - concurrent calls of the same request_id kept
  //                         rolling back; send it again with the same
  //                         request_id.
  //   UNAVAILABLE         - maintenance mode is on.
  rpc TriggerSingleNodeRun(TriggerSingleNodeRunRequest)
      returns (TriggerSingleNodeRunResponse);

  // TriggerRebase creates a new run on the source's schedule and the live
  // release that restarts the source from its failure. It re-executes the
  // source's tasks that did not succeed (failed, cancelled or skipped) whose
  // node the live schedule still holds, the live schedule's nodes the source
  // never ran, every descendant of those and, with include_changed_upstream,
  // every changed node upstream of anything it re-executes, until no changed
  // ancestor is left out. A node is changed when its content_hash, node_type,
  // secret_ref or upstream nodes differ between the live release and the
  // release the source's result for the node was built on: the source's
  // release, or for a success the source inherited, the release of the run
  // that built it. image_tag alone is not a change. Every other source
  // success is inherited. The new run keeps the source's schedule_name. A
  // non-empty expected_release_id must name the live release.
  // Errors:
  //   INVALID_ARGUMENT    - source_run_id is empty or not a UUID.
  //   NOT_FOUND           - source_run_id names no run.
  //   FAILED_PRECONDITION - the source is not failed or cancelled; or it has
  //                         no task that did not succeed; or its schedule
  //                         already has an active run; or it names no release,
  //                         is a test run, or leaves nothing to re-execute; or
  //                         the live release is not expected_release_id
  //                         (message "the live release changed; preview
  //                         again").
  //   ALREADY_EXISTS      - request_id reused with different parameters.
  //   ABORTED             - concurrent calls of the same request_id kept
  //                         rolling back; send it again with the same
  //                         request_id.
  //   UNAVAILABLE         - maintenance mode is on.
  rpc TriggerRebase(TriggerRebaseRequest) returns (TriggerRebaseResponse);

  // PreviewRebase reports what TriggerRebase would run for the same
  // source_run_id and include_changed_upstream on the live release, without
  // creating a run: the live release, how many nodes run and why, and the
  // changed upstream nodes with what each feeds and its last successful
  // duration. changed_nodes lists every changed upstream node the option would
  // add, whether or not include_changed_upstream is set. Maintenance mode does
  // not refuse it.
  // Errors: as TriggerRebase, except that an active run on the schedule does
  // not refuse a preview, no release is compared, and it takes no request_id,
  // so it is never ALREADY_EXISTS or ABORTED.
  rpc PreviewRebase(PreviewRebaseRequest) returns (PreviewRebaseResponse);

  // CancelRun cancels a run by id. The response carries the run as the cancel
  // left it: cancelling while an attempt is still being stopped, cancelled once
  // nothing was in flight. A run that is already cancelling or cancelled is
  // returned as it is, and nothing is written. It takes no request_id.
  // Errors:
  //   INVALID_ARGUMENT    - run_id is empty or not a UUID.
  //   NOT_FOUND           - run_id names no run of the tenant.
  //   FAILED_PRECONDITION - the run ended succeeded, failed or skipped.
  rpc CancelRun(CancelRunRequest) returns (RunResponse);

  // CancelActiveRun cancels the active run of a named schedule, as CancelRun
  // does, and answers with its id. A retry with the same request_id answers
  // with the run the first call cancelled, even once the schedule has another
  // active run.
  // Errors:
  //   INVALID_ARGUMENT    - empty schedule_name.
  //   FAILED_PRECONDITION - the schedule has no active run.
  //   ALREADY_EXISTS      - request_id reused with different parameters.
  //   ABORTED             - concurrent calls of the same request_id kept
  //                         rolling back; send it again with the same
  //                         request_id.
  rpc CancelActiveRun(CancelActiveRunRequest) returns (CancelActiveRunResponse);

  // ==========================================================================
  // Run and task reads
  // ==========================================================================

  // GetRun returns one run.
  // Errors:
  //   INVALID_ARGUMENT - run_id is empty or not a UUID.
  //   NOT_FOUND        - run_id names no run of the tenant.
  rpc GetRun(GetRunRequest) returns (RunResponse);

  // ListRuns returns a schedule's completed runs, newest first. page_size is
  // clamped to [1, 200], 0 meaning 50; a negative page_offset is 0.
  // total_count counts every completed run of the schedule. A schedule with no
  // completed run returns no runs and total_count 0.
  // Errors: INVALID_ARGUMENT (empty schedule_name).
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);

  // ListActiveRunDrifts returns the live promotion seq and every schedule's
  // newest pending, running or cancelling run with the promotion seq its
  // release was live under (0 when it names no release).
  // Errors: none beyond the service-wide ones. With no active run it returns
  // an empty list.
  rpc ListActiveRunDrifts(ListActiveRunDriftsRequest) returns (ListActiveRunDriftsResponse);

  // ListTasks returns one page of a run's tasks, newest first, optionally only
  // those in one status. A page_size of 0 or less means 50, with no upper
  // bound; a page_offset of 0 or less is 0. total_count counts every task the
  // filter matches. A run of the tenant that does not exist, or a run of
  // another tenant, returns no tasks and total_count 0.
  // Errors:
  //   INVALID_ARGUMENT - run_id is empty or not a UUID, or status is set and
  //                      is not a task_status value.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // ListRunAttempts returns one page of a run's task attempts, or of one of its
  // tasks when task_id is set, ordered by task_id then attempt. page_size is
  // clamped to [1, 200], 0 meaning 50; a negative page_offset is 0.
  // total_count counts every attempt the filter matches. A run of the tenant
  // that does not exist, or a run of another tenant, returns no attempts and
  // total_count 0.
  // Errors: INVALID_ARGUMENT (run_id is empty or not a UUID, or task_id is set
  // and is not a UUID).
  rpc ListRunAttempts(ListRunAttemptsRequest) returns (ListRunAttemptsResponse);

  // GetRunGraph returns a run's tasks as nodes and the dependencies among them
  // in the run's own release, with the promotion seq that release was live
  // under and the live one. Edges point from the dependent node to its
  // dependency; node ids are "service.schema.table". An unknown run returns no
  // nodes and run_promotion_seq 0; a run that names no release returns its
  // nodes, no edges and run_promotion_seq 0. Consumers treat 0 as "drift
  // unknown". A run of another tenant is an unknown run.
  // Errors: INVALID_ARGUMENT (run_id is empty or not a UUID).
  rpc GetRunGraph(GetRunGraphRequest) returns (GetRunGraphResponse);

  // ==========================================================================
  // Node reads
  // ==========================================================================

  // ListNodeTasks returns the most recent tasks of a node applying operation,
  // newest run first; the tasks of run (the empty default) include the node's
  // full refreshes. The identity fields are required; limit is capped
  // server-side at 50 (0 uses the default of 50). A node with no task returns
  // no tasks.
  // Errors: INVALID_ARGUMENT (service_name, schema_name or table_name is
  // empty, or operation is not an operation value).
  rpc ListNodeTasks(ListNodeTasksRequest) returns (ListNodeTasksResponse);

  // ListNodes returns the node catalog: one summary row per node that has run,
  // with stats aggregated over the most recent 50 tasks of each node. Supports a
  // case-insensitive exact match on the table name (searching "table_2" returns
  // only "table_2", never "ftable_2" or "table_2_v2"), an exact service_name
  // filter, and limit/offset paging. total_count reports the full
  // match count (before paging). A limit of 0 or less means 50 and a limit
  // above 200 is 200; a negative offset is 0. The catalog of run (the empty
  // default) includes full refreshes.
  // Errors: INVALID_ARGUMENT (operation is not an operation value).
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // ListNodeNames returns the distinct table names of nodes that have run,
  // optionally filtered by service. It powers the node search autocomplete
  // (the complete name list, independent of the paginated catalog).
  // Errors: none beyond the service-wide ones. A service with no node returns
  // an empty list.
  rpc ListNodeNames(ListNodeNamesRequest) returns (ListNodeNamesResponse);

  // ListNodeServices returns the distinct service names of nodes that have run.
  // It powers the catalog and remediation service filters (the complete service
  // list, independent of the paginated catalog).
  // Errors: none beyond the service-wide ones.
  rpc ListNodeServices(ListNodeServicesRequest) returns (ListNodeServicesResponse);

  // ==========================================================================
  // Schedule commands
  // ==========================================================================
  //
  // A schedule is a schedule name: the models of the live release whose dbt
  // tag names it. Its cron says when it runs on its own; a schedule with no
  // cron runs only when triggered. The commands below change only the cron,
  // and they take no request_id. Repeating an UpsertSchedule saves the same
  // cron, timezone, description and paused flag again, but each save raises
  // version and updated_at: a retry that sends the expected_version the
  // first call sent is ABORTED once the first call has saved. Repeating a
  // DeleteSchedule leaves the schedule with no cron, as the first did.

  // UpsertSchedule creates or replaces the cron of a schedule: its cron (five
  // fields or a descriptor such as @daily), the IANA timezone it is read in,
  // its description and whether it is paused. The next fire counts from now,
  // and a paused schedule has none: fires missed while paused do not run. The
  // version goes up by one, and updated_by is the caller's identity. A
  // schedule that has a cron can be edited, paused, resumed or removed
  // whatever the live release holds; only a schedule's first cron needs a
  // model of the live release with its tag. With expected_version above 0 the
  // cron is saved only while the schedule is at that version; 0 saves with no
  // check, and the last write wins: an edit that finds another edit saved
  // first reads the schedule again and saves over it, up to three tries in
  // all. The response carries the schedule as saved and its next three fire
  // times (none while paused).
  // Errors:
  //   INVALID_ARGUMENT - empty schedule_name or one longer than 50
  //                      characters, a negative expected_version, or a cron
  //                      or timezone the parser refuses (a CRON_TZ= or TZ=
  //                      prefix, an unknown or empty zone, a cron that never
  //                      fires, an @every interval under one minute); for a
  //                      refusal of the parser the message is the parser's.
  //   NOT_FOUND        - the schedule has no cron and no model of the live
  //                      release has its tag.
  //   ABORTED          - expected_version is set and the schedule is not at
  //                      it: another edit saved first, or its cron was
  //                      removed. Read the schedule again before editing it.
  //                      With expected_version 0, other edits saved first on
  //                      each of the three tries; the same call may be sent
  //                      again.
  //   UNAVAILABLE      - maintenance mode is on.
  rpc UpsertSchedule(UpsertScheduleRequest) returns (UpsertScheduleResponse);

  // DeleteSchedule removes the cron of a schedule, which then runs only when
  // triggered. A run of it in progress goes on. Deleting the cron of a
  // schedule that has none succeeds.
  // Errors:
  //   INVALID_ARGUMENT - empty schedule_name.
  //   UNAVAILABLE      - maintenance mode is on.
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);

  // PreviewSchedule reads a cron in a timezone as UpsertSchedule would, with
  // the same parser that fires it, and returns it in English words with its
  // next three fire times from now. It writes nothing, and maintenance mode
  // does not refuse it. cron_words is empty for a cron the parser fires but
  // the words cannot describe.
  // Errors: INVALID_ARGUMENT (a cron or timezone the parser refuses; the
  // message is the parser's).
  rpc PreviewSchedule(PreviewScheduleRequest) returns (PreviewScheduleResponse);

  // ==========================================================================
  // Schedule reads
  // ==========================================================================

  // ListSchedules returns one entry per schedule name that the live release
  // has or that has a cron, ordered by schedule_name: its cron, how many
  // models of the live release have its tag, and its last run. A schedule
  // that has a cron, is not paused and has a model_count of 0 records a
  // failed run at each fire until a release brings its models back, it is
  // paused, or its cron is removed. A schedule whose stored cron the parser no
  // longer reads (a timezone the timezone database has dropped) is listed with
  // no cron, whether or not the live release has its name; it fires nothing,
  // UpsertSchedule saves a new cron over it and DeleteSchedule removes it.
  // Errors: none beyond the service-wide ones. With no schedule it returns an
  // empty list.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);

  // GetScheduleGraph returns the live release view of one schedule: its
  // nodes, their one-hop upstream nodes in other schedules, the edges among
  // them (internal and cross-schedule) and the live promotion seq. A schedule
  // the live release does not hold returns no nodes and no edges. When no
  // release is live the graph is empty and promotion_seq is 0.
  // Errors: INVALID_ARGUMENT (empty schedule_name).
  rpc GetScheduleGraph(GetScheduleGraphRequest) returns (GetScheduleGraphResponse);

  // ListScheduleTopologies returns, for each schedule of the live release, its
  // node count and the time state loaded that release. It is empty when no
  // release is live.
  // Errors: none beyond the service-wide ones.
  rpc ListScheduleTopologies(ListScheduleTopologiesRequest)
      returns (ListScheduleTopologiesResponse);
}

// ============================================================================
// DOMAIN MESSAGES
// ============================================================================

// Run is one execution of a set of nodes.
message Run {
  string run_id = 1;
  // schedule_name is the schedule the run belongs to. A single-node or
  // promote-seed run carries a name made for it, "single-node-run-<8hex>" or
  // "promote-seed-<8hex>", and a rerun or rebase of a run copies its name.
  string schedule_name = 2;
  string kind = 3;       // cron | trigger | rerun | rebase | single_node_run | promote_seed
  string operation = 4;  // run | test | build | full_refresh
  string status = 5;     // pending | running | cancelling | succeeded | failed | cancelled | skipped
  // failure_reason says why a failed run failed when no task of it did:
  // stalled | empty_selection | invalid_node_type. It is empty otherwise.
  string failure_reason = 6;
  string release_id = 7;       // the release the run executes on; empty when it names none
  int64 promotion_seq = 8;     // the promotion_seq of that release; 0 when it names no release
  string initiated_by = 9;     // the identity that started the run; empty for a cron fire
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp started_at = 11;        // unset until the first task starts
  google.protobuf.Timestamp completed_at = 12;      // unset until the run ended
  google.protobuf.Timestamp last_progress_at = 13;  // the latest dispatch or task move of the run
  google.protobuf.Timestamp cancelled_at = 14;      // set once a cancel was requested
  string cancelled_by = 15;                         // set once a cancel was requested
  string cancellation_reason = 16;                  // set once a cancel was requested
}

// Task is one node of a run.
message Task {
  string task_id = 1;
  string run_id = 2;
  google.protobuf.Timestamp created_at = 3;
  string service_name = 4;
  string schema_name = 5;
  string table_name = 6;
  string job_name = 7;  // Kubernetes Job identifier (computed from service-schema-table)
  string status = 8;    // pending | dispatched | queued | running | stopping | succeeded | failed | cancelled | skipped
  int32 attempt = 9;    // 0-based number of the current attempt of the task
  int32 max_retries = 10;
  google.protobuf.Timestamp cancelled_at = 11;  // set only while status is cancelled
  string cancelled_by = 12;                     // set only while status is cancelled
  string wait_reason = 13;                      // node_lease while the task waits for another run to release its node; empty otherwise
  string waiting_on_run_id = 14;                // the run whose task holds the node the task waits for; empty when it waits for nothing or no task holds the node
  google.protobuf.Timestamp waiting_since = 15; // when the task began waiting for wait_reason; unset when it has none
}

// TaskAttempt is one attempt of a task: one dispatch of its Kubernetes Job.
message TaskAttempt {
  string task_id = 1;
  int32 attempt = 2;                              // 0-based attempt number
  string job_name = 3;                            // Kubernetes Job of this attempt
  string status = 4;                              // dispatched | queued | running | succeeded | failed | stopped
  string failure_class = 5;                       // why the attempt failed; empty unless failed
  string failure_reason = 6;                      // the specific failure within failure_class; empty unless failed
  // exit_code is the exit code of the container, 0 when unknown: a 0 is a clean exit
  // only for a succeeded attempt, so read it together with status and
  // failure_reason.
  int32 exit_code = 7;
  google.protobuf.Timestamp dispatched_at = 8;    // when state dispatched the attempt
  google.protobuf.Timestamp queued_at = 9;        // unset until reported
  google.protobuf.Timestamp started_at = 10;      // unset until reported
  google.protobuf.Timestamp finished_at = 11;     // unset until the attempt finished
  double execution_seconds = 12;                  // 0 until recorded
  string error_message = 13;                      // empty when none
  string log_s3_key = 14;                         // S3 object key of the pod log; empty when none
  string run_results_uri = 15;                    // S3 object key of the structured result block; empty when none
}

// Schedule is the cron of one schedule, as stored.
message Schedule {
  string schedule_name = 1;
  string cron = 2;                              // five fields or a descriptor such as @daily
  string timezone = 3;                          // IANA timezone the cron is read in
  string description = 4;                       // empty when the schedule has none
  bool paused = 5;                              // nothing starts on its own while paused
  google.protobuf.Timestamp next_fire_at = 6;   // unset while paused or when the cron fires no more
  int64 version = 7;                            // counts the edits of the cron, from 1
  string updated_by = 8;                        // who made the latest edit
  google.protobuf.Timestamp updated_at = 9;     // when the latest edit was made
}

// ============================================================================
// COMMAND REQUESTS/RESPONSES
// ============================================================================

message StartRunRequest {
  string request_id = 1;     // Required: UUID, see the idempotency rules of the service
  string schedule_name = 2;  // Required
  // operation is "" | "run" | "test" | "build"; empty means run. "full_refresh"
  // is single-node only and is rejected here (INVALID_ARGUMENT).
  string operation = 3;
}

// run_id is always non-empty on success.
message StartRunResponse {
  string run_id = 1;
}

message TriggerRerunRequest {
  string request_id = 1;      // Required: UUID
  string source_run_id = 2;   // Required: the failed or cancelled run to rerun
}

message TriggerRerunResponse {
  string run_id = 1;         // the new rerun run
  string schedule_name = 2;  // copied verbatim from the source schedule_name
}

message TriggerSingleNodeRunRequest {
  string request_id = 1;       // Required: UUID
  string service_name = 2;     // Required
  string schema_name = 3;      // Required
  string table_name = 4;       // Required
  string metadata_source = 5;  // Required: "latest" | "snapshot_of_run"
  string source_run_id = 6;    // Required iff metadata_source is "snapshot_of_run"
  // operation is "" | "run" | "test" | "build" | "full_refresh"; empty means
  // run. full_refresh rebuilds a dbt model or seed from scratch.
  string operation = 7;
}

message TriggerSingleNodeRunResponse {
  string run_id = 1;         // the synthesised run
  string schedule_name = 2;  // "single-node-run-<8hex>"
}

message TriggerRebaseRequest {
  string request_id = 1;                 // Required: UUID
  string source_run_id = 2;              // Required: the failed or cancelled run to rebase from
  bool include_changed_upstream = 3;     // also re-execute the changed nodes upstream of what re-executes
  string expected_release_id = 4;        // the live release the caller previewed; empty skips the check
}

message TriggerRebaseResponse {
  string run_id = 1;         // the new rebase run
  string schedule_name = 2;  // copied verbatim from the source schedule_name
}

message PreviewRebaseRequest {
  string source_run_id = 1;           // Required: the failed or cancelled run to rebase from
  bool include_changed_upstream = 2;  // as TriggerRebaseRequest.include_changed_upstream
}

// ChangedUpstreamNode is a changed node upstream of what a rebase re-executes.
message ChangedUpstreamNode {
  string service_name = 1;
  string schema_name = 2;
  string table_name = 3;
  int32 downstream = 4;             // nodes below it in the live schedule
  double last_success_seconds = 5;  // execution time of its latest successful task; 0 when it has none
}

message PreviewRebaseResponse {
  string release_id = 1;         // the live release previewed; send it as TriggerRebaseRequest.expected_release_id
  int64 promotion_seq = 2;       // the promotion_seq of that release
  int32 total_nodes = 3;         // tasks of the rebase: re-executed plus inherited
  int32 will_run = 4;            // tasks it re-executes: the sum of the four counts below
  int32 failed_or_skipped = 5;   // source tasks that did not succeed
  int32 new_nodes = 6;           // live schedule nodes the source never ran
  int32 changed_upstream = 7;    // changed upstream nodes it re-executes; 0 without include_changed_upstream
  int32 downstream = 8;          // every other re-executed node, each below one counted above
  int32 inherited = 9;           // source successes carried over
  repeated ChangedUpstreamNode changed_nodes = 10;  // ordered by service, schema, table
}

message CancelRunRequest {
  string run_id = 1;               // Required
  string cancelled_by = 2;         // Optional
  string cancellation_reason = 3;  // Optional
}

message CancelActiveRunRequest {
  string request_id = 1;           // Required: UUID
  string schedule_name = 2;        // Required
  string cancelled_by = 3;         // Optional
  string cancellation_reason = 4;  // Optional
}

message CancelActiveRunResponse {
  string run_id = 1;  // the run that was cancelled
}

// ============================================================================
// RUN AND TASK REQUESTS/RESPONSES
// ============================================================================

message GetRunRequest {
  string run_id = 1;  // Required
}

message RunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string schedule_name = 1;  // Required
  int32 page_size = 2;
  int32 page_offset = 3;
}

message RunSummary {
  string run_id = 1;
  string schedule_name = 2;
  string status = 3;          // succeeded | failed | cancelled | skipped
  string created_at = 4;      // RFC3339, UTC, seconds
  string completed_at = 5;    // RFC3339, UTC, seconds
  string failure_reason = 6;  // stalled | empty_selection | invalid_node_type when the run failed without a failed task; empty otherwise
}

message ListRunsResponse {
  repeated RunSummary runs = 1;
  int32 total_count = 2;
}

message ListActiveRunDriftsRequest {}

message ActiveRunDrift {
  string schedule_name = 1;
  string run_id = 2;
  int64 run_promotion_seq = 3;  // 0 when the run names no release
}

message ListActiveRunDriftsResponse {
  int64 latest_promotion_seq = 1;
  repeated ActiveRunDrift active_runs = 2;
}

message ListTasksRequest {
  string run_id = 1;       // Required
  string status = 2;       // Optional filter: a task_status value
  int32 page_size = 3;     // 0 or less means 50; there is no upper bound
  int32 page_offset = 4;   // Negative values are treated as 0
}

message ListTasksResponse {
  repeated Task tasks = 1;
  int32 total_count = 2;   // tasks matching the filter, ignoring paging
}

message ListRunAttemptsRequest {
  string run_id = 1;       // Required
  string task_id = 2;      // Optional: empty lists every task of the run
  int32 page_size = 3;     // Clamped to [1, 200]; 0 means 50
  int32 page_offset = 4;   // Negative values are treated as 0
}

message ListRunAttemptsResponse {
  repeated TaskAttempt attempts = 1;
  int32 total_count = 2;   // attempts matching the filter, ignoring paging
}

message RunGraphNode {
  string service_name = 1;
  string schema_name = 2;
  string table_name = 3;
  string schedule_name = 4;      // the schedule of the node in the release of the run; empty when unknown
  string node_type = 5;          // empty when the run names no release
  string status = 6;             // the task status: a task_status value
  string task_id = 7;
  string wait_reason = 8;        // node_lease while the task waits for another run to release its node; empty otherwise
  string waiting_on_run_id = 9;  // the run whose task holds the node the task waits for; empty when it waits for nothing or no task holds the node
  string waiting_since = 10;     // RFC3339, when the task began waiting for wait_reason; empty when it has none
}

message RunGraphEdge {
  string from_node_id = 1;  // the dependent node, "service.schema.table"
  string to_node_id = 2;    // its dependency, "service.schema.table"
}

message GetRunGraphRequest {
  string run_id = 1;  // Required
}

message GetRunGraphResponse {
  repeated RunGraphNode nodes = 1;
  repeated RunGraphEdge edges = 2;
  int64 run_promotion_seq = 3;     // 0 when the run is unknown or names no release
  int64 latest_promotion_seq = 4;  // the live promotion seq; 0 when no release is live
}

// ============================================================================
// NODE REQUESTS/RESPONSES
// ============================================================================

message ListNodeTasksRequest {
  string service_name = 1;  // Required
  string schema_name = 2;   // Required
  string table_name = 3;    // Required
  int32 limit = 4;          // 0 means the server default 50; at most 50
  string operation = 5;     // run | test | build; empty means run
}

message ListNodeTasksResponse {
  repeated NodeTask tasks = 1;
}

// NodeTask is one task of a node, with the run it belongs to.
message NodeTask {
  string run_id = 1;
  string schedule_name = 2;
  string kind = 3;                // the run kind: cron | trigger | rerun | rebase | single_node_run | promote_seed
  string run_status = 4;          // the run status: a run_status value
  string task_id = 5;
  string task_status = 6;         // a task_status value
  int32 attempt = 7;              // 0-based number of the current attempt of the task
  string image_tag = 8;
  string created_at = 9;          // RFC3339
  string started_at = 10;         // RFC3339, empty if no execution yet
  string completed_at = 11;       // RFC3339, empty if not finished
  string error_message = 12;      // empty when none
  string log_s3_key = 13;         // empty when none
  string operation = 14;          // run | test | build | full_refresh
  string run_results_uri = 15;    // empty when none
  string content_hash = 16;       // the content hash of the node in the release of the run; empty when the run names no release
  string failure_class = 17;      // why the latest attempt failed; empty unless it failed
  string failure_reason = 18;     // the specific failure within failure_class; empty unless it failed
  string wait_reason = 19;        // node_lease while the task waits for another run to release its node; empty otherwise
  string waiting_on_run_id = 20;  // the run whose task holds the node the task waits for; empty when it waits for nothing or no task holds the node
  string waiting_since = 21;      // RFC3339, when the task began waiting for wait_reason; empty when it has none
}

message ListNodesRequest {
  string search = 1;        // case-insensitive exact match on the table name; empty means no filter
  string service_name = 2;  // exact service filter; empty means all services
  int32 limit = 3;          // page size; 0 means 50, clamped to at most 200
  int32 offset = 4;         // page offset; default 0
  string operation = 5;     // run | test | build; empty means run
}

message ListNodesResponse {
  repeated NodeSummary nodes = 1;
  int32 total_count = 2;  // nodes matching the filter, ignoring limit and offset
}

message NodeSummary {
  string service_name = 1;
  string schema_name = 2;
  string table_name = 3;
  int32 task_count = 4;         // tasks in the stats window (at most 50)
  int32 success_rate_pct = 5;   // -1 when no terminal task in the window
  int32 avg_duration_sec = 6;   // -1 when no measurable task
  int32 p95_duration_sec = 7;   // -1 when no measurable task
  int32 flaky_rate_pct = 8;     // percent of window tasks with attempt > 0; 0 when none
  string last_status = 9;       // the latest task status: a task_status value
  string last_run_at = 10;      // RFC3339 of the most recent task created_at
  string operation = 11;        // run | test | build
  int32 timeout_seconds = 12;   // the task timeout the tasks of the node get: its declared timeout in the live release, else the install default
  bool timeout_declared = 13;   // true when the live release declares the timeout of the node; false when its tasks get the install default
}

message ListNodeNamesRequest {
  string service_name = 1;  // exact service filter; empty means all services
}

message ListNodeNamesResponse {
  repeated string table_names = 1;  // distinct, sorted ascending
}

message ListNodeServicesRequest {}

message ListNodeServicesResponse {
  repeated string service_names = 1;  // distinct, sorted ascending
}

// ============================================================================
// SCHEDULE REQUESTS/RESPONSES
// ============================================================================

message UpsertScheduleRequest {
  string schedule_name = 1;    // Required
  string cron = 2;             // Required: five fields or a descriptor such as @daily
  string timezone = 3;         // Required: the IANA zone the cron is read in, such as Europe/Paris or UTC
  string description = 4;      // what the schedule is for; may be empty
  bool paused = 5;             // nothing starts on its own while paused
  int64 expected_version = 6;  // the version read before editing; 0 saves with no check
}

message UpsertScheduleResponse {
  Schedule schedule = 1;                                   // the schedule as saved
  repeated google.protobuf.Timestamp next_fire_times = 2;  // its next three fires; none while paused
}

message DeleteScheduleRequest {
  string schedule_name = 1;  // Required
}

message DeleteScheduleResponse {}

message PreviewScheduleRequest {
  string cron = 1;      // as UpsertScheduleRequest.cron
  string timezone = 2;  // as UpsertScheduleRequest.timezone
}

message PreviewScheduleResponse {
  string cron_words = 1;                                   // the cron in English words; empty when they cannot describe it
  repeated google.protobuf.Timestamp next_fire_times = 2;  // its next three fires from now
}

message ListSchedulesRequest {}

// ScheduleSummary is one schedule name of the tenant: its cron when it has
// one, how many models of the live release have its tag, and its last run.
// With no cron, cron is empty, paused false, version 0 and next_fire_at and
// updated_at unset. last_run_status is a run_status value.
message ScheduleSummary {
  string schedule_name = 1;
  string cron = 2;             // empty when the schedule has no cron: it runs only when triggered
  string description = 3;      // empty when the schedule has none
  string timezone = 4;         // IANA timezone the cron is read in
  bool has_active_run = 5;     // a pending, running or cancelling run holds the schedule
  google.protobuf.Timestamp last_run_at = 6;  // unset if never run
  string last_run_status = 7;  // a run_status value; empty if never run
  string last_run_id = 8;      // run_id of the most recent run; empty if never run
  bool paused = 9;             // nothing starts on its own while paused
  google.protobuf.Timestamp next_fire_at = 10;  // unset while paused, with no cron, or when the cron fires no more
  int64 version = 11;          // counts the edits of the cron, from 1
  string updated_by = 12;      // who made the latest edit of the cron
  google.protobuf.Timestamp updated_at = 13;  // when the latest edit of the cron was made
  int32 model_count = 14;      // models of the live release with the schedule's tag
  string cron_words = 15;      // the cron in English words; empty with no cron or when they cannot describe it
}

message ListSchedulesResponse {
  repeated ScheduleSummary schedules = 1;
}

message GetScheduleGraphRequest {
  string schedule_name = 1;  // Required
}

// ScheduleGraphNode is a node of the live release.
message ScheduleGraphNode {
  string service_name = 1;
  string schema_name = 2;
  string table_name = 3;
  string node_type = 4;
  string schedule_name = 5;  // the schedule the node belongs to, which differs from the requested one for an upstream node
}

message ScheduleGraphEdge {
  string from_node_id = 1;  // the dependent node, "service.schema.table"
  string to_node_id = 2;    // its dependency, "service.schema.table"
}

message GetScheduleGraphResponse {
  repeated ScheduleGraphNode nodes = 1;
  repeated ScheduleGraphEdge edges = 2;
  // promotion_seq is the live promotion seq at query time. It is 0 when no
  // release is live; consumers treat 0 as unknown, not as a seq.
  int64 promotion_seq = 3;
}

message ListScheduleTopologiesRequest {}

message ScheduleTopologySummary {
  string schedule_name = 1;
  int32 node_count = 2;                       // nodes of the schedule in the live release
  google.protobuf.Timestamp last_updated_at = 3;  // when state loaded the live release
}

message ListScheduleTopologiesResponse {
  repeated ScheduleTopologySummary schedules = 1;
}
