# Retired names: the names the glossary replaced (GLOSSARY.md and each
# component's GLOSSARY.md, listed in GLOSSARY-MAP.md). A retired name may not
# appear in any tracked file: code, UI copy, contracts, generated files,
# migrations or docs. TestNoRetiredNames (pkg/deploycheck) fails CI with
# `<file>:<line>: "<old name>" is a retired name; use "<glossary word>"`.
#
# Each entry has:
#   pattern  a Go regular expression (RE2) for the old name. The guard wraps it
#            in word boundaries (\b...\b), so `foo` does not match `foobar`,
#            `foo_bar` or `fooBar`, and does match `foo-bar` and `foo.bar`.
#            List the code forms of the name in the pattern too, for example
#            `foos?|foo_\w+|[fF]oo[A-Z]\w*`. Start and end it with a letter,
#            digit or `_`: a `\b` next to any other character matches only
#            beside a word character. It is case-sensitive; start it with
#            (?i) to ignore case.
#   use      the glossary word to write instead.
#   paths    optional. The name is retired only in these paths. A path is a
#            directory or file (`agent-remediation`, `ui/src/client/App.tsx`)
#            or a glob over the path from the repository root (`*` and `?`
#            within one path segment, `**` across segments); it covers the
#            files under a directory it names. Each path must name at least
#            one tracked file. With no paths the name is retired everywhere.
#
# Exempt everywhere: the `_Avoid_:` lines of every GLOSSARY.md, the released
# sections (`## [x.y.z]`, `## x.y.z`) of deploy/continuo/CHANGELOG.md and
# docs/release-notes.md, and this file.
#
# A rename pull request adds the old names of its term group here, in the
# same pull request that removes them, so a renamed term cannot come back.
# Example entry:
#
#   - pattern: (?i)widget runs?|widget_?run\w*
#     use: gadget run
#     paths: [run-controller, "ui/src/client/**/runs*"]
names:
  # Project group: the code a team releases as one unit is a project.
  # Bare service_name and ServiceName also name continuo's own components
  # (config.ServiceName, topology-controller's SERVICE_NAME), gRPC's
  # ServiceDesc.ServiceName and a StatefulSet's serviceName, so those two
  # are retired only where they meant a project.
  - pattern: 'service_names|serviceNames|ServiceNames|SERVICE_NAMES'
    use: project names
  - pattern: 'service_name|SERVICE_NAME'
    use: project_name
    paths: ["AGENTS.md","agent-chat","agent-remediation","catalog","cli","db","dbt","deploy","docs","execution-controller","pkg/events","pkg/topologyartifact","release-controller","run-controller","tests","topology-controller/bench","topology-controller/domain","topology-controller/service","topology-controller/tests/fingerprint_fixtures.py","topology-controller/tests/fixtures","topology-controller/tests/test_candidate_artifacts.py","topology-controller/tests/test_candidate_manifest_handler.py","topology-controller/tests/test_candidate_manifest_handler_contract_bundle.py","topology-controller/tests/test_candidate_manifest_handler_external.py","topology-controller/tests/test_code_bundle.py","topology-controller/tests/test_code_bundle_contract.py","topology-controller/tests/test_contract_bundle.py","topology-controller/tests/test_external.py","topology-controller/tests/test_model.py","topology-controller/tests/test_odcs_bundle_parser.py","topology-controller/tests/test_ontology_stage.py","topology-controller/tests/test_parser.py","topology-controller/tests/test_parser_dbt_contracts.py","topology-controller/tests/test_parser_tests.py","topology-controller/tests/test_python_node_builder.py","topology-controller/tests/test_release_timings.py","topology-controller/tests/test_resolver.py","topology-controller/tests/test_rewriter.py","topology-controller/tests/test_store_with_ontology.py","topology-controller/tests/test_table_refs.py","topology-controller/tests/test_topology_artifact.py","topology-controller/tests/test_unique_id.py","ui"]
  - pattern: 'serviceName|ServiceName'
    use: projectName
    paths: [".github","agent-remediation/adapters/grpc","agent-remediation/service","catalog/adapters","catalog/api/catalog/v1/catalog.pb.go","catalog/domain","catalog/live_folder_integration_test.go","catalog/service","cli/integration_test.go","cli/internal","cli/proto/catalog/v1/catalog.pb.go","cli/proto/run/v1/run.pb.go","execution-controller/adapters","execution-controller/domain","execution-controller/serialization","execution-controller/service","execution-controller/test","pkg/domain","pkg/events","pkg/topologyartifact","release-controller/adapters","release-controller/cmd","release-controller/domain","release-controller/integration_test","release-controller/service","remediation/service","run-controller/adapters/postgres","run-controller/adapters/s3","run-controller/domain","run-controller/internal/grpc/runservice","run-controller/proto/run/v1/run.pb.go","run-controller/service","run-controller/test","tests"]
  - pattern: 'changed_services?|[cC]hangedServices?|CHANGED_SERVICES?'
    use: changed project
  - pattern: '[lL]istNodeServices\w*'
    use: ListNodeProjects
  - pattern: 'pr_services|[pP][rR]Services'
    use: pr_projects
  - pattern: 'other_service|[oO]therService'
    use: other project
  - pattern: 'declared_services?|[dD]eclaredServices?'
    use: declared project
  - pattern: '\w*[cC]ross_?[sS]ervice\w*|[cC]ross-service'
    use: cross-project
    paths: ["AGENTS.md","agent-remediation","db","dbt","deploy","docs","execution-controller","release-controller","tests","topology-controller","ui"]
  - pattern: 'service_repos?|service-repos|service_repo_paths|[sS]erviceRepo\w*|SERVICE_REPO_\w+'
    use: project repository map (project_repos, PROJECT_REPO_MAP_PATH)
  - pattern: 'IMAGE_TAG_PER_SERVICE'
    use: IMAGE_TAG_PER_PROJECT
  - pattern: 'dbt/services'
    use: dbt/projects
  - pattern: 'edits_map_to_a_service|edit_outside_services|EditsMapToAService'
    use: edits_map_to_a_project, edit_outside_projects
