# Retired names: the names the glossary replaced (GLOSSARY.md and each
# component's GLOSSARY.md, listed in GLOSSARY-MAP.md). A retired name may not
# appear in any tracked file: code, UI copy, contracts, generated files,
# migrations or docs. TestNoRetiredNames (pkg/deploycheck) fails CI with
# `<file>:<line>: "<old name>" is a retired name; use "<glossary word>"`.
#
# Each entry has:
#   pattern  a Go regular expression (RE2) for the old name. The guard wraps it
#            in word boundaries (\b...\b), so `foo` does not match `foobar`,
#            `foo_bar` or `fooBar`, and does match `foo-bar` and `foo.bar`.
#            List the code forms of the name in the pattern too, for example
#            `foos?|foo_\w+|[fF]oo[A-Z]\w*`. Start and end it with a letter,
#            digit or `_`: a `\b` next to any other character matches only
#            beside a word character. It is case-sensitive; start it with
#            (?i) to ignore case.
#   use      the glossary word to write instead.
#   paths    optional. The name is retired only in these paths. A path is a
#            directory or file (`agent-remediation`, `ui/src/client/App.tsx`)
#            or a glob over the path from the repository root (`*` and `?`
#            within one path segment, `**` across segments); it covers the
#            files under a directory it names. Each path must name at least
#            one tracked file. With no paths the name is retired everywhere.
#
# Exempt everywhere: the `_Avoid_:` lines of every GLOSSARY.md, the released
# sections (`## [x.y.z]`, `## x.y.z`) of deploy/continuo/CHANGELOG.md and
# docs/release-notes.md, and this file.
#
# A rename pull request adds the old names of its term group here, in the
# same pull request that removes them, so a renamed term cannot come back.
# Example entry:
#
#   - pattern: (?i)widget runs?|widget_?run\w*
#     use: gadget run
#     paths: [run-controller, "ui/src/client/**/runs*"]
names:
  # Component group: one of continuo's own programs is a component. Its name
  # is config.ComponentName, which a stream consumer takes through
  # SetComponent.
  - pattern: 'SetService'
    use: SetComponent
  - pattern: '\w*config\.ServiceName'
    use: config.ComponentName
  - pattern: 'ServiceName'
    use: ComponentName
    paths: ["*/config"]
  # topology-controller names itself COMPONENT_NAME (retired with service_name
  # below) and its directory COMPONENT_ROOT; the e2e suite checks every
  # component's health.
  - pattern: 'SERVICE_ROOT|_SERVICE_DIR'
    use: COMPONENT_ROOT or _COMPONENT_DIR
  - pattern: 'verifyServicesHealthy'
    use: verifyComponentsHealthy
  - pattern: 'maintenanceServices'
    use: maintenanceComponents
  - pattern: 'logServiceTails'
    use: logComponentTails
  - pattern: 'TestMetrics_ServicesServePrometheusMetrics'
    use: TestMetrics_ComponentsServePrometheusMetrics
  - pattern: 'TestVendored\w+ProtoMatchesService'
    use: TestVendored...ProtoMatchesComponent
  # The Redis sign-in mode where each component signs in as its own login is
  # perComponent (credentials.redis.mode, REDIS_ACL_MODE,
  # RedisACLModePerComponent, REDIS_ACL_MODE_PER_COMPONENT).
  - pattern: '(?i)\w*per_?service\w*'
    use: perComponent
  # The chart's list of component entries is `components:`.
  - pattern: 'Values\.services|services\[(name|%s|\]\.\w+)'
    use: .Values.components, components[name=...]
  # Every continuo metric series carries the label `component`.
  - pattern: 'Labels\{"service|service=~?"[\w-]+|by ?\(service'
    use: the metric label component
  # The streams contract names the component that owns a stream or reads
  # through a group with the `component:` key.
  - pattern: '(yaml|json):"service'
    use: yaml:"component", json:"component"
  # The guard of retired component names, the e2e start script and the
  # Makefile's component variables.
  - pattern: 'check-service-names\w*|check_service_names'
    use: check-component-names
  - pattern: 'start-services|e2e-start-services|start_go_service|GO_SERVICES|build-service|build-prod-service|\w*SERVICE=\w+'
    use: start-components, e2e-start-components, start_go_component, GO_COMPONENTS, build-component, COMPONENT=
  - pattern: '(?i)microservices?'
    use: component
  # Project group: the code a team releases as one unit is a project.
  # Bare ServiceName also names gRPC's ServiceDesc.ServiceName and a
  # StatefulSet's serviceName, so it is retired only where it meant a project.
  - pattern: 'service_names|serviceNames|ServiceNames|SERVICE_NAMES'
    use: project names
  - pattern: 'service_name|SERVICE_NAME'
    use: project_name, or COMPONENT_NAME for a component's name
  - pattern: 'serviceName|ServiceName'
    use: projectName
    paths:
      - ".dockerignore"
      - ".github"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".golangci.yml"
      - ".trivyignore.yaml"
      - "AGENTS.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "DCO"
      - "Dockerfile.base"
      - "GLOSSARY-MAP.md"
      - "GLOSSARY.md"
      - "LICENSE"
      - "Makefile"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "agent-remediation/adapters/grpc"
      - "agent-remediation/service"
      - "catalog/adapters"
      - "catalog/api/catalog/v1/catalog.pb.go"
      - "catalog/domain"
      - "catalog/live_folder_integration_test.go"
      - "catalog/service"
      - "cli/integration_test.go"
      - "cli/internal"
      - "cli/proto/catalog/v1/catalog.pb.go"
      - "cli/proto/run/v1/run.pb.go"
      - "compose"
      - "config"
      - "db"
      - "dbt"
      - "deploy/AUTH.md"
      - "deploy/CREDENTIALS.md"
      - "deploy/OBSERVABILITY.md"
      - "deploy/README.md"
      - "deploy/SECURITY.md"
      - "deploy/continuo/.kube-linter.yaml"
      - "deploy/continuo/CHANGELOG.md"
      - "deploy/continuo/Chart.yaml"
      - "deploy/continuo/README.md"
      - "deploy/continuo/files"
      - "deploy/continuo/templates/NOTES.txt"
      - "deploy/continuo/templates/_helpers.tpl"
      - "deploy/continuo/templates/agent-remediation-workflows-configmap.yaml"
      - "deploy/continuo/templates/cancel-config-configmap.yaml"
      - "deploy/continuo/templates/ci-auth-configmap.yaml"
      - "deploy/continuo/templates/configmap.yaml"
      - "deploy/continuo/templates/credentials-secret.yaml"
      - "deploy/continuo/templates/db-init-migrate-hook-secret.yaml"
      - "deploy/continuo/templates/db-init-migrate-job.yaml"
      - "deploy/continuo/templates/dbt-commands-configmap.yaml"
      - "deploy/continuo/templates/deployment.yaml"
      - "deploy/continuo/templates/dex"
      - "deploy/continuo/templates/egress-proxy"
      - "deploy/continuo/templates/ingress.yaml"
      - "deploy/continuo/templates/logins-secret.yaml"
      - "deploy/continuo/templates/networkpolicy.yaml"
      - "deploy/continuo/templates/project-repos-configmap.yaml"
      - "deploy/continuo/templates/rbac.yaml"
      - "deploy/continuo/templates/service.yaml"
      - "deploy/continuo/templates/streams-init-job.yaml"
      - "deploy/continuo/values-byo.yaml.example"
      - "deploy/continuo/values.schema.json"
      - "deploy/continuo/values.yaml"
      - "deploy/dbt-image-contract.md"
      - "deploy/python-image-contract.md"
      - "deploy/redis-acl-rules.acl"
      - "docker-compose.ci.yml"
      - "docker-compose.yml"
      - "docs"
      - "execution-controller/adapters"
      - "execution-controller/domain"
      - "execution-controller/serialization"
      - "execution-controller/service"
      - "execution-controller/test"
      - "go.work"
      - "go.work.sum"
      - "mcp-arch.yaml"
      - "pkg/codebundle"
      - "pkg/config"
      - "pkg/contractbundle"
      - "pkg/db"
      - "pkg/deploycheck"
      - "pkg/domain"
      - "pkg/events"
      - "pkg/identity"
      - "pkg/lifecycle"
      - "pkg/liveness"
      - "pkg/maintenance"
      - "pkg/messageprocessing"
      - "pkg/metrics"
      - "pkg/num"
      - "pkg/objectstore"
      - "pkg/outbox"
      - "pkg/parsecache"
      - "pkg/redis"
      - "pkg/retention"
      - "pkg/sanitize"
      - "pkg/seedreload"
      - "pkg/startupwait"
      - "pkg/testdeps"
      - "pkg/testmigrations"
      - "pkg/topologyartifact"
      - "pkg/validationresult"
      - "pkg/warehouse"
      - "release-controller/adapters"
      - "release-controller/cmd"
      - "release-controller/domain"
      - "release-controller/integration_test"
      - "release-controller/service"
      - "remediation/service"
      - "run-controller/adapters/postgres"
      - "run-controller/adapters/s3"
      - "run-controller/domain"
      - "run-controller/internal/grpc/runservice"
      - "run-controller/proto/run/v1/run.pb.go"
      - "run-controller/service"
      - "run-controller/test"
      - "s3-sidecar"
      - "scripts"
      - "tests"
      - "topology-controller"
      - "ui"
  - pattern: 'changed_services?|[cC]hangedServices?|CHANGED_SERVICES?'
    use: changed project
  - pattern: '[lL]istNodeServices\w*'
    use: ListNodeProjects
  - pattern: 'pr_services|[pP][rR]Services'
    use: pr_projects
  - pattern: 'other_service|[oO]therService'
    use: other project
  - pattern: 'declared_services?|[dD]eclaredServices?'
    use: declared project
  - pattern: '\w*[cC]ross_?[sS]ervice\w*|[cC]ross-service'
    use: cross-project
    paths:
      - "AGENTS.md"
      - "agent-remediation"
      - "db"
      - "dbt"
      - "deploy"
      - "docs"
      - "execution-controller"
      - "release-controller"
      - "tests"
      - "topology-controller"
      - "ui"
  - pattern: 'service_repos?|service-repos|service_repo_paths|[sS]erviceRepo\w*|SERVICE_REPO_\w+'
    use: project repository map (project_repos, PROJECT_REPO_MAP_PATH)
  - pattern: 'IMAGE_TAG_PER_SERVICE'
    use: IMAGE_TAG_PER_PROJECT
  - pattern: 'dbt/services'
    use: dbt/projects
  - pattern: 'edits_map_to_a_service|edit_outside_services|EditsMapToAService'
    use: edits_map_to_a_project, edit_outside_projects
  # Streams group: every stream starts again at :v1, the heal trigger is
  # heal.triggered and the parse result is release.parsed. Each pattern lists
  # the stream name, its Go and Python constants and the names of the files and
  # identifiers built from it.
  - pattern: '(?i)\w*remediation[._-]?requested\w*'
    use: heal.triggered
  - pattern: '(?i)\w*manifest[._-]?loaded[._-]?candidate\w*'
    use: release.parsed
  - pattern: '(?i)\w*task[._]?status[._]?updated[:_]?v2\w*'
    use: task.status.updated:v1
  - pattern: '(?i)\w*release[._]?promoted[:_]?v2\w*'
    use: release.promoted:v1
  # Project kind group: a Python project's release kind is python. The pattern
  # covers the kind's value and the names built from it (ManifestKindPython...,
  # PYTHON_..., test names).
  - pattern: '(?i)\w*python[-_]?odcs\w*'
    use: python (the kind of a Python project)
  # Release check group: the checks a release passes before production are
  # its release check, of a candidate release (kind candidate) or of a fix
  # (kind fix). The patterns cover the prose, the table, the stream and the
  # names built from them (VerificationRun..., release_pipeline_runs,
  # pipeline.run.finished, PipelineRunFinished..., fix-verification).
  - pattern: '(?i)\w*verification[ ._-]?runs?\w*'
    use: release check
  - pattern: '(?i)\w*pipeline[._-]runs?\w*|\w*[pP]ipelineRuns?\w*'
    use: release check (the stream is release_check.finished:v1)
  - pattern: '(?i)\w*release[ ._-]?pipelines?\w*'
    use: release check
  - pattern: '(?i)fix[ -]verifications?'
    use: a fix's release check
  - pattern: '\w*VerificationPipeline\w*|\w*(Kind|New|Receive)Verification\w*'
    use: ReleaseChecks, KindFix, NewFix, ReceiveFix
  - pattern: 'api/(verifications|pipeline)'
    use: api/release-checks, api/release-queue
  # Live release and production pointer group: the release the install runs
  # on now is its live release (table live_release, GET /api/v1/live-release,
  # live_release_id), and each project's record of the code and image
  # production runs is its production pointer (table production_pointers,
  # seed-production-pointers).
  - pattern: '\w*(current_prod|CURRENT_PROD|CurrentProd|currentProd)\w*|(?i)current[ -]prod'
    use: live release (live_release, LiveRelease, live_release_id)
  # The hyphenated form is listed only as the tool seed-service-prod: a
  # project or namespace may end in -service-prod (billing-service-prod).
  - pattern: '\w*(service_prod|SERVICE_PROD|ServiceProd|serviceProd)\w*|seed-service-prod|(?i)service prod'
    use: production pointer (production_pointers, ProductionPointer)
  - pattern: 'reannounce-current|print-current'
    use: announce-topology --reannounce-live, --print-live
  # Fix group: a change to a rejected release's code that continuo proposes,
  # checked by a release check and offered as a pull request, is a fix (the
  # fix and fix_pull_request tables, fix_id, the fix package, the gRPC
  # RemediationFixes, catalog's :Fix). The verb stays: the status proposed,
  # proposed_content and catalog's [:PROPOSED] edge.
  - pattern: '(?i)\w*proposals?\w*'
    use: fix (fix, fixes, fix_id, Fix)
  - pattern: '\w*remediation[._-](proposed|pr_opened|pr_closed)\w*|\w*[rR]emediation(Proposed|PrOpened|PrClosed)\w*|REMEDIATION_(PROPOSED|PR_OPENED|PR_CLOSED)\w*'
    use: fix.proposed:v1, fix.pr_opened:v1, fix.pr_closed:v1
  # Try group: in agent-remediation, one go at fixing every failing node of a
  # remediation is a try, named by its round and number ("round 2, try 1"),
  # and a try that did no work is a skipped try. attempt stays the word for a
  # task's attempt in a run, so the name is retired only in agent-remediation
  # and the ui's remediation and release pages. The patterns leave the verb
  # (attempted) and the outbox's next_attempt_at alone.
  - pattern: 'attempts?|Attempts?|attempt_\w+|[aA]ttempt[A-Z]\w*|\w+Attempts?'
    use: try (round and try number, skipped try)
    paths:
      - agent-remediation
      - "ui/src/client/Remediation*"
      - "ui/src/client/Release*"
      - "ui/src/client/release-helpers*"
      - ui/src/server/routes/remediation.ts
      - ui/tests/routes/remediation.test.ts
      - ui/tests/client/release-detail-page.test.tsx
  # Round and revision group: one turn of fixing a rejected release is a
  # round (the first rejection starts round 1, and every "Try again" starts
  # the next), named round in every field, column, message and copy, and the
  # event that starts the next round is round.requested:v1. The model's new
  # draft for a cluster after pre-flight refused the last one is a revision:
  # a type's drafts key counts the drafts a cluster gets in one try, each
  # cluster and journal row carries its draft number, a cluster that used
  # every draft is handed over with drafts_spent, and
  # continuo_remediation_drafts_total counts each pre-flight pass.
  # The consumer group of round.requested:v1 is remediation-round-requested
  # (RemediationRoundRequested): component remediation, purpose
  # round-requested. The patterns leave that name alone.
  - pattern: '(?i)remediation rounds?'
    use: round
  - pattern: 'remediation_rounds?|\w*[rR]emediationRounds?|MAX_REMEDIATION_ROUNDS|\w*remediation_rounds_total'
    use: round (round, Round, MAX_ROUNDS); the draft metric is continuo_remediation_drafts_total
  - pattern: '(?i)\w*retry[._-]?requested\w*'
    use: round.requested:v1 (RoundRequestedV1, remediation-round-requested)
  - pattern: '(?i)pre-?flight rounds?|\w*preflight_?rounds?_?spent\w*'
    use: draft, revision or drafts_spent
  - pattern: 'yaml:"rounds|Agent\.Rounds'
    use: yaml:"drafts", Agent.Drafts
  - pattern: 'rounds'
    use: drafts (a type's drafts key)
    paths: [agent-remediation/workflows]
  # Manual run group: a run of a whole schedule started by hand is a manual
  # run (run kind manual), a run of one node started by hand is a
  # single-node run, and every command that starts a run is Start...
  # (StartRun, StartRerun, StartRebase, StartSingleNodeRun). The command line
  # starts them with schedule run and node run.
  - pattern: '(?i)\w*trigger[_-]?(rerun|rebase|single[_-]?node[_-]?run)\w*'
    use: StartRerun, StartRebase, StartSingleNodeRun
  - pattern: '(?i)(schedule|node)[ _]trigger\w*'
    use: schedule run, node run
  - pattern: 'Trigger[ _-]?[rR]uns?|trigger[_-]runs?'
    use: manual run
  - pattern: 'KindTrigger|(?i)manual[ _-]trigger|cron\W{1,4}trigger|case .trigger|kind = .trigger|Equal\(t, .trigger'
    use: the run kind manual (KindManual)
  # Dependents check group: the check, before a seed reload drops the seed's
  # table, that lists every object reading that table is the dependents check
  # (the dispatch field dependents_check, the init container dependents-check,
  # VALIDATION_OP=dependents_check, its inputs DEPENDENTS_CHECK_*, the column
  # task_attempts.dependents_check_findings). The first pattern covers every
  # code form built from the old name (seed_preflight, SEED_PREFLIGHT_MODE,
  # SeedPreflightFindings, seedPreflightColumn). Pre-flight stays
  # agent-remediation's word for the checks a draft passes, so the bare word
  # is retired only where it can mean nothing but the dependents check. The ui
  # and cli copies of run.proto are held equal to run-controller's by
  # `make guards`.
  - pattern: '(?i)\w*seed[ _-]?pre-?flights?\w*'
    use: dependents check (dependents_check, DependentsCheck, dependents-check, DEPENDENTS_CHECK_*)
  - pattern: '(?i)\w*pre-?flights?\w*'
    use: dependents check (dependents_check, DependentsCheck)
    paths:
      - execution-controller
      - run-controller
      - release-controller
      - pkg/seedreload
      - pkg/events
      - pkg/validationresult
      - tests/e2e/seed_reload_test.go
      - ui/src/client/NodeTableBody.tsx
      - ui/src/server/routes/runs.ts
      - ui/tests/client/run-node-table.test.tsx
      - cli/internal/cmd/release
  # build_from_prod group: the release check builds a node that only feeds the
  # changed nodes as an empty table with its production table's columns (its
  # production shape); it copies no rows. The validation op is build_from_prod
  # and the reject reason upstream_build_from_prod_failed.
  - pattern: '(?i)\w*clon(e|ed|es|ing)[ _-]?(empty[ _-]?)?(from[ _-]?)?prod(uction)?\w*'
    use: build_from_prod (BuildFromProd, build_empty_from_prod)
  - pattern: '(?i)\w*upstream[ _-]?clones?\w*'
    use: upstream_build_from_prod_failed (UpstreamBuildFromProdFailed)
  - pattern: '(?i)\w*production[ _-]?cop(y|ies)\w*'
    use: production shape
  # Data contract group: the published description of a node's table is its
  # data contract (the RPCs GetNodeDataContract, ListNodeDataContractVersions
  # and GetNodeDataContractDiff, the commands node data-contract,
  # node data-contract-history and node data-contract-diff, the node page's
  # tab data-contract). Inside catalog, contract alone means a data contract.
  - pattern: '\w*([gG]et|[lL]ist)NodeContract\w*|NodeContract(Panel|Response|DiffResponse)\w*'
    use: GetNodeDataContract, ListNodeDataContractVersions, GetNodeDataContractDiff
  - pattern: 'node contract(-history|-diff)?|node", "contract(-history|-diff)?'
    use: node data-contract, node data-contract-history, node data-contract-diff
  - pattern: 'tab=contract'
    use: tab=data-contract
