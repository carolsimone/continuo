# gitleaks configuration.
#
# Extends the upstream default ruleset rather than replacing it, so rules added
# upstream apply automatically. Only repository-specific exemptions live here.

[extend]
useDefault = true

[allowlist]
description = "Paths and historical commits that contain no live credentials"

paths = [
  # Local agent worktrees hold full stale copies of every tracked file, so a
  # finding in the real tree would otherwise be reported once per worktree.
  '''^\.claude/''',
  # Local-only planning notes, never committed.
  '''^docs/superpowers/''',
  # Vendored dependency trees; upstream's problem, not ours, and enormous.
  '''(^|/)node_modules/''',
  # Recorded HTTP fixtures for the GitHub stub contain synthetic tokens that
  # exist to exercise parsing, not to authenticate anything.
  '''^tests/e2e/stub-github/.*\.json$''',
]

# Historical commit exemption, applied only to full-history scans.
#
# a22f6494 committed a throwaway 2048-bit RSA key into docker-compose.yml to
# satisfy octokit's createAppAuth constructor, which rejects a syntactically
# invalid PEM, so the local GitHub App stub path could be exercised without a
# real App. The working tree no longer contains it — compose now reads
# ${GITHUB_APP_PRIVATE_KEY} from a developer-local .env generated by
# scripts/ensure-dev-env.sh.
#
# Verified inert: the key's public fingerprint is
#   R8mDupq62LuDEGOEIibhSwVQ3oKM7MFwwN8BOkWX0iI=
# which matches no key registered on the continuo GitHub App. The surrounding
# configuration agrees — app id 1, installation id 1, and an API base URL
# pointing at the in-cluster stub rather than github.com.
#
# Scoped to this one commit: every other commit, past and future, is still
# scanned by the full default ruleset.
commits = ["a22f6494a89de87984ec0235bc4d92d481793300"]
