# Source of truth for Redis Stream names and consumer groups across continuo.
# Regenerate Go/Python bindings: `go generate ./pkg/streams/...`
#
# Naming policy:
#   - Stream name: lowercase, dot-separated, ends with `:vN`. Frozen contract.
#   - Group name: lowercase kebab-case, no underscores. Frozen per consumer.
#   - Stream const: PascalCase including version suffix (NodeUpdatedV1).
#   - Consumer const: PascalCase, service-prefixed (OrchestratorNodeUpdated).

streams:
  # ---------------- state-produced streams ----------------

  - name: scheduler.started:v1
    const: SchedulerStartedV1
    description: Scheduler boot heartbeat; orchestrator hydrates its projections on receipt.
    producers: [state]
    consumers:
      - service: orchestrator
        group: orchestrator-scheduler-started
        const: OrchestratorSchedulerStarted

  - name: schedules.loaded:v1
    const: SchedulesLoadedV1
    description: Schedules registered/refreshed by state; consumed by state for catalog projections.
    producers: [orchestrator]
    consumers:
      - service: state
        group: state-schedule-catalog
        const: StateScheduleCatalog

  - name: run.entries.dispatched:v1
    const: RunEntriesDispatchedV1
    description: Run entries that orchestrator successfully dispatched into the executor queue.
    producers: [orchestrator]
    consumers:
      - service: state
        group: state-run-entries-dispatched
        const: StateRunEntriesDispatched

  - name: run.entries.dispatch_failed:v1
    const: RunEntriesDispatchFailedV1
    description: Run entries orchestrator failed to dispatch.
    producers: [orchestrator]
    consumers:
      - service: state
        group: state-run-entries-dispatch-failed
        const: StateRunEntriesDispatchFailed

  - name: task.status.updated:v1
    const: TaskStatusUpdatedV1
    description: Per-task status transitions emitted by executor-controller.
    producers: [executor-controller]
    consumers:
      - service: state
        group: state-task-status-updated
        const: StateTaskStatusUpdated

  - name: task.execution.recorded:v1
    const: TaskExecutionRecordedV1
    description: Completed task executions emitted by k8s-controller's outbox processor.
    producers: [k8s-controller]
    consumers:
      - service: state
        group: state-task-execution-recorded
        const: StateTaskExecutionRecorded

  # ---------------- orchestrator-consumed streams ----------------

  - name: node.updated:v1
    const: NodeUpdatedV1
    description: Node state transitions; orchestrator updates its projections.
    producers: [executor-controller, k8s-controller]
    consumers:
      - service: orchestrator
        group: orchestrator-node-updated
        const: OrchestratorNodeUpdated

  - name: trigger.rerun:v1
    const: TriggerRerunV1
    description: User-initiated rerun trigger.
    producers: [state]
    consumers:
      - service: orchestrator
        group: orchestrator-rerun
        const: OrchestratorRerun

  - name: trigger.rebase:v1
    const: TriggerRebaseV1
    description: User-initiated rebase trigger.
    producers: [state]
    consumers:
      - service: orchestrator
        group: orchestrator-rebase
        const: OrchestratorRebase

  - name: trigger.single_node_run:v1
    const: TriggerSingleNodeRunV1
    description: User-initiated single-node run trigger.
    producers: [state]
    consumers:
      - service: orchestrator
        group: orchestrator-single-node-run
        const: OrchestratorSingleNodeRun

  - name: release.seeds.pending:v1
    const: ReleaseSeedsPendingV1
    description: Seeds a promoted release changed, emitted by orchestrator in the same transaction as the topology swap so the nodes exist before any run is projected onto them.
    producers: [orchestrator]
    consumers:
      - service: state
        group: state-release-seeds-pending
        const: StateReleaseSeedsPending

  - name: trigger.promoted_seeds:v1
    const: TriggerPromotedSeedsV1
    description: Run trigger for the seeds a promoted release changed; state creates the run, orchestrator projects its tasks.
    producers: [state]
    consumers:
      - service: orchestrator
        group: orchestrator-promoted-seeds
        const: OrchestratorPromotedSeeds

  - name: run.finalized:v1
    const: RunFinalizedV1
    description: Run finalization (success, failure, or cancellation) emitted by state; consumed for projections.
    producers: [state]
    consumers:
      - service: orchestrator
        group: orchestrator-run-finalized
        const: OrchestratorRunFinalized

  # ---------------- orchestrator-produced streams ----------------

  - name: query.model:v1
    const: QueryModelV1
    description: Tasks dispatched by orchestrator for the executor pool.
    producers: [orchestrator]
    consumers:
      - service: executor-controller
        group: executor-query-model
        const: ExecutorQueryModel

  # ---------------- executor-controller streams ----------------

  - name: retry.task:v1
    const: RetryTaskV1
    description: Retry trigger for tasks; produced by k8s-controller, consumed by executor.
    producers: [k8s-controller]
    consumers:
      - service: executor-controller
        group: executor-retry
        const: ExecutorRetry

  - name: node.deployed:v1
    const: NodeDeployedV1
    description: Pod-deploy intent from executor; consumed by k8s-controller.
    producers: [executor-controller]
    consumers:
      - service: k8s-controller
        group: k8s-deployed
        const: K8sDeployed

  # ---------------- k8s-controller streams ----------------

  - name: check.k8s:v1
    const: CheckK8sV1
    description: Delayed status-check tickets; a promoter moves due tickets from the delay queue into the stream.
    producers: [k8s-controller]
    consumers:
      - service: k8s-controller
        group: k8s-check-status
        const: K8sCheckStatus

  - name: task.failed:v1
    const: TaskFailedV1
    description: Terminal task failure emitted by k8s-controller.
    producers: [k8s-controller]
    consumers: []

  - name: outbox.dead_letter:v1
    const: OutboxDeadLetterV1
    description: Terminal outbox publish failures (permanent payload errors, or transient errors that exhausted their backoff budget), emitted by every service's outbox processor. Operational DLQ, not a domain event.
    producers: [state, orchestrator, executor-controller, k8s-controller, release-controller, remediation, agent-remediation]
    consumers: []

  # ---------------- cross-service fanout ----------------

  - name: schedule.cancelled:v1
    const: ScheduleCancelledV1
    description: Schedule cancellation broadcast; fanned out to orchestrator, executor, k8s.
    producers: [state]
    consumers:
      - service: orchestrator
        group: orchestrator-schedule-cancelled
        const: OrchestratorScheduleCancelled
      - service: executor-controller
        group: executor-schedule-cancelled
        const: ExecutorScheduleCancelled
      - service: k8s-controller
        group: k8s-schedule-cancelled
        const: K8sScheduleCancelled

  # ---------------- release-controller streams (dbt blue/green) ----------------

  - name: release.requested:v1
    const: ReleaseRequestedV1
    description: Candidate release accepted by release-controller; triggers manifest load for validation.
    producers: [release-controller]
    consumers:
      - service: topology-controller
        group: topology-controller-release-requested
        const: TopologyControllerReleaseRequested

  - name: manifest.loaded.candidate:v1
    const: ManifestLoadedCandidateV1
    description: Resolved candidate topology from topology-controller back to release-controller.
    producers: [topology-controller]
    consumers:
      - service: release-controller
        group: release-controller-manifest-loaded-candidate
        const: ReleaseControllerManifestLoadedCandidate

  - name: validation.requested:v1
    const: ValidationRequestedV1
    description: dbt --empty validation run requested by release-controller; executor-controller dispatches per-node jobs.
    producers: [release-controller]
    consumers:
      - service: executor-controller
        group: executor-validation-requested
        const: ExecutorValidationRequested

  - name: validation.node.completed:v1
    const: ValidationNodeCompletedV1
    description: Per-node validation Job terminal status from k8s-controller back to executor-controller; settled into the validation.result:v1 stream (per-node kind=node, plus the terminal kind=complete once all nodes settle).
    producers: [k8s-controller]
    consumers:
      - service: executor-controller
        group: executor-validation-node-completed
        const: ExecutorValidationNodeCompleted

  - name: validation.result:v1
    const: ValidationResultV1
    description: Unified validation-leg stream from executor-controller. Carries per-node results (kind=node, one per node as it settles) and the terminal decision (kind=complete, emitted last). release-controller projects nodes and decides on complete; the decision reads aggregate_status, so it does not depend on delivery order. executor-controller drops the candidate schema on complete.
    producers: [executor-controller]
    consumers:
      - service: release-controller
        group: release-controller-validation-result
        const: ReleaseControllerValidationResult
      - service: executor-controller
        group: executor-validation-result-teardown
        const: ExecutorValidationResultTeardown

  - name: seed.build.requested:v1
    const: SeedBuildRequestedV1
    description: release-controller requests candidate seed builds; executor dispatches per-seed team-image jobs.
    producers: [release-controller]
    consumers:
      - service: executor-controller
        group: executor-seed-build-requested
        const: ExecutorSeedBuildRequested

  - name: seed.build.node.completed:v1
    const: SeedBuildNodeCompletedV1
    description: per-seed build terminal status from k8s-controller back to executor-controller.
    producers: [k8s-controller]
    consumers:
      - service: executor-controller
        group: executor-seed-build-node-completed
        const: ExecutorSeedBuildNodeCompleted

  - name: seed.build.completed:v1
    const: SeedBuildCompletedV1
    description: aggregated candidate seed-build result from executor-controller back to release-controller.
    producers: [executor-controller]
    consumers:
      - service: release-controller
        group: release-controller-seed-build-completed
        const: ReleaseControllerSeedBuildCompleted

  - name: compile.requested:v1
    const: CompileRequestedV1
    description: release-controller requests the changed service's dbt compile; executor dispatches the compile Job.
    producers: [release-controller]
    consumers:
      - service: executor-controller
        group: executor-compile-requested
        const: ExecutorCompileRequested

  - name: compile.node.completed:v1
    const: CompileNodeCompletedV1
    description: compile Job terminal status from k8s-controller back to executor-controller.
    producers: [k8s-controller]
    consumers:
      - service: executor-controller
        group: executor-compile-node-completed
        const: ExecutorCompileNodeCompleted

  - name: compile.completed:v1
    const: CompileCompletedV1
    description: aggregated compile result from executor-controller back to release-controller.
    producers: [executor-controller]
    consumers:
      - service: release-controller
        group: release-controller-compile-completed
        const: ReleaseControllerCompileCompleted

  - name: release.promoted:v1
    const: ReleasePromotedV1
    description: Release promoted to production; orchestrator atomically replaces its Neo4j topology.
    producers: [release-controller]
    consumers:
      - service: orchestrator
        group: orchestrator-release-promoted
        const: OrchestratorReleasePromoted
      - service: orchestrator
        group: orchestrator-release-promoted-versions
        const: OrchestratorReleasePromotedVersions

  - name: release.rejected:v1
    const: ReleaseRejectedV1
    description: Candidate release rejected (compile, parse, seed-build, or validation failure); consumed by the remediation classifier. A verification run's failure never rides this stream.
    producers: [release-controller]
    consumers:
      - service: remediation
        group: remediation-release-rejected
        const: RemediationReleaseRejected

  - name: pipeline.run.finished:v1
    const: PipelineRunFinishedV1
    description: A pipeline run of either kind (a candidate release or a fix-verification run) reached a terminal status; carries the run's candidate schema so executor-controller can drop it whatever the outcome.
    producers: [release-controller]
    consumers:
      - service: executor-controller
        group: executor-pipeline-run-finished
        const: ExecutorPipelineRunFinished

  - name: remediation.retry_requested:v1
    const: RemediationRetryRequestedV1
    description: A human asked for another remediation round on a rejected release; release-controller replays the release's stored rejection payload plus remediation_round, and the remediation classifier re-classifies it as a fresh round.
    producers: [release-controller]
    consumers:
      - service: remediation
        group: remediation-retry-requested
        const: RemediationRetryRequested

  # ---------------- remediation-classifier streams ----------------

  - name: remediation.requested:v2
    const: RemediationRequestedV2
    description: One batched remediation trigger per rejected release carrying its whole healable node set (each node with the classifier's evidence and its changed ancestors); emitted by the remediation classifier, consumed by the heal agent and by orchestrator's case-base rejections group.
    producers: [remediation]
    consumers:
      - service: agent-remediation
        group: agent-remediation-remediation-requested
        const: AgentRemediationRemediationRequested
      - service: orchestrator
        group: orchestrator-remediation-requested-rejections
        const: OrchestratorRemediationRequestedRejections

  # ---------------- agent-remediation streams ----------------

  - name: remediation.proposed:v1
    const: RemediationProposedV1
    description: One shadow-verified fix proposal per (release, attempt), carrying every node the attempt resolves and every file it edits; emitted by the remediation agent, consumed by the PR creator and approval surfaces.
    producers: [agent-remediation]
    consumers: []

  - name: remediation.pr_opened:v1
    const: RemediationPrOpenedV1
    description: Emitted when an operator opens a GitHub PR from a fix proposal, one per (release, attempt) and carrying every node the PR resolves; consumed by orchestrator's case-base proposals group.
    producers: [agent-remediation]
    consumers:
      - service: orchestrator
        group: orchestrator-remediation-pr-opened-proposals
        const: OrchestratorRemediationPrOpenedProposals

  - name: remediation.pr_closed:v1
    const: RemediationPrClosedV1
    description: Terminal PR outcome (merged, or closed without merge), one per (release, attempt, service); merged outcomes carry per-edit amended flags and diffs, and orchestrator's provenance group draws RESOLVED_BY/EDITED case-base edges from them.
    producers: [agent-remediation]
    consumers:
      - service: orchestrator
        group: orchestrator-remediation-pr-closed-provenance
        const: OrchestratorRemediationPrClosedProvenance
