# Source of truth for Redis Stream names and consumer groups across continuo.
# Regenerate Go/Python bindings: `go generate ./pkg/streams/...`
#
# Naming policy:
#   - Stream name: lowercase, dot-separated, ends with `:vN`. Frozen contract.
#   - Group name: lowercase kebab-case, no underscores, `<consuming component>-<purpose>`
#     (TestConsumerGroupsStartWithTheirComponentName).
#   - Stream const: PascalCase including version suffix (TaskStatusUpdatedV1).
#   - Consumer const: PascalCase, component-prefixed (RunControllerTaskStatusUpdated).

# Every Redis key the system owns is named key_prefix + the contract name, so
# the stream `task.dispatch:v1` lives at `continuo:task.dispatch:v1`.
key_prefix: "continuo:"

streams:
  # ---------------- run lifecycle streams ----------------

  - name: task.dispatch:v1
    const: TaskDispatchV1
    description: One attempt of a task, from run-controller to execution-controller, written in the transaction that decides the attempt (the run's creation, the success that makes the task ready, or the failure that retries it) and again whenever run-controller asks about an attempt that has gone quiet, with run-controller's view of it as known_status. execution-controller accepts each (task, attempt) once and answers a repeated dispatch with the attempt's latest report.
    producers: [run-controller]
    consumers:
      - component: execution-controller
        group: execution-controller-task-dispatch
        const: ExecutionControllerTaskDispatch

  - name: task.status.updated:v1
    const: TaskStatusUpdatedV1
    description: What execution-controller knows of one attempt of a task — queued, running, succeeded, failed with a failure class and reason, or stopped once a cancel stopped it and no pod of it can run again — each report carrying every fact known so far. run-controller applies a report only when it ranks higher than the attempt's current status, and on a failure decides in the same transaction whether to dispatch the next attempt.
    producers: [execution-controller]
    consumers:
      - component: run-controller
        group: run-controller-task-status-updated
        const: RunControllerTaskStatusUpdated

  # ---------------- execution-controller streams ----------------

  - name: outbox.dead_letter:v1
    const: OutboxDeadLetterV1
    description: Terminal outbox publish failures (permanent payload errors, or transient errors that exhausted their backoff budget), emitted by the outbox processor of each component that keeps an outbox, with the fields the row would have published. dead-letter-controller stores them for listing and redrive.
    producers: [run-controller, execution-controller, release-controller, remediation, agent-remediation, dead-letter-controller]
    consumers:
      - component: dead-letter-controller
        group: dead-letter-controller-outbox-dead-letters
        const: DeadLetterControllerOutboxDeadLetters

  - name: consumer.dead_letter:v1
    const: ConsumerDeadLetterV1
    description: Messages a stream consumer gave up on (a permanent error, or a transient error on its fifth delivery), written before the original is acknowledged. dead-letter-controller stores them for listing and redrive.
    producers: [run-controller, catalog, execution-controller, release-controller, remediation, agent-remediation, topology-controller, dead-letter-controller]
    consumers:
      - component: dead-letter-controller
        group: dead-letter-controller-consumer-dead-letters
        const: DeadLetterControllerConsumerDeadLetters

  # ---------------- cross-component fanout ----------------

  - name: run.cancelled:v1
    const: RunCancelledV1
    description: A run's cancel, from run-controller to execution-controller, with who cancelled it, why, and the attempts to stop, each with the name of its Job. run-controller writes it with no attempt in the transaction that moves the run to cancelling, and again for each window in which attempts it asked to stop have not answered, naming those attempts. execution-controller fences the run, so no gate starts work for it, stops every attempt of the run it holds and every attempt the cancel names, and answers each with a stopped report once no pod of it can run again.
    producers: [run-controller]
    consumers:
      - component: execution-controller
        group: execution-controller-run-cancelled
        const: ExecutionControllerRunCancelled

  # ---------------- release-controller streams (dbt blue/green) ----------------

  - name: release.requested:v1
    const: ReleaseRequestedV1
    description: Candidate release accepted by release-controller; triggers manifest load for validation.
    producers: [release-controller]
    consumers:
      - component: topology-controller
        group: topology-controller-release-requested
        const: TopologyControllerReleaseRequested

  - name: release.parsed:v1
    const: ReleaseParsedV1
    description: How resolving a candidate release ended, from topology-controller back to release-controller. On success it carries the URI and SHA-256 of the release's topology artifact in S3 and the code bundle URI; on failure the parse failure kind, a detail and the failed nodes. Carries the event envelope; the topology itself is never on the stream.
    producers: [topology-controller]
    consumers:
      - component: release-controller
        group: release-controller-release-parsed
        const: ReleaseControllerReleaseParsed

  - name: validation.requested:v1
    const: ValidationRequestedV1
    description: dbt --empty validation run requested by release-controller; execution-controller dispatches per-node jobs.
    producers: [release-controller]
    consumers:
      - component: execution-controller
        group: execution-controller-validation-requested
        const: ExecutionControllerValidationRequested

  - name: validation.result:v1
    const: ValidationResultV1
    description: Unified validation-leg stream from execution-controller. Carries per-node results (kind=node, one per node as it settles) and the terminal decision (kind=complete, emitted last). release-controller projects nodes and decides on complete; the decision reads aggregate_status, so it does not depend on delivery order. execution-controller drops the candidate schema on complete.
    producers: [execution-controller]
    consumers:
      - component: release-controller
        group: release-controller-validation-result
        const: ReleaseControllerValidationResult
      - component: execution-controller
        group: execution-controller-validation-result-teardown
        const: ExecutionControllerValidationResultTeardown

  - name: seed.build.requested:v1
    const: SeedBuildRequestedV1
    description: release-controller requests candidate seed builds; execution-controller dispatches per-seed team-image jobs.
    producers: [release-controller]
    consumers:
      - component: execution-controller
        group: execution-controller-seed-build-requested
        const: ExecutionControllerSeedBuildRequested

  - name: seed.build.completed:v1
    const: SeedBuildCompletedV1
    description: aggregated candidate seed-build result from execution-controller back to release-controller.
    producers: [execution-controller]
    consumers:
      - component: release-controller
        group: release-controller-seed-build-completed
        const: ReleaseControllerSeedBuildCompleted

  - name: compile.requested:v1
    const: CompileRequestedV1
    description: release-controller requests the changed project's dbt compile; execution-controller dispatches the compile Job.
    producers: [release-controller]
    consumers:
      - component: execution-controller
        group: execution-controller-compile-requested
        const: ExecutionControllerCompileRequested

  - name: compile.completed:v1
    const: CompileCompletedV1
    description: aggregated compile result from execution-controller back to release-controller.
    producers: [execution-controller]
    consumers:
      - component: release-controller
        group: release-controller-compile-completed
        const: ReleaseControllerCompileCompleted

  - name: release.promoted:v1
    const: ReleasePromotedV1
    description: A topology becoming the live one, numbered by promotion_seq. It is either a promoted release or a topology release-controller announces without moving current_prod. Carries the URI and SHA-256 of the topology artifact in S3 and the event envelope, never the topology. catalog swaps its live topology only for a higher promotion_seq and records code versions; run-controller stores the release's topology in Postgres once and moves its live release only for a higher promotion_seq; execution-controller drops the release's candidate schema.
    producers: [release-controller]
    consumers:
      - component: catalog
        group: catalog-release-topology
        const: CatalogReleaseTopology
      - component: catalog
        group: catalog-release-versions
        const: CatalogReleaseVersions
      - component: catalog
        group: catalog-release-contracts
        const: CatalogReleaseContracts
      - component: execution-controller
        group: execution-controller-release-promoted
        const: ExecutionControllerReleasePromoted
      - component: run-controller
        group: run-controller-release-promoted
        const: RunControllerReleasePromoted

  - name: release.rejected:v1
    const: ReleaseRejectedV1
    description: Candidate release rejected (compile, parse, seed-build, or validation failure); consumed by the remediation classifier. A release check's failure never rides this stream.
    producers: [release-controller]
    consumers:
      - component: remediation
        group: remediation-release-rejected
        const: RemediationReleaseRejected
      - component: execution-controller
        group: execution-controller-release-rejected
        const: ExecutionControllerReleaseRejected

  - name: release_check.finished:v1
    const: ReleaseCheckFinishedV1
    description: A release check of either kind (a candidate release or a fix's release check) reached a terminal status; carries the run's candidate schema so execution-controller can drop it whatever the outcome.
    producers: [release-controller]
    consumers:
      - component: execution-controller
        group: execution-controller-release-check-finished
        const: ExecutionControllerReleaseCheckFinished

  - name: remediation.retry_requested:v1
    const: RemediationRetryRequestedV1
    description: An operator's "Try again" on a rejected release; release-controller sends the next remediation round, carrying the stored release.rejected payload unchanged, and the remediation classifier classifies it as a fresh round.
    producers: [release-controller]
    consumers:
      - component: remediation
        group: remediation-retry-requested
        const: RemediationRetryRequested

  # ---------------- remediation-classifier streams ----------------

  - name: heal.triggered:v1
    const: HealTriggeredV1
    description: One batched trigger per rejected release and remediation round, carrying every failing node the classifier recorded, each with its evidence and its changed ancestors; a node the classifier judged unfixable is marked with its reason, so agent-remediation hands it over without a model call and catalog keeps it out of its case base. Emitted by the remediation classifier, consumed by the heal agent and by catalog's case-base rejections group.
    producers: [remediation]
    consumers:
      - component: agent-remediation
        group: agent-remediation-heal-triggered
        const: AgentRemediationHealTriggered
      - component: catalog
        group: catalog-heal-triggered-rejections
        const: CatalogHealTriggeredRejections

  # ---------------- agent-remediation streams ----------------

  - name: remediation.proposed:v1
    const: RemediationProposedV1
    description: One verified fix proposal per (release, attempt), carrying every node the attempt resolves and every file it edits; emitted by the remediation agent, consumed by the PR creator and approval surfaces.
    producers: [agent-remediation]
    consumers: []

  - name: remediation.handed_over:v1
    const: RemediationHandedOverV1
    description: One event when a remediation ends with nodes a human must fix, each with its reason code and its owner; emitted by the remediation agent, read by people and not consumed by any component.
    producers: [agent-remediation]
    consumers: []

  - name: remediation.pr_opened:v1
    const: RemediationPrOpenedV1
    description: Emitted when an operator opens a GitHub PR from a fix proposal, one per (release, attempt) and carrying every node the PR resolves; consumed by catalog's case-base proposals group.
    producers: [agent-remediation]
    consumers:
      - component: catalog
        group: catalog-remediation-pr-opened-proposals
        const: CatalogRemediationPrOpenedProposals

  - name: remediation.pr_closed:v1
    const: RemediationPrClosedV1
    description: Terminal PR outcome (merged, or closed without merge), one per (release, attempt, project); merged outcomes carry per-edit amended flags and diffs, and catalog's provenance group draws RESOLVED_BY/EDITED case-base edges from them.
    producers: [agent-remediation]
    consumers:
      - component: catalog
        group: catalog-remediation-pr-closed-provenance
        const: CatalogRemediationPrClosedProvenance

# Redis grants a component needs beyond the streams it produces and consumes. The
# rules generator turns each entry into key patterns and commands of that
# component's login:
#   keys:        plain-key prefixes (after key_prefix), granted with `commands`
#   all_streams: every key under key_prefix, granted with `commands`
#   commands:    Redis commands, lowercase, `command|subcommand` for a subcommand
redis_access:
  - component: agent-chat
    keys: ["agent-chat:ratelimit:"]
    commands: [eval, evalsha, zremrangebyscore, zcard, zadd, pexpire]
  - component: agent-remediation
    keys: ["llmcache:"]
    commands: [get, set]
  - component: dead-letter-controller
    all_streams: true
    commands: [xrange, xtrim, xlen, del, info, xinfo|groups, xpending]
  - component: ui
    keys: ["uisession:"]
    commands: [get, set, del, expire]

# Streams removed from the contract. dead-letter-controller deletes their keys
# from Redis; nothing produces or consumes them.
retired_streams: []

# Closed value sets shared across components. Each becomes a typed string in Go
# (pkg/domain/model/vocabulary.gen.go) and a StrEnum in Python
# (topology-controller/domain/contract_vocabulary.py). They land in the domain
# layer, not alongside the stream names above, because domain code names these
# values and must not import the transport contract.
# Declaration order within a vocabulary is precedence.
vocabularies:
  - name: parse_failure_kind
    const: ParseFailureKind
    description: Why topology-controller could not resolve a candidate release. Declaration order is precedence.
    values:
      - value: invalid_sql
        const: InvalidSQL
        healable: true
        description: sqlglot cannot parse a node's compiled SQL under the configured dialect.
      - value: unqualified_reference
        const: UnqualifiedReference
        healable: true
        description: a node references a relation without a schema qualifier.
      - value: invalid_contract
        const: InvalidContract
        healable: false
        description: a dbt node's or Python node's contract breaks the contract rules or, with the ontology switch on, breaks one of the ontology's rules, or a seed's declared columns differ from its CSV header; every invalid contract of the release is named in one failure.
      - value: invalid_artifact
        const: InvalidArtifact
        healable: false
        description: the uploaded manifest or contract is unreadable, empty, of unknown kind, names another project, or declares an invalid node setting.
      - value: internal
        const: Internal
        healable: false
        description: continuo's own wiring or an S3 write failed; no change to the user's source will fix it.

  - name: reject_reason
    const: RejectReason
    description: >-
      Why release-controller ended a release check, a candidate release's or a
      fix's, short of promotion. Travels as `reason` on release.rejected:v1 and
      as the check's stored fail reason. `healable` marks the reasons the remediation
      classifier turns into a heal trigger; every other reason it drops, so a
      retry of one would spend a remediation round for nothing.
    values:
      - value: compile_failed
        const: CompileFailed
        healable: true
        description: the release's dbt compile job failed on the project's own SQL.
      - value: parse_rehearsal_failed
        const: ParseRehearsalFailed
        healable: false
        description: the compile pod's parse or parse-candidate container failed, so the project does not re-parse under run-pod conditions; not a SQL error.
      - value: artifact_upload_failed
        const: ArtifactUploadFailed
        healable: false
        description: the compile pod could not publish its artifacts; continuo's own failure, which no change to the dbt project fixes.
      - value: invalid_sql
        const: InvalidSQL
        healable: true
        description: topology-controller's parser could not read a node's compiled SQL.
      - value: unqualified_reference
        const: UnqualifiedReference
        healable: true
        description: a node references a relation without a schema qualifier.
      - value: invalid_contract
        const: InvalidContract
        healable: false
        description: a dbt node's or Python node's contract in the release breaks the contract rules or, with the ontology switch on, breaks one of the ontology's rules, or a seed's declared columns differ from its CSV header.
      - value: invalid_artifact
        const: InvalidArtifact
        healable: false
        description: a manifest or python contract in the release is unreadable, empty, of unknown kind, names another project, or declares an invalid node setting.
      - value: internal_error
        const: InternalError
        healable: false
        description: continuo's own wiring or an S3 access failed while resolving the release.
      - value: duplicate_table
        const: DuplicateTable
        healable: true
        description: two nodes in the candidate topology claim the same warehouse relation.
      - value: unbuildable_cross_project_upstream
        const: UnbuildableCrossProjectUpstream
        healable: false
        description: a changed node reads an upstream that is absent from the candidate topology, so the candidate schema cannot build it.
      - value: nothing_to_validate
        const: NothingToValidate
        healable: false
        description: the candidate of a fix's release check declares no node, so the fix it proposes is unproven.
      - value: seed_build_failed
        const: SeedBuildFailed
        healable: true
        description: building the release's candidate seeds failed.
      - value: validation_failed
        const: ValidationFailed
        healable: true
        description: at least one node failed the candidate's dbt --empty validation run.
      - value: upgrade_interrupted
        const: UpgradeInterrupted
        healable: false
        description: the release check was in `parsing` when release-controller moved to topology artifacts; its parse result was published on a stream the new version no longer reads. Submit the release again.
      - value: upstream_clone_failed
        const: UpstreamCloneFailed
        healable: false
        description: validation could not copy the production table of an unchanged upstream; a run of that node, not a code change, settles it.

  - name: validation_op
    const: ValidationOp
    description: >-
      How the validation leg prepares one node of a candidate release in the
      candidate schema. release-controller names it per node on
      validation.requested:v1 and on each per_node entry of a validation
      rejection on release.rejected:v1; execution-controller passes it to the
      validation runner as VALIDATION_OP; remediation never turns a failed
      clone_from_prod node into a failure to fix.
    values:
      - value: build_from_sql
        const: BuildFromSQL
        description: a dbt model or snapshot built from its own candidate code; the runner builds its compiled SQL, with no data, in the candidate schema.
      - value: build_from_columns
        const: BuildFromColumns
        description: a python node built from its own candidate code; the runner bind-checks its declared reads and creates its empty typed table from its validation spec.
      - value: check_binds
        const: CheckBinds
        description: a dbt test built from its own candidate code; the runner EXPLAINs its compiled SQL against the candidate schema and creates nothing.
      - value: clone_from_prod
        const: CloneFromProd
        description: an unchanged upstream of a node built from candidate code; the runner copies its production table, empty, into the candidate schema. A failure points at that production table, which a run of the node settles, not a code change.

  - name: handover_reason
    const: HandoverReason
    description: Why a failing node of a rejected release is left to a human instead of a fix proposal. Remediation records one code on each node it hands over, and the release page tells the operator what to do from it.
    values:
      - value: tries_spent
        const: TriesSpent
        description: the tries are spent and the last try failed at the release checks.
      - value: preflight_rounds_spent
        const: PreflightRoundsSpent
        description: the model's drafts for the node's cluster were refused by pre-flight in every round its type allows.
      - value: declined
        const: Declined
        description: a context or prompt step found that no fix can reach the node, so no model call was made for it.
      - value: no_type
        const: NoType
        description: no type of the flow matches the node's failure, so no model call was made for it.
      - value: classifier_infra
        const: ClassifierInfra
        description: the classifier judged the failure an infrastructure error that a new release check clears, and marked the node unfixable.
      - value: classifier_unhealable_parse
        const: ClassifierUnhealableParse
        description: the classifier judged the parse failure one no change to the release's source fixes, and marked the node unfixable.
      - value: no_repository
        const: NoRepository
        description: the trigger names no repository, so no fix pull request can be opened.
      - value: unverifiable_edits
        const: UnverifiableEdits
        description: the tries are spent and the last try's edits could not be checked by a release check, because a cross-cluster check refused them or the gate refused them before starting one.

  - name: approver_source
    const: ApproverSource
    description: Where agent-remediation read the owner of a node of a rejected release, the person or team who must approve what a remediation did with that node. It names the owner on each approver of a proposal, which the gRPC reads carry to the release page.
    values:
      - value: bundle
        const: Bundle
        description: the owner the release's code bundle records for the node (a dbt node's config meta.owner, a python node's contract team.name).
      - value: contract_file
        const: ContractFile
        description: the team.name of the node's ODCS contract file in the repository, for a node the code bundle names no owner for.
      - value: none
        const: None
        description: no owner was found for the node, so the approver's owner is empty.

  - name: contract_family
    const: ContractFamily
    description: Which producer wrote a node's ODCS contract. It travels on release.parsed:v1 (the count of contracts by family), is stored on each contract of a release's contract bundle and on each contract version in catalog, and the release page shows the count.
    values:
      - value: dbt
        const: Dbt
        description: a dbt model, seed or snapshot, whose contract topology-controller generates from its manifest entry and its tests.
      - value: python
        const: Python
        description: a Python node, whose contract its project authors in a file of its repository and packs into odcs-bundle.json.

  - name: remediation_source
    const: RemediationSource
    description: The stage of the release check that produced the failure of a node a remediation works on.
    values:
      - value: validation
        const: Validation
        description: the per-node validation of a candidate release.
      - value: compile
        const: Compile
        description: the compile leg of a candidate release.
      - value: seed_build
        const: SeedBuild
        description: the seed-build leg of a candidate release.
      - value: duplicate_table
        const: DuplicateTable
        description: release-controller's rejection of a candidate topology in which two nodes claim the same relation, before any Job runs.
      - value: parse
        const: Parse
        description: topology-controller's rejection of a node whose SQL it could not resolve, before any Job runs.

  - name: dead_letter_kind
    const: DeadLetterKind
    description: Why a stream message or an outbox row was dead-lettered. An operational vocabulary — delivery outcomes of the transport, used by pkg/redis, pkg/outbox and the dead-letter streams — that the generator emits into the shared domain packages with the other vocabularies.
    values:
      - value: permanent
        const: Permanent
        description: the handler or publisher reported an error no retry can fix.
      - value: transient_exhausted
        const: TransientExhausted
        description: a retryable error persisted through the delivery or retry limit.
      - value: trimmed
        const: Trimmed
        description: the stream's retention cap removed an entry a consumer group had not finished; dead-letter-controller stored it before the trim.

  - name: node_runtime
    const: NodeRuntime
    description: The toolchain that builds a graph node, or external when nothing in continuo builds it.
    values:
      - value: dbt
        const: Dbt
        description: built by the dbt CLI inside the team's dbt image.
      - value: python
        const: Python
        description: built by continuo-python-runtime inside the node's own image.
      - value: external
        const: External
        description: "nothing in continuo builds it: the node only marks a table another system loads."

  - name: node_type
    const: NodeType
    description: >-
      The kind of a graph node. Decides which toolchain builds it, or that
      nothing does (runtime), which contract rules and validation path apply,
      whether a single-node full refresh can rebuild it from scratch
      (full_refresh), and whether its contract may name a Secret (secret_ref).
    # full_refresh: true marks a type a single-node full refresh can rebuild;
    # a value without it does not support a full refresh.
    # secret_ref: true marks a type whose contract may name one continuo-api-*
    # Secret for the node's pod; a value without it may name none.
    values:
      - value: dbt-model
        const: DbtModel
        runtime: dbt
        full_refresh: true
        description: a dbt model; built with dbt run.
      - value: dbt-seed
        const: DbtSeed
        runtime: dbt
        full_refresh: true
        description: a dbt seed; built with dbt seed.
      - value: dbt-snapshot
        const: DbtSnapshot
        runtime: dbt
        description: a dbt snapshot; built with dbt snapshot.
      - value: python-node
        const: PythonNode
        runtime: python
        description: a python script node declared in a project's contract; its script's run(ctx) returns the table.
      - value: python-csv
        const: PythonCsv
        runtime: python
        description: a contract-only python node that loads its table from one csv uri; it has no script.
      - value: python-api
        const: PythonApi
        runtime: python
        secret_ref: true
        description: a python script node with no declared reads; its script fetches its own data and may receive one continuo-api-* Secret as env vars.
      - value: dbt-test
        const: DbtTest
        runtime: dbt
        description: a dbt data test; exists only in candidate and current_prod topologies, where validation bind-checks its compiled SQL; never promoted to catalog's graph and never scheduled.
      - value: unknown-external
        const: UnknownExternal
        runtime: external
        description: a table a node reads that no node builds, never run, built, validated or fixed.

  - name: run_status
    const: RunStatus
    list_func: RunStatusValues
    description: >-
      Where a run stands. A run is active while pending, running or
      cancelling, and holds its schedule; it is terminal once succeeded,
      failed, cancelled or skipped.
    values:
      - value: pending
        const: Pending
        description: run-controller created the run and no task of it has been dispatched yet.
      - value: running
        const: Running
        description: at least one task of the run has been dispatched and the run has not ended.
      - value: cancelling
        const: Cancelling
        description: a cancel was requested and the run's open attempts are still being stopped; the run ends cancelled once every attempt has ended.
      - value: succeeded
        const: Succeeded
        description: every task of the run succeeded.
      - value: failed
        const: Failed
        description: a task of the run failed for good, or run-controller failed the run as stalled or unplannable.
      - value: cancelled
        const: Cancelled
        description: the run was cancelled and every attempt of it has ended.
      - value: skipped
        const: Skipped
        description: the run had no work to do, such as a test run over nodes with no tests; a benign non-failure.

  - name: task_status
    const: TaskStatus
    list_func: TaskStatusValues
    description: >-
      Where one task of a run stands. A task waits pending until it is ready;
      run-controller then dispatches an attempt of it, and the task follows that attempt
      through queued and running. A failed attempt with retries left dispatches
      the next one, so a task is failed only once it will not run again.
    values:
      - value: pending
        const: Pending
        description: the task waits for its upstream tasks, or for the write lease on its node.
      - value: dispatched
        const: Dispatched
        description: run-controller dispatched an attempt of the task and has no report of it yet.
      - value: queued
        const: Queued
        description: execution-controller accepted the attempt; it waits for a slot or its Job.
      - value: running
        const: Running
        description: the main container of the attempt's pod started.
      - value: stopping
        const: Stopping
        description: the run is being cancelled while the task's attempt is still open.
      - value: succeeded
        const: Succeeded
        description: the task succeeded.
      - value: failed
        const: Failed
        description: the task failed and will not run again.
      - value: cancelled
        const: Cancelled
        description: the run was cancelled before the task ran, or its attempt was stopped.
      - value: skipped
        const: Skipped
        description: an upstream task failed, so the task will not run.

  - name: operation
    const: Operation
    description: >-
      The verb a run applies to its nodes. It is orthogonal to the node type: the
      type is what a node is, the operation is which verb runs against it. The
      default (run) is the empty string on the wire, so a message that names no
      operation reads as a plain run; run-controller stores it as run.
    # single_node_only: true marks an operation that may target only one node.
    # default: true marks the operation a message that names none stands for.
    values:
      - value: run
        const: Run
        default: true
        description: dbt run, seed or snapshot, chosen by the node's type.
      - value: test
        const: Test
        description: dbt test over the node.
      - value: build
        const: Build
        description: dbt build over the node, which materializes and tests it in one invocation.
      - value: full_refresh
        const: FullRefresh
        single_node_only: true
        description: rebuilds one model or seed from scratch; it drops and rebuilds a table, so it is never fanned out across a schedule.

  - name: attempt_status
    const: AttemptStatus
    description: >-
      Where one attempt of a task stands, on the two task streams. run-controller sends
      dispatched, queued or running as a dispatch's known_status on
      task.dispatch:v1; execution-controller reports queued, running,
      succeeded, failed or stopped as a report's status on
      task.status.updated:v1.
    values:
      - value: dispatched
        const: Dispatched
        description: run-controller dispatched the attempt and has no report of it yet.
      - value: queued
        const: Queued
        description: execution-controller accepted the attempt; it waits for a slot or its Job.
      - value: running
        const: Running
        description: the main container of the attempt's pod started.
      - value: succeeded
        const: Succeeded
        description: the attempt ended successfully and no pod of it can run again.
      - value: failed
        const: Failed
        description: the attempt ended with a failure_reason and no pod of it can run again.
      - value: stopped
        const: Stopped
        description: "the attempt was stopped on request: its run was cancelled, and no pod of it can run again."

  - name: failure_class
    const: FailureClass
    description: >-
      What kind of failure ended an attempt of a task. execution-controller
      classifies each attempt that fails and records the class with the
      attempt's facts.
    values:
      - value: task
        const: Task
        description: the task's own code failed; a container of its pod, init or main, exited non-zero.
      - value: resource
        const: Resource
        description: the pod ran out of a node resource; it was killed for memory or evicted.
      - value: infra
        const: Infra
        description: the attempt was lost to the platform; its node, its Job or its record is gone, Kubernetes refused its Job, or the seed preflight could not reach the warehouse.
      - value: start
        const: Start
        description: the pod could not start its containers (an image pull, a missing Secret or ConfigMap, a container the runtime could not create).
      - value: timeout
        const: Timeout
        description: the attempt ran out of time, before any container of its pod started or before it finished.
      - value: invalid
        const: Invalid
        description: the task as dispatched cannot produce its result; dbt found nothing to build, or the dispatch cannot run.

  - name: failure_reason
    const: FailureReason
    description: >-
      Why an attempt of a task failed. Each reason is filed under one
      failure_class (its class attribute).
    # class: the failure_class value the reason is filed under; every value
    # names one.
    values:
      - value: exit_code
        const: ExitCode
        class: task
        description: a container of the pod, init or main, exited with a non-zero code.
      - value: oom_killed
        const: OOMKilled
        class: resource
        description: the main container was killed for exceeding its memory.
      - value: evicted
        const: Evicted
        class: resource
        description: the kubelet evicted the pod under node resource pressure.
      - value: node_lost
        const: NodeLost
        class: infra
        description: the pod left the API before its main container terminated, and execution-controller did not remove it.
      - value: job_missing
        const: JobMissing
        class: infra
        description: the attempt's Job is gone from Kubernetes and nothing seen of the attempt shows how it ended.
      - value: attempt_lost
        const: AttemptLost
        class: infra
        description: run-controller asked about an attempt execution-controller acknowledged, and execution-controller holds neither its row nor its Job.
      - value: create_failed
        const: CreateFailed
        class: infra
        description: Kubernetes refused the attempt's Job on every one of execution-controller's creation tries.
      - value: image_pull
        const: ImagePull
        class: start
        description: the pod could not pull an image (ErrImagePull, ImagePullBackOff).
      - value: invalid_image
        const: InvalidImage
        class: start
        description: an image reference of the pod is malformed (InvalidImageName).
      - value: missing_config
        const: MissingConfig
        class: start
        description: a Secret or ConfigMap the pod reads is missing (CreateContainerConfigError).
      - value: create_container
        const: CreateContainer
        class: start
        description: the container runtime could not create a container (CreateContainerError).
      - value: start_timeout
        const: StartTimeout
        class: timeout
        description: no container of the pod, init or main, had started when the start timeout expired.
      - value: deadline_exceeded
        const: DeadlineExceeded
        class: timeout
        description: the Job ran past its active deadline and Kubernetes stopped it.
      - value: dbt_nothing_to_do
        const: DbtNothingToDo
        class: invalid
        description: dbt exited 0 having matched no node ("Nothing to do"), so nothing was built.
      - value: invalid_node_type
        const: InvalidNodeType
        class: invalid
        description: the dispatch names a node type the node_type vocabulary does not declare.
      - value: malformed_dispatch
        const: MalformedDispatch
        class: invalid
        description: "a field of the dispatch holds a value execution-controller cannot run: an operation it does not know, no image, a Job name that is not a Kubernetes name, a timeout below one second, or a known_status other than dispatched, queued or running; or no command builds the node."
      - value: job_name_collision
        const: JobNameCollision
        class: invalid
        description: a Job of the dispatched name already exists for another task or attempt.
      - value: image_contract_mismatch
        const: ImageContractMismatch
        class: invalid
        description: the python harness found that the contract, script, imports or assets baked into the image do not hash to the content_hash the dispatch carries, so the image is not the code the release promoted.
      - value: seed_full_refresh_disabled
        const: SeedFullRefreshDisabled
        class: invalid
        description: the seed sets +full_refresh false where only a full refresh can apply its change, so no command can rebuild it; refused before any container starts.
      - value: unowned_dependents
        const: UnownedDependents
        class: invalid
        description: the seed preflight found an object reading the seed outside the views the run rebuilds and the objects an operator named, on a warehouse where dropping the seed destroys it; nothing was dropped.
      - value: engine_mismatch
        const: EngineMismatch
        class: invalid
        description: the validation image's engine adapter declares another drop family than the install's warehouse engine, so the seed preflight cannot tell what a drop destroys; nothing was dropped.
      - value: seed_full_refresh_undefined
        const: SeedFullRefreshUndefined
        class: invalid
        description: the task is a seed full refresh and the dbt-commands block that governs its project defines no seed_full_refresh command; refused before any container starts.
      - value: full_refresh_undefined
        const: FullRefreshUndefined
        class: invalid
        description: the task is a model full refresh and the dbt-commands block that governs its project defines no full_refresh command; refused before any container starts.
      - value: warehouse_unreachable
        const: WarehouseUnreachable
        class: infra
        description: the seed preflight could not connect to the warehouse; nothing was dropped.
