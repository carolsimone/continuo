# Source of truth for Redis Stream names and consumer groups across continuo.
# Regenerate Go/Python bindings: `go generate ./pkg/streams/...`
#
# Naming policy:
#   - Stream name: lowercase, dot-separated, ends with `:vN`. Frozen contract.
#   - Group name: lowercase kebab-case, no underscores, `<consuming service>-<purpose>`
#     (TestConsumerGroupsStartWithTheirServiceName).
#   - Stream const: PascalCase including version suffix (TaskStatusUpdatedV2).
#   - Consumer const: PascalCase, service-prefixed (StateTaskStatusUpdated).

streams:
  # ---------------- run lifecycle streams ----------------

  - name: task.dispatch:v1
    const: TaskDispatchV1
    description: One attempt of a task, from state to execution-controller, written in the transaction that decides the attempt (the run's creation, the success that makes the task ready, or the failure that retries it) and again whenever state asks about an attempt that has gone quiet, with state's view of it as known_status. execution-controller accepts each (task, attempt) once and answers a repeated dispatch with the attempt's latest report.
    producers: [state]
    consumers:
      - service: execution-controller
        group: execution-controller-task-dispatch
        const: ExecutionControllerTaskDispatch

  - name: task.status.updated:v2
    const: TaskStatusUpdatedV2
    description: What execution-controller knows of one attempt of a task — queued, running, succeeded, failed with a failure class and reason, or stopped once a cancel stopped it and no pod of it can run again — each report carrying every fact known so far. state applies a report only when it ranks higher than the attempt's current status, and on a failure decides in the same transaction whether to dispatch the next attempt.
    producers: [execution-controller]
    consumers:
      - service: state
        group: state-task-status-updated
        const: StateTaskStatusUpdated

  # ---------------- execution-controller streams ----------------

  - name: outbox.dead_letter:v1
    const: OutboxDeadLetterV1
    description: Terminal outbox publish failures (permanent payload errors, or transient errors that exhausted their backoff budget), emitted by the outbox processor of each service that keeps an outbox, with the fields the row would have published. dead-letter-controller stores them for listing and redrive.
    producers: [state, execution-controller, release-controller, remediation, agent-remediation, dead-letter-controller]
    consumers:
      - service: dead-letter-controller
        group: dead-letter-controller-outbox-dead-letters
        const: DeadLetterControllerOutboxDeadLetters

  - name: consumer.dead_letter:v1
    const: ConsumerDeadLetterV1
    description: Messages a stream consumer gave up on (a permanent error, or a transient error on its fifth delivery), written before the original is acknowledged. dead-letter-controller stores them for listing and redrive.
    producers: [state, orchestrator, execution-controller, release-controller, remediation, agent-remediation, topology-controller, dead-letter-controller]
    consumers:
      - service: dead-letter-controller
        group: dead-letter-controller-consumer-dead-letters
        const: DeadLetterControllerConsumerDeadLetters

  # ---------------- cross-service fanout ----------------

  - name: run.cancelled:v1
    const: RunCancelledV1
    description: A run's cancel, from state to execution-controller, with who cancelled it, why, and the attempts to stop, each with the name of its Job. state writes it with no attempt in the transaction that moves the run to cancelling, and again for each window in which attempts it asked to stop have not answered, naming those attempts. execution-controller fences the run, so no gate starts work for it, stops every attempt of the run it holds and every attempt the cancel names, and answers each with a stopped report once no pod of it can run again.
    producers: [state]
    consumers:
      - service: execution-controller
        group: execution-controller-run-cancelled
        const: ExecutionControllerRunCancelled

  # ---------------- release-controller streams (dbt blue/green) ----------------

  - name: release.requested:v1
    const: ReleaseRequestedV1
    description: Candidate release accepted by release-controller; triggers manifest load for validation.
    producers: [release-controller]
    consumers:
      - service: topology-controller
        group: topology-controller-release-requested
        const: TopologyControllerReleaseRequested

  - name: manifest.loaded.candidate:v2
    const: ManifestLoadedCandidateV2
    description: How resolving a candidate release ended, from topology-controller back to release-controller. On success it carries the URI and SHA-256 of the release's topology artifact in S3 and the code bundle URI; on failure the parse failure kind, a detail and the failed nodes. Carries the event envelope; the topology itself is never on the stream.
    producers: [topology-controller]
    consumers:
      - service: release-controller
        group: release-controller-manifest-loaded-candidate
        const: ReleaseControllerManifestLoadedCandidate

  - name: validation.requested:v1
    const: ValidationRequestedV1
    description: dbt --empty validation run requested by release-controller; execution-controller dispatches per-node jobs.
    producers: [release-controller]
    consumers:
      - service: execution-controller
        group: execution-controller-validation-requested
        const: ExecutionControllerValidationRequested

  - name: validation.result:v1
    const: ValidationResultV1
    description: Unified validation-leg stream from execution-controller. Carries per-node results (kind=node, one per node as it settles) and the terminal decision (kind=complete, emitted last). release-controller projects nodes and decides on complete; the decision reads aggregate_status, so it does not depend on delivery order. execution-controller drops the candidate schema on complete.
    producers: [execution-controller]
    consumers:
      - service: release-controller
        group: release-controller-validation-result
        const: ReleaseControllerValidationResult
      - service: execution-controller
        group: execution-controller-validation-result-teardown
        const: ExecutionControllerValidationResultTeardown

  - name: seed.build.requested:v1
    const: SeedBuildRequestedV1
    description: release-controller requests candidate seed builds; execution-controller dispatches per-seed team-image jobs.
    producers: [release-controller]
    consumers:
      - service: execution-controller
        group: execution-controller-seed-build-requested
        const: ExecutionControllerSeedBuildRequested

  - name: seed.build.completed:v1
    const: SeedBuildCompletedV1
    description: aggregated candidate seed-build result from execution-controller back to release-controller.
    producers: [execution-controller]
    consumers:
      - service: release-controller
        group: release-controller-seed-build-completed
        const: ReleaseControllerSeedBuildCompleted

  - name: compile.requested:v1
    const: CompileRequestedV1
    description: release-controller requests the changed service's dbt compile; execution-controller dispatches the compile Job.
    producers: [release-controller]
    consumers:
      - service: execution-controller
        group: execution-controller-compile-requested
        const: ExecutionControllerCompileRequested

  - name: compile.completed:v1
    const: CompileCompletedV1
    description: aggregated compile result from execution-controller back to release-controller.
    producers: [execution-controller]
    consumers:
      - service: release-controller
        group: release-controller-compile-completed
        const: ReleaseControllerCompileCompleted

  - name: release.promoted:v2
    const: ReleasePromotedV2
    description: A topology becoming the live one, numbered by promotion_seq. It is either a promoted release or a topology release-controller announces without moving current_prod. Carries the URI and SHA-256 of the topology artifact in S3 and the event envelope, never the topology. orchestrator swaps its live topology only for a higher promotion_seq and records code versions; state stores the release's topology in Postgres once and moves its live release only for a higher promotion_seq; execution-controller drops the release's candidate schema.
    producers: [release-controller]
    consumers:
      - service: orchestrator
        group: orchestrator-release-promoted
        const: OrchestratorReleasePromoted
      - service: orchestrator
        group: orchestrator-release-promoted-versions
        const: OrchestratorReleasePromotedVersions
      - service: execution-controller
        group: execution-controller-release-promoted
        const: ExecutionControllerReleasePromoted
      - service: state
        group: state-release-promoted
        const: StateReleasePromoted

  - name: release.rejected:v1
    const: ReleaseRejectedV1
    description: Candidate release rejected (compile, parse, seed-build, or validation failure); consumed by the remediation classifier. A verification run's failure never rides this stream.
    producers: [release-controller]
    consumers:
      - service: remediation
        group: remediation-release-rejected
        const: RemediationReleaseRejected
      - service: execution-controller
        group: execution-controller-release-rejected
        const: ExecutionControllerReleaseRejected

  - name: pipeline.run.finished:v1
    const: PipelineRunFinishedV1
    description: A pipeline run of either kind (a candidate release or a fix-verification run) reached a terminal status; carries the run's candidate schema so execution-controller can drop it whatever the outcome.
    producers: [release-controller]
    consumers:
      - service: execution-controller
        group: execution-controller-pipeline-run-finished
        const: ExecutionControllerPipelineRunFinished

  - name: remediation.retry_requested:v1
    const: RemediationRetryRequestedV1
    description: A human asked for another remediation round on a rejected release; release-controller replays the release's stored rejection payload plus remediation_round, and the remediation classifier re-classifies it as a fresh round.
    producers: [release-controller]
    consumers:
      - service: remediation
        group: remediation-retry-requested
        const: RemediationRetryRequested

  # ---------------- remediation-classifier streams ----------------

  - name: remediation.requested:v2
    const: RemediationRequestedV2
    description: One batched remediation trigger per rejected release carrying its whole healable node set (each node with the classifier's evidence and its changed ancestors); emitted by the remediation classifier, consumed by the heal agent and by orchestrator's case-base rejections group.
    producers: [remediation]
    consumers:
      - service: agent-remediation
        group: agent-remediation-remediation-requested
        const: AgentRemediationRemediationRequested
      - service: orchestrator
        group: orchestrator-remediation-requested-rejections
        const: OrchestratorRemediationRequestedRejections

  # ---------------- agent-remediation streams ----------------

  - name: remediation.proposed:v1
    const: RemediationProposedV1
    description: One verified fix proposal per (release, attempt), carrying every node the attempt resolves and every file it edits; emitted by the remediation agent, consumed by the PR creator and approval surfaces.
    producers: [agent-remediation]
    consumers: []

  - name: remediation.pr_opened:v1
    const: RemediationPrOpenedV1
    description: Emitted when an operator opens a GitHub PR from a fix proposal, one per (release, attempt) and carrying every node the PR resolves; consumed by orchestrator's case-base proposals group.
    producers: [agent-remediation]
    consumers:
      - service: orchestrator
        group: orchestrator-remediation-pr-opened-proposals
        const: OrchestratorRemediationPrOpenedProposals

  - name: remediation.pr_closed:v1
    const: RemediationPrClosedV1
    description: Terminal PR outcome (merged, or closed without merge), one per (release, attempt, service); merged outcomes carry per-edit amended flags and diffs, and orchestrator's provenance group draws RESOLVED_BY/EDITED case-base edges from them.
    producers: [agent-remediation]
    consumers:
      - service: orchestrator
        group: orchestrator-remediation-pr-closed-provenance
        const: OrchestratorRemediationPrClosedProvenance

# Streams removed from the contract. dead-letter-controller deletes their keys
# from Redis; nothing produces or consumes them.
retired_streams:
  - name: check.k8s:v1
  - name: compile.node.completed:v1
  - name: initialize.run:v1
  - name: manifest.loaded.candidate:v1
  - name: manifest.loaded:v1
  - name: node.deployed:v1
  - name: node.updated:v1
  - name: query.model:v1
  - name: release.promoted:v1
  - name: release.seeds.pending:v1
  - name: remediation.requested:v1
  - name: rerun.ready:v1
  - name: retry.task:v1
  - name: run.entries.dispatch_failed:v1
  - name: run.entries.dispatched:v1
  - name: run.finalized:v1
  - name: run.initialized:v1
  - name: schedule.cancelled:v1
  - name: scheduler.started:v1
  - name: schedules.loaded:v1
  - name: seed.build.node.completed:v1
  - name: task.execution.recorded:v1
  - name: task.failed:v1
  - name: task.status.updated:v1
  - name: trigger.promoted_seeds:v1
  - name: trigger.rebase:v1
  - name: trigger.rerun:v1
  - name: trigger.single_node_run:v1
  - name: update.graph:v1
  - name: validation.completed:v1
  - name: validation.node.completed:v1

# Closed value sets shared across services. Each becomes a typed string in Go
# (pkg/domain/model/vocabulary.gen.go) and a StrEnum in Python
# (topology-controller/domain/contract_vocabulary.py). They land in the domain
# layer, not alongside the stream names above, because domain code names these
# values and must not import the transport contract.
# Declaration order within a vocabulary is precedence.
vocabularies:
  - name: parse_failure_kind
    const: ParseFailureKind
    description: Why topology-controller could not resolve a candidate release. Declaration order is precedence.
    values:
      - value: invalid_sql
        const: InvalidSQL
        healable: true
        description: sqlglot cannot parse a node's compiled SQL under the configured dialect.
      - value: unqualified_reference
        const: UnqualifiedReference
        healable: true
        description: a node references a relation without a schema qualifier.
      - value: invalid_artifact
        const: InvalidArtifact
        healable: false
        description: the uploaded manifest or contract is unreadable, empty, of unknown kind, names another service, or declares an invalid node setting.
      - value: internal
        const: Internal
        healable: false
        description: continuo's own wiring or an S3 write failed; no change to the user's source will fix it.

  - name: reject_reason
    const: RejectReason
    description: >-
      Why release-controller ended a candidate or fix-verification run short of
      promotion. Travels as `reason` on release.rejected:v1 and as the run's
      stored fail reason. `healable` marks the reasons the remediation
      classifier turns into a heal trigger; every other reason it drops, so a
      retry of one would spend a remediation round for nothing.
    values:
      - value: compile_failed
        const: CompileFailed
        healable: true
        description: the release's dbt compile job failed on the project's own SQL.
      - value: parse_rehearsal_failed
        const: ParseRehearsalFailed
        healable: false
        description: the compile pod's parse or parse-candidate container failed, so the project does not re-parse under run-pod conditions; not a SQL error.
      - value: artifact_upload_failed
        const: ArtifactUploadFailed
        healable: false
        description: the compile pod could not publish its artifacts; continuo's own failure, which no change to the dbt project fixes.
      - value: invalid_sql
        const: InvalidSQL
        healable: true
        description: topology-controller's parser could not read a node's compiled SQL.
      - value: unqualified_reference
        const: UnqualifiedReference
        healable: true
        description: a node references a relation without a schema qualifier.
      - value: invalid_artifact
        const: InvalidArtifact
        healable: false
        description: a manifest or python contract in the release is unreadable, empty, of unknown kind, names another service, or declares an invalid node setting.
      - value: internal_error
        const: InternalError
        healable: false
        description: continuo's own wiring or an S3 access failed while resolving the release.
      - value: duplicate_table
        const: DuplicateTable
        healable: true
        description: two nodes in the candidate topology claim the same warehouse relation.
      - value: unbuildable_cross_service_upstream
        const: UnbuildableCrossServiceUpstream
        healable: false
        description: a changed node reads an upstream that is absent from the candidate topology, so the candidate schema cannot build it.
      - value: nothing_to_validate
        const: NothingToValidate
        healable: false
        description: a fix-verification run's candidate declares no node, so the fix it proposes is unproven.
      - value: seed_build_failed
        const: SeedBuildFailed
        healable: true
        description: building the release's candidate seeds failed.
      - value: validation_failed
        const: ValidationFailed
        healable: true
        description: at least one node failed the candidate's dbt --empty validation run.
      - value: upgrade_interrupted
        const: UpgradeInterrupted
        healable: false
        description: the run was in `parsing` when release-controller moved to topology artifacts; its parse result was published on a stream the new version no longer reads. Submit the release again.

  - name: dead_letter_kind
    const: DeadLetterKind
    description: Why a stream message or an outbox row was dead-lettered. An operational vocabulary — delivery outcomes of the transport, used by pkg/redis, pkg/outbox and the dead-letter streams — that the generator emits into the shared domain packages with the other vocabularies.
    values:
      - value: permanent
        const: Permanent
        description: the handler or publisher reported an error no retry can fix.
      - value: transient_exhausted
        const: TransientExhausted
        description: a retryable error persisted through the delivery or retry limit.
      - value: trimmed
        const: Trimmed
        description: the stream's retention cap removed an entry a consumer group had not finished; dead-letter-controller stored it before the trim.

  - name: node_runtime
    const: NodeRuntime
    description: The toolchain that builds a graph node.
    values:
      - value: dbt
        const: Dbt
        description: built by the dbt CLI inside the team's dbt image.
      - value: python
        const: Python
        description: built by continuo-python-runtime inside the node's own image.

  - name: node_type
    const: NodeType
    description: >-
      The kind of a graph node. Decides which toolchain builds it (runtime),
      which contract rules and validation path apply, whether a
      single-node full refresh can rebuild it from scratch (full_refresh), and
      whether its contract may name a Secret (secret_ref).
    # full_refresh: true marks a type a single-node full refresh can rebuild;
    # a value without it does not support a full refresh.
    # secret_ref: true marks a type whose contract may name one continuo-api-*
    # Secret for the node's pod; a value without it may name none.
    values:
      - value: dbt-model
        const: DbtModel
        runtime: dbt
        full_refresh: true
        description: a dbt model; built with dbt run.
      - value: dbt-seed
        const: DbtSeed
        runtime: dbt
        full_refresh: true
        description: a dbt seed; built with dbt seed.
      - value: dbt-snapshot
        const: DbtSnapshot
        runtime: dbt
        description: a dbt snapshot; built with dbt snapshot.
      - value: python-node
        const: PythonNode
        runtime: python
        description: a python script node declared in a service contract; its script's run(ctx) returns the table.
      - value: python-csv
        const: PythonCsv
        runtime: python
        description: a contract-only python node that loads its table from one csv uri; it has no script.
      - value: python-api
        const: PythonApi
        runtime: python
        secret_ref: true
        description: a python script node with no declared reads; its script fetches its own data and may receive one continuo-api-* Secret as env vars.
      - value: dbt-test
        const: DbtTest
        runtime: dbt
        description: a dbt data test; exists only in candidate and current_prod topologies, where validation bind-checks its compiled SQL; never promoted to the orchestrator's graph and never scheduled.

  - name: run_status
    const: RunStatus
    list_func: RunStatusValues
    description: >-
      Where a run stands. A run is active while pending, running or
      cancelling, and holds its schedule; it is terminal once succeeded,
      failed, cancelled or skipped.
    values:
      - value: pending
        const: Pending
        description: state created the run and no task of it has been dispatched yet.
      - value: running
        const: Running
        description: at least one task of the run has been dispatched and the run has not ended.
      - value: cancelling
        const: Cancelling
        description: a cancel was requested and the run's open attempts are still being stopped; the run ends cancelled once every attempt has ended.
      - value: succeeded
        const: Succeeded
        description: every task of the run succeeded.
      - value: failed
        const: Failed
        description: a task of the run failed for good, or state failed the run as stalled or unplannable.
      - value: cancelled
        const: Cancelled
        description: the run was cancelled and every attempt of it has ended.
      - value: skipped
        const: Skipped
        description: the run had no work to do, such as a test run over nodes with no tests; a benign non-failure.

  - name: task_status
    const: TaskStatus
    list_func: TaskStatusValues
    description: >-
      Where one task of a run stands. A task waits pending until it is ready;
      state then dispatches an attempt of it, and the task follows that attempt
      through queued and running. A failed attempt with retries left dispatches
      the next one, so a task is failed only once it will not run again.
    values:
      - value: pending
        const: Pending
        description: the task waits for its upstream tasks, or for the write lease on its node.
      - value: dispatched
        const: Dispatched
        description: state dispatched an attempt of the task and has no report of it yet.
      - value: queued
        const: Queued
        description: execution-controller accepted the attempt; it waits for a slot or its Job.
      - value: running
        const: Running
        description: the main container of the attempt's pod started.
      - value: stopping
        const: Stopping
        description: the run is being cancelled while the task's attempt is still open.
      - value: succeeded
        const: Succeeded
        description: the task succeeded.
      - value: failed
        const: Failed
        description: the task failed and will not run again.
      - value: cancelled
        const: Cancelled
        description: the run was cancelled before the task ran, or its attempt was stopped.
      - value: skipped
        const: Skipped
        description: an upstream task failed, so the task will not run.

  - name: operation
    const: Operation
    description: >-
      The verb a run applies to its nodes. It is orthogonal to the node type: the
      type is what a node is, the operation is which verb runs against it. The
      default (run) is the empty string on the wire, so a message that names no
      operation reads as a plain run; state stores it as run.
    # single_node_only: true marks an operation that may target only one node.
    # default: true marks the operation a message that names none stands for.
    values:
      - value: run
        const: Run
        default: true
        description: dbt run, seed or snapshot, chosen by the node's type.
      - value: test
        const: Test
        description: dbt test over the node.
      - value: build
        const: Build
        description: dbt build over the node, which materializes and tests it in one invocation.
      - value: full_refresh
        const: FullRefresh
        single_node_only: true
        description: rebuilds one model or seed from scratch; it drops and rebuilds a table, so it is never fanned out across a schedule.

  - name: attempt_status
    const: AttemptStatus
    description: >-
      Where one attempt of a task stands, on the two task streams. state sends
      dispatched, queued or running as a dispatch's known_status on
      task.dispatch:v1; execution-controller reports queued, running,
      succeeded, failed or stopped as a report's status on
      task.status.updated:v2.
    values:
      - value: dispatched
        const: Dispatched
        description: state dispatched the attempt and has no report of it yet.
      - value: queued
        const: Queued
        description: execution-controller accepted the attempt; it waits for a slot or its Job.
      - value: running
        const: Running
        description: the main container of the attempt's pod started.
      - value: succeeded
        const: Succeeded
        description: the attempt ended successfully and no pod of it can run again.
      - value: failed
        const: Failed
        description: the attempt ended with a failure_reason and no pod of it can run again.
      - value: stopped
        const: Stopped
        description: "the attempt was stopped on request: its run was cancelled, and no pod of it can run again."

  - name: failure_class
    const: FailureClass
    description: >-
      What kind of failure ended an attempt of a task. execution-controller
      classifies each attempt that fails and records the class with the
      attempt's facts.
    values:
      - value: task
        const: Task
        description: the task's own code failed; a container of its pod, init or main, exited non-zero.
      - value: resource
        const: Resource
        description: the pod ran out of a node resource; it was killed for memory or evicted.
      - value: infra
        const: Infra
        description: the attempt was lost to the platform; its node, its Job or its record is gone, or Kubernetes refused its Job.
      - value: start
        const: Start
        description: the pod could not start its containers (an image pull, a missing Secret or ConfigMap, a container the runtime could not create).
      - value: timeout
        const: Timeout
        description: the attempt ran out of time, before any container of its pod started or before it finished.
      - value: invalid
        const: Invalid
        description: the task as dispatched cannot produce its result; dbt found nothing to build, or the dispatch cannot run.

  - name: failure_reason
    const: FailureReason
    description: >-
      Why an attempt of a task failed. Each reason is filed under one
      failure_class (its class attribute).
    # class: the failure_class value the reason is filed under; every value
    # names one.
    values:
      - value: exit_code
        const: ExitCode
        class: task
        description: a container of the pod, init or main, exited with a non-zero code.
      - value: oom_killed
        const: OOMKilled
        class: resource
        description: the main container was killed for exceeding its memory.
      - value: evicted
        const: Evicted
        class: resource
        description: the kubelet evicted the pod under node resource pressure.
      - value: node_lost
        const: NodeLost
        class: infra
        description: the pod left the API before its main container terminated, and execution-controller did not remove it.
      - value: job_missing
        const: JobMissing
        class: infra
        description: the attempt's Job is gone from Kubernetes and nothing seen of the attempt shows how it ended.
      - value: attempt_lost
        const: AttemptLost
        class: infra
        description: state asked about an attempt execution-controller acknowledged, and execution-controller holds neither its row nor its Job.
      - value: create_failed
        const: CreateFailed
        class: infra
        description: Kubernetes refused the attempt's Job on every one of execution-controller's creation tries.
      - value: image_pull
        const: ImagePull
        class: start
        description: the pod could not pull an image (ErrImagePull, ImagePullBackOff).
      - value: invalid_image
        const: InvalidImage
        class: start
        description: an image reference of the pod is malformed (InvalidImageName).
      - value: missing_config
        const: MissingConfig
        class: start
        description: a Secret or ConfigMap the pod reads is missing (CreateContainerConfigError).
      - value: create_container
        const: CreateContainer
        class: start
        description: the container runtime could not create a container (CreateContainerError).
      - value: start_timeout
        const: StartTimeout
        class: timeout
        description: no container of the pod, init or main, had started when the start timeout expired.
      - value: deadline_exceeded
        const: DeadlineExceeded
        class: timeout
        description: the Job ran past its active deadline and Kubernetes stopped it.
      - value: dbt_nothing_to_do
        const: DbtNothingToDo
        class: invalid
        description: dbt exited 0 having matched no node ("Nothing to do"), so nothing was built.
      - value: invalid_node_type
        const: InvalidNodeType
        class: invalid
        description: the dispatch names a node type the node_type vocabulary does not declare.
      - value: malformed_dispatch
        const: MalformedDispatch
        class: invalid
        description: "a field of the dispatch holds a value execution-controller cannot run: an operation it does not know, no image, a Job name that is not a Kubernetes name, a timeout below one second, or a known_status other than dispatched, queued or running; or no command builds the node."
      - value: job_name_collision
        const: JobNameCollision
        class: invalid
        description: a Job of the dispatched name already exists for another task or attempt.
