# Scoped Trivy misconfiguration exclusions.
#
# Every entry below is pinned to a rule ID AND an exact file path — never a
# bare rule ID, which would silence it repo-wide. Nothing here touches a
# Dockerfile that ships to production; every *.prod Dockerfile already sets a
# non-root USER and stays fully scanned.
#
# The paths ignored here are dev/base/CI-only images that run as root by
# necessity, not oversight:
#   - docker-compose mounts host source directories into them
#     (`./<service>:/app/<service>`), and a non-root container UID cannot
#     write into a directory owned by the host user without extra UID
#     mapping the local dev flow does not do.
#   - Several of them bind-mount /var/run/docker.sock (testcontainers) or a
#     kubeconfig file, both of which typically require root inside the
#     container to use without additional group/ACL setup.
#   - Their Go/uv build caches (`--mount=type=cache`) are written as whatever
#     user runs the RUN step; switching that user mid-chain would need a
#     matching chown of every cache and bind-mounted directory across every
#     service that extends continuo-base, which is out of scope here and
#     risks breaking local dev and the e2e suite that currently passes as
#     root.
#
# scripts/check-dev-dockerfile-nonroot.sh (run by `make guards`) fails the
# build if any `Dockerfile.base` or `*/Dockerfile.dev` runs as root without
# appearing below, or if a path below no longer exists — so a new or renamed
# dev image cannot silently reintroduce the DS002 advisory this list silences.
misconfigurations:
  - id: AVD-DS-0002 # DS002: image USER should not be 'root'
    paths:
      # Builder base every Go service's Dockerfile.dev extends via
      # `FROM continuo-base:latest`. It is never run directly — only used as
      # a layer cache for `apt-get`/`go install` steps that need root, and a
      # final USER here would flow into every downstream dev image's
      # COPY/RUN steps (see the file header), not just set the base's own user.
      - "Dockerfile.base"
      # Go-service dev images: each is `FROM continuo-base:latest`,
      # docker-compose bind-mounts its working tree into /app and reuses the
      # root-owned Go module/build cache; several of them additionally mount a
      # kubeconfig and /var/run/docker.sock for the testcontainers-backed
      # in-container tests. See the file header for why a non-root USER cannot
      # be set without breaking the local dev flow and the e2e suite.
      - "agent-chat/Dockerfile.dev"
      - "agent-remediation/Dockerfile.dev"
      - "execution-controller/Dockerfile.dev"
      - "orchestrator/Dockerfile.dev"
      - "release-controller/Dockerfile.dev"
      - "remediation/Dockerfile.dev"
      - "state/Dockerfile.dev"
      # Python service (topology-controller) dev image: docker-compose
      # bind-mounts the working tree and the uv-managed virtualenv/cache into
      # /app; runs as root for the same host-ownership reason.
      - "topology-controller/Dockerfile.dev"
