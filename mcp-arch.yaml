repo: "."
ignore:
  - "vendor/**"
  - "node_modules/**"
  - ".git/**"
  - ".archmcp/**"
  - "**/*_test.go"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*_spec.rb"
  - "**/*_test.rb"
  - ".next/**"
  - "out/**"
  - ".vercel/**"
  - ".turbo/**"
  - "**/*.md"
  - "**/*.mdx"
  - "**/*.json"
  - "Jenkinsfile"
  - "**/Jenkinsfile"
  - "**/Jenkinsfile*"
  - "Dockerfile"
  - "**/Dockerfile*"
  - "**/.env*"
  - "build/**"
  - "**/build/**"
  - ".gradle/**"
  - "**/.gradle/**"
  - "**/generated/**"
  - "**/*Test.kt"
  - "**/androidTest/**"
  - "DerivedData/**"
  - "**/DerivedData/**"
  - "*.xcodeproj/**"
  - "*.xcworkspace/**"
  - "Pods/**"
  - "**/Pods/**"
  - ".build/**"
  - "**/.build/**"
  - "**/*Tests.swift"
  - "**/*Test.swift"
  - "tmp/**"
  - "log/**"
  - "public/assets/**"
  - "public/packs/**"
extractors:
  - go
  - openapi
  - python
  - typescript
explainers:
  - cycles
  - layers
renderers:
  - llm_context
output:
  dir: ".archmcp"
  max_context_tokens: 16000
