[project]
name = "dbt-compile-and-load"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # base.warehouse composes identifiers with psycopg2.sql and catches psycopg2.errors;
    # its unit tests import these (using a mock cursor, so no database connection is opened).
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "s3-sidecar"]
markers = [
    "integration: requires localstack and compiled dbt services (skipped by default)",
]

[tool.hatch.build.targets.wheel]
only-include = ["dbt_upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
