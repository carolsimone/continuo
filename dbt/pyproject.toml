[project]
name = "dbt-compile-and-load"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
only-include = ["dbt_upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
