name: service_2
version: '1.0.0'
config-version: 2
profile: default

model-paths: ["models"]

models:
  service_2:
    +materialized: table
    +meta:
      owner: "test"
      criticality: "CORE"
    table_g:
      +tags: ["e2e-schedule"]
    table_h:
      +tags: ["e2e-schedule"]
    ftable_d:
      +tags: ["e2e-schedule-failure"]
    ftable_e:
      +tags: ["e2e-schedule-failure"]
    ftable_h:
      +tags: ["e2e-schedule-failure"]
    xprobe_down:
      +tags: ["xprobe"]
    # xbreak_down is the downstream half of a DELIBERATELY-BROKEN cross-service
    # pair: it reads the amount_eur column of service-3's xbreak_up by raw
    # schema-qualified name, but the current xbreak_up no longer produces that
    # column. Valid SQL that compiles; the break surfaces only at validation, as
    # `column "amount_eur" does not exist`. Its own tag keeps it off every shared
    # schedule so only the column-break e2e test builds it.
    xbreak_down:
      +tags: ["xbreak"]
    # The batched-remediation fixtures. A model with no tags is dropped by
    # topology-controller (an untagged model has no schedule, and only seeds
    # have a default one), so it never reaches a candidate topology and no
    # release can compile, validate or fail on it. These four therefore need a
    # tag purely to exist. They get their own rather than joining
    # e2e-schedule-failure, whose node set the e2e suite pins model by model and
    # whose schedule other tests trigger — ftable_k fails by construction, so
    # putting it there would break runs that have nothing to do with it.
    ftable_k:
      +tags: ["e2e-remediation-batch"]
    ftable_u:
      +tags: ["e2e-remediation-batch"]
    ftable_v:
      +tags: ["e2e-remediation-batch"]
    ftable_w:
      +tags: ["e2e-remediation-batch"]
