name: service_1
version: '1.0.0'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]

seeds:
  service_1:
    +full_refresh: false
    +meta:
      owner: "test"
      criticality: "CORE"

models:
  service_1:
    +materialized: table
    +meta:
      owner: "test"
      criticality: "CORE"
    table_a:
      +tags: ["e2e-schedule"]
    table_b:
      +tags: ["e2e-schedule"]
    table_c:
      +tags: ["e2e-schedule"]
    ftable_a:
      +tags: ["e2e-schedule-failure"]
    ftable_b:
      +tags: ["e2e-schedule-failure"]
    rel_probe:
      +tags: ["rel-probe"]
    rel_probe_up:
      +tags: ["rel-probe"]
    rel_probe_down:
      +tags: ["rel-probe"]
    worker_incremental:
      +tags: ["worker-runtime"]
    worker_view:
      +tags: ["worker-runtime"]

# worker_incremental and worker_view are the release-routed worker-runtime
# fixtures: an incremental model and a view built on it, covering materializations
# a reusable worker reproduces from a hydrated manifest. A node's first tag names
# the schedule it belongs to, so the dedicated worker-runtime tag keeps them off
# every other schedule. worker_snapshot (snapshots/worker_snapshot.sql) exercises
# snapshot materialization in the in-process worker qualification only and is
# selected there by name; it is deliberately given no owner or tags so the
# manifest parser drops it and it is never routed into a release.
