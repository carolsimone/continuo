name: service_1
version: '1.0.0'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]

seeds:
  service_1:
    +meta:
      owner: "test"
      criticality: "CORE"

models:
  service_1:
    +materialized: table
    +meta:
      owner: "test"
      criticality: "CORE"
    table_a:
      +tags: ["e2e-schedule"]
    table_b:
      +tags: ["e2e-schedule"]
    table_c:
      +tags: ["e2e-schedule"]
    ftable_a:
      +tags: ["e2e-schedule-failure"]
    ftable_b:
      +tags: ["e2e-schedule-failure"]
    rel_probe:
      +tags: ["rel-probe"]
    rel_probe_up:
      +tags: ["rel-probe"]
    rel_probe_down:
      +tags: ["rel-probe"]
    # The execution-protocol fixtures. A model with no tag is dropped by
    # topology-controller, so each needs one to exist in the topology; each
    # scenario gets a schedule of its own, so no run of a shared schedule
    # builds them. ftable_retry fails its first attempt (TASK_ATTEMPT 0) and
    # succeeds on its second.
    ftable_retry:
      +tags: ["e2e-retry"]
    # ftable_deadline declares a one-minute task timeout and sleeps for ten, so
    # its Job runs past its deadline; ftable_deadline_down reads it and is
    # skipped when it fails.
    ftable_deadline:
      +tags: ["e2e-deadline"]
    ftable_deadline_down:
      +tags: ["e2e-deadline"]
