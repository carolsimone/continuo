name: service_1
version: '1.0.0'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]

seeds:
  service_1:
    +meta:
      owner: "test"
      criticality: "CORE"

models:
  service_1:
    +materialized: table
    +meta:
      owner: "test"
      criticality: "CORE"
    table_a:
      +tags: ["e2e-schedule"]
    table_b:
      +tags: ["e2e-schedule"]
    table_c:
      +tags: ["e2e-schedule"]
    ftable_a:
      +tags: ["e2e-schedule-failure"]
    ftable_b:
      +tags: ["e2e-schedule-failure"]
    rel_probe:
      +tags: ["rel-probe"]
    rel_probe_up:
      +tags: ["rel-probe"]
    rel_probe_down:
      +tags: ["rel-probe"]
    # ingest_probe_reader reads e2e_raw.ingest_probe, a table no model builds
    # (scripts/setup.sh creates it), so the release's topology holds an
    # unknown-external node upstream of it. Its own schedule keeps every other
    # run from building it. The unknown-external-node e2e test is the only one
    # whose run of that schedule builds it: the dormant-node e2e test starts a
    # run of it while no pod can be created and cancels it at once, so that
    # run builds nothing.
    ingest_probe_reader:
      +tags: ["ingest-probe"]
    # The execution-protocol fixtures. Each scenario gets a schedule of its
    # own, so a run of that schedule builds it and no run of a shared schedule
    # does; with no tag it would be a dormant node, which only a run started by
    # hand builds. ftable_retry fails its first attempt (TASK_ATTEMPT 0) and
    # succeeds on its second.
    ftable_retry:
      +tags: ["e2e-retry"]
    # ftable_deadline declares a one-minute task timeout and sleeps for ten, so
    # its Job runs past its deadline; ftable_deadline_down reads it and is
    # skipped when it fails.
    ftable_deadline:
      +tags: ["e2e-deadline"]
    ftable_deadline_down:
      +tags: ["e2e-deadline"]
    # dormant_probe has no entry here: it carries the project's owner and no
    # tag, so topology-controller keeps it as a dormant node, with no schedule.
    # No cron and no schedule's run builds it; the dormant-node e2e test runs
    # it by hand.
