name: service_1
version: '1.0.0'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]

seeds:
  service_1:
    +full_refresh: false
    +meta:
      owner: "test"
      criticality: "CORE"

models:
  service_1:
    +materialized: table
    +meta:
      owner: "test"
      criticality: "CORE"
    table_a:
      +tags: ["e2e-schedule"]
    table_b:
      +tags: ["e2e-schedule"]
    table_c:
      +tags: ["e2e-schedule"]
    ftable_a:
      +tags: ["e2e-schedule-failure"]
    ftable_b:
      +tags: ["e2e-schedule-failure"]
    rel_probe:
      +tags: ["rel-probe"]
    rel_probe_up:
      +tags: ["rel-probe"]
    rel_probe_down:
      +tags: ["rel-probe"]
    worker_incremental:
      +tags: ["worker-runtime"]
    worker_view:
      +tags: ["worker-runtime"]

# The worker-runtime fixtures cover the materializations a reusable worker must
# reproduce from a hydrated manifest: an incremental model, a view built on it,
# and a snapshot of it. A node's first tag names the schedule it belongs to, so
# the dedicated worker-runtime tag keeps them off every other schedule.
snapshots:
  service_1:
    +tags: ["worker-runtime"]
    +meta:
      owner: "test"
      criticality: "CORE"
