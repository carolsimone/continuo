default:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_POSTGRES_DB', 'continuo_dbt') }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'runner') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'runner') }}"
      schema: e2e_schema
      threads: 4

