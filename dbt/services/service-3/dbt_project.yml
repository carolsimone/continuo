name: service_3
version: '1.0.0'
config-version: 2
profile: default

model-paths: ["models"]

models:
  service_3:
    +materialized: table
    +meta:
      owner: "test"
      criticality: "CORE"
    table_d:
      +tags: ["e2e-schedule"]
    table_e:
      +tags: ["e2e-schedule"]
    table_f:
      +tags: ["e2e-schedule"]
    table_i:
      +tags: ["e2e-schedule"]
    table_j:
      +tags: ["e2e-schedule"]
    ftable_c:
      +tags: ["e2e-schedule-failure"]
    ftable_f:
      +tags: ["e2e-schedule-failure"]
    ftable_g:
      +tags: ["e2e-schedule-failure"]
    xprobe_up:
      +tags: ["xprobe"]
    # xbreak_up is the upstream half of a DELIBERATELY-BROKEN cross-service pair
    # (see xbreak_down in service-2). It produces only `id`: the amount_eur column
    # a downstream service still reads has been dropped upstream. Its own tag keeps
    # it off every shared schedule so only the column-break e2e test builds it.
    xbreak_up:
      +tags: ["xbreak"]
