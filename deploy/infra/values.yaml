global:
  security:
    allowInsecureImages: true

postgresql:
  image:
    registry: docker.io
    repository: carolsimone/postgresql
    tag: "18.3.0"
  auth:
    username: continuo_svc
    password: changeme
    postgresPassword: changeme
  primary:
    initdb:
      user: postgres
      scripts:
        init-databases.sh: |
          #!/bin/bash
          set -e
          export PGPASSWORD="$POSTGRESQL_INITSCRIPTS_PASSWORD"

          DATABASES="continuo_state continuo_executor continuo_orchestrator continuo_k8s continuo_dbt continuo_release continuo_agent continuo_remediation continuo_remediation_agent"

          psql -v ON_ERROR_STOP=1 --username "$POSTGRESQL_INITSCRIPTS_USERNAME" --dbname postgres <<-EOSQL
              $(for db in $DATABASES; do echo "CREATE DATABASE ${db};"; done)
              $(for db in $DATABASES; do echo "GRANT ALL PRIVILEGES ON DATABASE ${db} TO ${POSTGRESQL_USERNAME};"; done)
          EOSQL

          # PostgreSQL 15+ revoked default CREATE on the public schema for
          # non-superusers. Grant it explicitly per database so Flyway and
          # the application user can create tables.
          for db in $DATABASES; do
            psql -v ON_ERROR_STOP=1 --username "$POSTGRESQL_INITSCRIPTS_USERNAME" --dbname "$db" <<-EOSQL
              GRANT ALL ON SCHEMA public TO ${POSTGRESQL_USERNAME};
          EOSQL
          done
    persistence:
      storageClass: hcloud-volumes
      size: 10Gi
  sslmode: disable

redis:
  image:
    registry: docker.io
    repository: carolsimone/redis
    tag: "8.6.2"
  architecture: standalone
  auth:
    enabled: true
    password: changeme
  master:
    resources:
      requests:
        memory: 384Mi
        cpu: 100m
      limits:
        memory: 576Mi
        cpu: 150m
    persistence:
      storageClass: hcloud-volumes
      size: 2Gi

neo4j:
  fullnameOverride: continuo-infra-neo4j
  neo4j:
    name: neo4j
    password: changeme
  services:
    neo4j:
      enabled: false
  config:
    server.memory.pagecache.size: "512M"
    server.memory.heap.initial_size: "512M"
    server.memory.heap.max_size: "1G"
  volumes:
    data:
      mode: dynamic
      dynamic:
        storageClassName: hcloud-volumes
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 10Gi
