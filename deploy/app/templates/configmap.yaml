apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "continuo-app.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo-app.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ required "global.postgres.host is required" .Values.global.postgres.host | quote }}
  POSTGRES_PORT: {{ required "global.postgres.port is required" .Values.global.postgres.port | quote }}
  REDIS_HOST: {{ required "global.redis.host is required" .Values.global.redis.host | quote }}
  REDIS_PORT: {{ required "global.redis.port is required" .Values.global.redis.port | quote }}
  REDIS_ADDR: {{ printf "%s:%v" .Values.global.redis.host .Values.global.redis.port | quote }}
  NEO4J_URI: {{ required "global.neo4j.uri is required" .Values.global.neo4j.uri | quote }}
  STATE_GRPC_ADDR: {{ required "global.stateGrpcAddr is required" .Values.global.stateGrpcAddr | quote }}
  GRAPH_GRPC_ADDR: {{ required "global.graphGrpcAddr is required" .Values.global.graphGrpcAddr | quote }}
  STATE_SERVICE_GRPC_ADDR: {{ .Values.global.stateGrpcAddr | quote }}
  GRAPH_SERVICE_GRPC_ADDR: {{ .Values.global.graphGrpcAddr | quote }}
  S3_ENDPOINT_URL: {{ required "global.s3.endpointUrl is required" .Values.global.s3.endpointUrl | quote }}
  S3_BUCKET: {{ required "global.s3.bucket is required" .Values.global.s3.bucket | quote }}
  S3_ENV: {{ required "global.s3.env is required" .Values.global.s3.env | quote }}
  AWS_DEFAULT_REGION: {{ required "global.s3.region is required" .Values.global.s3.region | quote }}
  ENV: {{ required "global.env is required" .Values.global.env | quote }}
  LOG_LEVEL: {{ required "global.logLevel is required" .Values.global.logLevel | quote }}
