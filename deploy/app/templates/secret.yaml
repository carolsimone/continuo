apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo-app.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "global.postgres.user is required" .Values.global.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ required "global.postgres.password is required" .Values.global.postgres.password | quote }}
  NEO4J_USER: {{ required "global.neo4j.user is required" .Values.global.neo4j.user | quote }}
  NEO4J_PASSWORD: {{ required "global.neo4j.password is required" .Values.global.neo4j.password | quote }}
  AWS_ACCESS_KEY_ID: {{ required "global.s3.accessKeyId is required" .Values.global.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "global.s3.secretKey is required" .Values.global.s3.secretKey | quote }}
  REDIS_PASSWORD: {{ required "global.redis.password is required" .Values.global.redis.password | quote }}
  AUTH_OIDC_CLIENT_SECRET: {{ .Values.global.auth.oidcClientSecret | quote }}
  LLM_API_KEY: {{ .Values.global.llm.apiKey | default "" | quote }}
