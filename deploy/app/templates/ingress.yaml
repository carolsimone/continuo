{{- range $svc := .Values.services }}
{{- if and ($svc.enabled | default true) $svc.httpPort $svc.ingress $svc.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "continuo-app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: {{ $svc.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc.name }}
                port:
                  number: {{ $svc.httpPort }}
  tls:
    - hosts:
        - {{ $svc.ingress.host | quote }}
      secretName: {{ printf "%s-tls" $svc.name }}
{{- end }}
{{- end }}
