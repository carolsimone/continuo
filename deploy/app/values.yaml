global:
  imageTag: latest
  dockerHubUser: youruser

  env: dev
  logLevel: INFO

  postgres:
    host: continuo-infra-postgresql
    port: "5432"
    user: continuo_svc
    password: ""

  redis:
    host: continuo-infra-redis-master
    port: "6379"
    password: ""

  auth:
    # OIDC client secret for ui-service. Empty by default: the service
    # fails fast at boot until the deployer sets it, never serving an
    # unauthenticated UI.
    oidcClientSecret: ""

  neo4j:
    uri: bolt://continuo-infra-neo4j:7687
    user: neo4j
    password: ""

  stateGrpcAddr: state:50051
  orchestratorGrpcAddr: orchestrator:50052

  s3:
    endpointUrl: https://nbg1.your-objectstorage.com
    bucket: continuo-dev
    env: dev
    region: eu-central-1
    accessKeyId: ""
    secretKey: ""

services:
  - name: state
    enabled: true
    replicas: 1
    httpPort: 8082
    grpcPort: 50051
    readinessPath: /ready
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      POSTGRES_DB: continuo_state
      DB_SSLMODE: disable
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      HEALTH_PORT: "8082"
      GRPC_PORT: "50051"
      SCHEDULES_CONFIG_PATH: /etc/continuo/schedules.yaml
    volumeMounts:
      - name: schedules
        mountPath: /etc/continuo
        readOnly: true
    volumes:
      - name: schedules
        configMap:
          name: ""

  - name: orchestrator
    enabled: true
    replicas: 1
    httpPort: 8087
    grpcPort: 50052
    readinessPath: /ready
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: NEO4J_USER
        secretKey: NEO4J_USER
      - name: NEO4J_PASSWORD
        secretKey: NEO4J_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      POSTGRES_DB: continuo_orchestrator
      GRPC_PORT: "50052"
      HTTP_PORT: "8087"

  - name: executor-controller
    enabled: true
    replicas: 1
    httpPort: 8084
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    rbac:
      enabled: true
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["create", "get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
    env:
      POSTGRES_DB: continuo_executor
      K8S_NAMESPACE: __RELEASE_NAMESPACE__
      MAX_CONCURRENT_JOBS: "50"
      DBT_POSTGRES_DB: continuo_dbt
      HTTP_PORT: "8084"
      DOCKERHUB_USERNAME: __DOCKERHUB_USERNAME__
      IMAGE_TAG: latest

  - name: k8s-controller
    enabled: true
    replicas: 1
    httpPort: 8085
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    rbac:
      enabled: true
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list", "watch"]
    env:
      POSTGRES_DB: continuo_k8s
      K8S_NAMESPACE: __RELEASE_NAMESPACE__
      LOG_TAIL_LINES: "50"
      K8S_CHECK_DELAY_SECONDS: "30"
      ERROR_MESSAGE_MAX_LENGTH: "4096"
      HTTP_PORT: "8085"

  - name: ui-service
    enabled: true
    replicas: 1
    httpPort: 8090
    probePath: /healthz
    serviceType: ClusterIP
    secretEnv:
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
      - name: AUTH_OIDC_CLIENT_SECRET
        secretKey: AUTH_OIDC_CLIENT_SECRET
    ingress:
      enabled: true
      host: dev.yourdomain.com
    env:
      PORT: "8090"
      NODE_ENV: production
      RELEASE_CONTROLLER_URL: http://release-controller:8088
      # Authentication: ui-service fails fast at boot when these are missing,
      # so a misconfigured deployment crashloops instead of serving an open UI.
      AUTH_MODE: oidc
      AUTH_OIDC_ISSUER_URL: ""
      AUTH_OIDC_CLIENT_ID: ""
      AUTH_PUBLIC_URL: https://dev.yourdomain.com
      AUTH_GROUPS_CLAIM: groups
      AUTH_ROLE_MAPPING: ""
      AUTH_OPERATOR_EMAILS: ""
      AUTH_VIEWER_EMAILS: ""
      REDIS_URL: __REDIS_URL_FROM_AUTH__
    volumeMounts:
      - name: cancel-config
        mountPath: /app/config
        readOnly: true
    volumes:
      - name: cancel-config
        configMap:
          name: ""

  - name: manifest-controller
    enabled: true
    replicas: 1
    secretEnv:
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      REDIS_URL: __REDIS_URL_FROM_AUTH__
    resources:
      requests:
        cpu: 200m
        memory: 256Mi

  - name: release-controller
    enabled: true
    replicas: 1
    httpPort: 8088
    probePath: /healthz
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
    env:
      POSTGRES_DB: continuo_release
      HTTP_PORT: "8088"
