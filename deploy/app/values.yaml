global:
  imageTag: latest
  dockerHubUser: youruser

  env: dev
  logLevel: INFO

  postgres:
    host: continuo-infra-postgresql
    port: "5432"
    user: continuo_svc
    password: ""

  redis:
    host: continuo-infra-redis-master
    port: "6379"
    password: ""

  auth:
    # ui-service identity-provider settings. The committed defaults are empty,
    # so a deploy fails closed (the pod crashloops) until they are set — it never
    # serves an unauthenticated UI. Populate these in the on-box secret values
    # file passed with `-f` (it deep-merges over these defaults), keeping
    # per-deployment identity config out of the committed chart.
    oidcClientSecret: ""   # OAuth client secret (sensitive)
    issuerUrl: ""          # OIDC issuer, e.g. https://accounts.google.com
    clientId: ""           # OAuth client ID
    publicUrl: ""          # external base URL, e.g. https://continuo.example.com
    operatorEmails: ""     # comma-separated operator emails (verified-email gate)
    viewerEmails: ""       # comma-separated viewer emails
    roleMapping: ""        # group=role pairs when the IdP emits a groups claim

  neo4j:
    uri: bolt://continuo-infra-neo4j:7687
    user: neo4j
    password: ""

  stateGrpcAddr: state:50051
  orchestratorGrpcAddr: orchestrator:50052
  agentRunnerGrpcAddr: agent-runner:50053

  llm:
    # LLM provider API key (sensitive). Populated in the on-box secret values
    # file passed with `-f`. The chart default is empty so a deploy without the
    # key leaves the agent-runner unable to call the LLM — the pod still starts
    # and serves gRPC, but chat sessions will fail until the key is supplied.
    apiKey: ""

  s3:
    endpointUrl: https://nbg1.your-objectstorage.com
    bucket: continuo-dev
    env: dev
    region: eu-central-1
    accessKeyId: ""
    secretKey: ""

services:
  - name: state
    enabled: true
    replicas: 1
    httpPort: 8082
    grpcPort: 50051
    readinessPath: /ready
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      POSTGRES_DB: continuo_state
      DB_SSLMODE: disable
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      HEALTH_PORT: "8082"
      GRPC_PORT: "50051"
      SCHEDULES_CONFIG_PATH: /etc/continuo/schedules.yaml
    volumeMounts:
      - name: schedules
        mountPath: /etc/continuo
        readOnly: true
    volumes:
      - name: schedules
        configMap:
          name: ""

  - name: orchestrator
    enabled: true
    replicas: 1
    httpPort: 8087
    grpcPort: 50052
    readinessPath: /ready
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: NEO4J_USER
        secretKey: NEO4J_USER
      - name: NEO4J_PASSWORD
        secretKey: NEO4J_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      POSTGRES_DB: continuo_orchestrator
      GRPC_PORT: "50052"
      HTTP_PORT: "8087"

  - name: agent-runner
    enabled: true
    replicas: 1
    httpPort: 8091
    grpcPort: 50053
    readinessPath: /ready
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: LLM_API_KEY
        secretKey: LLM_API_KEY
      # REDIS_PASSWORD enables the shared (global) rate limiter; REDIS_ADDR/HOST/
      # PORT reach every pod via the shared ConfigMap. Required before scaling
      # agent-runner past replicas: 1 so the per-user limit stays global.
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      POSTGRES_DB: continuo_agent
      DB_SSLMODE: disable
      HEALTH_PORT: "8091"
      GRPC_PORT: "50053"
      CONTINUO_STATE_ADDR: state:50051
      CONTINUO_ORCHESTRATOR_ADDR: orchestrator:50052
      LLM_PROVIDER: anthropic
      LLM_MODEL: claude-sonnet-4-6
      CHAT_MAX_CONCURRENT_SESSIONS: "100"

  - name: executor-controller
    enabled: true
    replicas: 1
    httpPort: 8084
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
      # Forwarded into each validation Job so validation_runner.py can fetch the
      # candidate SQL from S3 (CANDIDATE_SQL_URI). Endpoint/bucket/region come
      # from the shared configMap; the access keys come from the secret.
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
    rbac:
      enabled: true
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["create", "get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
    env:
      POSTGRES_DB: continuo_executor
      K8S_NAMESPACE: __RELEASE_NAMESPACE__
      MAX_CONCURRENT_JOBS: "50"
      DBT_POSTGRES_DB: continuo_dbt
      HTTP_PORT: "8084"
      DOCKERHUB_USERNAME: __DOCKERHUB_USERNAME__
      IMAGE_TAG: latest

  - name: k8s-controller
    enabled: true
    replicas: 1
    httpPort: 8085
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    rbac:
      enabled: true
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list", "watch"]
    env:
      POSTGRES_DB: continuo_k8s
      K8S_NAMESPACE: __RELEASE_NAMESPACE__
      LOG_TAIL_LINES: "50"
      K8S_CHECK_DELAY_SECONDS: "30"
      ERROR_MESSAGE_MAX_LENGTH: "4096"
      HTTP_PORT: "8085"

  - name: ui-service
    enabled: true
    replicas: 1
    httpPort: 8090
    probePath: /healthz
    serviceType: ClusterIP
    secretEnv:
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
      - name: AUTH_OIDC_CLIENT_SECRET
        secretKey: AUTH_OIDC_CLIENT_SECRET
    ingress:
      enabled: true
      host: dev.yourdomain.com
    env:
      PORT: "8090"
      NODE_ENV: production
      RELEASE_CONTROLLER_URL: http://release-controller:8088
      # Authentication: ui-service fails fast at boot when these are missing,
      # so a misconfigured deployment crashloops instead of serving an open UI.
      # The __AUTH_*__ sentinels are expanded by the deployment template from
      # global.auth.* (see global.auth above), so per-deployment identity config
      # lives in the on-box secret values file, not in this committed chart.
      # Attaches the /ws/chat bridge to agent-runner and lets the client render the
      # chat panel. Operator-gated client-side; agent-runner must have a working
      # LLM_API_KEY (anthropic) for the agent to answer.
      CHAT_BRIDGE_ENABLED: "true"
      AUTH_MODE: oidc
      AUTH_OIDC_ISSUER_URL: __AUTH_ISSUER_URL__
      AUTH_OIDC_CLIENT_ID: __AUTH_CLIENT_ID__
      AUTH_PUBLIC_URL: __AUTH_PUBLIC_URL__
      AUTH_GROUPS_CLAIM: groups
      AUTH_ROLE_MAPPING: __AUTH_ROLE_MAPPING__
      AUTH_OPERATOR_EMAILS: __AUTH_OPERATOR_EMAILS__
      AUTH_VIEWER_EMAILS: __AUTH_VIEWER_EMAILS__
      REDIS_URL: __REDIS_URL_FROM_AUTH__
    volumeMounts:
      - name: cancel-config
        mountPath: /app/config
        readOnly: true
    volumes:
      - name: cancel-config
        configMap:
          name: ""

  - name: manifest-controller
    enabled: true
    replicas: 1
    secretEnv:
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      REDIS_URL: __REDIS_URL_FROM_AUTH__
    resources:
      requests:
        cpu: 200m
        memory: 256Mi

  - name: release-controller
    enabled: true
    replicas: 1
    httpPort: 8088
    probePath: /healthz
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
    env:
      POSTGRES_DB: continuo_release
      HTTP_PORT: "8088"
