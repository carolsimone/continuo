global:
  imageTag: latest
  dockerHubUser: youruser

  env: dev
  logLevel: INFO

  postgres:
    host: continuo-infra-postgresql
    port: "5432"
    user: continuo_svc
    password: ""

  redis:
    host: continuo-infra-redis-master
    port: "6379"
    password: ""

  neo4j:
    uri: bolt://continuo-infra-neo4j:7687
    user: neo4j
    password: ""

  stateGrpcAddr: state:50051
  orchestratorGrpcAddr: orchestrator:50052

  s3:
    endpointUrl: https://nbg1.your-objectstorage.com
    bucket: continuo-dev
    env: dev
    region: eu-central-1
    accessKeyId: ""
    secretKey: ""

services:
  - name: state
    enabled: true
    replicas: 1
    httpPort: 8082
    grpcPort: 50051
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      POSTGRES_DB: continuo_state
      DB_SSLMODE: disable
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      HEALTH_PORT: "8082"
      GRPC_PORT: "50051"
      REDIS_STREAM_RUN_ENTRIES_DISPATCHED: run.entries.dispatched:v1
      REDIS_STREAM_RUN_ENTRIES_DISPATCH_FAILED: run.entries.dispatch_failed:v1
      REDIS_STREAM_TASK_STATUS_UPDATED: task.status.updated:v1
      REDIS_STREAM_TASK_EXECUTION_RECORDED: task.execution.recorded:v1
      REDIS_STREAM_SCHEDULER_STARTED: scheduler.started:v1
      REDIS_STREAM_SCHEDULES_LOADED: schedules.loaded:v1
      SCHEDULES_CONFIG_PATH: /etc/continuo/schedules.yaml
    volumeMounts:
      - name: schedules
        mountPath: /etc/continuo
        readOnly: true
    volumes:
      - name: schedules
        configMap:
          name: ""

  - name: orchestrator
    enabled: true
    replicas: 1
    httpPort: 8087
    grpcPort: 50052
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: NEO4J_USER
        secretKey: NEO4J_USER
      - name: NEO4J_PASSWORD
        secretKey: NEO4J_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      NODE_UPDATED_STREAM: node.updated:v1
      NODE_UPDATED_GROUP: orchestrator_node_updated
      MANIFEST_LOADED_STREAM: manifest.loaded:v1
      MANIFEST_LOADED_GROUP: orchestrator_manifest_loaded
      INITIALIZE_RUN_STREAM: initialize.run:v1
      INITIALIZE_RUN_GROUP: orchestrator_initialize_run
      SCHEDULER_STARTED_STREAM: scheduler.started:v1
      SCHEDULER_STARTED_GROUP: orchestrator_scheduler_started
      RERUN_STREAM: trigger.rerun:v1
      RERUN_GROUP: orchestrator_rerun
      REBASE_STREAM: trigger.rebase:v1
      REBASE_GROUP: orchestrator_rebase
      SINGLE_NODE_RUN_STREAM: trigger.single_node_run:v1
      SINGLE_NODE_RUN_GROUP: orchestrator_single_node_run
      RUN_FINALIZED_STREAM: run.finalized:v1
      RUN_FINALIZED_GROUP: orchestrator-run-finalized
      SCHEDULE_CANCELLED_STREAM: schedule.cancelled:v1
      SCHEDULE_CANCELLED_GROUP: orchestrator-schedule-cancelled
      POSTGRES_DB: continuo_orchestrator
      GRPC_PORT: "50052"
      HTTP_PORT: "8087"

  - name: executor-controller
    enabled: true
    replicas: 1
    httpPort: 8084
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    rbac:
      enabled: true
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["create", "get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
    env:
      REDIS_CONSUMER_STREAM: query.model:v1
      REDIS_CONSUMER_RETRY_STREAM: retry.task:v1
      REDIS_CONSUMER_GROUP: executor_controller_consumers
      REDIS_PRODUCER_STREAM: node.deployed:v1
      REDIS_STATUS_STREAM: task.status.updated:v1
      REDIS_NODE_UPDATED_STREAM: node.updated:v1
      SCHEDULE_CANCELLED_STREAM: schedule.cancelled:v1
      SCHEDULE_CANCELLED_GROUP: executor-schedule-cancelled
      POSTGRES_DB: continuo_executor
      K8S_NAMESPACE: __RELEASE_NAMESPACE__
      DBT_POSTGRES_DB: continuo_dbt
      HTTP_PORT: "8084"
      DOCKERHUB_USERNAME: __DOCKERHUB_USERNAME__
      IMAGE_TAG: latest

  - name: k8s-controller
    enabled: true
    replicas: 1
    httpPort: 8085
    secretEnv:
      - name: POSTGRES_USER
        secretKey: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        secretKey: POSTGRES_PASSWORD
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    rbac:
      enabled: true
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list", "watch"]
    env:
      REDIS_CONSUMER_DEPLOYED_STREAM: node.deployed:v1
      REDIS_CONSUMER_CHECK_STREAM: check.k8s:v1
      REDIS_CONSUMER_GROUP: k8s_controller_consumers
      REDIS_PRODUCER_CHECK_STREAM: check.k8s:v1
      REDIS_PRODUCER_RETRY_STREAM: retry.task:v1
      REDIS_PRODUCER_FAILED_STREAM: task.failed:v1
      REDIS_PRODUCER_UPDATE_TABLE_STREAM: node.updated:v1
      SCHEDULE_CANCELLED_STREAM: schedule.cancelled:v1
      SCHEDULE_CANCELLED_GROUP: k8s-schedule-cancelled
      POSTGRES_DB: continuo_k8s
      K8S_NAMESPACE: __RELEASE_NAMESPACE__
      LOG_TAIL_LINES: "50"
      K8S_CHECK_DELAY_SECONDS: "30"
      ERROR_MESSAGE_MAX_LENGTH: "4096"
      HTTP_PORT: "8085"

  - name: ui-service
    enabled: true
    replicas: 1
    httpPort: 8090
    probePath: /
    serviceType: LoadBalancer
    secretEnv:
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    ingress:
      enabled: true
      host: dev.yourdomain.com
    env:
      PORT: "8090"
      NODE_ENV: production
      REDIS_URL: __REDIS_URL_FROM_AUTH__
    volumeMounts:
      - name: cancel-config
        mountPath: /app/config
        readOnly: true
    volumes:
      - name: cancel-config
        configMap:
          name: ""

  - name: manifest-controller
    enabled: true
    replicas: 1
    secretEnv:
      - name: AWS_ACCESS_KEY_ID
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: REDIS_PASSWORD
        secretKey: REDIS_PASSWORD
    env:
      REDIS_URL: __REDIS_URL_FROM_AUTH__
      REDIS_STREAM: "update.graph:v1"
      REDIS_GROUP: "manifest-controller"
      REDIS_OUTPUT_STREAM: "manifest.loaded:v1"
      REGISTRY_PATH: /data/registry.csv
      MANIFESTS_BASE: /manifests
    volumeMounts:
      - name: manifests
        mountPath: /manifests
        readOnly: true
    volumes:
      - name: manifests
        emptyDir: {}
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
    # The local compose setup mounts dbt manifests into /manifests. In-cluster this
    # needs a follow-up source such as a PVC, baked-in artifacts, or S3-backed sync.
