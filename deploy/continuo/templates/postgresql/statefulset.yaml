{{- if .Values.postgresql.enabled }}
# Quickstart/evaluation PostgreSQL: single instance, no HA, no backups.
# Production installs set postgresql.enabled=false and bring their own.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "continuo.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
spec:
  serviceName: {{ include "continuo.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "continuo.selectorLabels" (dict "root" $ "service" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "continuo.selectorLabels" (dict "root" $ "service" "postgresql") | nindent 8 }}
    spec:
      securityContext:
        {{- include "continuo.podSecurityContext" . | nindent 8 }}
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "continuo.containerSecurityContext" . | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "postgres") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "postgres") | quote }}
            # Subdirectory so the PVC's lost+found does not trip initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (default .Values.global.storageClass .Values.postgresql.persistence.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
