{{- /* The bundled quickstart's warehouse Secret: the login dbt and the
     validation runner sign in as (credentials.postgres.warehouse), which the
     migrate Job creates and makes the owner of validation.warehouseDatabase.
     execution-controller attaches it to Job pods with envFrom, so it holds
     only the POSTGRES_* keys the postgres runner reads. Its password is
     generated once and kept across upgrades. */}}
{{- if and .Values.postgresql.enabled .Values.validation.createWarehouseSecret }}
{{- $name := include "continuo.validation.warehouseSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
type: Opaque
stringData:
  POSTGRES_HOST: {{ include "continuo.postgresql.host" . | quote }}
  POSTGRES_PORT: {{ include "continuo.postgresql.port" . | quote }}
  POSTGRES_DB: {{ .Values.validation.warehouseDatabase | quote }}
  POSTGRES_USER: {{ include "continuo.postgres.warehouseLogin" . | quote }}
  POSTGRES_PASSWORD: {{ include "continuo.generatedSecret" (dict "root" $ "secretName" $name "key" "POSTGRES_PASSWORD") | quote }}
{{- end }}
