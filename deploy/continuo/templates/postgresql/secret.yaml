{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $pw := include "continuo.generatedSecret" (dict "root" $ "secretName" (include "continuo.postgresql.fullname" .) "key" "password") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
type: Opaque
stringData:
  password: {{ $pw | quote }}
  {{- if .Values.validation.createWarehouseSecret }}
  # Validation runner warehouse connection, attached to each validation pod via
  # envFrom (VALIDATION_WAREHOUSE_SECRET points here in bundled mode). Sharing this
  # Secret — and the single $pw above — guarantees the runner uses exactly the
  # password the StatefulSet does, even on a fresh install where a second
  # generatedSecret call would produce a different random value.
  POSTGRES_HOST: {{ include "continuo.postgresql.host" . | quote }}
  POSTGRES_PORT: {{ include "continuo.postgresql.port" . | quote }}
  POSTGRES_DB: {{ .Values.validation.warehouseDatabase | quote }}
  POSTGRES_USER: {{ include "continuo.postgresql.username" . | quote }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  {{- end }}
{{- end }}
