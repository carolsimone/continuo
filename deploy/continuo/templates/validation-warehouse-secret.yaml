{{- /* Dedicated warehouse Secret for the postgres validation runner when the chart
     talks to an EXTERNAL Postgres via an inline password (externalDatabase.password,
     no existingSecret). Bundled Postgres shares its own generated Secret instead
     (see postgresql/secret.yaml) so the password is generated exactly once. When the
     password lives in an existingSecret, or the engine is not postgres, the chart
     cannot build this — the operator sets validation.createWarehouseSecret=false and
     supplies validation.warehouseSecret. */}}
{{- if and .Values.validation.createWarehouseSecret (not .Values.postgresql.enabled) .Values.externalDatabase.password (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.validation.warehouseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_HOST: {{ include "continuo.postgresql.host" . | quote }}
  POSTGRES_PORT: {{ include "continuo.postgresql.port" . | quote }}
  POSTGRES_DB: {{ .Values.validation.warehouseDatabase | quote }}
  POSTGRES_USER: {{ include "continuo.postgresql.username" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.externalDatabase.password | quote }}
{{- end }}
