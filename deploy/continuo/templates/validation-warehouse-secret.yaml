{{- /* Warehouse credentials for the postgres validation runner, created from the
     Postgres the chart already configures (bundled or externalDatabase) so the
     quickstart works with no operator action. The executor attaches it to each
     validation pod via envFrom (VALIDATION_WAREHOUSE_SECRET). Operators on a
     non-postgres engine — or bringing externalDatabase.existingSecret — set
     validation.createWarehouseSecret=false and point validation.warehouseSecret
     at their own Secret, whose keys match their engine's runner image. */}}
{{- if .Values.validation.createWarehouseSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.validation.warehouseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_HOST: {{ include "continuo.postgresql.host" . | quote }}
  POSTGRES_PORT: {{ include "continuo.postgresql.port" . | quote }}
  POSTGRES_DB: {{ .Values.validation.warehouseDatabase | quote }}
  POSTGRES_USER: {{ include "continuo.postgresql.username" . | quote }}
  POSTGRES_PASSWORD: {{ include "continuo.postgresql.password" . | quote }}
{{- end }}
