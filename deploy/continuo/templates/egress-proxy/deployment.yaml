{{- if eq (include "continuo.egress.enabled" .) "true" }}
{{- $e := .Values.egress | default dict }}
{{- $p := $e.proxy | default dict }}
{{- range .Values.services }}
{{- if eq .name "egress-proxy" }}
{{- fail "services[name=egress-proxy] collides with the egress-proxy Deployment and Service the chart renders from the egress block: remove the services entry, or set egress.enabled=false to run your own" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: egress-proxy
spec:
  replicas: {{ $p.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "continuo.selectorLabels" (dict "root" . "service" "egress-proxy") | nindent 6 }}
  template:
    metadata:
      annotations:
        # LOG_LEVEL and METRICS_PORT reach the proxy through the shared
        # ConfigMap and its allowlist file is read once at startup, so a change
        # to either rolls the proxy.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/egress-proxy: {{ include (print $.Template.BasePath "/egress-proxy/configmap.yaml") . | sha256sum }}
        {{- if eq (include "continuo.metrics.podAnnotations" .) "true" }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ include "continuo.metrics.port" . | quote }}
        prometheus.io/path: /metrics
        {{- end }}
      labels:
        {{- include "continuo.selectorLabels" (dict "root" . "service" "egress-proxy") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.global.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "continuo.podSecurityContext" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: egress-proxy
          image: {{ include "continuo.image" (dict "root" . "name" "egress-proxy") | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "continuo.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "continuo.configMapName" . }}
          env:
            - name: EGRESS_PROXY_LISTEN_PORT
              value: "3128"
            - name: EGRESS_PROXY_HEALTH_PORT
              value: "8093"
            - name: EGRESS_ALLOWLIST_PATH
              value: /etc/egress-proxy/allowlist.yaml
            - name: EGRESS_MAX_TUNNELS
              value: {{ $p.maxTunnels | default 1024 | quote }}
          ports:
            - name: proxy
              containerPort: 3128
            - name: http
              containerPort: 8093
            - name: metrics
              containerPort: {{ include "continuo.metrics.port" . }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "500m" "memory" "256Mi")) $p.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: allowlist
              mountPath: /etc/egress-proxy
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: allowlist
          configMap:
            name: {{ include "continuo.egressProxy.configMapName" . }}
{{- end }}
