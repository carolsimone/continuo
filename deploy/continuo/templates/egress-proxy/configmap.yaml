{{- /* egress.directDestinations, and every URL the agents call whose host is
       an IP address, are checked whenever egress is on, also when no proxy
       renders and nothing else reads them. */}}
{{- if eq (include "continuo.egress.enabled" .) "true" }}
{{- $_ := include "continuo.egress.directDestinations" . }}
{{- end }}
{{- if eq (include "continuo.egress.proxyEnabled" .) "true" }}
# The hosts and ports egress-proxy admits, read once at startup. The proxy's
# pod template carries a digest of this file, so a changed list rolls it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "continuo.egressProxy.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: egress-proxy
data:
  allowlist.yaml: |
    entries:
    {{- range (include "continuo.egress.allowlist" . | fromJsonArray) }}
      - host: {{ .host | quote }}
        port: {{ .port }}
        allowPrivate: {{ .allowPrivate }}
    {{- end }}
{{- end }}
