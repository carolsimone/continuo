{{- if eq (include "continuo.egress.proxyEnabled" .) "true" }}
# The address a client sets as its HTTP and HTTPS proxy: http://egress-proxy:3128.
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: egress-proxy
spec:
  type: ClusterIP
  selector:
    {{- include "continuo.selectorLabels" (dict "root" . "service" "egress-proxy") | nindent 4 }}
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
{{- end }}
