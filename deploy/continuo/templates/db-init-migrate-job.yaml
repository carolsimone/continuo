apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "continuo.migrateJobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: db-init-migrate
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "flyway writes reports under /flyway"
    {{- if not .Values.postgresql.enabled }}
    # BYO database exists before install → strict pre-install/pre-upgrade
    # ordering, exactly like the previous production flow. With the bundled
    # Postgres this Job is a regular resource instead: pre-install hooks run
    # before ANY release resource exists, so a hook could never connect.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- end }}
spec:
  {{- /* When postgresql.enabled=false and there is no existingSecret, the
       postgres credential resolves to the chart's OWN credentials Secret
       (templates/credentials-secret.yaml), which is a regular resource Helm
       only creates AFTER pre-install/pre-upgrade hooks finish. A secretKeyRef
       to that Secret here would deadlock this hook pod (CreateContainerConfig
       Error until install/upgrade timeout). Instead of inlining the raw
       password as an env `value` (readable by anyone with get/list/watch on
       Jobs/Pods, no Secret permission required), templates/db-init-migrate-
       hook-secret.yaml renders a small dedicated Secret via the same hook
       mechanism, ordered strictly before this Job (hook-weight -10 vs -5),
       and both containers below reference it with a normal secretKeyRef.
       Bundled and existingSecret resolutions keep the secretKeyRef via the
       dispatcher helpers unchanged. */}}
  {{- $usesHookSecret := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
  {{- $hookSecretName := include "continuo.migrateHookSecretName" . }}
  backoffLimit: 3
  {{- if .Values.postgresql.enabled }}
  ttlSecondsAfterFinished: 86400
  {{- else }}
  # Hook Job: helm's before-hook-creation/hook-succeeded delete policy already
  # sweeps it on the next install and on success. This TTL is the backstop for
  # a FAILED hook run, giving an hour to inspect logs before it is swept too.
  ttlSecondsAfterFinished: 3600
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "continuo.selectorLabels" (dict "root" $ "service" "db-init-migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "continuo.podSecurityContext" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
      {{- if .Values.databaseInit.enabled }}
      initContainers:
        # Idempotently creates every continuo database: the 7 Flyway-migrated
        # service databases and, with the bundled Postgres, the dbt warehouse
        # (validation.warehouseDatabase). An external Postgres's warehouse is
        # the company's. Requires CREATEDB; disable databaseInit when a DBA
        # pre-creates the databases and makes the migration login their owner.
        - name: db-init
          image: {{ include "continuo.image" (dict "root" $ "name" "migrations") | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGHOST
              value: {{ include "continuo.postgresql.host" . | quote }}
            - name: PGPORT
              value: {{ include "continuo.postgresql.port" . | quote }}
            - name: PGUSER
              value: {{ include "continuo.postgresql.username" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if $usesHookSecret }}
                  name: {{ $hookSecretName | quote }}
                  key: postgres-password
                  {{- else }}
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "postgres") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "postgres") | quote }}
                  {{- end }}
            - name: PGDATABASE
              value: postgres
            - name: DB_SSLMODE
              value: {{ include "continuo.db.sslMode" . | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              tries=0
              until psql -tc "SELECT 1" >/dev/null 2>&1; do
                tries=$((tries+1))
                [ "$tries" -gt 100 ] && echo "postgres never became reachable" && exit 1
                echo "waiting for postgres ($tries)..."; sleep 3
              done
              ensure_database() {
                if psql -tc "SELECT 1 FROM pg_database WHERE datname = '${1}'" | grep -q 1; then
                  echo "database ${1} already exists"
                else
                  echo "creating database ${1}"
                  psql -c "CREATE DATABASE \"${1}\""
                fi
              }
              for db in continuo_run_controller continuo_execution \
                        continuo_release continuo_agent_chat \
                        continuo_remediation continuo_agent_remediation \
                        continuo_dead_letter; do
                ensure_database "${db}"
                psql -d "${db}" -c "GRANT ALL ON SCHEMA public TO \"${PGUSER}\""
              done
              {{- if .Values.postgresql.enabled }}
              # The bundled quickstart's dbt warehouse; the migrate container
              # hands it to the warehouse login.
              ensure_database {{ .Values.validation.warehouseDatabase | quote }}
              {{- end }}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "continuo.image" (dict "root" $ "name" "migrations") | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_HOST
              value: {{ include "continuo.postgresql.host" . | quote }}
            - name: POSTGRES_PORT
              value: {{ include "continuo.postgresql.port" . | quote }}
            - name: POSTGRES_USER
              value: {{ include "continuo.postgresql.username" . | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if $usesHookSecret }}
                  name: {{ $hookSecretName | quote }}
                  key: postgres-password
                  {{- else }}
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "postgres") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "postgres") | quote }}
                  {{- end }}
            - name: DB_SSLMODE
              value: {{ include "continuo.db.sslMode" . | quote }}
            # Each database's runtime login, which the job grants its rights
            # and checks (credentials.postgres).
            - name: CONTINUO_PG_LOGINS
              value: {{ include "continuo.postgres.loginsEnv" . | quote }}
            {{- if .Values.postgresql.enabled }}
            # Bundled quickstart: the job creates each login with its password.
            - name: CONTINUO_PG_CREATE_LOGINS
              value: "true"
            {{- range $svc, $db := (include "continuo.postgres.serviceDatabases" . | fromJson) }}
            {{- $login := dict "root" $ "ref" "postgresLogin" "svc" (dict "name" $svc) }}
            - name: {{ printf "CONTINUO_PG_PASSWORD_%s" (upper $db) }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" $login | quote }}
                  key: {{ include "continuo.secretKey" $login | quote }}
            {{- end }}
            {{- if .Values.validation.createWarehouseSecret }}
            # ... and hands the warehouse database to the warehouse login.
            - name: CONTINUO_PG_WAREHOUSE_LOGIN
              value: {{ include "continuo.postgres.warehouseLogin" . | quote }}
            - name: CONTINUO_PG_WAREHOUSE_DB
              value: {{ .Values.validation.warehouseDatabase | quote }}
            - name: CONTINUO_PG_WAREHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.validation.warehouseSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- end }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
