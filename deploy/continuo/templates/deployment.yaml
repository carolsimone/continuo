{{- range $svc := .Values.services }}
{{- if ($svc.enabled | default true) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  {{- if eq $svc.name "executor-controller" }}
  annotations:
    # VALIDATION_WAREHOUSE_SECRET holds the NAME of a Secret (a resource
    # reference), not a credential value; every real secret in this chart is
    # injected via secretKeyRef. The heuristic matches the var name only.
    ignore-check.kube-linter.io/env-var-secret: "value is a Secret name, not a secret"
  {{- end }}
  labels:
    {{- include "continuo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
spec:
  replicas: {{ default 1 $svc.replicas }}
  selector:
    matchLabels:
      {{- include "continuo.selectorLabels" (dict "root" $ "service" $svc.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Every service reads the shared ConfigMap through envFrom, and
        # Kubernetes never refreshes environment variables in a running pod when
        # that ConfigMap changes. Without this checksum, `helm upgrade` with a
        # different REDIS_HOST, S3_BUCKET, LOG_LEVEL or WAREHOUSE_ENGINE renders
        # an identical Deployment, so nothing rolls and every pod keeps serving
        # the previous configuration indefinitely. The engine case is the one
        # that corrupts output rather than merely going stale: executor-
        # controller rolls on an engine change because its validation image ref
        # changes, so manifest-controller would keep uploading the old engine's
        # SQL to the new engine's validator.
        #
        # The ConfigMap holds only values derived deterministically from
        # values.yaml — generated credentials live in Secrets — so this digest is
        # stable across upgrades that change nothing, and an unchanged install
        # does not roll.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "continuo.selectorLabels" (dict "root" $ "service" $svc.name) | nindent 8 }}
    spec:
      # Bounds how long the kubelet waits after SIGTERM before SIGKILLing the
      # container. Must stay comfortably above the app's own SHUTDOWN_GRACE
      # (pkg/lifecycle's env-configured shutdown budget, default 15s / 10s for
      # agent-chat): if this is tighter than SHUTDOWN_GRACE, Kubernetes can
      # SIGKILL mid-teardown before the app's own bounded sequence finishes.
      terminationGracePeriodSeconds: {{ $.Values.global.terminationGracePeriodSeconds }}
      {{- if and $svc.rbac $svc.rbac.enabled }}
      serviceAccountName: {{ $svc.name }}
      {{- end }}
      securityContext:
        {{- include "continuo.podSecurityContext" $ | nindent 8 }}
        {{- if eq $svc.name "ui" }}
        runAsUser: 1000
        runAsGroup: 1000
        {{- else }}
        runAsUser: 65532
        runAsGroup: 65532
        {{- end }}
      {{- $needsMigrations := and $.Values.postgresql.enabled $svc.env $svc.env.POSTGRES_DB }}
      {{- $needsRedis := and $.Values.redis.enabled $svc.env $svc.env.REDIS_URL }}
      {{- if or $needsMigrations $needsRedis }}
      initContainers:
        {{- if $needsRedis }}
        # Bundled mode: Redis is a StatefulSet with no ordering guarantee against
        # these Deployments, so a Redis-backed service that starts first crashes
        # on connect. CrashLoopBackOff then backs off exponentially (10s, 20s,
        # 40s, 80s...), so the pod stays down long after Redis is actually ready
        # — the restart loop costs more than the wait it replaces. Gate instead.
        # BYO installs point at Redis that is already running and render nothing.
        - name: wait-for-redis
          image: "{{ $.Values.redis.image.repository }}:{{ $.Values.redis.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "continuo.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "redis") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "redis") | quote }}
            - name: REDIS_HOST
              value: {{ include "continuo.redis.host" $ | quote }}
            - name: REDIS_PORT
              value: {{ include "continuo.redis.port" $ | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              tries=0
              until [ "$(redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" ping 2>/dev/null)" = "PONG" ]; do
                tries=$((tries+1))
                if [ "$tries" -gt 100 ]; then
                  echo "FATAL: Redis at ${REDIS_HOST}:${REDIS_PORT} never became ready after $((100*3))s" >&2
                  exit 1
                fi
                echo "waiting for redis ($tries)..."; sleep 3
              done
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
        {{- end }}
        {{- if $needsMigrations }}
        # Bundled mode: the migration Job is a regular resource (hooks would
        # deadlock — see db-init-migrate-job.yaml), so Postgres-backed services
        # gate on Flyway having initialized their database. BYO installs keep
        # the pre-install hook and render no initContainer.
        - name: wait-for-migrations
          image: {{ include "continuo.image" (dict "root" $ "name" "migrations") | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "continuo.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: PGHOST
              value: {{ include "continuo.postgresql.host" $ | quote }}
            - name: PGPORT
              value: {{ include "continuo.postgresql.port" $ | quote }}
            - name: PGUSER
              value: {{ include "continuo.postgresql.username" $ | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "postgres") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "postgres") | quote }}
            - name: PGDATABASE
              value: {{ $svc.env.POSTGRES_DB | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              tries=0
              until psql -tc "SELECT 1 FROM flyway_schema_history LIMIT 1" >/dev/null 2>&1; do
                tries=$((tries+1))
                if [ "$tries" -gt 200 ]; then
                  echo "FATAL: migrations never completed for ${PGDATABASE} after $((200*3))s — check the db-init-migrate Job" >&2
                  exit 1
                fi
                echo "waiting for migrations on ${PGDATABASE} ($tries)..."; sleep 3
              done
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ default (include "continuo.image" (dict "root" $ "name" $svc.name)) $svc.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "continuo.containerSecurityContext" $ | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "continuo.configMapName" $ }}
          {{- $needsS3 := has $svc.name (include "continuo.s3.credentialServices" $ | fromJsonArray) }}
          {{- if or $svc.secretEnv $svc.env $needsS3 }}
          env:
            {{- /*
              Services that read or write object storage get their S3 credentials
              from here rather than from their `secretEnv` entry. `services` is a
              list, and Helm replaces lists wholesale, so an operator upgrading
              with their own copy of values.yaml keeps an older entry — which
              would silently drop these refs and leave the service authenticating
              with nothing. Injecting them from the template makes the credentials
              independent of that replaceable list.
            */}}
            {{- if $needsS3 }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "s3AccessKeyId") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "s3AccessKeyId") | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "s3SecretAccessKey") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "s3SecretAccessKey") | quote }}
            {{- end }}
            {{- range $secret := ($svc.secretEnv | default (list)) }}
            {{- if not (and $needsS3 (or (eq $secret.name "AWS_ACCESS_KEY_ID") (eq $secret.name "AWS_SECRET_ACCESS_KEY"))) }}
            - name: {{ $secret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" $secret.ref) | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" $secret.ref) | quote }}
            {{- end }}
            {{- end }}
          {{- if $svc.env }}
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              {{- if and (eq $key "K8S_NAMESPACE") (eq $val "__RELEASE_NAMESPACE__") }}
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
              {{- else if eq $val "__REDIS_URL__" }}
              value: {{ printf "redis://:$(REDIS_PASSWORD)@%s:%s" (include "continuo.redis.host" $) (include "continuo.redis.port" $) | quote }}
              {{- else if eq $val "__DOCKERHUB_USERNAME__" }}
              value: {{ $.Values.global.teamImagePrefix | quote }}
              {{- else if eq $val "__VALIDATION_IMAGE__" }}
              value: {{ include "continuo.validation.image" $ | quote }}
              {{- else if eq $val "__VALIDATION_WAREHOUSE_SECRET__" }}
              value: {{ include "continuo.validation.warehouseSecretName" $ | quote }}
              {{- else if eq $val "__S3_SIDECAR_IMAGE__" }}
              value: {{ include "continuo.image" (dict "root" $ "name" "s3-sidecar") | quote }}
              {{- else if eq $val "__AUTH_ISSUER_URL__" }}
              value: {{ include "continuo.auth.issuerUrl" $ | quote }}
              {{- else if eq $val "__AUTH_CLIENT_ID__" }}
              value: {{ include "continuo.auth.clientId" $ | quote }}
              {{- else if eq $val "__AUTH_PUBLIC_URL__" }}
              value: {{ $.Values.auth.publicUrl | quote }}
              {{- else if eq $val "__AUTH_OPERATOR_EMAILS__" }}
              value: {{ include "continuo.auth.operatorEmails" $ | quote }}
              {{- else if eq $val "__AUTH_VIEWER_EMAILS__" }}
              value: {{ $.Values.auth.viewerEmails | quote }}
              {{- else if eq $val "__AUTH_ROLE_MAPPING__" }}
              value: {{ $.Values.auth.roleMapping | quote }}
              {{- else if eq $val "__GITHUB_APP_ID__" }}
              value: {{ $.Values.github.appId | default "" | quote }}
              {{- else if eq $val "__GITHUB_APP_INSTALLATION_ID__" }}
              value: {{ $.Values.github.installationId | default "" | quote }}
              {{- else if eq $val "__LLM_PROVIDER__" }}
              value: {{ $.Values.llm.provider | quote }}
              {{- else if eq $val "__LLM_MODEL__" }}
              value: {{ $.Values.llm.model | quote }}
              {{- else }}
              value: {{ $val | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if or $svc.httpPort $svc.grpcPort }}
          ports:
            {{- if $svc.httpPort }}
            - name: http
              containerPort: {{ $svc.httpPort }}
            {{- end }}
            {{- if $svc.grpcPort }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
          {{- end }}
          {{- if $svc.httpPort }}
          readinessProbe:
            httpGet:
              path: {{ default (default "/health" $svc.probePath) $svc.readinessPath }}
              port: {{ $svc.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              # livenessPath resolves independently of readinessPath, so a
              # service points liveness at a WORKER-health-only endpoint (a dead
              # or wedged consumer restarts the pod) that is distinct from the
              # readiness endpoint (which also includes dependency probes, so a
              # Redis/Postgres outage stops traffic WITHOUT restarting a pod
              # whose consumers are already retrying). This split closes the gap
              # that let five services sit at 1/1 Running with dead consumers
              # during the Redis blip, without letting a dependency outage turn
              # into CrashLoopBackOff. Falls back to probePath then /health.
              path: {{ default (default "/health" $svc.probePath) $svc.livenessPath }}
              port: {{ $svc.httpPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          {{- else }}
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml (default $.Values.defaultResources $svc.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with $svc.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if $svc.volumes }}
        {{- if eq $svc.name "state" }}
        {{- range $volume := $svc.volumes }}
        - name: {{ $volume.name }}
          configMap:
            name: {{ default (include "continuo.schedulesConfigMapName" $) $volume.configMap.name }}
        {{- end }}
        {{- else if eq $svc.name "ui" }}
        {{- range $volume := $svc.volumes }}
        - name: {{ $volume.name }}
          configMap:
            name: {{ default (include "continuo.cancelConfigMapName" $) $volume.configMap.name }}
        {{- end }}
        {{- else if eq $svc.name "agent-remediation" }}
        {{- range $volume := $svc.volumes }}
        - name: {{ $volume.name }}
          configMap:
            name: {{ default (include "continuo.serviceReposConfigMapName" $) $volume.configMap.name }}
        {{- end }}
        {{- else if eq $svc.name "executor-controller" }}
        {{- range $volume := $svc.volumes }}
        - name: {{ $volume.name }}
          configMap:
            name: {{ default (include "continuo.dbtCommandsConfigMapName" $) $volume.configMap.name }}
        {{- end }}
        {{- else }}
        {{- toYaml $svc.volumes | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
