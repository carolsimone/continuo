{{- /*
  The chart-managed ConfigMap each service mounts through its `volumes`
  entries, keyed by service name. A volume whose configMap.name is empty
  mounts the ConfigMap the `name` helper names. The services that read the
  mounted file only at startup also set `checksum` and `template`: their pod
  template carries `checksum/<checksum>`, the digest of the ConfigMap that
  `template` renders, so `helm upgrade` rolls them when the file changes. The
  ui re-reads cancel-config.json on every request from a directory mount the
  kubelet keeps current, so it carries no digest and an edit reaches it without
  a restart.
*/ -}}
{{- $mountedConfigMaps := dict
      "execution-controller" (dict "name" "continuo.dbtCommandsConfigMapName" "checksum" "dbt-commands" "template" "dbt-commands-configmap.yaml")
      "agent-remediation" (dict "name" "continuo.serviceReposConfigMapName" "checksum" "service-repos" "template" "service-repos-configmap.yaml")
      "ui" (dict "name" "continuo.cancelConfigMapName") }}
{{- include "continuo.credentials.assertFiles" $ }}
{{- range $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $servesMetrics := has $svc.name (include "continuo.metrics.services" $ | fromJsonArray) }}
{{- $mounted := default (dict) (get $mountedConfigMaps $svc.name) }}
{{- $isAgent := has $svc.name (list "agent-chat" "agent-remediation") }}
{{- if $isAgent }}{{ include "continuo.agent.assertEnv" (dict "root" $ "svc" $svc) }}{{ end }}
{{- /* How this service's credentials reach it ("continuo.credentialSource"):
       $fileDelivery when it reads them as files projected from their Secrets,
       $companyFiles the credentials.files entries the company provides, and
       $projection the sources of the continuo-credentials volume. */}}
{{- $fileDelivery := eq (include "continuo.credentialDelivery" (dict "root" $ "svc" $svc)) "file" }}
{{- $companyFiles := get (include "continuo.credentialFiles" $ | fromJson) $svc.name | default dict }}
{{- $projection := include "continuo.credentialProjection" (dict "root" $ "svc" $svc) | trim }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  {{- if or (eq $svc.name "execution-controller") $fileDelivery $companyFiles }}
  annotations:
    # kube-linter flags every variable whose name contains SECRET and that has
    # a value. VALIDATION_WAREHOUSE_SECRET holds the NAME of a Secret, and a
    # <VAR>_FILE variable the path of a credential file; no credential value
    # is ever in a container's environment.
    ignore-check.kube-linter.io/env-var-secret: "values are Secret names and credential file paths, not secrets"
  {{- end }}
  labels:
    {{- include "continuo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
spec:
  replicas: {{ dig "replicas" 1 $svc }}
  {{- if eq $svc.name "run-controller" }}
  # Every run-controller pod consumes the task status group and dispatches what a
  # success unblocks, so a pod of the previous release must be gone before the
  # new one consumes: an old pod would record the success of a run the new pod
  # planned without dispatching its downstream tasks.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "continuo.selectorLabels" (dict "root" $ "service" $svc.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Every service reads the shared ConfigMap through envFrom, and
        # Kubernetes never refreshes environment variables in a running pod when
        # that ConfigMap changes. Without this checksum, `helm upgrade` with a
        # different REDIS_HOST, S3_BUCKET, LOG_LEVEL or WAREHOUSE_ENGINE renders
        # an identical Deployment, so nothing rolls and every pod keeps serving
        # the previous configuration indefinitely. The engine case is the one
        # that corrupts output rather than merely going stale: execution-
        # controller rolls on an engine change because its validation image ref
        # changes, so topology-controller would keep uploading the old engine's
        # SQL to the new engine's validator.
        #
        # The ConfigMap holds only values derived deterministically from
        # values.yaml — generated credentials live in Secrets — so this digest is
        # stable across upgrades that change nothing, and an unchanged install
        # does not roll.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if eq $svc.name "ui" }}
        # The ui reads its CI bindings once at boot; a changed binding must roll it.
        checksum/ci-auth: {{ include "continuo.ciAuth.json" $ | sha256sum }}
        {{- end }}
        {{- if and $servesMetrics (eq (include "continuo.metrics.podAnnotations" $) "true") }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ include "continuo.metrics.port" $ | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- if $mounted.template }}
        {{- $chartManaged := false }}
        {{- range $volume := $svc.volumes }}
        {{- if and (hasKey $volume "configMap") (not (dig "configMap" "name" "" $volume)) }}{{ $chartManaged = true }}{{ end }}
        {{- end }}
        {{- if $chartManaged }}
        # The service reads its mounted file only at startup; a changed file
        # must roll it. A volume naming an operator-owned ConfigMap is not
        # hashed: Helm cannot read it, so an edit to it needs
        # `kubectl rollout restart`.
        checksum/{{ $mounted.checksum }}: {{ include (print $.Template.BasePath "/" $mounted.template) $ | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with $svc.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "continuo.selectorLabels" (dict "root" $ "service" $svc.name) | nindent 8 }}
    spec:
      # Bounds how long the kubelet waits after SIGTERM before SIGKILLing the
      # container. Must stay comfortably above the app's own SHUTDOWN_GRACE
      # (pkg/lifecycle's env-configured shutdown budget, default 15s / 10s for
      # agent-chat): if this is tighter than SHUTDOWN_GRACE, Kubernetes can
      # SIGKILL mid-teardown before the app's own bounded sequence finishes.
      terminationGracePeriodSeconds: {{ $.Values.global.terminationGracePeriodSeconds }}
      serviceAccountName: {{ $svc.name }}
      securityContext:
        {{- include "continuo.podSecurityContext" $ | nindent 8 }}
        {{- if eq $svc.name "ui" }}
        runAsUser: 1000
        runAsGroup: 1000
        {{- else }}
        runAsUser: 65532
        runAsGroup: 65532
        {{- end }}
      {{- $needsMigrations := and $.Values.postgresql.enabled $svc.env $svc.env.POSTGRES_DB }}
      {{- $needsRedis := and $.Values.redis.enabled (has $svc.name (include "continuo.redis.clientServices" $ | fromJsonArray)) }}
      {{- if or $needsMigrations $needsRedis }}
      initContainers:
        {{- if $needsRedis }}
        # Bundled mode: Redis is a StatefulSet with no ordering guarantee against
        # these Deployments, so every service that connects to Redis waits here
        # until it answers PING (continuo.redis.clientServices names them). The
        # services also wait for Redis in code, which covers BYO installs and
        # docker-compose; this gate keeps a cold bundled install from logging a
        # retry per service while Redis is still being scheduled. BYO installs
        # point at Redis that is already running and render nothing.
        - name: wait-for-redis
          image: "{{ $.Values.redis.image.repository }}:{{ $.Values.redis.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "continuo.containerSecurityContext" $ | nindent 12 }}
          {{- $redisPerService := eq (include "continuo.redis.mode" $) "perService" }}
          {{- $redisAuth := dict "root" $ "svc" $svc "name" "REDIS_PASSWORD" "ref" (ternary "redisLogin" "redis" $redisPerService) "as" "REDISCLI_AUTH" }}
          env:
            {{- with include "continuo.credentialEnv" $redisAuth | trim }}{{ . | nindent 12 }}{{ end }}
            {{- if $redisPerService }}
            - name: REDIS_USERNAME
              value: {{ (include "continuo.redis.login" (dict "root" $ "svc" $svc.name) | fromJson).username | quote }}
            {{- end }}
            - name: REDIS_HOST
              value: {{ include "continuo.redis.host" $ | quote }}
            - name: REDIS_PORT
              value: {{ include "continuo.redis.port" $ | quote }}
          {{- with include "continuo.credentialInitMounts" $redisAuth | trim }}{{ . | nindent 10 }}{{ end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # In file delivery the password is in the file REDISCLI_AUTH_FILE
              # names; redis-cli reads it from REDISCLI_AUTH.
              {{- include "continuo.readCredentialShell" $ | nindent 14 }}
              if [ -n "${REDISCLI_AUTH_FILE:-}" ]; then
                read_credential "$REDISCLI_AUTH_FILE"
                REDISCLI_AUTH="$credential"; export REDISCLI_AUTH
              fi
              tries=0
              # Signs in as the service's own login when it has one, so a
              # wrong password stops the pod here.
              set -- -h "$REDIS_HOST" -p "$REDIS_PORT"
              if [ -n "${REDIS_USERNAME:-}" ]; then set -- "$@" --user "$REDIS_USERNAME"; fi
              until [ "$(redis-cli "$@" ping 2>/dev/null)" = "PONG" ]; do
                tries=$((tries+1))
                if [ "$tries" -gt 100 ]; then
                  echo "FATAL: Redis at ${REDIS_HOST}:${REDIS_PORT} never became ready after $((100*3))s" >&2
                  exit 1
                fi
                echo "waiting for redis ($tries)..."; sleep 3
              done
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
        {{- end }}
        {{- if $needsMigrations }}
        # Bundled mode: the migration Job is a regular resource (hooks would
        # deadlock — see db-init-migrate-job.yaml), so Postgres-backed services
        # gate on Flyway having initialized their database. BYO installs keep
        # the pre-install hook and render no initContainer.
        - name: wait-for-migrations
          image: {{ include "continuo.image" (dict "root" $ "name" "migrations") | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "continuo.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: PGHOST
              value: {{ include "continuo.postgresql.host" $ | quote }}
            - name: PGPORT
              value: {{ include "continuo.postgresql.port" $ | quote }}
            - name: PGUSER
              value: {{ (include "continuo.postgres.login" (dict "root" $ "svc" $svc.name) | fromJson).username | quote }}
            {{- $pgPassword := dict "root" $ "svc" $svc "name" "POSTGRES_PASSWORD" "ref" "postgresLogin" "as" "PGPASSWORD" }}
            {{- with include "continuo.credentialEnv" $pgPassword | trim }}{{ . | nindent 12 }}{{ end }}
            - name: PGDATABASE
              value: {{ $svc.env.POSTGRES_DB | quote }}
          {{- with include "continuo.credentialInitMounts" $pgPassword | trim }}{{ . | nindent 10 }}{{ end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # In file delivery the password is in the file PGPASSWORD_FILE
              # names; psql reads it from PGPASSWORD.
              {{- include "continuo.readCredentialShell" $ | nindent 14 }}
              if [ -n "${PGPASSWORD_FILE:-}" ]; then
                read_credential "$PGPASSWORD_FILE"
                PGPASSWORD="$credential"; export PGPASSWORD
              fi
              tries=0
              # Signs in as the service's own login, so a wrong password stops
              # the pod here. Probes through the always-present maintenance
              # database, then the service's own, using queries that cannot
              # fail server-side: connecting to a database the login may not
              # connect to yet, or selecting from a table that does not exist
              # yet, would log a FATAL/ERROR on Postgres for every iteration.
              # The migrate Job grants the login SELECT on
              # flyway_schema_history after Flyway, so holding it means the
              # database is migrated and the grants are in place.
              migrated() {
                [ "$(PGDATABASE=postgres psql -XAtqc "SELECT has_database_privilege(current_user, datname, 'CONNECT') FROM pg_database WHERE datname = '${PGDATABASE}'" 2>/dev/null)" = "t" ] || return 1
                [ "$(psql -XAtqc "SELECT to_regclass('public.flyway_schema_history') IS NOT NULL AND has_table_privilege(current_user, 'public.flyway_schema_history', 'SELECT')" 2>/dev/null)" = "t" ] || return 1
                [ "$(psql -XAtqc "SELECT 1 FROM public.flyway_schema_history LIMIT 1" 2>/dev/null)" = "1" ]
              }
              until migrated; do
                tries=$((tries+1))
                if [ "$tries" -gt 200 ]; then
                  echo "FATAL: migrations never completed for ${PGDATABASE} after $((200*3))s — check the db-init-migrate Job" >&2
                  exit 1
                fi
                echo "waiting for migrations on ${PGDATABASE} ($tries)..."; sleep 3
              done
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ default (include "continuo.image" (dict "root" $ "name" $svc.name)) $svc.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "continuo.containerSecurityContext" $ | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "continuo.configMapName" $ }}
          {{- $needsS3 := has $svc.name (include "continuo.s3.credentialServices" $ | fromJsonArray) }}
          {{- $needsPostgres := hasKey (include "continuo.postgres.serviceDatabases" $ | fromJson) $svc.name }}
          {{- $needsRedisLogin := and (has $svc.name (include "continuo.redis.clientServices" $ | fromJsonArray)) (eq (include "continuo.redis.mode" $) "perService") }}
          {{- if or $svc.secretEnv $svc.env $needsS3 $needsPostgres $needsRedisLogin (eq $svc.name "ui") $isAgent $companyFiles }}
          env:
            {{- /*
              Services that read or write object storage get their S3 credentials
              from here rather than from their `secretEnv` entry. `services` is a
              list, and Helm replaces lists wholesale, so an operator upgrading
              with their own copy of values.yaml keeps an older entry — which
              would silently drop these refs and leave the service authenticating
              with nothing. Injecting them from the template makes the credentials
              independent of that replaceable list.
            */}}
            {{- /*
              The same holds for the Postgres login: a service that keeps a
              continuo database signs in as its own login
              (credentials.postgres), whatever its `secretEnv` entry says.
              POSTGRES_USER here wins over the shared ConfigMap's, which names
              the migration login.

              Every credential goes through "continuo.credentialEnv", which
              renders it as the service's delivery asks: a secretKeyRef
              variable, a <VAR>_FILE naming its projected file, or a
              <VAR>_FILE naming a company-provided file.
            */}}
            {{- if $needsPostgres }}
            - name: POSTGRES_USER
              value: {{ (include "continuo.postgres.login" (dict "root" $ "svc" $svc.name) | fromJson).username | quote }}
            {{- end }}
            {{- if $needsRedisLogin }}
            - name: REDIS_USERNAME
              value: {{ (include "continuo.redis.login" (dict "root" $ "svc" $svc.name) | fromJson).username | quote }}
            {{- end }}
            {{- range $c := (include "continuo.credentialList" (dict "root" $ "svc" $svc) | fromJsonArray) }}
            {{- with include "continuo.credentialEnv" (dict "root" $ "svc" $svc "name" $c.name "ref" $c.ref) | trim }}{{ . | nindent 12 }}{{ end }}
            {{- end }}
            {{- if eq $svc.name "ui" }}
            {{- /* Injected here rather than through the ui's `services` entry so
                   an overridden or reused `services` list cannot drop CI auth;
                   the file is the ci-auth ConfigMap mounted below. */}}
            - name: CI_AUTH_CONFIG_PATH
              value: /app/ci-auth/ci-auth.json
            {{- end }}
            {{- if $isAgent }}
            {{- with include "continuo.agent.env" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- /* A company file reaches the service even when its entry does
                   not list the credential. */}}
            {{- range $name := (include "continuo.credentialExtraFiles" (dict "root" $ "svc" $svc) | fromJsonArray) }}
            - name: {{ printf "%s_FILE" $name }}
              value: {{ get $companyFiles $name | quote }}
            {{- end }}
          {{- if $svc.env }}
            {{- /* The logins above are the service's POSTGRES_USER and
                   REDIS_USERNAME; an env entry of either name is left out
                   rather than set twice. */}}
            {{- $ownEnv := $svc.env | default dict }}
            {{- if $needsPostgres }}{{ $ownEnv = omit $ownEnv "POSTGRES_USER" }}{{ end }}
            {{- if $needsRedisLogin }}{{ $ownEnv = omit $ownEnv "REDIS_USERNAME" }}{{ end }}
            {{- range $key, $val := $ownEnv }}
            - name: {{ $key }}
              {{- if and (eq $key "K8S_NAMESPACE") (eq $val "__RELEASE_NAMESPACE__") }}
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
              {{- else if eq $val "__REDIS_URL__" }}
              value: {{ include "continuo.redis.url" $ | quote }}
              {{- else if eq $val "__DEAD_LETTER_CONTROLLER_ADDR__" }}
              value: {{ $.Values.global.deadLetterControllerGrpcAddr | quote }}
              {{- else if eq $val "__RELEASE_CONTROLLER_ADDR__" }}
              value: {{ $.Values.global.releaseControllerGrpcAddr | quote }}
              {{- else if eq $val "__DOCKERHUB_USERNAME__" }}
              value: {{ $.Values.global.teamImagePrefix | quote }}
              {{- else if eq $val "__VALIDATION_IMAGE__" }}
              value: {{ include "continuo.validation.image" $ | quote }}
              {{- else if eq $val "__VALIDATION_WAREHOUSE_SECRET__" }}
              value: {{ include "continuo.validation.warehouseSecretName" $ | quote }}
              {{- else if eq $val "__S3_SIDECAR_IMAGE__" }}
              value: {{ include "continuo.image" (dict "root" $ "name" "s3-sidecar") | quote }}
              {{- else if eq $val "__AUTH_ISSUER_URL__" }}
              value: {{ include "continuo.auth.issuerUrl" $ | quote }}
              {{- else if eq $val "__AUTH_CLIENT_ID__" }}
              value: {{ include "continuo.auth.clientId" $ | quote }}
              {{- else if eq $val "__AUTH_PUBLIC_URL__" }}
              value: {{ $.Values.auth.publicUrl | quote }}
              {{- else if eq $val "__AUTH_OPERATOR_EMAILS__" }}
              value: {{ include "continuo.auth.operatorEmails" $ | quote }}
              {{- else if eq $val "__AUTH_VIEWER_EMAILS__" }}
              value: {{ $.Values.auth.viewerEmails | quote }}
              {{- else if eq $val "__AUTH_ROLE_MAPPING__" }}
              value: {{ $.Values.auth.roleMapping | quote }}
              {{- else if eq $val "__GITHUB_APP_ID__" }}
              value: {{ $.Values.github.appId | default "" | quote }}
              {{- else if eq $val "__GITHUB_APP_INSTALLATION_ID__" }}
              value: {{ $.Values.github.installationId | default "" | quote }}
              {{- else if eq $val "__LLM_PROVIDER__" }}
              value: {{ $.Values.llm.provider | quote }}
              {{- else if eq $val "__LLM_MODEL__" }}
              value: {{ $.Values.llm.model | quote }}
              {{- else }}
              value: {{ $val | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if or $svc.httpPort $svc.grpcPort $servesMetrics }}
          ports:
            {{- if $svc.httpPort }}
            - name: http
              containerPort: {{ $svc.httpPort }}
            {{- end }}
            {{- if $svc.grpcPort }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
            {{- if $servesMetrics }}
            - name: metrics
              containerPort: {{ include "continuo.metrics.port" $ }}
            {{- end }}
          {{- end }}
          {{- if $svc.httpPort }}
          {{- $fastReady := eq $svc.name "run-controller" }}
          {{- if $fastReady }}
          # This pod rolls with Recreate, so no pod serves its gRPC port until this
          # one is Ready and every read of a run fails meanwhile. The startup probe
          # checks readiness every second, so the pod turns Ready as soon as it can
          # serve. Its 6 minutes outlast each of the process's own 5-minute waits, for
          # Postgres and for Redis: running out of failures restarts the container.
          startupProbe:
            httpGet:
              path: {{ default (default "/health" $svc.probePath) $svc.readinessPath }}
              port: {{ $svc.httpPort }}
            periodSeconds: 1
            failureThreshold: 360
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ default (default "/health" $svc.probePath) $svc.readinessPath }}
              port: {{ $svc.httpPort }}
            initialDelaySeconds: {{ if $fastReady }}0{{ else }}10{{ end }}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              # livenessPath resolves independently of readinessPath, so a
              # service points liveness at a WORKER-health-only endpoint (a dead
              # or wedged consumer restarts the pod) that is distinct from the
              # readiness endpoint (which also includes dependency probes, so a
              # Redis/Postgres outage stops traffic WITHOUT restarting a pod
              # whose consumers are already retrying). This split closes the gap
              # that let five services sit at 1/1 Running with dead consumers
              # during the Redis blip, without letting a dependency outage turn
              # into CrashLoopBackOff. Falls back to probePath then /health.
              path: {{ default (default "/health" $svc.probePath) $svc.livenessPath }}
              port: {{ $svc.httpPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          {{- else if $svc.grpcPort }}
          # No service registers the gRPC health service and the Go images carry
          # no Python, so a gRPC-only entry is probed by a TCP connect to its
          # gRPC port, which the kubelet makes without any binary in the image.
          readinessProbe:
            tcpSocket:
              port: {{ $svc.grpcPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: {{ $svc.grpcPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          {{- else }}
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml (default $.Values.defaultResources $svc.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with $svc.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq $svc.name "ui" }}
            - name: ci-auth
              mountPath: /app/ci-auth
              readOnly: true
          {{- end }}
          {{- if $projection }}
            - name: continuo-credentials
              mountPath: {{ include "continuo.credentialDir" $ }}
              readOnly: true
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if eq $svc.name "ui" }}
        - name: ci-auth
          configMap:
            name: {{ include "continuo.ciAuthConfigMapName" $ }}
      {{- end }}
      {{- if $projection }}
        {{- /* The Secret keys the pod reads as credential files, one file per
               variable, named after it ("continuo.credentialProjection"). */}}
        - name: continuo-credentials
          projected:
            sources:
              {{- $projection | nindent 14 }}
      {{- end }}
      {{- if $svc.volumes }}
        {{- /* Volumes of any type render as given. A configMap volume with an
               empty name mounts the chart's ConfigMap for this service; a
               service the chart mounts no ConfigMap into has nothing to fall
               back to, and the API server would refuse the Deployment. */}}
        {{- $volumes := list }}
        {{- range $volume := $svc.volumes }}
        {{- $volume = deepCopy $volume }}
        {{- if and (hasKey $volume "configMap") (not (dig "configMap" "name" "" $volume)) }}
        {{- if not $mounted.name }}
        {{- fail (printf "services[%s].volumes[%s]: configMap.name is empty, but the chart mounts no ConfigMap of its own into %s; name a ConfigMap you own, or remove the volume and its volumeMounts entry" $svc.name $volume.name $svc.name) }}
        {{- end }}
        {{- $_ := set $volume "configMap" (dict "name" (include $mounted.name $)) }}
        {{- end }}
        {{- $volumes = append $volumes $volume }}
        {{- end }}
        {{- toYaml $volumes | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
