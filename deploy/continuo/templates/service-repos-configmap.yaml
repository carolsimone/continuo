apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "continuo.serviceReposConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
data:
  # The shipped files/service_repos.yaml is the default map; .Values.serviceRepos
  # is merged over it (a value entry adds a service or overrides a default one),
  # so an operator can map their own service names — e.g. a monorepo's
  # continuo-core: services/continuo-core — without editing the chart. Comments in
  # the default file are not carried into the rendered map; the file stays their
  # documented home.
  service_repos.yaml: |
    {{- $file := .Files.Get "files/service_repos.yaml" | fromYaml -}}
    {{- $services := merge (deepCopy (default (dict) .Values.serviceRepos)) (default (dict) $file.services) -}}
    {{- dict "services" $services | toYaml | nindent 4 }}
