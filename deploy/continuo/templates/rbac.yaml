{{- /*
  Every enabled service runs under a ServiceAccount named after it, carrying
  its serviceAccount.annotations (e.g. a cloud IAM role, or the identity a
  Vault role is bound to). Only a service with rbac.enabled gets a Role and
  RoleBinding; every other ServiceAccount holds no Kubernetes permission.
*/ -}}
{{- range $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "continuo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
  {{- with dig "annotations" dict ($svc.serviceAccount | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if and $svc.rbac $svc.rbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "continuo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
rules:
  {{- toYaml ($svc.rbac.rules | default (list)) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "continuo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $svc.name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $svc.name }}
{{- end }}
{{- end }}
{{- end }}
