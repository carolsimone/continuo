{{- if .Values.networkPolicy.enabled }}
{{- $instance := .Release.Name }}
# Default-deny ingress for every pod in the release; the documents below
# re-open exactly the edges the service graph needs. Egress stays open
# (DNS, the Kubernetes API, external datastores, GitHub/Anthropic).
# In-cluster encryption in transit is a service mesh's job — this chart is
# mesh-compatible and enforces reachability only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: postgresql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [state, orchestrator, executor-controller, k8s-controller,
                         release-controller, remediation, remediation-agent,
                         agent-runner, db-init-migrate]
        - podSelector:
            matchLabels:
              app: dbt-job
        # Candidate-schema lifecycle Jobs (executor-scheduled engine-image pods
        # running ensure_schema/drop_schema) carry app=continuo-schema-op — never
        # app=dbt-job — and must reach the warehouse to run their DDL.
        - podSelector:
            matchLabels:
              app: continuo-schema-op
      ports:
        - port: 5432
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [state, orchestrator, executor-controller, k8s-controller,
                         release-controller, remediation, remediation-agent,
                         agent-runner, manifest-controller, ui, stream-reaper]
      ports:
        - port: 6379
{{- end }}
{{- if .Values.neo4j.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-neo4j
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: neo4j
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
              app.kubernetes.io/name: orchestrator
      ports:
        - port: 7687
{{- end }}
{{- if .Values.minio.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [executor-controller, k8s-controller, release-controller,
                         remediation, remediation-agent, ui,
                         manifest-controller, orchestrator, minio-bucket-init]
        - podSelector:
            matchLabels:
              app: dbt-job
      ports:
        - port: 9000
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-grpc-http-backends
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: state
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [orchestrator, k8s-controller, agent-runner, ui]
      ports:
        - port: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-orchestrator-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: orchestrator
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [ui, agent-runner, remediation-agent]
      ports:
        - port: 50052
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-ui-upstreams
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [agent-runner, remediation-agent, release-controller]
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
              app.kubernetes.io/name: ui
      ports:
        - port: 50053
        - port: 50054
        - port: 8088
---
# Front door: ui accepts traffic from any source (ingress controller
# namespaces vary per cluster; authentication is enforced in the app itself).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: ui
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8090
{{- if .Values.dex.enabled }}
---
# IdP endpoints are public by nature; the browser reaches dex via
# port-forward or ingress depending on the install.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-dex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: dex
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 5556
{{- end }}
{{- end }}
