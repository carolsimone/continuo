{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-grpc-http-backends
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: state
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [orchestrator, k8s-controller, agent-chat, ui]
      ports:
        - port: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-orchestrator-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: orchestrator
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [ui, agent-chat, agent-remediation]
      ports:
        - port: 50052
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-ui-upstreams
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [agent-chat, agent-remediation, release-controller]
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
              app.kubernetes.io/name: ui
      ports:
        - port: 50053
        - port: 50054
        - port: 8088
---
# Front door: ui accepts traffic from any source (ingress controller
# namespaces vary per cluster; authentication is enforced in the app itself).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: ui
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8090
{{- if .Values.ingress.enabled }}
---
# cert-manager HTTP-01 solver pods answer ACME challenges for the ingress
# certificate. They appear ad hoc in this namespace during issuance and are
# reached through the ingress controller, so default-deny would block the
# challenge and issuance would time out. Selects only pods carrying
# cert-manager's solver label — inert on installs that terminate TLS
# elsewhere or bring their own certificate Secret.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-acme-solver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicy: >-
      cert-manager creates the HTTP-01 solver pods ad hoc during ACME
      challenges; no chart workload carries this label by design.
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8089
{{- end }}
{{- if .Values.dex.enabled }}
---
# IdP endpoints are public by nature; the browser reaches dex via
# port-forward or ingress depending on the install.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-dex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: dex
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 5556
{{- end }}
{{- end }}
