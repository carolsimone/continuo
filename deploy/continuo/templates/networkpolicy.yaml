{{- end }}
{{- if .Values.minio.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $instance }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [executor-controller, k8s-controller, release-controller,
                         remediation, agent-remediation, ui,
                         topology-controller, orchestrator, minio-bucket-init]
        - podSelector:
            matchLabels:
              app: dbt-job
      ports:
