{{- if .Values.networkPolicy.enabled }}
{{- $instance := .Release.Name }}
# Default-deny ingress for every pod in the release; the documents below
# re-open exactly the edges the service graph needs. Egress stays open
# (DNS, the Kubernetes API, external datastores, GitHub/Anthropic).
# In-cluster encryption in transit is a service mesh's job — this chart is
# mesh-compatible and enforces reachability only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: postgresql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [state, orchestrator, executor-controller, k8s-controller,
                         release-controller, remediation, remediation-agent,
                         agent-runner, db-init-migrate]
        - podSelector:
            matchLabels:
              app: dbt-job
        # A worker pod runs dbt against the warehouse itself, exactly as a
        # dbt-job pod does; only the pod's lifetime differs.
        - podSelector:
            matchLabels:
              app: continuo-dbt-worker
      ports:
        - port: 5432
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [state, orchestrator, executor-controller, k8s-controller,
                         release-controller, remediation, remediation-agent,
                         agent-runner, manifest-controller, ui-service, stream-reaper]
      ports:
        - port: 6379
{{- end }}
{{- if .Values.neo4j.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-neo4j
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: neo4j
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orchestrator
      ports:
        - port: 7687
{{- end }}
{{- if .Values.minio.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [executor-controller, k8s-controller, release-controller,
                         remediation, remediation-agent, ui-service,
                         manifest-controller, minio-bucket-init]
        - podSelector:
            matchLabels:
              app: dbt-job
        # A worker pod holds no object-store credential, but it does the reads
        # and writes itself: it fetches its runtime artifact and uploads each
        # task's log and run results through URLs the executor signs.
        - podSelector:
            matchLabels:
              app: continuo-dbt-worker
      ports:
        - port: 9000
{{- end }}
---
# The executor's internal worker API. It is the only edge into
# executor-controller: every other service reaches it through Redis, and the
# transport is pull-only, so a worker pod calls in and is never called back.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-executor-worker-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: executor-controller
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: continuo-dbt-worker
      ports:
        - port: 8084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-grpc-http-backends
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: state
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [orchestrator, k8s-controller, agent-runner, ui-service]
      ports:
        - port: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-orchestrator-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: orchestrator
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [ui-service, agent-runner, remediation-agent]
      ports:
        - port: 50052
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-ui-upstreams
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [agent-runner, remediation-agent, release-controller]
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ui-service
      ports:
        - port: 50053
        - port: 50054
        - port: 8088
---
# Front door: ui-service accepts traffic from any source (ingress controller
# namespaces vary per cluster; authentication is enforced in the app itself).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-ui-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: ui-service
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8090
{{- if .Values.dex.enabled }}
---
# IdP endpoints are public by nature; the browser reaches dex via
# port-forward or ingress depending on the install.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuo.fullname" . }}-allow-dex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $instance }}
      app.kubernetes.io/name: dex
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 5556
{{- end }}
{{- end }}
