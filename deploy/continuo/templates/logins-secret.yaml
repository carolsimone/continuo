{{- /* The passwords of the bundled datastores' logins, generated once and kept
     across upgrades:
       postgres-<service>  each service's Postgres login, which the migrate
                           Job creates (a login given an existingSecret reads
                           that instead);
       redis-<name>        each Redis login of perService mode, streams-init's
                           among them.
     The bundled Redis's ACL file is rendered here too, from the same
     passwords, so its hashes always match them. */}}
{{- $redisLogins := and .Values.redis.enabled (eq (include "continuo.redis.mode" .) "perService") }}
{{- if or .Values.postgresql.enabled $redisLogins }}
{{- $name := include "continuo.loginsSecretName" . }}
{{- $redisPasswords := dict }}
{{- if $redisLogins }}
{{- range $login := (include "continuo.redis.loginNames" . | fromJsonArray) }}
{{- $_ := set $redisPasswords $login (include "continuo.generatedSecret" (dict "root" $ "secretName" $name "key" (printf "redis-%s" $login))) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- range $svc, $_ := (include "continuo.postgres.serviceDatabases" . | fromJson) }}
  {{ printf "postgres-%s" $svc }}: {{ include "continuo.generatedSecret" (dict "root" $ "secretName" $name "key" (printf "postgres-%s" $svc)) | quote }}
  {{- end }}
  {{- end }}
  {{- range $login, $pw := $redisPasswords }}
  {{ printf "redis-%s" $login }}: {{ $pw | quote }}
  {{- end }}
{{- if $redisLogins }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.redis.aclSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
type: Opaque
stringData:
  users.acl: |
    {{- include "continuo.redis.aclFile" (dict "root" $ "passwords" $redisPasswords) | nindent 4 }}
{{- end }}
{{- end }}
