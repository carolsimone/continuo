{{- if .Values.minio.enabled }}
# Quickstart object store so the install needs zero external accounts.
# Production installs set minio.enabled=false and point s3.* at a real
# S3-compatible endpoint.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "continuo.minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "minio entrypoint writes a pidfile and runtime config at startup"
spec:
  serviceName: {{ include "continuo.minio.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "continuo.selectorLabels" (dict "root" $ "service" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "continuo.selectorLabels" (dict "root" $ "service" "minio") | nindent 8 }}
    spec:
      securityContext:
        {{- include "continuo.podSecurityContext" . | nindent 8 }}
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: IfNotPresent
          # This image runs env-driven (no "server /data" args); its entrypoint
          # writes a pidfile and runtime config under the root filesystem, so —
          # like neo4j — it keeps the other hardening but not readOnlyRootFilesystem.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "s3AccessKeyId") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "s3AccessKeyId") | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "s3SecretAccessKey") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "s3SecretAccessKey") | quote }}
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (default .Values.global.storageClass .Values.minio.persistence.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
{{- end }}
