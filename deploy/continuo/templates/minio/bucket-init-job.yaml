{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Discriminator reserved against the chart fullname (not minio.fullname),
  # so this Job's name never collides with db-init-migrate's under a long
  # release name — see continuo.jobName in _helpers.tpl.
  name: {{ include "continuo.jobName" (dict "root" . "discriminator" "-minio-bucket-init" "revisioned" true) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio-bucket-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "continuo.selectorLabels" (dict "root" $ "service" "minio-bucket-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "continuo.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mc
          image: "{{ .Values.minio.mcImage.repository }}:{{ .Values.minio.mcImage.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "continuo.containerSecurityContext" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "s3AccessKeyId") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "s3AccessKeyId") | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuo.secretName" (dict "root" $ "ref" "s3SecretAccessKey") | quote }}
                  key: {{ include "continuo.secretKey" (dict "root" $ "ref" "s3SecretAccessKey") | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local "http://{{ include "continuo.minio.fullname" . }}:9000" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing "local/{{ .Values.minio.bucket }}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
