{{- if .Values.dex.enabled }}
{{- $clientSecret := include "continuo.generatedSecret" (dict "root" $ "secretName" (include "continuo.dex.fullname" .) "key" "client-secret") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.dex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: dex
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
  # Full dex config lives in the Secret because it embeds the client secret.
  config.yaml: |
    {{- include "continuo.dex.config" (dict "root" . "clientSecret" $clientSecret) | nindent 4 }}
{{- end }}
