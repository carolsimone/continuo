{{- if .Values.dex.enabled }}
{{- $clientSecret := include "continuo.generatedSecret" (dict "root" $ "secretName" (include "continuo.dex.fullname" .) "key" "client-secret") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.dex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: dex
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
  # Full dex config lives in the Secret because it embeds the client secret.
  config.yaml: |
    issuer: {{ include "continuo.auth.issuerUrl" . }}
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: continuo-ui
        name: Continuo UI
        redirectURIs:
          - {{ printf "%s/auth/callback" (.Values.auth.publicUrl | trimSuffix "/") | quote }}
        secret: {{ $clientSecret | quote }}
    enablePasswordDB: true
    staticPasswords:
      - email: {{ .Values.dex.demoUser.email | quote }}
        hash: {{ .Values.dex.demoUser.passwordHash | quote }}
        username: {{ .Values.dex.demoUser.username | quote }}
        userID: {{ .Values.dex.demoUser.userID | quote }}
{{- end }}
