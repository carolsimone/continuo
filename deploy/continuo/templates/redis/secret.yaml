{{- if and .Values.redis.enabled (not .Values.redis.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
type: Opaque
stringData:
  password: {{ include "continuo.generatedSecret" (dict "root" $ "secretName" (include "continuo.redis.fullname" .) "key" "password") | quote }}
{{- end }}
