apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
  postgres-password: {{ required "set externalDatabase.password or externalDatabase.existingSecret when postgresql.enabled=false" .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) }}
  redis-password: {{ required "set externalRedis.password or externalRedis.existingSecret when redis.enabled=false" .Values.externalRedis.password | quote }}
  {{- end }}
  {{- if and (not .Values.neo4j.enabled) (not .Values.externalNeo4j.existingSecret) }}
  neo4j-password: {{ required "set externalNeo4j.password or externalNeo4j.existingSecret when neo4j.enabled=false" .Values.externalNeo4j.password | quote }}
  {{- end }}
  {{- if and (not .Values.minio.enabled) (not .Values.s3.existingSecret) }}
  s3-access-key-id: {{ required "set s3.accessKeyId or s3.existingSecret when minio.enabled=false" .Values.s3.accessKeyId | quote }}
  s3-secret-access-key: {{ required "set s3.secretKey or s3.existingSecret when minio.enabled=false" .Values.s3.secretKey | quote }}
  {{- end }}
  {{- if and (not .Values.dex.enabled) (not .Values.auth.existingSecret) }}
  auth-oidc-client-secret: {{ required "set auth.oidcClientSecret or auth.existingSecret when dex.enabled=false" .Values.auth.oidcClientSecret | quote }}
  {{- end }}
  {{- if not .Values.llm.existingSecret }}
  llm-api-key: {{ .Values.llm.apiKey | default "" | quote }}
  {{- end }}
  {{- if not .Values.github.existingSecret }}
  github-token: {{ .Values.github.token | default "" | quote }}
  github-app-private-key: {{ .Values.github.appPrivateKey | default "" | quote }}
  {{- end }}
