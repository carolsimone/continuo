{{- range $svc := .Values.services }}
{{- if and $svc.enabled (or $svc.httpPort $svc.grpcPort) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "continuo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
spec:
  type: {{ default "ClusterIP" $svc.serviceType }}
  selector:
    {{- include "continuo.selectorLabels" (dict "root" $ "service" $svc.name) | nindent 4 }}
  ports:
    {{- if $svc.httpPort }}
    - name: http
      port: {{ $svc.httpPort }}
      targetPort: {{ $svc.httpPort }}
    {{- end }}
    {{- if $svc.grpcPort }}
    - name: grpc
      port: {{ $svc.grpcPort }}
      targetPort: {{ $svc.grpcPort }}
    {{- end }}
{{- end }}
{{- end }}
