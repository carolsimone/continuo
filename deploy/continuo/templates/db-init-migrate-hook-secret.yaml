{{- /* The db-init-migrate Job only needs an inline (non-secretKeyRef)
     password in the exact case where it runs as a pre-install/pre-upgrade
     hook (postgresql.enabled=false) AND the postgres credential resolves to
     the chart's OWN generated credentials Secret (no externalDatabase.
     existingSecret) — that Secret is a regular resource Helm only creates
     AFTER hooks finish, so a secretKeyRef to it would deadlock the hook pod.
     Rather than writing the raw password into the Job/Pod spec as an env
     `value` (readable by anyone with get/list/watch on Jobs/Pods, no Secret
     permission required, and left behind for up to an hour on a failed
     hook), render a small Secret dedicated to this one case and reference it
     via secretKeyRef instead.

     This Secret must itself be a hook (hook-weight -10, strictly before the
     Job's -5) for the same reason a plain Secret doesn't work for the
     credentials Secret above: regular (non-hook) resources in a fresh
     install don't exist yet when pre-install hooks run, so the Job's
     secretKeyRef would have nothing to resolve against unless this Secret is
     created via the hook mechanism too, ahead of it.

     hook-delete-policy: before-hook-creation,hook-succeeded keeps it
     short-lived on purpose — swept immediately on the next install/upgrade
     attempt and right after this hook succeeds, so the raw password sits in
     the cluster only as long as the migration hook itself is running, not
     for the Job's full ttlSecondsAfterFinished backstop. */}}
{{- $isMigrateHook := not .Values.postgresql.enabled }}
{{- $usesChartCredentials := not .Values.externalDatabase.existingSecret }}
{{- if and $isMigrateHook $usesChartCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuo.migrateHookSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuo.labels" . | nindent 4 }}
    app.kubernetes.io/name: db-init-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  postgres-password: {{ required "set externalDatabase.password or externalDatabase.existingSecret when postgresql.enabled=false" .Values.externalDatabase.password | quote }}
{{- end }}
