# config/service_repos.yaml
# Maps a service name (orchestrator topology service_name; dbt or python) to its
# project root within that service's own repository. agent-remediation joins
# <repo_path> with an offending file's path to read the model's source from
# GitHub — the repo itself comes from the release/remediation trigger — so it can
# propose a fix. A service with no entry has its fix recorded as unverifiable and
# its compile/seed/duplicate-table proposals skipped.
#
# ⚠️  EXAMPLE DATA — NOT FOR PRODUCTION. Every entry below maps one of continuo's
#     own demo services (the continuo-demo-docs and continuo-core-finance-demo
#     walkthroughs). They ship only so those tutorials work out of the box. They
#     are inert for a real deployment — nothing references a service name you do
#     not run — but a name that collides with a service you DO run would pick up
#     the demo path. A production install should map its own services instead:
#     add them under the `serviceRepos` Helm value (a value entry adds a service
#     or overrides a same-named default here), then restart agent-remediation.
services:
  # continuo-demo-docs — docs/run-projects-in-continuo.md
  core: services/core
  finance: services/finance
  marketing: services/marketing
  service-py: services/service-py
  service-1: services/service-1
  service-2: services/service-2
  service-3: services/service-3
  # continuo-core-finance-demo — the airflow-to-continuo migration article
  continuo-core: services/continuo-core
  continuo-finance: services/continuo-finance
