syntax = "proto3";

package graph.v1;

option go_package = "github.com/carolsimone/continuo/graph/api/graph/v1;graphv1";

import "google/protobuf/timestamp.proto";

// GraphService manages table dependency graphs in Neo4j
service GraphService {
  // Node operations
  rpc CreateNode(CreateNodeRequest) returns (NodeResponse);
  rpc UpdateNodeTimestamp(UpdateNodeTimestampRequest) returns (NodeResponse);
  rpc GetStaleRootNodes(GetStaleRootNodesRequest) returns (GetStaleRootNodesResponse);

  // Dependency operations
  rpc GetDownstreamDependencies(GetDownstreamDependenciesRequest) returns (GetDownstreamDependenciesResponse);
  rpc CheckUpstreamFreshness(CheckUpstreamFreshnessRequest) returns (CheckUpstreamFreshnessResponse);

  rpc GetScheduleGraph(GetScheduleGraphRequest) returns (GetScheduleGraphResponse);
  rpc GetScheduleInitNodes(GetScheduleInitNodesRequest) returns (GetScheduleInitNodesResponse);

  rpc UpdateNodeStatus(UpdateNodeStatusRequest) returns (UpdateNodeStatusResponse);
  rpc GetReadyDownstream(GetReadyDownstreamRequest) returns (GetReadyDownstreamResponse);
  rpc CheckScheduleCompletion(CheckScheduleCompletionRequest) returns (CheckScheduleCompletionResponse);
  rpc SnapshotGraph(SnapshotGraphRequest) returns (SnapshotGraphResponse);
  rpc FinalizeRun(FinalizeRunRequest) returns (FinalizeRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRunGraph(GetRunGraphRequest) returns (GetRunGraphResponse);

  // GetTransitiveDownstream returns all reachable downstream nodes from the
  // given node that are not in SUCCEEDED status. Used by startup-controller
  // to determine the full reset scope for a re-run.
  rpc GetTransitiveDownstream(GetTransitiveDownstreamRequest) returns (GetTransitiveDownstreamResponse);
}

// ============================================================================
// ENUMS
// ============================================================================

enum Criticality {
  CRITICALITY_UNSPECIFIED = 0;
  CRITICALITY_REGULATORY = 1;
  CRITICALITY_CORE = 2;
  CRITICALITY_SECONDARY = 3;
}

// ============================================================================
// DOMAIN MESSAGES
// ============================================================================

message TableNode {
  string table_name = 1;
  string schema_name = 2;
  string service_name = 3;
  string owner = 4;
  string schedule_name = 5;
  Criticality criticality = 6;
  google.protobuf.Timestamp last_updated_at = 7;
  google.protobuf.Timestamp created_at = 8;
  string node_type = 9;  // dbt-model | dbt-seed | dbt-snapshot
  string status = 10;    // runtime graph status: PENDING, RUNNING, SUCCEEDED, FAILED, or empty
}

message Dependency {
  TableNode node = 1;
  int32 depth = 2;  // Distance from the starting node
}

// ============================================================================
// CREATE NODE REQUESTS/RESPONSES
// ============================================================================

message CreateNodeRequest {
  string table_name = 1;       // Required
  string schema_name = 2;      // Required
  string service_name = 3;     // Required
  string owner = 4;            // Required
  string schedule_name = 5;    // Required
  Criticality criticality = 6; // Required

  // Optional: upstream dependencies (creates DEPENDS_ON relationships)
  repeated UpstreamDependency upstream_dependencies = 7;
  string node_type = 8;          // dbt-model | dbt-seed | dbt-snapshot
  string manifest_version = 9;   // e.g. "v3" — set by manifest-controller at load time
}

message UpstreamDependency {
  string table_name = 1;
  string schema_name = 2;
  string service_name = 3;
}

message NodeResponse {
  TableNode node = 1;
}

// ============================================================================
// UPDATE NODE TIMESTAMP
// ============================================================================

message UpdateNodeTimestampRequest {
  string table_name = 1;   // Required
  string schema_name = 2;  // Required
}

// ============================================================================
// GET STALE ROOT NODES
// ============================================================================

message GetStaleRootNodesRequest {
  int32 hours_threshold = 1;  // Required: nodes not updated in last N hours
}

message GetStaleRootNodesResponse {
  repeated TableNode nodes = 1;
}

// ============================================================================
// GET DOWNSTREAM DEPENDENCIES
// ============================================================================

message GetDownstreamDependenciesRequest {
  string schedule_name = 1;  // Required
  string table_name = 2;     // Required
  string schema_name = 3;    // Required
  int32 max_depth = 4;       // Optional: limit traversal depth (0 = unlimited)
}

message GetDownstreamDependenciesResponse {
  repeated Dependency dependencies = 1;
  int32 total_count = 2;
}

// ============================================================================
// CHECK UPSTREAM FRESHNESS
// ============================================================================

message CheckUpstreamFreshnessRequest {
  string table_name = 1;        // Required
  string schema_name = 2;       // Required
  int32 freshness_minutes = 3;  // Optional: default 30 minutes
}

message CheckUpstreamFreshnessResponse {
  bool all_fresh = 1;
  int32 fresh_count = 2;
  int32 total_count = 3;
  repeated StaleUpstream stale_upstreams = 4;
}

message StaleUpstream {
  TableNode node = 1;
  int32 minutes_since_update = 2;
}

// ============================================================================
// GET SCHEDULE GRAPH
// ============================================================================

message GetScheduleGraphRequest {
  string schedule_name = 1;  // Required
}

message GraphEdge {
  string from_node_id = 1;  // "{service_name}.{schema_name}.{table_name}"
  string to_node_id   = 2;
}

message GetScheduleGraphResponse {
  repeated TableNode nodes = 1;
  repeated GraphEdge edges = 2;
}

// ============================================================================
// GET SCHEDULE INIT NODES
// ============================================================================

message GetScheduleInitNodesRequest {
  string schedule_name = 1;
  string run_id = 2;
}

message GetScheduleInitNodesResponse {
  repeated TableNode all_nodes  = 1;
  repeated TableNode root_nodes = 2;
  repeated TableNode seed_nodes = 3;
}

// ============================================================================
// UPDATE NODE STATUS
// ============================================================================

message UpdateNodeStatusRequest {
  string schedule_name = 1;
  string schema_name   = 2;
  string table_name    = 3;
  string status        = 4;  // PENDING | RUNNING | SUCCEEDED | FAILED
  string run_id        = 5;
}

message UpdateNodeStatusResponse {}

// ============================================================================
// GET READY DOWNSTREAM
// ============================================================================

message GetReadyDownstreamRequest {
  string schedule_name = 1;
  string schema_name   = 2;
  string table_name    = 3;
  string run_id        = 4;
}

message GetReadyDownstreamResponse {
  repeated TableNode nodes = 1;
}

// ============================================================================
// CHECK SCHEDULE COMPLETION
// ============================================================================

message CheckScheduleCompletionRequest {
  string schedule_name = 1;
  string run_id = 2;
}

message CheckScheduleCompletionResponse {
  bool is_complete = 1;
  bool has_failed  = 2;
}

// ============================================================================
// GET TRANSITIVE DOWNSTREAM
// ============================================================================

message GetTransitiveDownstreamRequest {
  string schedule_name = 1;
  string schema_name   = 2;
  string table_name    = 3;
}

message GetTransitiveDownstreamResponse {
  repeated TableNode nodes = 1;
}

// ============================================================================
// SNAPSHOT GRAPH
// ============================================================================

message SnapshotGraphRequest {
  string run_id        = 1;  // scheduler_tracker.schedule_id
  string schedule_name = 2;
}

message SnapshotGraphResponse {}

// ============================================================================
// FINALIZE RUN
// ============================================================================

message FinalizeRunRequest {
  string run_id          = 1;
  string terminal_status = 2;  // "SUCCEEDED" | "FAILED"
}

message FinalizeRunResponse {}

// ============================================================================
// LIST RUNS
// ============================================================================

message ListRunsRequest {
  string schedule_name = 1;
}

message RunSummary {
  string run_id          = 1;
  string schedule_name   = 2;
  string terminal_status = 3;
  string created_at      = 4;
  string completed_at    = 5;
}

message ListRunsResponse {
  repeated RunSummary runs = 1;
}

// ============================================================================
// GET RUN GRAPH
// ============================================================================

message GetRunGraphRequest {
  string run_id = 1;
}

message GetRunGraphResponse {
  repeated TableNode nodes = 1;
  repeated GraphEdge edges = 2;
}
