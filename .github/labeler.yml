# Area labels for pull requests, applied by .github/workflows/pr-labels.yml.
#
# A service's `area/<name>` label goes on a pull request that changes a file
# under that directory which defines behaviour: tests, Markdown and generated
# code (stubs, the streams contract bindings) are excluded, so a pull request
# that only regenerates stubs or adds a test does not claim the area.
# `all-globs-to-any-file` reads as "at least one changed file matches every
# glob below", and a `!` glob matches the files it does not name.
#
# area/e2e and area/docs go on a pull request whose every changed file is part
# of the end-to-end harness (tests/) or documentation (docs/, README.md,
# AGENTS.md, CONTRIBUTING.md). A pull request that also changes a service
# carries that service's label instead, so these two do not mark every change
# that ships with a test or a doc edit. Workflow and script changes carry no
# area; their type label (ci/cd, chore) says what they are.

area/run-controller:
  - changed-files:
      - all-globs-to-any-file:
          - 'run-controller/**'
          - '!**/*_test.go'
          - '!**/test_*.py'
          - '!**/tests/**'
          - '!**/*.test.*'
          - '!**/*.md'
          - '!**/*.gen.go'
          - '!**/*.pb.go'
          - '!**/*_pb2*.py'
          - '!**/streams_contract.py'
          - '!**/contract_vocabulary.py'

