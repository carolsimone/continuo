name: Bug report
description: Something in Continuo behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the chart with ...
        2. Trigger a run via ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which component
      multiple: true
      options:
        - state
        - orchestrator
        - executor-controller
        - k8s-controller
        - release-controller
        - remediation
        - remediation-agent
        - agent-chat
        - manifest-controller
        - ui
        - cli
        - Helm chart
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Chart version, image tag, or commit SHA.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is it installed
      options:
        - Helm chart, bundled datastores
        - Helm chart, external datastores
        - Local docker compose
        - Built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please redact any credentials before pasting.
      render: shell
