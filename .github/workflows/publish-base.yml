name: Publish Base Image

# Manual backfill only. On push to main, deploy.yml's build-base job owns
# publishing continuo-base:v1 — inside its own DAG, so service-image builds
# wait for the fresh base instead of racing a separately-triggered workflow.
on:
  workflow_dispatch:  # allows manual trigger from the Actions UI

env:
  # Pinned base tag consumed by every Go service's Dockerfile.prod
  # (ARG BASE_IMAGE default). Bump both together on breaking base changes.
  BASE_VERSION: v1

jobs:
  publish:
    # Self-hosted for the warm Docker layer cache (this only builds + pushes the
    # base image). Triggered by manual dispatch (trusted), so no fork exposure.
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Isolate Docker client state
        # Without this, a concurrent job's docker/login-action post step logs out
        # and this push loses its ghcr credentials mid-flight.
        uses: ./.github/actions/isolate-docker-state

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push continuo-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/continuo-base:${{ env.BASE_VERSION }}
            ghcr.io/${{ github.repository_owner }}/continuo-base:${{ github.sha }}
          cache-from: type=gha,scope=continuo-base
          cache-to: type=gha,scope=continuo-base,mode=max
