name: Publish Base Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.base
  workflow_dispatch:  # allows manual trigger from the Actions UI

jobs:
  publish:
    # Self-hosted for the warm Docker layer cache (this only builds + pushes the
    # base image). Triggered by push/dispatch (trusted), so no fork exposure.
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push continuo-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/continuo-base:latest
          cache-from: type=gha,scope=continuo-base
          cache-to: type=gha,scope=continuo-base,mode=max
