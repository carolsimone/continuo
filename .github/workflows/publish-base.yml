name: Publish Base Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.base
  workflow_dispatch:  # allows manual trigger from the Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push continuo-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/carolsimone/continuo/continuo-base:latest
          cache-from: type=gha,scope=continuo-base
          cache-to: type=gha,scope=continuo-base,mode=max
