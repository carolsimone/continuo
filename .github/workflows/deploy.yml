name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      dbt: ${{ steps.filter.outputs.dbt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            release:
              - '.github/workflows/deploy.yml'
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'config/**'
              - 'db/**'
              - 'deploy/**'
              - 'state/**'
              - 'orchestrator/**'
              - 'executor-controller/**'
              - 'k8s-controller/**'
              - 'ui-service/**'
              - 'manifest-controller/**'
              - 'release-controller/**'
              - 'dbt/**'
            state:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'state/**'
            orchestrator:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'orchestrator/**'
            executor_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'executor-controller/**'
            k8s_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'k8s-controller/**'
            ui_service:
              - 'ui-service/**'
            manifest_controller:
              - 'manifest-controller/**'
            release_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'release-controller/**'
            dbt:
              - 'dbt/base/**'
              - 'dbt/services/**'
            migrations:
              - 'db/**'

      - name: Build publish matrix
        id: matrix
        env:
          STATE_CHANGED: ${{ steps.filter.outputs.state }}
          ORCHESTRATOR_CHANGED: ${{ steps.filter.outputs.orchestrator }}
          EXECUTOR_CHANGED: ${{ steps.filter.outputs.executor_controller }}
          K8S_CHANGED: ${{ steps.filter.outputs.k8s_controller }}
          UI_CHANGED: ${{ steps.filter.outputs.ui_service }}
          MANIFEST_CHANGED: ${{ steps.filter.outputs.manifest_controller }}
          RELEASE_CONTROLLER_CHANGED: ${{ steps.filter.outputs.release_controller }}
          MIGRATIONS_CHANGED: ${{ steps.filter.outputs.migrations }}
        run: |
          matrix="$(
            jq -cn \
              --arg state "$STATE_CHANGED" \
              --arg orchestrator "$ORCHESTRATOR_CHANGED" \
              --arg executor "$EXECUTOR_CHANGED" \
              --arg k8s "$K8S_CHANGED" \
              --arg ui "$UI_CHANGED" \
              --arg manifest "$MANIFEST_CHANGED" \
              --arg release_controller "$RELEASE_CONTROLLER_CHANGED" \
              --arg migrations "$MIGRATIONS_CHANGED" \
              '{
                include: [
                  {service: "state", changed: $state, dockerfile: "state/Dockerfile.prod", context: "."},
                  {service: "orchestrator", changed: $orchestrator, dockerfile: "orchestrator/Dockerfile.prod", context: "."},
                  {service: "executor-controller", changed: $executor, dockerfile: "executor-controller/Dockerfile.prod", context: "."},
                  {service: "k8s-controller", changed: $k8s, dockerfile: "k8s-controller/Dockerfile.prod", context: "."},
                  {service: "ui-service", changed: $ui, dockerfile: "ui-service/Dockerfile", context: "ui-service"},
                  {service: "manifest-controller", changed: $manifest, dockerfile: "manifest-controller/Dockerfile.prod", context: "manifest-controller"},
                  {service: "release-controller", changed: $release_controller, dockerfile: "release-controller/Dockerfile.prod", context: "."},
                  {service: "migrations", changed: $migrations, dockerfile: "db/Dockerfile.migrate", context: "db"}
                ]
              }'
          )"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build-publish:
    if: needs.detect-changes.outputs.release == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/continuo-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reuse latest image for unchanged service
        id: reuse
        if: matrix.changed != 'true'
        continue-on-error: true
        run: |
          docker buildx imagetools inspect "${IMAGE_REPO}:latest"
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${GITHUB_SHA}" \
            "${IMAGE_REPO}:latest"

      - name: Build and push image
        if: matrix.changed == 'true' || steps.reuse.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Report publish strategy
        run: |
          if [ "${{ matrix.changed }}" = "true" ]; then
            echo "Built and pushed ${IMAGE_REPO}."
          elif [ "${{ steps.reuse.outcome }}" = "success" ]; then
            echo "Reused ${IMAGE_REPO}:latest for ${GITHUB_SHA}."
          else
            echo "Built ${IMAGE_REPO} because latest was missing."
          fi

  deploy:
    if: needs.detect-changes.outputs.release == 'true'
    needs:
      - detect-changes
      - build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            if [ ! -d /root/continuo/.git ]; then
              echo "/root/continuo is missing; clone the repo on the server before enabling this workflow." >&2
              exit 1
            fi

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            cd /root/continuo
            git pull --ff-only origin main

            kubectl create namespace continuo --dry-run=client -o yaml | kubectl apply -f -

            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm repo add neo4j https://helm.neo4j.com/neo4j
            helm repo update

            helm dependency build deploy/infra

            helm upgrade --install continuo-infra deploy/infra \
              -n continuo \
              --wait \
              --timeout 10m

            helm upgrade --install continuo-app deploy/app \
              -f deploy/app/values.yaml \
              -f /root/continuo-values.secret.yaml \
              --set global.dockerHubUser=${{ secrets.DOCKERHUB_USERNAME }} \
              --set global.imageTag=${{ github.sha }} \
              -n continuo \
              --wait \
              --timeout 10m

