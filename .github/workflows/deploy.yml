name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: >-
          Publish :<git-sha> images for the current commit even when no
          release paths changed (used to backfill images before tagging a
          release). Skips the Hetzner deploy step.
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      release: ${{ steps.filter.outputs.release }}
      base: ${{ steps.filter.outputs.base }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            base:
              - 'Dockerfile.base'
            release:
              - '.github/workflows/deploy.yml'
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'config/**'
              - 'db/**'
              - 'deploy/**'
              - 'state/**'
              - 'orchestrator/**'
              - 'executor-controller/**'
              - 'k8s-controller/**'
              - 'ui-service/**'
              - 'manifest-controller/**'
              - 'release-controller/**'
              - 'agent-runner/**'
              - 'cli/**'
              - 'remediation/**'
              - 'remediation-agent/**'
              - 'validation-runner/**'
              - 's3-sidecar/**'
            state:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'state/**'
            orchestrator:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'orchestrator/**'
            executor_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'executor-controller/**'
            k8s_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'k8s-controller/**'
            ui_service:
              - 'ui-service/**'
            manifest_controller:
              - 'manifest-controller/**'
            release_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'release-controller/**'
            agent_runner:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'agent-runner/**'
              - 'cli/**'
            remediation:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'remediation/**'
            remediation_agent:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'orchestrator/**'
              - 'remediation-agent/**'
            migrations:
              - 'db/**'
            validation_runner:
              - 'validation-runner/**'
            s3_sidecar:
              - 's3-sidecar/**'
            stream_reaper:
              - 'pkg/**'

      - name: Build publish matrix
        id: matrix
        env:
          STATE_CHANGED: ${{ steps.filter.outputs.state }}
          ORCHESTRATOR_CHANGED: ${{ steps.filter.outputs.orchestrator }}
          EXECUTOR_CHANGED: ${{ steps.filter.outputs.executor_controller }}
          K8S_CHANGED: ${{ steps.filter.outputs.k8s_controller }}
          UI_CHANGED: ${{ steps.filter.outputs.ui_service }}
          MANIFEST_CHANGED: ${{ steps.filter.outputs.manifest_controller }}
          RELEASE_CONTROLLER_CHANGED: ${{ steps.filter.outputs.release_controller }}
          AGENT_RUNNER_CHANGED: ${{ steps.filter.outputs.agent_runner }}
          REMEDIATION_CHANGED: ${{ steps.filter.outputs.remediation }}
          REMEDIATION_AGENT_CHANGED: ${{ steps.filter.outputs.remediation_agent }}
          MIGRATIONS_CHANGED: ${{ steps.filter.outputs.migrations }}
          VALIDATION_RUNNER_CHANGED: ${{ steps.filter.outputs.validation_runner }}
          S3_SIDECAR_CHANGED: ${{ steps.filter.outputs.s3_sidecar }}
          STREAM_REAPER_CHANGED: ${{ steps.filter.outputs.stream_reaper }}
        run: |
          matrix="$(
            jq -cn \
              --arg state "$STATE_CHANGED" \
              --arg orchestrator "$ORCHESTRATOR_CHANGED" \
              --arg executor "$EXECUTOR_CHANGED" \
              --arg k8s "$K8S_CHANGED" \
              --arg ui "$UI_CHANGED" \
              --arg manifest "$MANIFEST_CHANGED" \
              --arg release_controller "$RELEASE_CONTROLLER_CHANGED" \
              --arg agent_runner "$AGENT_RUNNER_CHANGED" \
              --arg remediation "$REMEDIATION_CHANGED" \
              --arg remediation_agent "$REMEDIATION_AGENT_CHANGED" \
              --arg migrations "$MIGRATIONS_CHANGED" \
              --arg validation_runner "$VALIDATION_RUNNER_CHANGED" \
              --arg s3_sidecar "$S3_SIDECAR_CHANGED" \
              --arg stream_reaper "$STREAM_REAPER_CHANGED" \
              '{
                include: [
                  {service: "state", changed: $state, dockerfile: "state/Dockerfile.prod", context: "."},
                  {service: "orchestrator", changed: $orchestrator, dockerfile: "orchestrator/Dockerfile.prod", context: "."},
                  {service: "executor-controller", changed: $executor, dockerfile: "executor-controller/Dockerfile.prod", context: "."},
                  {service: "k8s-controller", changed: $k8s, dockerfile: "k8s-controller/Dockerfile.prod", context: "."},
                  {service: "ui-service", changed: $ui, dockerfile: "ui-service/Dockerfile", context: "ui-service"},
                  {service: "manifest-controller", changed: $manifest, dockerfile: "manifest-controller/Dockerfile.prod", context: "manifest-controller"},
                  {service: "release-controller", changed: $release_controller, dockerfile: "release-controller/Dockerfile.prod", context: "."},
                  {service: "agent-runner", changed: $agent_runner, dockerfile: "agent-runner/Dockerfile.prod", context: "."},
                  {service: "remediation", changed: $remediation, dockerfile: "remediation/Dockerfile.prod", context: "."},
                  {service: "remediation-agent", changed: $remediation_agent, dockerfile: "remediation-agent/Dockerfile.prod", context: "."},
                  {service: "migrations", changed: $migrations, dockerfile: "db/Dockerfile.migrate", context: "db"},
                  {service: "validation-runner-postgres", changed: $validation_runner, dockerfile: "validation-runner/Dockerfile.postgres", context: "validation-runner"},
                  {service: "validation-runner-trino", changed: $validation_runner, dockerfile: "validation-runner/Dockerfile.trino", context: "validation-runner"},
                  {service: "s3-sidecar", changed: $s3_sidecar, dockerfile: "s3-sidecar/Dockerfile", context: "s3-sidecar"},
                  {service: "stream-reaper", changed: $stream_reaper, dockerfile: "pkg/cmd/stream-reaper/Dockerfile", context: "pkg"}
                ]
              }'
          )"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build-base:
    # When Dockerfile.base changes, the service images must build FROM the
    # rebuilt continuo-base:v1 — publishing it here, inside this workflow's
    # DAG, guarantees build-publish never pulls a stale base. Publishing it
    # from a separate push-triggered workflow raced this one: the base build
    # queued behind other jobs while build-publish pulled the old :v1.
    # (publish-base.yml remains as a manual backfill entry point.)
    if: needs.detect-changes.outputs.base == 'true'
    needs: detect-changes
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push continuo-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          # :v1 is the pinned tag every Dockerfile.prod consumes (see the
          # BASE_IMAGE build-arg in build-publish below); bump both together
          # on breaking base changes.
          tags: |
            ghcr.io/${{ github.repository_owner }}/continuo-base:v1
            ghcr.io/${{ github.repository_owner }}/continuo-base:${{ github.sha }}
          cache-from: type=gha,scope=continuo-base
          cache-to: type=gha,scope=continuo-base,mode=max

  build-publish:
    # force_publish backfills :<git-sha> images on a manual dispatch even
    # when no release path changed (inputs is empty on push, so this
    # reduces to today's behavior there).
    # build-base is skipped on most pushes; !cancelled() keeps this job
    # running in that case while a build-base failure still blocks it.
    if: >-
      !cancelled() && needs.build-base.result != 'failure' &&
      (needs.detect-changes.outputs.release == 'true' || inputs.force_publish == true)
    needs:
      - detect-changes
      - build-base
    # Self-hosted, deliberately trading wall-clock for cost.
    #
    # This is a matrix (one job per service), so on GitHub-hosted it fans out for
    # free — and it used to live there for exactly that reason. It is also the
    # single largest consumer of billable Actions minutes: ~743 job-minutes/month
    # of a ~2,029 total, against a 2,000-minute allowance. Keeping it hosted is
    # what pushes the account into paid overage, and eliminating that bill is the
    # goal that outranks speed here.
    #
    # The cost is real and was measured: the runner box runs runner_count=1, so
    # these per-service jobs serialize (one agent = one job at a time) and queue
    # behind PR CI — ~6x slower for a release. Accepted knowingly.
    #
    # This becomes free again the moment the box has several agents: raise
    # runner_count (needs a larger server_type — see the sizing table in
    # carolsimone/hetzner-cicd-runner) and the matrix fans out on-prem instead.
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/continuo-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        # binfmt registration for linux/arm64. The Go images cross-compile and
        # need no emulation, but the Python images are built under QEMU; without
        # this the arm64 half of every build fails on this amd64 runner.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse latest image for unchanged service
        id: reuse
        if: matrix.changed != 'true'
        continue-on-error: true
        run: |
          docker buildx imagetools inspect "${IMAGE_REPO}:latest"
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${GITHUB_SHA}" \
            "${IMAGE_REPO}:latest"

      - name: Build and push image
        if: matrix.changed == 'true' || steps.reuse.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          # matrix.build_args carries per-service extras (none set today; the
          # continuo-validation-* packages resolve from real PyPI). Unset entries
          # contribute a blank line, which build-push-action ignores.
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/continuo-base:v1
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Report publish strategy
        run: |
          if [ "${{ matrix.changed }}" = "true" ]; then
            echo "Built and pushed ${IMAGE_REPO}."
          elif [ "${{ steps.reuse.outcome }}" = "success" ]; then
            echo "Reused ${IMAGE_REPO}:latest for ${GITHUB_SHA}."
          else
            echo "Built ${IMAGE_REPO} because latest was missing."
          fi

  deploy:
    # force_publish is a backfill-only run (see build-publish above); it
    # never deploys, so it never touches the Hetzner box.
    # !cancelled() is required: build-base is skipped on most pushes, and the
    # implicit success() is chain-wide — without the override a skipped
    # build-base silently skips this job too (no push deployed between the
    # build-base introduction and this guard). build-publish must itself have
    # succeeded; its own condition already blocks on a build-base failure.
    if: >-
      !cancelled() &&
      needs.build-publish.result == 'success' &&
      needs.detect-changes.outputs.release == 'true' &&
      inputs.force_publish != true
    needs:
      - detect-changes
      - build-publish
    runs-on: self-hosted
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            if [ ! -d /root/continuo/.git ]; then
              echo "/root/continuo is missing; clone the repo on the server before enabling this workflow." >&2
              exit 1
            fi

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            cd /root/continuo
            # Force the checkout to exactly match origin/main. A plain
            # `git pull --ff-only` aborts when an untracked file on the server
            # collides with a file a new commit adds (e.g. local agent output
            # left in /root/continuo), wedging every deploy. Fetch + hard reset
            # + clean make the deploy immune to accumulated untracked cruft.
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            kubectl create namespace continuo --dry-run=client -o yaml | kubectl apply -f -

            # Infra (Postgres/Redis/Neo4j) is managed manually from the
            # private continuo-infra repo's runbook; this workflow deploys
            # only the application chart against it (BYO mode).
            helm upgrade --install continuo-app deploy/continuo \
              -f /root/continuo-values.secret.yaml \
              --set global.imageTag=${{ github.sha }} \
              -n continuo \
              --wait \
              --timeout 10m

