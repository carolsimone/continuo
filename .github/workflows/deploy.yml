name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: >-
          Publish :<git-sha> images for the current commit even when no
          release paths changed (used to backfill images before tagging a
          release). Skips the Hetzner deploy step.
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            release:
              - '.github/workflows/deploy.yml'
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'config/**'
              - 'db/**'
              - 'deploy/**'
              - 'state/**'
              - 'orchestrator/**'
              - 'executor-controller/**'
              - 'k8s-controller/**'
              - 'ui-service/**'
              - 'manifest-controller/**'
              - 'release-controller/**'
              - 'agent-runner/**'
              - 'cli/**'
              - 'remediation/**'
              - 'remediation-agent/**'
              - 'validation-runner/**'
              - 's3-sidecar/**'
            state:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'state/**'
            orchestrator:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'orchestrator/**'
            executor_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'executor-controller/**'
            k8s_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'k8s-controller/**'
            ui_service:
              - 'ui-service/**'
            manifest_controller:
              - 'manifest-controller/**'
            release_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'release-controller/**'
            agent_runner:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'agent-runner/**'
              - 'cli/**'
            remediation:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'remediation/**'
            remediation_agent:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'orchestrator/**'
              - 'remediation-agent/**'
            migrations:
              - 'db/**'
            validation_runner:
              - 'validation-runner/**'
            s3_sidecar:
              - 's3-sidecar/**'
            stream_reaper:
              - 'pkg/**'

      - name: Build publish matrix
        id: matrix
        env:
          STATE_CHANGED: ${{ steps.filter.outputs.state }}
          ORCHESTRATOR_CHANGED: ${{ steps.filter.outputs.orchestrator }}
          EXECUTOR_CHANGED: ${{ steps.filter.outputs.executor_controller }}
          K8S_CHANGED: ${{ steps.filter.outputs.k8s_controller }}
          UI_CHANGED: ${{ steps.filter.outputs.ui_service }}
          MANIFEST_CHANGED: ${{ steps.filter.outputs.manifest_controller }}
          RELEASE_CONTROLLER_CHANGED: ${{ steps.filter.outputs.release_controller }}
          AGENT_RUNNER_CHANGED: ${{ steps.filter.outputs.agent_runner }}
          REMEDIATION_CHANGED: ${{ steps.filter.outputs.remediation }}
          REMEDIATION_AGENT_CHANGED: ${{ steps.filter.outputs.remediation_agent }}
          MIGRATIONS_CHANGED: ${{ steps.filter.outputs.migrations }}
          VALIDATION_RUNNER_CHANGED: ${{ steps.filter.outputs.validation_runner }}
          S3_SIDECAR_CHANGED: ${{ steps.filter.outputs.s3_sidecar }}
          STREAM_REAPER_CHANGED: ${{ steps.filter.outputs.stream_reaper }}
        run: |
          matrix="$(
            jq -cn \
              --arg state "$STATE_CHANGED" \
              --arg orchestrator "$ORCHESTRATOR_CHANGED" \
              --arg executor "$EXECUTOR_CHANGED" \
              --arg k8s "$K8S_CHANGED" \
              --arg ui "$UI_CHANGED" \
              --arg manifest "$MANIFEST_CHANGED" \
              --arg release_controller "$RELEASE_CONTROLLER_CHANGED" \
              --arg agent_runner "$AGENT_RUNNER_CHANGED" \
              --arg remediation "$REMEDIATION_CHANGED" \
              --arg remediation_agent "$REMEDIATION_AGENT_CHANGED" \
              --arg migrations "$MIGRATIONS_CHANGED" \
              --arg validation_runner "$VALIDATION_RUNNER_CHANGED" \
              --arg s3_sidecar "$S3_SIDECAR_CHANGED" \
              --arg stream_reaper "$STREAM_REAPER_CHANGED" \
              '{
                include: [
                  {service: "state", changed: $state, dockerfile: "state/Dockerfile.prod", context: "."},
                  {service: "orchestrator", changed: $orchestrator, dockerfile: "orchestrator/Dockerfile.prod", context: "."},
                  {service: "executor-controller", changed: $executor, dockerfile: "executor-controller/Dockerfile.prod", context: "."},
                  {service: "k8s-controller", changed: $k8s, dockerfile: "k8s-controller/Dockerfile.prod", context: "."},
                  {service: "ui-service", changed: $ui, dockerfile: "ui-service/Dockerfile", context: "ui-service"},
                  {service: "manifest-controller", changed: $manifest, dockerfile: "manifest-controller/Dockerfile.prod", context: "manifest-controller"},
                  {service: "release-controller", changed: $release_controller, dockerfile: "release-controller/Dockerfile.prod", context: "."},
                  {service: "agent-runner", changed: $agent_runner, dockerfile: "agent-runner/Dockerfile.prod", context: "."},
                  {service: "remediation", changed: $remediation, dockerfile: "remediation/Dockerfile.prod", context: "."},
                  {service: "remediation-agent", changed: $remediation_agent, dockerfile: "remediation-agent/Dockerfile.prod", context: "."},
                  {service: "migrations", changed: $migrations, dockerfile: "db/Dockerfile.migrate", context: "db"},
                  {service: "validation-runner", changed: $validation_runner, dockerfile: "validation-runner/Dockerfile", context: "validation-runner"},
                  {service: "s3-sidecar", changed: $s3_sidecar, dockerfile: "s3-sidecar/Dockerfile", context: "s3-sidecar"},
                  {service: "stream-reaper", changed: $stream_reaper, dockerfile: "pkg/cmd/stream-reaper/Dockerfile", context: "pkg"}
                ]
              }'
          )"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build-publish:
    # force_publish backfills :<git-sha> images on a manual dispatch even
    # when no release path changed (inputs is empty on push, so this
    # reduces to today's behavior there).
    if: needs.detect-changes.outputs.release == 'true' || inputs.force_publish == true
    needs: detect-changes
    # GitHub-hosted on purpose: this is a matrix (one job per service) that runs
    # in parallel here for free. On the single self-hosted runner the jobs
    # serialize (one agent = one job at a time) and queue behind PR CI — measured
    # ~6x slower for a release — so the warm-cache gain doesn't pay off. ci.yml and
    # the single-job publish workflows stay self-hosted; only this parallel matrix
    # belongs on hosted.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/continuo-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse latest image for unchanged service
        id: reuse
        if: matrix.changed != 'true'
        continue-on-error: true
        run: |
          docker buildx imagetools inspect "${IMAGE_REPO}:latest"
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${GITHUB_SHA}" \
            "${IMAGE_REPO}:latest"

      - name: Build and push image
        if: matrix.changed == 'true' || steps.reuse.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/continuo-base:v1
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Report publish strategy
        run: |
          if [ "${{ matrix.changed }}" = "true" ]; then
            echo "Built and pushed ${IMAGE_REPO}."
          elif [ "${{ steps.reuse.outcome }}" = "success" ]; then
            echo "Reused ${IMAGE_REPO}:latest for ${GITHUB_SHA}."
          else
            echo "Built ${IMAGE_REPO} because latest was missing."
          fi

  deploy:
    # force_publish is a backfill-only run (see build-publish above); it
    # never deploys, so it never touches the Hetzner box.
    if: needs.detect-changes.outputs.release == 'true' && inputs.force_publish != true
    needs:
      - detect-changes
      - build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            if [ ! -d /root/continuo/.git ]; then
              echo "/root/continuo is missing; clone the repo on the server before enabling this workflow." >&2
              exit 1
            fi

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            cd /root/continuo
            # Force the checkout to exactly match origin/main. A plain
            # `git pull --ff-only` aborts when an untracked file on the server
            # collides with a file a new commit adds (e.g. local agent output
            # left in /root/continuo), wedging every deploy. Fetch + hard reset
            # + clean make the deploy immune to accumulated untracked cruft.
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            kubectl create namespace continuo --dry-run=client -o yaml | kubectl apply -f -

            # Infra (Postgres/Redis/Neo4j) is managed manually from the
            # private continuo-infra repo's runbook; this workflow deploys
            # only the application chart against it (BYO mode).
            helm upgrade --install continuo-app deploy/continuo \
              -f /root/continuo-values.secret.yaml \
              --set global.imageTag=${{ github.sha }} \
              -n continuo \
              --wait \
              --timeout 10m

