name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: >-
          Publish :<git-sha> images for the current commit even when no
          release paths changed (used to backfill images before tagging a
          release). Skips the dev deploy.
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

# Default for jobs without their own permissions block; jobs that push
# images declare packages: write themselves.
permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: self-hosted
    # actions: read lets the last-deployed-commit step list this workflow's runs.
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
      base: ${{ steps.filter.outputs.base }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the last deployed commit
        # Changes are detected since the last commit a push run deployed, not
        # since the previous push: a deploy run that was cancelled while it
        # waited behind another would otherwise take its commits' changes with
        # it, and those services would keep running their older images.
        id: since
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sha="$(bash scripts/deploy/last-deployed-commit.sh)"
          echo "Detecting changes between ${sha} and ${GITHUB_SHA}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.since.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            base:
              - 'Dockerfile.base'
            release:
              - '.github/workflows/deploy.yml'
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'config/**'
              - 'db/**'
              - 'deploy/**'
              - 'run-controller/**'
              - 'catalog/**'
              - 'execution-controller/**'
              - 'ui/**'
              - 'topology-controller/**'
              - 'release-controller/**'
              - 'agent-chat/**'
              - 'cli/**'
              - 'remediation/**'
              - 'agent-remediation/**'
              - 'dead-letter-controller/**'
              - 'egress-proxy/**'
              - 's3-sidecar/**'
            run_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'run-controller/**'
            catalog:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'catalog/**'
            execution_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'execution-controller/**'
            ui:
              - 'ui/**'
            topology_controller:
              - 'topology-controller/**'
            release_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'release-controller/**'
            agent_chat:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'agent-chat/**'
              - 'cli/**'
            remediation:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'remediation/**'
            agent_remediation:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'catalog/**'
              - 'agent-remediation/**'
            dead_letter_controller:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'dead-letter-controller/**'
            egress_proxy:
              - 'Dockerfile.base'
              - 'go.work'
              - 'go.work.sum'
              - 'pkg/**'
              - 'egress-proxy/**'
            migrations:
              - 'db/**'
            s3_sidecar:
              - 's3-sidecar/**'

      - name: Build publish matrix
        id: matrix
        env:
          RUN_CONTROLLER_CHANGED: ${{ steps.filter.outputs.run_controller }}
          CATALOG_CHANGED: ${{ steps.filter.outputs.catalog }}
          EXECUTION_CONTROLLER_CHANGED: ${{ steps.filter.outputs.execution_controller }}
          UI_CHANGED: ${{ steps.filter.outputs.ui }}
          TOPOLOGY_CHANGED: ${{ steps.filter.outputs.topology_controller }}
          RELEASE_CONTROLLER_CHANGED: ${{ steps.filter.outputs.release_controller }}
          AGENT_CHAT_CHANGED: ${{ steps.filter.outputs.agent_chat }}
          REMEDIATION_CHANGED: ${{ steps.filter.outputs.remediation }}
          AGENT_REMEDIATION_CHANGED: ${{ steps.filter.outputs.agent_remediation }}
          DEAD_LETTER_CONTROLLER_CHANGED: ${{ steps.filter.outputs.dead_letter_controller }}
          EGRESS_PROXY_CHANGED: ${{ steps.filter.outputs.egress_proxy }}
          MIGRATIONS_CHANGED: ${{ steps.filter.outputs.migrations }}
          S3_SIDECAR_CHANGED: ${{ steps.filter.outputs.s3_sidecar }}
        run: |
          matrix="$(
            jq -cn \
              --arg run_controller "$RUN_CONTROLLER_CHANGED" \
              --arg catalog "$CATALOG_CHANGED" \
              --arg execution_controller "$EXECUTION_CONTROLLER_CHANGED" \
              --arg ui "$UI_CHANGED" \
              --arg topology "$TOPOLOGY_CHANGED" \
              --arg release_controller "$RELEASE_CONTROLLER_CHANGED" \
              --arg agent_chat "$AGENT_CHAT_CHANGED" \
              --arg remediation "$REMEDIATION_CHANGED" \
              --arg agent_remediation "$AGENT_REMEDIATION_CHANGED" \
              --arg dead_letter_controller "$DEAD_LETTER_CONTROLLER_CHANGED" \
              --arg egress_proxy "$EGRESS_PROXY_CHANGED" \
              --arg migrations "$MIGRATIONS_CHANGED" \
              --arg s3_sidecar "$S3_SIDECAR_CHANGED" \
              '{
                include: [
                  {service: "run-controller", changed: $run_controller, dockerfile: "run-controller/Dockerfile.prod", context: "."},
                  {service: "catalog", changed: $catalog, dockerfile: "catalog/Dockerfile.prod", context: "."},
                  {service: "execution-controller", changed: $execution_controller, dockerfile: "execution-controller/Dockerfile.prod", context: "."},
                  {service: "ui", changed: $ui, dockerfile: "ui/Dockerfile", context: "ui"},
                  {service: "topology-controller", changed: $topology, dockerfile: "topology-controller/Dockerfile.prod", context: "topology-controller"},
                  {service: "release-controller", changed: $release_controller, dockerfile: "release-controller/Dockerfile.prod", context: "."},
                  {service: "agent-chat", changed: $agent_chat, dockerfile: "agent-chat/Dockerfile.prod", context: "."},
                  {service: "remediation", changed: $remediation, dockerfile: "remediation/Dockerfile.prod", context: "."},
                  {service: "agent-remediation", changed: $agent_remediation, dockerfile: "agent-remediation/Dockerfile.prod", context: "."},
                  {service: "dead-letter-controller", changed: $dead_letter_controller, dockerfile: "dead-letter-controller/Dockerfile.prod", context: "."},
                  {service: "egress-proxy", changed: $egress_proxy, dockerfile: "egress-proxy/Dockerfile.prod", context: "."},
                  {service: "migrations", changed: $migrations, dockerfile: "db/Dockerfile.migrate", context: "db"},
                  {service: "s3-sidecar", changed: $s3_sidecar, dockerfile: "s3-sidecar/Dockerfile", context: "s3-sidecar"}
                ]
              }'
          )"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build-base:
    # When Dockerfile.base changes, the service images must build FROM the
    # rebuilt continuo-base:v1 — publishing it here, inside this workflow's
    # DAG, guarantees build-publish never pulls a stale base. Publishing it
    # from a separate push-triggered workflow raced this one: the base build
    # queued behind other jobs while build-publish pulled the old :v1.
    # (publish-base.yml remains as a manual backfill entry point.)
    if: needs.detect-changes.outputs.base == 'true'
    needs: detect-changes
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Isolate Docker client state
        # Without this, a sibling job's docker/login-action post step (which logs
        # out) drops the ghcr credentials this push still needs, and its buildx
        # builder selection leaks into this job.
        uses: ./.github/actions/isolate-docker-state

      - name: Set up QEMU
        # continuo-base is published for both architectures; the half that is
        # not this runner's own builds under emulation. Derived from the
        # runner, so the same step works on the x86 and the arm64 box.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ runner.arch == 'ARM64' && 'amd64' || 'arm64' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push continuo-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          # :v1 is the pinned tag every Dockerfile.prod consumes (see the
          # BASE_IMAGE build-arg in build-publish below); bump both together
          # on breaking base changes.
          tags: |
            ghcr.io/${{ github.repository_owner }}/continuo-base:v1
            ghcr.io/${{ github.repository_owner }}/continuo-base:${{ github.sha }}
          cache-from: type=gha,scope=continuo-base
          cache-to: type=gha,scope=continuo-base,mode=max

  build-publish:
    # force_publish backfills :<git-sha> images on a manual dispatch even
    # when no release path changed (inputs is empty on push, so this
    # reduces to today's behavior there).
    # build-base is skipped on most pushes; !cancelled() keeps this job
    # running in that case while a build-base failure still blocks it.
    if: >-
      !cancelled() && needs.build-base.result != 'failure' &&
      (needs.detect-changes.outputs.release == 'true' || inputs.force_publish == true)
    needs:
      - detect-changes
      - build-base
    # Self-hosted, deliberately trading wall-clock for cost.
    #
    # This is a matrix (one job per service), so on GitHub-hosted it fans out for
    # free — and it used to live there for exactly that reason. It is also the
    # single largest consumer of billable Actions minutes: ~743 job-minutes/month
    # of a ~2,029 total, against a 2,000-minute allowance. Keeping it hosted is
    # what pushes the account into paid overage, and eliminating that bill is the
    # goal that outranks speed here.
    #
    # The cost is real and was measured: the runner box runs runner_count=1, so
    # these per-service jobs serialize (one agent = one job at a time) and queue
    # behind PR CI — ~6x slower for a release. Accepted knowingly.
    #
    # This becomes free again the moment the box has several agents: raise
    # runner_count (needs a larger server_type — see the sizing table in
    # carolsimone/hetzner-cicd-runner) and the matrix fans out on-prem instead.
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/continuo-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Isolate Docker client state
        # These matrix legs run two-at-a-time across the agents under one OS user.
        # On a shared ~/.docker the first leg to finish logs out from under the
        # other, which then fails its push with "failed to fetch anonymous token".
        uses: ./.github/actions/isolate-docker-state

      - name: Set up QEMU
        # binfmt registration for the architecture this runner is NOT. The Go
        # images cross-compile and need no emulation, but the Python images are
        # built under QEMU; without this the non-native half of every build
        # fails. Derived from the runner, so x86 and arm64 boxes both work.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ runner.arch == 'ARM64' && 'amd64' || 'arm64' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse latest image for unchanged service
        id: reuse
        if: matrix.changed != 'true'
        continue-on-error: true
        run: |
          docker buildx imagetools inspect "${IMAGE_REPO}:latest"
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${GITHUB_SHA}" \
            "${IMAGE_REPO}:latest"

          # A reused :latest predating multi-arch is amd64-only. Fail this step so
          # the build step below (which runs on steps.reuse.outcome == 'failure')
          # rebuilds it properly for both platforms. Self-healing: no manual
          # backfill needed.
          platforms="$(docker buildx imagetools inspect "${IMAGE_REPO}:${GITHUB_SHA}" --raw \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')"
          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "${want}" <<< "${platforms}"; then
              echo "Reused image lacks ${want}; falling through to a full build"
              exit 1
            fi
          done

      - name: Build and push image
        if: matrix.changed == 'true' || steps.reuse.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          # matrix.build_args carries per-service extras (none set today). Unset
          # entries contribute a blank line, which build-push-action ignores.
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/continuo-base:v1
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Report publish strategy
        run: |
          if [ "${{ matrix.changed }}" = "true" ]; then
            echo "Built and pushed ${IMAGE_REPO}."
          elif [ "${{ steps.reuse.outcome }}" = "success" ]; then
            echo "Reused ${IMAGE_REPO}:latest for ${GITHUB_SHA}."
          else
            echo "Built ${IMAGE_REPO} for ${GITHUB_SHA}: reuse was unavailable (latest missing or single-arch)."
          fi

      - name: Assert the published image is multi-arch
        # Fails closed if a build silently reverts to single-arch. Proves the
        # non-native variant EXISTS; the smoke step below proves it RUNS.
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect "${IMAGE_REPO}:${GITHUB_SHA}" --raw \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')"
          echo "${IMAGE_REPO}:${GITHUB_SHA} platforms:"
          echo "${platforms}"
          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "${want}" <<< "${platforms}"; then
              echo "::error::${IMAGE_REPO}:${GITHUB_SHA} is missing ${want}"
              exit 1
            fi
          done

      - name: Smoke-run the non-native variant
        # Executes the image built for the architecture this runner is NOT,
        # under QEMU. Catches a wrong GOARCH: the manifest would still list the
        # platform, but the binary inside would fail with "exec format error".
        # Skipped for images with no runnable entrypoint of this shape.
        if: matrix.service != 'migrations'
        env:
          SMOKE_ARCH: ${{ runner.arch == 'ARM64' && 'amd64' || 'arm64' }}
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${SMOKE_ARCH}" --entrypoint /bin/sh \
            "${IMAGE_REPO}:${GITHUB_SHA}" \
            -c "uname -m && echo \"${SMOKE_ARCH} variant executed OK\""

  deploy:
    # force_publish is a backfill-only run (see build-publish above); it
    # never deploys, so it never starts a deploy of dev.
    # !cancelled() is required: build-base is skipped on most pushes, and the
    # implicit success() is chain-wide — without the override a skipped
    # build-base silently skips this job too (no push deployed between the
    # build-base introduction and this guard). build-publish must itself have
    # succeeded; its own condition already blocks on a build-base failure.
    if: >-
      !cancelled() &&
      needs.build-publish.result == 'success' &&
      needs.detect-changes.outputs.release == 'true' &&
      inputs.force_publish != true
    needs:
      - detect-changes
      - build-publish
    runs-on: ubuntu-latest
    # The job holds no credential for dev: it starts the deploy workflow of
    # carolsimone/continuo-infra, which owns dev's cluster access and values,
    # and waits for that run to finish. Its own token needs no scope.
    permissions: {}
    timeout-minutes: 180
    steps:
      - name: Mint a token for continuo-infra
        id: app-token
        # Pinned to a commit SHA, not a tag: the token it mints can start
        # continuo-infra's deploy. Bump deliberately after reviewing the diff.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CONTINUO_INFRA_APP_ID }}
          private-key: ${{ secrets.CONTINUO_INFRA_APP_PRIVATE_KEY }}
          owner: carolsimone
          repositories: continuo-infra

      - name: Run the continuo-infra deploy
        # Dispatches continuo-infra's deploy workflow for this commit and waits
        # for its run to finish; the run's conclusion is this job's outcome.
        #
        # continuo-infra's deploy and apply workflows share one concurrency
        # group that queues, and GitHub keeps one pending run per group: a run
        # that queues behind a running one cancels the run already pending.
        # A run that ends `cancelled` therefore does not mean the deploy broke:
        #  - A deploy of a newer continuo commit took its place. That commit
        #    deploys everything this one carries (the compare API says it is
        #    ahead of this commit), and its own workflow run reports the
        #    outcome, so this job ends green and names that run.
        #  - An infra apply, or a person, cancelled it. Nothing deployed this
        #    commit, so the job dispatches once more and waits for that run
        #    under the same rules; a second cancellation that no newer commit
        #    explains fails the job.
        # gh workflow run does not print the run it creates: a run is found as
        # the newest workflow_dispatch run created at or after the dispatch
        # whose title names the commit (continuo-infra's deploy sets run-name
        # to "deploy <commit>"). Timestamps are UTC in one format, so string
        # comparison orders them.
        #
        # The step outlasts the longest wait in the infra queue: a deploy can
        # queue behind a continuo-infra apply (up to 90 minutes) and then run
        # for up to 60 minutes itself. A shorter limit would end this job red
        # while dev is still deploying.
        #
        # The app token is installed on continuo-infra only, so the compare
        # call on this repository uses the workflow's own token
        # (REPO_TOKEN), which reads this public repository.
        timeout-minutes: 170
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          infra=carolsimone/continuo-infra
          run_id=""
          run_created_at=""

          # dispatch_and_find: starts a deploy of this commit and sets run_id
          # and run_created_at to the run it created.
          dispatch_and_find() {
            local started_at found
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run deploy.yml -R "${infra}" -f commit="${GITHUB_SHA}"
            for _ in $(seq 1 12); do
              found="$(gh run list -R "${infra}" --workflow deploy.yml \
                --event workflow_dispatch --limit 50 --json databaseId,createdAt,displayTitle \
                --jq "[.[] | select(.createdAt >= \"${started_at}\" and .displayTitle == \"deploy ${GITHUB_SHA}\")] | sort_by(.createdAt) | last // empty | \"\(.databaseId) \(.createdAt)\"")"
              if [ -n "${found}" ]; then
                read -r run_id run_created_at <<< "${found}"
                echo "Deploy run: https://github.com/${infra}/actions/runs/${run_id}"
                return 0
              fi
              sleep 5
            done
            echo "::error::No ${infra} deploy run appeared within 60 s of the dispatch at ${started_at}"
            return 1
          }

          # superseding_run: prints the id of a deploy run created after this
          # run for another continuo commit that is ahead of this one, if any.
          # createdAt has whole seconds, so a run that replaced this one within
          # the same second has the same createdAt; run ids only grow, so of
          # two runs created in the same second the higher id is the later.
          superseding_run() {
            local id sha status
            while read -r id sha; do
              if [ -z "${id}" ] || [ "${sha}" = "${GITHUB_SHA}" ]; then
                continue
              fi
              if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
                continue
              fi
              status="$(GH_TOKEN="${REPO_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${sha}" --jq .status 2>/dev/null || true)"
              if [ "${status}" = "ahead" ] || [ "${status}" = "identical" ]; then
                echo "${id}"
                return 0
              fi
            done < <(gh run list -R "${infra}" --workflow deploy.yml \
              --event workflow_dispatch --limit 50 --json databaseId,createdAt,displayTitle \
              --jq ".[] | select((.createdAt > \"${run_created_at}\" or (.createdAt == \"${run_created_at}\" and .databaseId > ${run_id})) and (.displayTitle | startswith(\"deploy \"))) | \"\(.databaseId) \(.displayTitle | ltrimstr(\"deploy \"))\"")
            return 0
          }

          dispatch_and_find
          for attempt in 1 2; do
            # gh run watch can fail on a transient API error while the run goes
            # on, so the run counts as finished only once it has a conclusion.
            conclusion=""
            while [ -z "${conclusion}" ]; do
              gh run watch "${run_id}" -R "${infra}" || sleep 15
              conclusion="$(gh run view "${run_id}" -R "${infra}" --json conclusion -q .conclusion || true)"
            done
            run_url="https://github.com/${infra}/actions/runs/${run_id}"
            if [ "${conclusion}" = "success" ]; then
              exit 0
            fi
            if [ "${conclusion}" != "cancelled" ]; then
              echo "::error::The continuo-infra deploy ended ${conclusion:-without a conclusion}: ${run_url}"
              exit 1
            fi
            newer="$(superseding_run)"
            if [ -n "${newer}" ]; then
              echo "::notice::The deploy of ${GITHUB_SHA} was cancelled in the continuo-infra queue by a deploy of a newer commit, https://github.com/${infra}/actions/runs/${newer}, which deploys it; that commit's own run reports the outcome."
              exit 0
            fi
            if [ "${attempt}" = 2 ]; then
              echo "::error::The continuo-infra deploy was cancelled again, and no newer commit's deploy replaced it: ${run_url}"
              exit 1
            fi
            echo "::notice::The continuo-infra deploy was cancelled and no newer commit's deploy replaced it (${run_url}); dispatching it once more."
            dispatch_and_find
          done
