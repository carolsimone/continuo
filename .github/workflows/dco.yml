name: dco

# Runs on GitHub-hosted runners only. This must never route to the self-hosted box:
# it executes for pull requests from forks, which are untrusted by definition.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole PR commit range has to be walkable, not just the merge commit.
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            # Merge commits are generated by GitHub and carry no sign-off.
            if [ "$(git rev-list --no-walk --count --merges "$sha")" -eq 1 ]; then
              continue
            fi
            if ! git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha ($(git show -s --format='%an' "$sha")) has no Signed-off-by line."
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Every commit needs a Developer Certificate of Origin sign-off (see DCO)."
            echo "Fix an existing branch with:"
            echo "    git rebase --signoff origin/main && git push --force-with-lease"
            echo "Sign off future commits automatically with 'git commit -s'."
            exit 1
          fi
          echo "All commits signed off."
