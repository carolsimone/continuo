name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Free disk space
        # ubuntu-latest ships ~30 GB of tools we never use (Android SDK, .NET,
        # Haskell, large apt packages).  Removing them before any Docker work
        # gives ~20 GB of headroom so kind can save image tarballs to /tmp.
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Run pkg static guards
        # The pkg module holds cross-cutting static guards (stream/group-name
        # wiring, handler→adapter import rules, deploy-time migration
        # provisioning) that need no running infrastructure. Run them first so
        # they fail fast, before the slow docker/kind setup below.
        working-directory: pkg
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # install: true makes 'docker build' an alias for 'docker buildx build',
          # so docker compose build also benefits from the buildx cache backend.
          install: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or build base image
        # Normally pull continuo-base from Docker Hub (published by publish-base.yml).
        # Fall back to a local build only when Dockerfile.base itself changed in
        # this PR, because the published image hasn't been updated yet.
        run: |
          if git diff --name-only origin/main..HEAD | grep -q "^Dockerfile\.base$"; then
            echo "Dockerfile.base changed in this PR — building locally..."
            DOCKER_BUILDKIT=1 docker build -t continuo-base:latest -f Dockerfile.base .
          else
            echo "Pulling continuo-base from Docker Hub..."
            if docker pull ${{ secrets.DOCKERHUB_USERNAME }}/continuo-base:latest; then
              docker tag ${{ secrets.DOCKERHUB_USERNAME }}/continuo-base:latest continuo-base:latest
            else
              echo "Docker Hub pull failed (image may not exist yet) — building locally as fallback..."
              DOCKER_BUILDKIT=1 docker build -t continuo-base:latest -f Dockerfile.base .
            fi
          fi

      - name: Switch to docker driver for local image access
        # The docker-container buildx driver (used above for Docker Hub pull) runs
        # in an isolated container and cannot see local daemon images.
        # The default docker driver shares the daemon's image store, so
        # "FROM continuo-base:latest" resolves correctly in docker compose build.
        # Docker Engine 24+ (shipped on ubuntu-latest) supports type=gha cache
        # with the default driver, so docker compose build still benefits.
        run: docker buildx use default

      - name: Set up infrastructure
        # COMPOSE_FILE merges docker-compose.ci.yml so that docker compose build
        # uses GHA layer cache for all service images.
        # setup.sh inherits this env var and passes it to docker compose build.
        run: COMPOSE_FILE="docker-compose.yml:docker-compose.ci.yml" bash scripts/setup.sh

      - name: Wait for service containers to be running
        run: |
          for container in state orchestrator executor-controller k8s-controller manifest-controller release-controller; do
            echo "Waiting for $container..."
            for i in $(seq 1 30); do
              if docker inspect --format='{{.State.Running}}' "$container" 2>/dev/null | grep -q true; then
                echo "✓ $container is running"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "✗ $container failed to start within 60s"
                docker logs "$container" --tail 50 || true
                exit 1
              fi
              sleep 2
            done
          done

      - name: Start state and orchestrator service processes
        # Containers run `tail -f /dev/null` by default (dev mode).
        # Build and start the service binaries so that gRPC ports are open
        # before dependent controller tests run.
        run: |
          echo "Building and starting state service (gRPC :50051)..."
          docker exec state go build -o bin/state .
          docker exec -d state ./bin/state

          echo "Building and starting orchestrator service (gRPC :50052)..."
          docker exec orchestrator go build -o bin/orchestrator .
          docker exec -d orchestrator ./bin/orchestrator

          echo "Waiting for state gRPC port 50051..."
          for i in $(seq 1 30); do
            if docker exec state bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null; then
              echo "✓ state gRPC ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ state gRPC not ready after 60s"
              docker logs state --tail 30 || true
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for orchestrator gRPC port 50052..."
          for i in $(seq 1 30); do
            if docker exec orchestrator bash -c 'echo > /dev/tcp/localhost/50052' 2>/dev/null; then
              echo "✓ orchestrator gRPC ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ orchestrator gRPC not ready after 60s"
              docker logs orchestrator --tail 30 || true
              exit 1
            fi
            sleep 2
          done

      - name: Test state
        run: docker exec state make test-ci

      - name: Test orchestrator
        run: docker exec orchestrator make test-ci

      - name: Test executor-controller
        run: docker exec executor-controller make test-ci

      - name: Test k8s-controller
        run: docker exec k8s-controller make test-ci

      - name: Test manifest-controller
        run: docker exec manifest-controller uv run pytest -v

      - name: Verify ui-service proto is in sync with canonical
        # Drift in ui-service/proto/state.proto silently drops fields on the
        # wire — @grpc/proto-loader reads this copy at boot, so any divergence
        # from state/proto/state/v1/state.proto must fail loudly here.
        run: diff state/proto/state/v1/state.proto ui-service/proto/state.proto

      - name: Test ui-service
        # Run vitest unit tests directly on the CI runner (devDependencies are
        # not installed in the production container image).
        working-directory: ui-service
        run: npm ci && npm test

      # ── E2E test ────────────────────────────────────────────────────────────
      - name: Start services for e2e
        # Flyway migrations already ran as part of "docker compose up -d" in
        # setup.sh.  Build and start the remaining service binaries that the
        # e2e test needs beyond state/graph (which are already running above).
        run: |
          echo "Starting manifest-controller..."
          docker exec -d manifest-controller bash -c "cd /app && PYTHONPATH=/app/proto uv run python main.py > /tmp/mc.log 2>&1"
          sleep 3
          echo "✓ manifest-controller started"

          echo "Building and starting release-controller (HTTP :8088)..."
          docker exec release-controller go build -o bin/release-controller .
          docker exec -d release-controller ./bin/release-controller

          echo "Waiting for release-controller HTTP port 8088..."
          for i in $(seq 1 30); do
            if docker exec release-controller bash -c 'echo > /dev/tcp/localhost/8088' 2>/dev/null; then
              echo "✓ release-controller HTTP ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ release-controller HTTP not ready after 60s"
              docker logs release-controller --tail 30 || true
              exit 1
            fi
            sleep 2
          done

          echo "Starting agent-runner (gRPC :50053, health :8091)..."
          docker exec -d agent-runner bash -c "cd /app/agent-runner && go run . > /tmp/agent-runner.log 2>&1"

          # Wait for the gRPC listener itself, not just /health (which is the
          # always-200 liveness probe): the chat e2e dials 50053 through the
          # ui-service relay, so the port must be accepting before tests run.
          echo "Waiting for agent-runner gRPC port 50053 (go run compiles cold ~30-60s)..."
          for i in $(seq 1 60); do
            if docker exec agent-runner bash -c 'echo > /dev/tcp/localhost/50053' 2>/dev/null; then
              echo "✓ agent-runner gRPC ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "✗ agent-runner gRPC not ready after 120s"
              docker exec agent-runner tail -40 /tmp/agent-runner.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Start ui-service container
        run: |
          echo "Starting ui container (HTTP :8090)..."
          docker compose up -d ui

          echo "Waiting for ui :8090..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/api/schedulers > /dev/null 2>&1; then
              echo "✓ ui-service ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ ui-service not ready after 60s"
              docker logs ui --tail 30 || true
              exit 1
            fi
            sleep 2
          done

      - name: Deploy k8s controllers
        run: bash tests/e2e/deploy-k8s-controllers.sh

      - name: Run e2e test
        timeout-minutes: 30
        run: docker exec -e UI_HTTP_BASE=http://ui:8090 orchestrator go test -v -timeout 25m /app/tests/e2e/...

      - name: Cleanup k8s controllers
        if: always()
        run: bash tests/e2e/cleanup-k8s-controllers.sh
      # ────────────────────────────────────────────────────────────────────────

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans --volumes
