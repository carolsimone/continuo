name: ci

on:
  pull_request:
    branches:
      - main
  # Runs merged pull_request commits again with head_branch=main, since
  # pull_request-triggered runs are attributed to the PR's head branch, never
  # to main. Without this, the README's ci.yml badge (which shows the latest
  # run on the default branch) has no run to report and renders as failing.
  push:
    branches:
      - main

# A new push to a PR cancels any still-running build for that same PR. The single
# self-hosted runner serializes jobs, so without this it would tie up finishing a
# build for a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Fork-gated runner. Maintainer PRs (branches pushed inside this repo) run on
    # the self-hosted box (warm caches); fork PRs from outside contributors run on
    # free GitHub-hosted (sandboxed) — never on the self-hosted box, which has
    # prod-deploy reach. This expression is the routing default; the actual
    # security boundary is the repo setting "Require approval for all outside
    # collaborators", since a fork could otherwise edit this line.
    #
    # The `kind` label is REQUIRED, not decorative. This job runs scripts/setup.sh,
    # which creates a kind cluster named `continuo` — a fixed name — and whose
    # existence check (setup.sh:47) *adopts* an existing cluster instead of
    # failing. The runner box now has more than one agent, so without this label
    # two PRs building at once land on two agents, the second adopts the first's
    # cluster and `kind load`s its own images into it, and both runs report
    # results that are quietly wrong. Only one agent on the box carries `kind`,
    # so requiring it makes GitHub's scheduler serialize these jobs.
    #
    # fromJSON is needed because a ternary cannot yield a YAML sequence.
    runs-on: ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest'
      || fromJSON('["self-hosted","kind"]') }}
    # Hard backstop against runaway runs. Without this the job inherits GitHub's
    # 6-hour default, so a stuck step (e.g. a hung image build) can silently burn
    # hours of Actions minutes. Deliberately below the sum of the two step caps
    # below (50 + 110), keeping the same ratio to them this cap has always had:
    # it is a backstop against a hang, not a budget any healthy run approaches.
    timeout-minutes: 125

    # The repo's default workflow token is restricted (contents/metadata/packages
    # read only), which denies the pull-requests API that paths-filter uses to
    # detect changed files on PR events — grant that scope explicitly.
    permissions:
      contents: read
      pull-requests: read

    env:
      DOCKER_BUILDKIT: "1"

      # Pin the builder for every docker/compose invocation in this job. The
      # builds below resolve base tags that exist only in the local daemon
      # image store (continuo-base, dbt-base, s3-sidecar), which only the
      # docker driver can see: a docker-container builder runs isolated from
      # the daemon and resolves "FROM continuo-base:latest" against docker.io,
      # failing with "pull access denied". Setting it here rather than running
      # `docker buildx use` is deliberate — the env var applies to this job's
      # process tree only, so no other job can redirect these builds.
      BUILDX_BUILDER: default

    steps:
      - name: Free disk space
        # GitHub-hosted only (the fork-PR path). ubuntu-latest ships ~30 GB of
        # tools we never use (Android SDK, .NET, Haskell, large apt packages);
        # removing them before any Docker work gives ~20 GB of headroom so kind
        # can save image tarballs to /tmp. The self-hosted box has ample disk and
        # no passwordless sudo for these paths, so this step is skipped there.
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Isolate Docker client state
        # Keeps this job's builder selection and registry credentials out of the
        # ~/.docker that the two runner agents would otherwise share. Requires the
        # buildx/compose CLI plugins to be installed system-wide
        # (/usr/libexec/docker/cli-plugins, as on the runners and on
        # ubuntu-latest); a user-local ~/.docker/cli-plugins install would be
        # hidden and `docker buildx` would report "unknown command".
        uses: ./.github/actions/isolate-docker-state

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Run guards
        # The single copy of the fast, infra-free gates lives in the Makefile's
        # `guards` target (static check scripts, the pkg and stub-llm test
        # modules no other gate reaches, the ui proto sync diffs) —
        # see its comment block for what each gate protects. CI calls the
        # target verbatim so a gate added there reaches CI automatically;
        # check-ci-alignment.sh fails this step if the workflow re-inlines
        # any of them. Runs first so they fail fast, before the slow
        # docker/kind setup below.
        run: make guards

      - name: Lint Go services
        # Static analysis (golangci-lint v2) over the modules enrolled in
        # scripts/lint-ci-modules.txt. Runs early and needs no docker/kind/e2e
        # infra, so it fails fast before the slow setup. All install/run logic
        # lives in scripts/lint-go.sh to keep CI and local dev on one primitive.
        run: bash scripts/lint-go.sh --ci

      - name: Detect Dockerfile.base changes
        id: basefilter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            base:
              - 'Dockerfile.base'

      # Normally pull continuo-base from ghcr (published by publish-base.yml,
      # public package — anonymous pull), falling back to a local build if the
      # pull fails (e.g. first run or registry hiccup). But a PR that changes
      # Dockerfile.base must be tested against ITS OWN base, not the published
      # one — build locally in that case, so a broken base change fails CI
      # instead of merging unvalidated and poisoning the published :v1 tag.
      - name: Provide continuo-base image
        run: |
          # A PR that changes Dockerfile.base must be tested against ITS OWN
          # base, not the published one — build locally in that case (detected
          # via the paths-filter step; the shallow checkout has no history for
          # a git diff). Otherwise pull the published ghcr base (public
          # package, anonymous pull) and fall back to a local build if the
          # pull fails.
          # --load makes the result land in the daemon's image store, which is
          # where the service builds resolve "FROM continuo-base:latest" from.
          if [ "${{ steps.basefilter.outputs.base }}" = "true" ]; then
            echo "Dockerfile.base changed in this PR; building continuo-base locally..."
            DOCKER_BUILDKIT=1 docker build --load -t continuo-base:latest -f Dockerfile.base .
          elif docker pull ghcr.io/${{ github.repository_owner }}/continuo-base:v1; then
            docker tag ghcr.io/${{ github.repository_owner }}/continuo-base:v1 continuo-base:latest
          else
            echo "Pull failed; building continuo-base locally..."
            DOCKER_BUILDKIT=1 docker build --load -t continuo-base:latest -f Dockerfile.base .
          fi

      - name: Set up infrastructure
        # COMPOSE_FILE merges docker-compose.ci.yml so docker compose build uses
        # GHA layer cache. setup.sh builds images in small batches and loads them
        # into kind sequentially, because building/loading everything at once
        # thrashes the 2-CPU/7.75GB runner's memory and disk I/O badly enough to
        # stall (observed: a single image export hung ~27 min). The batched path
        # trades a few minutes of wall-clock for reliability.
        #
        # Hard cap via a process-GROUP watchdog. A plain `timeout` only kills the
        # foreground shell; setup.sh backgrounds `kind create &`, so on a hang the
        # orphaned kind keeps the step's output open and the cap never fires (this
        # burned hours before). `set -m` puts setup.sh in its own process group;
        # the watchdog SIGKILLs the whole group (negative PID), terminating
        # kind/docker children too, so the step always ends. Step-level
        # timeout-minutes is a backstop; the job has its own backstop.
        timeout-minutes: 50
        run: |
          set -m
          COMPOSE_FILE="docker-compose.yml:docker-compose.ci.yml" bash scripts/setup.sh &
          setup_pid=$!
          ( sleep 2700; echo "::error::Set up infrastructure exceeded 45m — killing process group"; \
            kill -KILL -"$setup_pid" 2>/dev/null ) &
          watchdog_pid=$!
          set +e
          wait "$setup_pid"; rc=$?
          kill -KILL -"$watchdog_pid" 2>/dev/null
          exit "$rc"

      - name: Wait for service containers
        # Block until all long-running service containers report Running=true.
        # wait_for_container_running is defined in scripts/lib/common.sh.
        run: |
          source scripts/lib/common.sh
          for c in state orchestrator executor-controller k8s-controller \
                   manifest-controller release-controller remediation remediation-agent agent-chat; do
            wait_for_container_running "$c"
          done

      - name: Test all Go services
        # Run on the runner via the shared Make target (not in-container): brings up
        # the data deps and runs `go test -tags integration` for all 8 services with
        # the full per-service DB env. Running on the runner (clean env) avoids the
        # container's ambient env leaking into config tests, and covers the 4 services
        # plus the -tags integration files that the old in-container path missed.
        run: make test-go

      - name: Test remediation-agent/adapters/packaging (in-container)
        # remediation-agent/adapters/packaging shells out to the continuo-runtime
        # CLI, which is installed only inside the remediation-agent image
        # (remediation-agent/Dockerfile.dev), never on the bare CI runner that the
        # step above runs on. cli_packager_test.go skips itself there for exactly
        # that reason, which would otherwise let this package's only integration
        # test pass CI without ever calling the real CLI. Run it here instead,
        # inside the remediation-agent container that "Wait for service
        # containers" already confirmed is up, where continuo-runtime is on PATH
        # and the Go toolchain + this PR's source are both baked into the image.
        # Every other Go test stays on the runner; this is the one package whose
        # dependency cannot exist there.
        run: docker exec remediation-agent go test -tags integration -count=1 ./adapters/packaging/... -v

      - name: Test manifest-controller
        run: docker exec manifest-controller uv run pytest -v

      - name: Test s3-sidecar
        # Unit-test the continuo-owned sidecar scripts (compile_uploader,
        # parse_cache_fetcher, s3_common) against boto3 in the uv image. No committed
        # uv.lock, so use ephemeral --with deps rather than uv sync --frozen.
        run: |
          docker run --rm -v "$PWD/s3-sidecar:/app" -w /app \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
            sh -c "uv run --with boto3 --with pytest pytest tests/ -v"

      - name: Test dbt compile + S3 upload (integration)
        # Runs every @pytest.mark.integration test under dbt/tests (test_upload.py's
        # compile+S3 round trip and test_parse_rehearsal.py's real-dbt partial-parse
        # rehearsal + fetcher round trip), not just one file, so a new integration
        # test module is picked up here automatically.
        run: |
          docker exec \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e S3_ENDPOINT_URL=http://localstack:4566 \
            -e S3_BUCKET=continuo \
            dbt-compile-and-load \
            uv run --with pytest pytest tests/ -v -m integration

      - name: Set up Node
        # ui vitest runs directly on the runner. GitHub-hosted preinstalls
        # Node, but the self-hosted box does not — set it up explicitly on both.
        # Pinned to 20 to match ui's production image (node:20-alpine).
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Test ui
        # Run vitest unit tests directly on the CI runner (devDependencies are
        # not installed in the production container image).
        working-directory: ui
        run: npm ci && npm test

      # ── E2E test ────────────────────────────────────────────────────────────
      - name: Start services for e2e
        # Build and start all service binaries the e2e suite depends on.
        # All build/run/wait logic lives in tests/e2e/start-services.sh.
        run: bash tests/e2e/start-services.sh

      - name: Start ui + deploy + e2e
        # Start the ui container, wait for it to become healthy, deploy k8s
        # controllers, then run the full e2e suite inside the orchestrator
        # container where the test code lives. Comfortably exceeds the go
        # test -timeout below (100m) plus the ui-wait/deploy steps that run
        # first in this same step.
        #
        # The 100m go timeout is derived, not measured: it strictly exceeds the
        # 56 minutes the two python-remediation tests' own context deadlines sum
        # to (22 + 34, see tests/e2e/remediation_python_test.go) plus the 40m
        # this suite budgeted for everything else before they existed. Every
        # per-test context must be able to fire first, or an operator gets a
        # goroutine dump instead of a named assertion.
        timeout-minutes: 110
        run: |
          source scripts/lib/common.sh
          docker compose up -d ui && wait_for_http_host http://localhost:8090/api/schedulers
          bash tests/e2e/deploy-k8s-controllers.sh
          docker exec -e UI_HTTP_BASE=http://ui:8090 orchestrator go test -v -timeout 100m /app/tests/e2e/...

      - name: Cleanup k8s controllers
        if: always()
        run: bash tests/e2e/cleanup-k8s-controllers.sh
      # ────────────────────────────────────────────────────────────────────────

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans --volumes
