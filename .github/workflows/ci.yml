name: ci

on:
  pull_request:
    branches:
      - main

# A new push to a PR cancels any still-running build for that same PR. The single
# self-hosted runner serializes jobs, so without this it would tie up finishing a
# build for a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Fork-gated runner. Maintainer PRs (branches pushed inside this repo) run on
    # the fast self-hosted box (8 vCPU / 16 GB, warm caches); fork PRs from
    # outside contributors run on free GitHub-hosted (sandboxed) — never on the
    # self-hosted box, which has prod-deploy reach. This expression is the routing
    # default; the actual security boundary is the repo setting "Require approval
    # for all outside collaborators", since a fork could otherwise edit this line.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    # Hard backstop against runaway runs. Without this the job inherits GitHub's
    # 6-hour default, so a stuck step (e.g. a hung image build) can silently burn
    # hours of Actions minutes. A healthy run is ~55 min; cap well below the
    # default. The slow setup phase carries its own tighter cap below.
    timeout-minutes: 75

    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Free disk space
        # GitHub-hosted only (the fork-PR path). ubuntu-latest ships ~30 GB of
        # tools we never use (Android SDK, .NET, Haskell, large apt packages);
        # removing them before any Docker work gives ~20 GB of headroom so kind
        # can save image tarballs to /tmp. The self-hosted box has ample disk and
        # no passwordless sudo for these paths, so this step is skipped there.
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Run pkg static guards
        # The pkg module holds cross-cutting static guards (stream/group-name
        # wiring, handler→adapter import rules, deploy-time migration
        # provisioning) that need no running infrastructure. Run them first so
        # they fail fast, before the slow docker/kind setup below.
        working-directory: pkg
        run: go test ./...

      - name: Run guards
        # Fail fast if ci.yml contains inline build/run/wait logic that should
        # live in shared scripts. Keeps CI and local dev on the same primitives.
        run: bash scripts/check-ci-alignment.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # install: true makes 'docker build' an alias for 'docker buildx build',
          # so docker compose build also benefits from the buildx cache backend.
          install: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or build base image
        # Normally pull continuo-base from Docker Hub (published by publish-base.yml).
        # Fall back to a local build only when Dockerfile.base itself changed in
        # this PR, because the published image hasn't been updated yet.
        run: |
          if git diff --name-only origin/main..HEAD | grep -q "^Dockerfile\.base$"; then
            echo "Dockerfile.base changed in this PR — building locally..."
            DOCKER_BUILDKIT=1 docker build -t continuo-base:latest -f Dockerfile.base .
          else
            echo "Pulling continuo-base from Docker Hub..."
            if docker pull ${{ secrets.DOCKERHUB_USERNAME }}/continuo-base:latest; then
              docker tag ${{ secrets.DOCKERHUB_USERNAME }}/continuo-base:latest continuo-base:latest
            else
              echo "Docker Hub pull failed (image may not exist yet) — building locally as fallback..."
              DOCKER_BUILDKIT=1 docker build -t continuo-base:latest -f Dockerfile.base .
            fi
          fi

      - name: Switch to docker driver for local image access
        # The docker-container buildx driver (used above for Docker Hub pull) runs
        # in an isolated container and cannot see local daemon images.
        # The default docker driver shares the daemon's image store, so
        # "FROM continuo-base:latest" resolves correctly in docker compose build.
        # Docker Engine 24+ (shipped on ubuntu-latest) supports type=gha cache
        # with the default driver, so docker compose build still benefits.
        run: docker buildx use default

      - name: Set up infrastructure
        # COMPOSE_FILE merges docker-compose.ci.yml so docker compose build uses
        # GHA layer cache. setup.sh builds images in small batches and loads them
        # into kind sequentially, because building/loading everything at once
        # thrashes the 2-CPU/7.75GB runner's memory and disk I/O badly enough to
        # stall (observed: a single image export hung ~27 min). The batched path
        # trades a few minutes of wall-clock for reliability.
        #
        # Hard cap via a process-GROUP watchdog. A plain `timeout` only kills the
        # foreground shell; setup.sh backgrounds `kind create &`, so on a hang the
        # orphaned kind keeps the step's output open and the cap never fires (this
        # burned hours before). `set -m` puts setup.sh in its own process group;
        # the watchdog SIGKILLs the whole group (negative PID), terminating
        # kind/docker children too, so the step always ends. Step-level
        # timeout-minutes is a backstop; the job has its own backstop.
        timeout-minutes: 50
        run: |
          set -m
          COMPOSE_FILE="docker-compose.yml:docker-compose.ci.yml" bash scripts/setup.sh &
          setup_pid=$!
          ( sleep 2700; echo "::error::Set up infrastructure exceeded 45m — killing process group"; \
            kill -KILL -"$setup_pid" 2>/dev/null ) &
          watchdog_pid=$!
          set +e
          wait "$setup_pid"; rc=$?
          kill -KILL -"$watchdog_pid" 2>/dev/null
          exit "$rc"

      - name: Wait for service containers
        # Block until all long-running service containers report Running=true.
        # wait_for_container_running is defined in scripts/lib/common.sh.
        run: |
          source scripts/lib/common.sh
          for c in state orchestrator executor-controller k8s-controller \
                   manifest-controller release-controller remediation remediation-agent agent-runner; do
            wait_for_container_running "$c"
          done

      - name: Test all Go services
        # Run on the runner via the shared Make target (not in-container): brings up
        # the data deps and runs `go test -tags integration` for all 8 services with
        # the full per-service DB env. Running on the runner (clean env) avoids the
        # container's ambient env leaking into config tests, and covers the 4 services
        # plus the -tags integration files that the old in-container path missed.
        run: make test-go

      - name: Test manifest-controller
        run: docker exec manifest-controller uv run pytest -v

      - name: Test validation-runner
        # Run the validation-runner unit tests against the committed lockfile so CI
        # matches the image's pinned deps. Uses the uv image so the step needs only Docker.
        run: |
          docker run --rm -v "$PWD/validation-runner:/app" -w /app \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
            sh -c "uv sync --frozen --extra dev && uv run pytest -v"

      - name: Test dbt compile + S3 upload (integration)
        run: |
          docker exec \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e S3_ENDPOINT_URL=http://localstack:4566 \
            -e S3_BUCKET=continuo \
            dbt-compile-and-load \
            uv run --with pytest pytest tests/test_upload.py -v -m integration

      - name: Verify ui-service proto is in sync with canonical
        # Drift in ui-service/proto/state.proto silently drops fields on the
        # wire — @grpc/proto-loader reads this copy at boot, so any divergence
        # from state/proto/state/v1/state.proto must fail loudly here.
        run: diff state/proto/state/v1/state.proto ui-service/proto/state.proto

      - name: Set up Node
        # ui-service vitest runs directly on the runner. GitHub-hosted preinstalls
        # Node, but the self-hosted box does not — set it up explicitly on both.
        # Pinned to 20 to match ui-service's production image (node:20-alpine).
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test ui-service
        # Run vitest unit tests directly on the CI runner (devDependencies are
        # not installed in the production container image).
        working-directory: ui-service
        run: npm ci && npm test

      # ── E2E test ────────────────────────────────────────────────────────────
      - name: Start services for e2e
        # Build and start all service binaries the e2e suite depends on.
        # All build/run/wait logic lives in tests/e2e/start-services.sh.
        run: bash tests/e2e/start-services.sh

      - name: Start ui + deploy + e2e
        # Start the ui container, wait for it to become healthy, deploy k8s
        # controllers, then run the full e2e suite inside the orchestrator
        # container where the test code lives.
        timeout-minutes: 30
        run: |
          source scripts/lib/common.sh
          docker compose up -d ui && wait_for_http_host http://localhost:8090/api/schedulers
          bash tests/e2e/deploy-k8s-controllers.sh
          docker exec -e UI_HTTP_BASE=http://ui:8090 orchestrator go test -v -timeout 25m /app/tests/e2e/...

      - name: Cleanup k8s controllers
        if: always()
        run: bash tests/e2e/cleanup-k8s-controllers.sh
      # ────────────────────────────────────────────────────────────────────────

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans --volumes
