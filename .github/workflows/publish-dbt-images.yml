name: Publish dbt service images (manual ad-hoc only)

# The continuo-owned s3-sidecar image is published by deploy.yml's build-publish
# matrix (as continuo-s3-sidecar:<sha> + :latest) on every deploy, so it is NOT
# built here. This workflow rebuilds only the example/e2e dbt images — dbt-base
# and the service-N projects — which are not part of continuo's CD. It is a
# manual safety valve for ad-hoc rebuilds (e.g. testing dbt changes without a
# full rollout) and only produces :latest tags.
on:
  workflow_dispatch:

jobs:
  publish:
    # Self-hosted for the warm Docker layer cache (builds + pushes the dbt service
    # images). Manual ad-hoc workflow_dispatch only (trusted), so no fork exposure.
    runs-on: self-hosted

    permissions:
      contents: read

    env:
      # Private Docker client state: both self-hosted agents run as the same OS
      # user, so on a shared ~/.docker a concurrent job's docker/login-action
      # post step logs out and these pushes lose their credentials mid-flight.
      DOCKER_CONFIG: ${{ runner.temp }}/.docker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        # dbt-base is python:3.12-slim + pip installs, so the arm64 half builds
        # under emulation.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build dbt-base locally (not pushed; used as base layer for service images)
      - name: Build dbt-base
        uses: docker/build-push-action@v7
        with:
          context: dbt/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dbt-base:latest
          cache-from: type=gha,scope=dbt-base
          cache-to: type=gha,mode=max,scope=dbt-base

      # One step per service. Image name = DOCKERHUB_USERNAME/service-N:latest,
      # matching the dbt project name and params.ServiceName in executor-controller.
      - name: Build and push service-1
        uses: docker/build-push-action@v7
        with:
          context: dbt/services/service-1
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/service-1:latest
          cache-from: type=gha,scope=dbt-service-1
          cache-to: type=gha,mode=max,scope=dbt-service-1

      - name: Build and push service-2
        uses: docker/build-push-action@v7
        with:
          context: dbt/services/service-2
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/service-2:latest
          cache-from: type=gha,scope=dbt-service-2
          cache-to: type=gha,mode=max,scope=dbt-service-2

      - name: Build and push service-3
        uses: docker/build-push-action@v7
        with:
          context: dbt/services/service-3
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/service-3:latest
          cache-from: type=gha,scope=dbt-service-3
          cache-to: type=gha,mode=max,scope=dbt-service-3
