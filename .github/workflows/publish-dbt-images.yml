name: Publish dbt service images (manual ad-hoc only)

# Auto-triggering moved into deploy.yml's build-publish-dbt job, which
# pushes both :${{ github.sha }} AND :latest tags as part of every deploy.
# This workflow is kept as a manual safety valve for ad-hoc rebuilds
# (e.g. testing a hotfix branch's dbt changes without doing a full Go
# rollout) and only produces :latest tags.
on:
  workflow_dispatch:

jobs:
  publish:
    # Self-hosted for the warm Docker layer cache (builds + pushes the dbt service
    # images). Manual ad-hoc workflow_dispatch only (trusted), so no fork exposure.
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build dbt-base locally (not pushed; used as base layer for service images)
      - name: Build dbt-base
        uses: docker/build-push-action@v6
        with:
          context: dbt/base
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dbt-base:latest
          cache-from: type=gha,scope=dbt-base
          cache-to: type=gha,mode=max,scope=dbt-base

      - name: Build and push s3-sidecar
        uses: docker/build-push-action@v6
        with:
          context: dbt/s3-sidecar
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/s3-sidecar:latest
          cache-from: type=gha,scope=s3-sidecar
          cache-to: type=gha,mode=max,scope=s3-sidecar

      - name: Build and push validation-runner
        uses: docker/build-push-action@v6
        with:
          context: validation-runner
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/validation-runner:latest
          cache-from: type=gha,scope=validation-runner
          cache-to: type=gha,mode=max,scope=validation-runner

      # One step per service. Image name = DOCKERHUB_USERNAME/service-N:latest,
      # matching the dbt project name and params.ServiceName in executor-controller.
      - name: Build and push service-1
        uses: docker/build-push-action@v6
        with:
          context: dbt/services/service-1
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/service-1:latest
          cache-from: type=gha,scope=dbt-service-1
          cache-to: type=gha,mode=max,scope=dbt-service-1

      - name: Build and push service-2
        uses: docker/build-push-action@v6
        with:
          context: dbt/services/service-2
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/service-2:latest
          cache-from: type=gha,scope=dbt-service-2
          cache-to: type=gha,mode=max,scope=dbt-service-2

      - name: Build and push service-3
        uses: docker/build-push-action@v6
        with:
          context: dbt/services/service-3
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/service-3:latest
          cache-from: type=gha,scope=dbt-service-3
          cache-to: type=gha,mode=max,scope=dbt-service-3
