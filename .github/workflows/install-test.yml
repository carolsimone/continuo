name: install-test

# Chart install gate for deploy/continuo: lints the chart across every
# supported values topology, then installs it on a throwaway kind cluster in
# bundled and BYO (inline + existingSecret) modes and verifies health.
#
# Runs on PRs that touch the chart or this harness, and as a callable gate
# for the release workflow (which passes the release image tag). PR runs
# install the latest published main-branch images from ghcr — this proves the
# install path; ci.yml's e2e suite proves the code.
#
# Always GitHub-hosted: needs no repo secrets (the ghcr images are public),
# so it is fork-safe and never routes to the self-hosted box.
#
# The kind cluster created by helm/kind-action enforces NetworkPolicies, so
# the chart's default-deny and allow policies are behaviorally exercised
# here, not just rendered: the BYO fixtures need their own explicit
# ingress-allow policies precisely because the default-deny blocks them
# otherwise.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/continuo/**'
      - 'scripts/install-test/**'
      - '.github/workflows/install-test.yml'
      # release.yml and the scripts it drives have no other CI gate — this
      # is the only workflow that parses and exercises them (run.sh sources
      # common.sh, and install-test is the callable gate release.yml runs
      # against a live tag).
      - 'scripts/release/**'
      - '.github/workflows/release.yml'
      - 'scripts/lib/common.sh'
  workflow_call:
    inputs:
      image_tag:
        description: Tag of the published continuo images the chart installs.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch PR base commit
        # Needed by the changelog check below to diff against; a plain
        # checkout only has the PR merge commit at depth 1.
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Require a CHANGELOG.md entry for chart changes
        # Only meaningful on PRs — a release-tag-triggered workflow_call run
        # has no PR base to diff against, and the PR that shipped the change
        # was already gated on this.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/install-test/changelog-check.sh

      - name: Set up Go
        # lint.sh executes kube-linter through a version-pinned `go run`, so
        # besides the runner's preinstalled helm it only needs Go.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Lint chart across values topologies
        run: bash scripts/install-test/lint.sh

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [bundled, byo-inline, byo-secret]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: install-test

      - name: Fetch PR base commit
        # The build-load step below diffs against it to pick the changed
        # images; a plain checkout only has the PR merge commit at depth 1.
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Build and load PR-changed images into kind
        # PR runs install with global.imageTag=latest, which otherwise pulls the
        # images published from main. A PR that renames a service or database
        # references image names / migrations that main's :latest lacks, failing
        # the install against stale images. Build only what this PR changed and
        # side-load it so those refs are already present (imagePullPolicy is
        # IfNotPresent, so a loaded image wins); everything unchanged still pulls
        # published :latest. Skipped on workflow_call (release), which passes a
        # real published image_tag and must pull it unchanged.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLUSTER: install-test
          TAG: latest
        run: bash scripts/install-test/build-load-pr-images.sh

      - name: Install and verify (${{ matrix.mode }})
        # inputs.image_tag is empty on pull_request events (the inputs
        # context only exists for workflow_call) — default to the latest
        # published main-branch images. It is routed through env: rather
        # than interpolated into the script text because release.yml feeds
        # it github.ref_name (a tag name), which must never become live
        # shell text in a run: step. matrix.mode is a static value from the
        # matrix list above, not an untrusted expression, so it stays inline.
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: bash scripts/install-test/run.sh "${{ matrix.mode }}" "$IMAGE_TAG"

      - name: Diagnostics on failure
        if: failure()
        run: bash scripts/install-test/diagnose.sh
