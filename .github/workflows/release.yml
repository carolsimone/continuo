name: release

# Release flow, triggered by pushing a v* tag on a main commit:
#   1. retag-images  — alias every published :<commit-sha> image to the
#                      release tag (fails closed if the commit never went
#                      through deploy.yml's build-publish).
#   2. install-test  — the reusable kind install gate, run against the
#                      freshly tagged images. A failing install blocks the
#                      chart publish.
#   3. publish-chart — helm package with version=X.Y.Z / appVersion=vX.Y.Z
#                      (appVersion is the chart's default image tag, so the
#                      published chart pins every image to this release) and
#                      push to oci://ghcr.io/<owner>/charts.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retag-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          # For annotated tags GITHUB_SHA can be the tag OBJECT, not the
          # commit it points at — dereference explicitly.
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag images to the release tag
        run: >
          bash scripts/release/retag-images.sh
          "${{ steps.meta.outputs.commit }}"
          "${{ github.ref_name }}"
          "${{ github.repository_owner }}"

  install-test:
    needs: retag-images
    uses: ./.github/workflows/install-test.yml
    with:
      image_tag: ${{ github.ref_name }}

  publish-chart:
    needs:
      - retag-images
      - install-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.retag-images.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (helm)
        run: helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push chart
        run: |
          helm package deploy/continuo --version "${VERSION}" --app-version "${GITHUB_REF_NAME}"
          helm push "continuo-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Verify the published chart pulls back
        run: |
          mkdir -p /tmp/chart-verify
          helm pull "oci://ghcr.io/${{ github.repository_owner }}/charts/continuo" \
            --version "${VERSION}" -d /tmp/chart-verify
          helm show chart "/tmp/chart-verify/continuo-${VERSION}.tgz" | grep -E "^(version|appVersion):"
