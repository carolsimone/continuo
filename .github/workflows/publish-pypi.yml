name: publish-pypi

# Publishes the continuo-validation-contract package via PyPI Trusted Publishing
# (OIDC, no stored token). Tag `contract-v<ver>-test<n>` publishes to TestPyPI;
# `contract-v<ver>` publishes to real PyPI. The GitHub environment name is what
# each PyPI "pending publisher" is registered against.
on:
  push:
    tags: ["contract-v*"]

permissions: {}

jobs:
  publish-contract:
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-test') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: read # actions/checkout needs read access to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the sdist + wheel
        run: uv build validation-contract -o dist
      - name: Publish to TestPyPI
        if: contains(github.ref_name, '-test')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
