name: publish-pypi

# Publishes the continuo-validation-contract package via PyPI Trusted Publishing
# (OIDC, no stored token). Tag `contract-v<ver>-test<n>` publishes to TestPyPI;
# `contract-v<ver>` publishes to real PyPI. The GitHub environment name is what
# each PyPI "pending publisher" is registered against.
on:
  push:
    tags: ["contract-v*"]

permissions: {}

jobs:
  publish-contract:
    runs-on: self-hosted
    environment: ${{ contains(github.ref_name, '-test') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: read # actions/checkout needs read access to the repo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # repo has a symlink loop (.opencode/) that breaks the cache tree-walk
      - name: Build the sdist + wheel
        run: uv build validation-contract -o dist
      - name: Publish to TestPyPI
        if: contains(github.ref_name, '-test')
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
