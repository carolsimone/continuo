# Dependabot keeps dependencies current so that known CVEs are fixed by an
# upgrade before a scanner has to report them.
#
# Every ecosystem groups its patch and minor updates into a single pull request
# per week. Ungrouped, this monorepo's eleven Go modules plus npm, uv, Actions and
# Docker would open dozens of pull requests a week and the noise would guarantee
# they all get ignored. Major updates stay ungrouped because they carry breaking
# changes and need to be reviewed one at a time.
version: 2

updates:
  # Every Go module in the repository: the go.work members, cli (outside the
  # workspace by design, see CLAUDE.md), and the two e2e stub servers, which are
  # also standalone modules and so are invisible to a workspace-wide update.
  - package-ecosystem: gomod
    directories:
      - /agent-runner
      - /cli
      - /executor-controller
      - /k8s-controller
      - /orchestrator
      - /pkg
      - /release-controller
      - /remediation
      - /remediation-agent
      - /state
      - /tests/e2e
      - /tests/e2e/stub-github
      - /tests/e2e/stub-llm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major bumps only, and only for version updates — the `ignore` key does
      # not apply to security updates, so a major that fixes an advisory still
      # arrives. Majors are where the breakage lives here (React 19 needing act()
      # in fake-timer tests, jsdom 29 border longhands, a react-dom partial group
      # breaking `npm ci`), so they should be opened deliberately rather than
      # landing unprompted alongside routine patches.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Kubernetes libraries are versioned v0.x, so a whole Kubernetes
      # release registers as a minor bump and lands in the grouped pull request
      # unreviewed. They have to track the cluster: client-go is supported
      # against an API server within one minor version either way, and kind runs
      # kindest/node:v1.34.0, so v0.35.x is the ceiling that stays inside that
      # window. v0.36.0 also requires go 1.26.0, which would raise the go
      # directive of executor-controller and k8s-controller above go.work's
      # 1.25.12 — leaving the workspace unloadable, and moving the CI toolchain
      # with it, since CI resolves Go from go-version-file: go.work.
      # Raise this ceiling when the kind node image moves to 1.35 or later.
      - dependency-name: "k8s.io/*"
        versions: [">=0.36.0"]
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /ui-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major bumps only, and only for version updates — the `ignore` key does
      # not apply to security updates, so a major that fixes an advisory still
      # arrives. Majors are where the breakage lives here (React 19 needing act()
      # in fake-timer tests, jsdom 29 border longhands, a react-dom partial group
      # breaking `npm ci`), so they should be opened deliberately rather than
      # landing unprompted alongside routine patches.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  # The Python service manifest-controller, a uv project with its own
  # pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directories:
      - /manifest-controller
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major bumps only, and only for version updates — the `ignore` key does
      # not apply to security updates, so a major that fixes an advisory still
      # arrives. Majors are where the breakage lives here (React 19 needing act()
      # in fake-timer tests, jsdom 29 border longhands, a react-dom partial group
      # breaking `npm ci`), so they should be opened deliberately rather than
      # landing unprompted alongside routine patches.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  # Actions are a supply-chain surface in their own right: a compromised or
  # abandoned action runs with access to the workflow token and, for maintainer
  # pull requests, the self-hosted runner.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major bumps only, and only for version updates — the `ignore` key does
      # not apply to security updates, so a major that fixes an advisory still
      # arrives. Majors are where the breakage lives here (React 19 needing act()
      # in fake-timer tests, jsdom 29 border longhands, a react-dom partial group
      # breaking `npm ci`), so they should be opened deliberately rather than
      # landing unprompted alongside routine patches.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)

  # Base images across Dockerfile.base, the per-service Dockerfile.dev/.prod and
  # the dbt images. Most base-image CVEs are fixed by moving to a newer tag.
  - package-ecosystem: docker
    directories:
      - /**
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major bumps only, and only for version updates — the `ignore` key does
      # not apply to security updates, so a major that fixes an advisory still
      # arrives. Majors are where the breakage lives here (React 19 needing act()
      # in fake-timer tests, jsdom 29 border longhands, a react-dom partial group
      # breaking `npm ci`), so they should be opened deliberately rather than
      # landing unprompted alongside routine patches.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
