[project]
name = "manifest-controller"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sqlglot>=30.17.0",
    "redis>=8.1.0",
    "grpcio>=1.62.0",
    "protobuf>=7.35.1",
    "boto3>=1.43.75",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.12.0",
    "grpcio-tools>=1.62.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "domain", "adapters", "service", "proto"]

[tool.pytest.ini_options]
pythonpath = [".", "proto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
