[project]
name = "manifest-controller"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sqlglot>=23.0.0",
    "redis>=5.0.0",
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "grpcio-tools>=1.62.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "domain", "adapters", "service", "proto"]

[tool.pytest.ini_options]
pythonpath = [".", "proto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
