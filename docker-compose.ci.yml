# CI-only override: adds GHA layer cache to every service build.
# Applied via COMPOSE_FILE="docker-compose.yml:docker-compose.ci.yml" in ci.yml.
# Never used locally.
services:
  state:
    build:
      cache_from:
        - "type=gha,scope=state"
      cache_to:
        - "type=gha,scope=state,mode=max"

  executor-controller:
    build:
      cache_from:
        - "type=gha,scope=executor-controller"
      cache_to:
        - "type=gha,scope=executor-controller,mode=max"

  orchestrator:
    build:
      cache_from:
        - "type=gha,scope=orchestrator"
      cache_to:
        - "type=gha,scope=orchestrator,mode=max"

  k8s-controller:
    build:
      cache_from:
        - "type=gha,scope=k8s-controller"
      cache_to:
        - "type=gha,scope=k8s-controller,mode=max"

  ui:
    build:
      cache_from:
        - "type=gha,scope=ui"
      cache_to:
        - "type=gha,scope=ui,mode=max"

  release-controller:
    build:
      cache_from:
        - "type=gha,scope=release-controller"
      cache_to:
        - "type=gha,scope=release-controller,mode=max"

  remediation:
    build:
      cache_from:
        - "type=gha,scope=remediation"
      cache_to:
        - "type=gha,scope=remediation,mode=max"

  agent-remediation:
    build:
      cache_from:
        - "type=gha,scope=agent-remediation"
      cache_to:
        - "type=gha,scope=agent-remediation,mode=max"

  agent-chat:
    build:
      cache_from:
        - "type=gha,scope=agent-chat"
      cache_to:
        - "type=gha,scope=agent-chat,mode=max"

  manifest-controller:
    build:
      cache_from:
        - "type=gha,scope=manifest-controller"
      cache_to:
        - "type=gha,scope=manifest-controller,mode=max"

  dbt-compile-and-load:
    build:
      cache_from:
        - "type=gha,scope=dbt-compile-and-load"
      cache_to:
        - "type=gha,scope=dbt-compile-and-load,mode=max"
