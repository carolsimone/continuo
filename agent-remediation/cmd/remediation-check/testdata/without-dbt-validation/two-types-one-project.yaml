# An install's fixture of the flow scenario two_types_one_project, for a
# rejected-release flow that lists no dbt-validation. Two clusters of two types
# fix the sales project: orders is a dbt-parse fix of its own, and
# daily_orders and weekly_orders share one fix at base_orders. One
# verification run checks both edits, and one attempt carries them.
kind: fixture
version: 1
flow: rejected-release
scenario: two_types_one_project
trigger:
  source: parse
  release_id: rel-lint-two-types
  repo: o/repo
  commit_sha: sha-lint-two-types
  code_bundle_uri: s3://continuo/code-bundles/rel-lint-two-types/bundle.json
  nodes:
    - node_id: model.sales.orders
      category: parse
      error_signature: sig-orders-comma
      reason: parse_error
      error_excerpt: "Expecting ). Line 1, Col: 12.\n  select id total"
      file_path: models/orders.sql
      project: sales
      node_type: dbt-model
    - node_id: model.sales.daily_orders
      category: parse
      error_signature: sig-base-orders-amount
      reason: parse_error
      error_excerpt: 'base_orders.amount is not declared'
      file_path: models/daily_orders.sql
      project: sales
      node_type: dbt-model
      changed_ancestors:
        - { node_id: model.sales.base_orders, file_path: models/base_orders.sql, project: sales, depth: 1 }
    - node_id: model.sales.weekly_orders
      category: parse
      error_signature: sig-base-orders-amount
      reason: parse_error
      error_excerpt: 'base_orders.amount is not declared'
      file_path: models/weekly_orders.sql
      project: sales
      node_type: dbt-model
      changed_ancestors:
        - { node_id: model.sales.base_orders, file_path: models/base_orders.sql, project: sales, depth: 1 }
project_repo_paths:
  sales: services/sales
repo_files:
  services/sales/models/orders.sql: "select id total from raw_orders\n"
  services/sales/models/base_orders.sql: "select id from analytics.raw_orders\n"
  services/sales/dbt_project.yml: "name: sales\n"
bundle:
  model.sales.base_orders: { runtime: dbt, raw_code: "select id from analytics.raw_orders\n" }
release:
  image_tag: sha-lint-two-types
answers:
  pass:
    - proposed_sql: "select id, amount from analytics.raw_orders\n"
      rationale: restored the amount column both members read
      confidence: high
      model: claude-test
member_answers:
  model.sales.orders:
    pass:
      - target_file: services/sales/models/orders.sql
        proposed_content: "select id, total from raw_orders\n"
        rationale: added the missing comma
        confidence: high
        model: claude-test
