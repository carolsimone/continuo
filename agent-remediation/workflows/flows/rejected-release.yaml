# The flow a rejected release runs: every fixable failure of the release is
# grouped into clusters, each cluster is fixed by the first type below that
# matches it, and the try's edits are checked together and verified by one
# release check per edited project before a pull request is proposed.
kind: flow
version: 1
name: rejected-release
trigger: heal.triggered
types:
  - dbt-compile
  - dbt-parse
  - seed-build
  - duplicate-table
  - dbt-validation
  - python-validation
  - python-parse
  - csv-validation
  - shared-upstream
  - cross-project-upstream
context: [previous_tries]
across_clusters: [edits_map_to_a_project, no_path_edited_twice, one_manifest_kind]
gate: [release_check]
tries: 3
# The model may be shown source code and the text that failures and tools
# report (logs), and no rows of data. A type that gathers evidence of another
# class is refused at startup.
model_may_see: [code, logs]
output:
  on_pass: { action: pull_request, emits: remediation.proposed }
  on_give_up: { action: hand_over, emits: remediation.handed_over }
# Each node's owner must approve what the remediation did with it: the owner
# the release's code bundle records, else the team.name of its ODCS contract.
approver: node_owner
