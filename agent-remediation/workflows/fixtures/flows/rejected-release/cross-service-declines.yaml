# The cross-service cluster at core's orders declines: the release's code
# bundle does not hold it. Its finance member is handed over skipped, since a
# fix in finance cannot ship before core's.
kind: fixture
version: 1
flow: rejected-release
scenario: cross_service_declines
trigger:
  source: validation
  release_id: rel-flow-cross-declines
  repo: o/repo
  commit_sha: sha-cross-declines
  code_bundle_uri: s3://continuo/code-bundles/rel-flow-cross-declines/bundle.json
  nodes:
    - node_id: model.finance.revenue
      category: validation
      error_signature: sig-revenue-amount
      reason: missing_column
      error_excerpt: 'column orders.amount does not exist'
      candidate_artifact_uri: s3://candidates/rel-flow-cross-declines/model.finance.revenue.sql
      file_path: models/revenue.sql
      service: finance
      node_type: dbt-model
      changed_ancestors:
        - { node_id: model.core.orders, file_path: models/orders.sql, service: core, depth: 1 }
service_repo_paths:
  core: services/core
  finance: services/finance
release:
  image_tag: sha-cross-declines
answers:
  pass:
    - proposed_sql: "select id, amount from analytics.raw_orders\n"
      rationale: unused, the cluster declines first
      confidence: high
