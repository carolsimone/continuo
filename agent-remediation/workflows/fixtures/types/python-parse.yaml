# A python node whose declared read names its relation without a schema, which
# the release's SQL parser rejects. The fix qualifies the relation in the
# node's ODCS contract. Built from the e2e fixture tests/e2e/fixtures/py-remediation-repo
# (services/svc-py-e2e-parse) and the python parse lane's tests
# (service/fixer/python_parse_test.go). A parse rejection has no code bundle.
kind: fixture
version: 1
type: python-parse
trigger:
  source: parse
  release_id: rel-python-parse-1
  repo: o/demo
  commit_sha: deadbeef
  nodes:
    - node_id: e2e_schema.py_unqualified_read
      category: parse
      error_signature: sig-unqualified-reference
      reason: unqualified_reference
      error_excerpt: "read orders references right_name, which names no schema"
      service: svc-py-e2e-parse
      node_type: python-node
service_repo_paths:
  svc-py-e2e-parse: services/svc-py-e2e-parse
repo_files:
  services/svc-py-e2e-parse/contracts/py_unqualified_read.odcs.yaml: |
    apiVersion: v3.2.0
    kind: DataContract
    id: e2e_schema.py_unqualified_read
    name: py_unqualified_read
    version: "0"
    description:
      purpose: "python node whose declared read is not schema-qualified"
    team:
      name: e2e
    customProperties:
      - {vendor: continuo, property: schedule, value: daily}
      - {vendor: continuo, property: criticality, value: SECONDARY}
      - {vendor: continuo, property: script, value: scripts/py_unqualified_read.py}
      - vendor: continuo
        property: readQueries
        value:
          orders: select id from right_name
    schema:
      - name: py_unqualified_read
        physicalType: table
        properties:
          - {name: id, physicalType: INTEGER, required: true}
  services/svc-py-e2e-parse/scripts/py_unqualified_read.py: |
    import pyarrow as pa


    def run(ctx):
        ctx.read("orders")
        return pa.table({"id": pa.array([1], type=pa.int32())})
release:
  image_tag: sha-python-parse
  failing_nodes:
    e2e_schema.py_unqualified_read: "read orders references right_name, which names no schema"
packager:
  merged: |
    nodes:
      - schema: e2e_schema
        table: py_unqualified_read
        reads:
          orders: select id from public.right_name
answers:
  pass:
    - files:
        - path: services/svc-py-e2e-parse/contracts/py_unqualified_read.odcs.yaml
          content: |
            apiVersion: v3.2.0
            kind: DataContract
            id: e2e_schema.py_unqualified_read
            name: py_unqualified_read
            version: "0"
            description:
              purpose: "python node whose declared read is not schema-qualified"
            team:
              name: e2e
            customProperties:
              - {vendor: continuo, property: schedule, value: daily}
              - {vendor: continuo, property: criticality, value: SECONDARY}
              - {vendor: continuo, property: script, value: scripts/py_unqualified_read.py}
              - vendor: continuo
                property: readQueries
                value:
                  orders: select id from public.right_name
            schema:
              - name: py_unqualified_read
                physicalType: table
                properties:
                  - {name: id, physicalType: INTEGER, required: true}
      rationale: qualified right_name with its schema
      confidence: high
      model: claude-test
  fail:
    # The node renamed: pre-flight refuses a fix that changes the node's identity.
    - files:
        - path: services/svc-py-e2e-parse/contracts/py_unqualified_read.odcs.yaml
          content: |
            apiVersion: v3.2.0
            kind: DataContract
            id: e2e_schema.py_qualified_read
            name: py_qualified_read
            version: "0"
            description:
              purpose: "python node whose declared read is not schema-qualified"
            team:
              name: e2e
            customProperties:
              - {vendor: continuo, property: schedule, value: daily}
              - {vendor: continuo, property: criticality, value: SECONDARY}
              - {vendor: continuo, property: script, value: scripts/py_unqualified_read.py}
              - vendor: continuo
                property: readQueries
                value:
                  orders: select id from public.right_name
            schema:
              - name: py_qualified_read
                physicalType: table
                properties:
                  - {name: id, physicalType: INTEGER, required: true}
      rationale: renamed the node and qualified its read
      confidence: high
      model: claude-test
  decline:
    - files: []
      rationale: cannot tell which schema right_name lives in
      confidence: low
      model: claude-test
decline_before_model:
  node: { service: "" }
gate_errors:
  e2e_schema.py_unqualified_read: 'relation "public.right_name" does not exist'
