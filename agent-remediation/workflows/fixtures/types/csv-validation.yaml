# A python-csv node whose declared columns do not match the csv's header. The
# fix renames the column in the node's ODCS contract.
kind: fixture
version: 1
type: csv-validation
trigger:
  source: validation
  release_id: rel-csv-1
  repo: o/demo
  commit_sha: deadbeef
  code_bundle_uri: s3://continuo/code-bundles/rel-csv-1/bundle.json
  nodes:
    - node_id: analytics.py_csv_orders
      category: validation
      error_signature: sig-csv-header
      reason: csv_header_mismatch
      error_excerpt: "csv header missing declared column(s): ['customer_id']"
      dbt_log_uri: s3://logs/rel-csv-1/analytics.py_csv_orders.log
      project: svc-csv
      node_type: python-csv
project_repo_paths:
  svc-csv: services/service-csv
repo_files:
  services/service-csv/contracts/py_csv_orders.odcs.yaml: |
    apiVersion: v3.2.0
    kind: DataContract
    id: analytics.py_csv_orders
    name: py_csv_orders
    version: "0"
    customProperties:
      - {vendor: continuo, property: kind, value: python-csv}
      - {vendor: continuo, property: csvSource, value: "s3://exports/orders/orders.csv"}
    schema:
      - name: py_csv_orders
        physicalType: table
        properties:
          - {name: order_id, physicalType: INTEGER}
          - {name: customer_id, physicalType: INTEGER}
  services/service-csv/contracts/other.odcs.yaml: |
    apiVersion: v3.2.0
    kind: DataContract
    id: analytics.other
    name: other
    version: "0"
    customProperties:
      - {vendor: continuo, property: kind, value: python-node}
      - {vendor: continuo, property: script, value: scripts/other.py}
      - vendor: continuo
        property: readQueries
        value:
          customers: select id from analytics.customers
    schema:
      - name: other
        physicalType: table
        properties:
          - {name: id, physicalType: INTEGER}
  services/service-csv/scripts/other.py: "print('other')\n"
objects:
  s3://logs/rel-csv-1/analytics.py_csv_orders.log: "header check: csv header is order_id,cust_id\n"
bundle:
  analytics.py_csv_orders: { runtime: python, raw_code: '{"output_columns":[{"name":"order_id"},{"name":"customer_id"}]}' }
catalog:
  # The node's contract as continuo last promoted it.
  contracts:
    analytics.py_csv_orders: |
      apiVersion: v3.2.0
      kind: DataContract
      id: analytics.py_csv_orders
      name: py_csv_orders
      version: "1"
release:
  image_tag: sha-csv
  # The package list of the image, which the image_packages context step reads
  # and contract_packages packs with. Without it the step declines the cluster.
  image_packages: {pyarrow: "26.0.0"}
  failing_nodes:
    analytics.py_csv_orders: "csv header missing declared column(s): ['customer_id']"
packager:
  # The odcs-bundle.json continuo-runtime pack writes for the patched contract
  # directory, with the release's image packages.
  packed: '{"bundle_version": 1, "project": "svc-csv", "producer": {"continuo_python_runtime": "0.13.0", "continuo_contracts": "0.2.0"}, "image_packages": {"pyarrow": "26.0.0"}, "nodes": [{"path": "contracts/py_csv_orders.odcs.yaml", "text": "id: analytics.py_csv_orders\n", "source_hash": "", "shared_code_hash": ""}]}'
answers:
  pass:
    - files:
        - path: services/service-csv/contracts/py_csv_orders.odcs.yaml
          content: |
            apiVersion: v3.2.0
            kind: DataContract
            id: analytics.py_csv_orders
            name: py_csv_orders
            version: "0"
            customProperties:
              - {vendor: continuo, property: kind, value: python-csv}
              - {vendor: continuo, property: csvSource, value: "s3://exports/orders/orders.csv"}
            schema:
              - name: py_csv_orders
                physicalType: table
                properties:
                  - {name: order_id, physicalType: INTEGER}
                  - {name: cust_id, physicalType: INTEGER}
      rationale: renamed the column to match the file's real header
      confidence: high
      model: claude-test
  fail:
    # The csvSource renamed: the node's one read may never go.
    - files:
        - path: services/service-csv/contracts/py_csv_orders.odcs.yaml
          content: |
            apiVersion: v3.2.0
            kind: DataContract
            id: analytics.py_csv_orders
            name: py_csv_orders
            version: "0"
            customProperties:
              - {vendor: continuo, property: kind, value: python-csv}
              - {vendor: continuo, property: csvFile, value: "s3://exports/orders/orders.csv"}
            schema:
              - name: py_csv_orders
                physicalType: table
                properties:
                  - {name: order_id, physicalType: INTEGER}
                  - {name: cust_id, physicalType: INTEGER}
      rationale: renamed the read and the column
      confidence: high
      model: claude-test
  decline:
    - files: []
      rationale: cannot tell which header the file will have
      confidence: low
      model: claude-test
decline_before_model:
  node: { project: "" }
gate_errors:
  analytics.py_csv_orders: "csv header missing declared column(s): ['cust_id']"
