# Two services build analytics.orders: the release's marketing model moves to
# orders_v2, and its properties entry and the model that refs it follow.
kind: fixture
version: 1
type: duplicate-table
trigger:
  source: duplicate_table
  release_id: rel-dup-1
  repo: owner/repo
  commit_sha: abc123
  code_bundle_uri: s3://continuo/code-bundles/rel-dup-1/bundle.json
  nodes:
    - node_id: analytics.orders
      relation_id: analytics.orders
      category: duplicate_table
      error_signature: sig-duplicate-orders
      reason: duplicate_relation
      error_excerpt: "relation analytics.orders is produced by finance and marketing"
      file_path: models/orders.sql
      service: marketing
      node_type: dbt-model
      other_service: finance
      other_file_path: services/finance/models/orders.sql
service_repo_paths:
  marketing: services/marketing
  finance: services/finance
repo_files:
  services/marketing/models/orders.sql: "select 1 as id\n"
  services/marketing/models/orders_by_day.sql: "select id from {{ ref('orders') }}\n"
  services/marketing/models/schema.yml: "version: 2\nmodels:\n  - name: orders\n    description: Marketing's orders.\n"
  services/finance/models/orders.sql: "select 1 as id\n"
release:
  image_tag: sha-dup
answers:
  pass:
    - files:
        - path: services/marketing/models/orders_v2.sql
          content: "select 1 as id\n"
        - path: services/marketing/models/orders_by_day.sql
          content: "select id from {{ ref('orders_v2') }}\n"
        - path: services/marketing/models/schema.yml
          content: "version: 2\nmodels:\n  - name: orders_v2\n    description: Marketing's orders.\n"
      rationale: moved the model to orders_v2 and renamed its entry and its ref
      confidence: high
      model: claude-test
  fail:
    # An alias in place: the model keeps its name, so it is still a duplicate.
    - files:
        - path: services/marketing/models/orders.sql
          content: "{{ config(alias='marketing_orders') }}\nselect 1 as id\n"
      rationale: aliased the model to avoid the collision with finance
      confidence: high
      model: claude-test
  decline:
    - files:
        - path: services/marketing/models/orders_v2.sql
          content: "select 1 as id\n"
        - path: services/marketing/models/orders_by_day.sql
          content: "select id from {{ ref('orders_v2') }}\n"
        - path: services/marketing/models/schema.yml
          content: "version: 2\nmodels:\n  - name: orders_v2\n    description: Marketing's orders.\n"
      rationale: either model could keep the name
      confidence: low
      model: claude-test
decline_before_model:
  node: { file_path: "" }
gate_errors:
  analytics.orders: "duplicate_table — unique_id analytics.orders is declared by marketing and finance"
