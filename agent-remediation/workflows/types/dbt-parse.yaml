# A dbt node whose SQL the release's parser rejected: the model rewrites the
# node's source file. A python node's parse failure is not this type's: a
# python-node is fixed by python-parse, and a python-csv or python-api node,
# whose contract has no SQL to rewrite, matches no type and is handed over.
kind: type
version: 1
name: dbt-parse
match: { cluster: single, source: parse, node_types: [dbt-model, dbt-seed, dbt-snapshot, none] }
context: [failing_node_source, failure_precedents]
agent: { prompt: dbt-parse, tools: [], drafts: 3 }
preflight: [target_file_was_shown, content_changed, confidence_not_low]
