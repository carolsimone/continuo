# Nodes broken by a change in another project: the model fixes the changed
# ancestor in that project. When it cannot, the members are handed over,
# since a fix in their own project cannot ship before the ancestor's.
kind: type
version: 1
name: cross-project-upstream
match: { cluster: cross_project }
context: [upstream_target, failure_precedents]
agent: { prompt: upstream, tools: [], rounds: 3 }
preflight: [content_changed, confidence_not_low]
