syntax = "proto3";

package remediation.v1;

option go_package = "github.com/carolsimone/continuo/agent-remediation/api/remediation/v1;remediationv1";

// RemediationFixes serves the fix read-path and pull-request lifecycle
// for the agent-remediation. The UI reads fixes via ListFixes/GetFix
// and drives the PR workflow via BeginPullRequest/RecordPullRequest/FailPullRequest.
service RemediationFixes {
  // ListFixes returns fixes filtered by status, pr_state, release_id,
  // project, and limit.
  rpc ListFixes(ListFixesRequest) returns (ListFixesResponse);
  // GetFix returns a single fix by ID.
  rpc GetFix(GetFixRequest) returns (Fix);
  // BeginPullRequest atomically claims a fix for PR creation and returns
  // the data needed to open a GitHub pull-request.
  rpc BeginPullRequest(BeginPullRequestRequest) returns (BeginPullRequestResponse);
  // RecordPullRequest stores the PR URL, number, and opener after a PR is opened.
  rpc RecordPullRequest(RecordPullRequestRequest) returns (RecordPullRequestResponse);
  // FailPullRequest releases a claim whose pull request could not be opened.
  rpc FailPullRequest(FailPullRequestRequest) returns (FailPullRequestResponse);
}

// Fix is a read-only projection of a remediation fix row, including
// all PR-lifecycle columns. Fields mirror fix.View (snake_case).
message Fix {
  string id = 1;
  string source = 2;
  string release_id = 3;
  string node_id = 4;
  string error_signature = 5;
  // try is the try's number in its round, from 1; 0 is the round's hand-over
  // row, written once the round's tries are spent.
  int32 try = 6;
  string status = 7;
  string confidence = 8;
  string rationale = 9;
  // single-file view of the fix: edits[0]'s content_uri when edits is
  // non-empty, otherwise the candidate-only fix artifact
  string proposed_sql_uri = 10;
  // single-file view of the fix: edits[0]'s diff_uri when edits is
  // non-empty, otherwise the diff of the candidate-only fix artifact
  string diff_uri = 11;
  string candidate_fix_sql_uri = 12;
  string candidate_fix_diff_uri = 13;
  bool source_resolved = 14;
  string repo = 15;
  string commit_sha = 16;
  // single-file view of the fix: edits[0]'s path when edits is
  // non-empty, empty when only candidate_fix_sql_uri is set
  string file_path = 17;
  string model = 18;
  // created_at is an RFC3339-formatted timestamp string.
  string created_at = 19;
  string pr_url = 20;
  int32 pr_number = 21;
  string pr_state = 22;
  // pr_opened_at is an RFC3339-formatted timestamp string, empty when not yet set.
  string pr_opened_at = 23;
  string pr_opened_by = 24;
  // pr_closed_at is an RFC3339-formatted timestamp string, empty until the PR
  // reaches a terminal outcome (pr_state 'merged' or 'rejected').
  string pr_closed_at = 25;
  repeated FileEdit edits = 26;
  // release_check_id names the release check that verified this try's
  // fix — the first of `release_checks`. Set while the try is 'verifying'
  // and kept on the row it became. Empty on a try judged without one.
  string release_check_id = 27;
  // verify_error is why that release check rejected the fix — the reason a python
  // contract try reached 'failed', and the evidence the next try is
  // shown. Empty unless the release check failed.
  string verify_error = 28;
  // round is the release's round this try belongs to.
  int32 round = 29;
  // resolved_node_ids is the failing nodes this try addresses, sorted;
  // node_id is their representative.
  repeated string resolved_node_ids = 30;
  // node_outcomes is, per failing node, how this try ended for it — a
  // cluster that was skipped or failed leaves its members
  // skipped/failed while other members verify.
  map<string, NodeOutcome> node_outcomes = 31;
  // release_checks holds one release check of the fix per edited project; the
  // first entry is the view mirrored onto release_check_id.
  repeated ReleaseCheck release_checks = 32;
  // pull_requests is one entry per (fix, project) pull request; empty
  // for a fix that never entered the PR lifecycle. project = "" is the
  // legacy whole-fix group. The singular pr_* fields above mirror
  // pull_requests[0] for old readers that predate the per-project split.
  repeated PullRequest pull_requests = 33;
  // pr_projects is the sorted owning-project groups this fix's pull
  // requests split into; [""] for a legacy (unsplit) fix.
  repeated string pr_projects = 34;
  // projects is every project this try touched — the failing nodes'
  // projects plus the edited ones, sorted — the same set the
  // ListFixesRequest.project filter matches a fix on.
  repeated string projects = 35;
  // approvers is who must approve what this try did with each node a
  // remediation settled at its end, the fixed nodes and the handed-over ones,
  // one entry per node sorted by node_id. Empty on a try's row with no
  // remediation id and on one with no approvers recorded.
  repeated Approver approvers = 36;
}

// ListFixesRequest filters the fix list. Empty fields are ignored.
message ListFixesRequest {
  string status = 1;
  string pr_state = 2;
  int32 limit = 3;
  string release_id = 4; // when set, only fixes of this release
  string project = 5; // when set, only fixes whose projects contain it
}

message ListFixesResponse {
  repeated Fix fixes = 1;
}

message GetFixRequest {
  string id = 1;
}

// BeginPullRequestRequest identifies the fix to claim for PR creation.
message BeginPullRequestRequest {
  string id = 1;
  // project is the owning-project group to claim; "" is the legacy
  // whole-fix group. Must be one of the fix's pr_projects.
  string project = 2;
}

// BeginPullRequestResponse carries all data needed to open a GitHub pull-request.
message BeginPullRequestResponse {
  string fix_id = 1;
  string repo = 2;
  string commit_sha = 3;
  // single-file view of the fix: edits[0]'s path when edits is
  // non-empty, empty when only candidate_fix_sql_uri is set
  string file_path = 4;
  // single-file view of the fix: edits[0]'s content_uri when edits is
  // non-empty, otherwise the candidate-only fix artifact
  string proposed_sql_uri = 5;
  // single-file view of the fix: edits[0]'s diff_uri when edits is
  // non-empty, otherwise the diff of the candidate-only fix artifact
  string diff_uri = 6;
  string release_id = 7;
  string node_id = 8;
  // try is the claimed fix's try number in its round.
  int32 try = 9;
  string rationale = 10;
  string confidence = 11;
  string model = 12;
  // branch is the git branch name to open the PR from.
  string branch = 13;
  // claimed_at is an RFC3339-formatted timestamp string: the pr_claimed_at
  // value this claim actually persisted. FailPullRequest must echo it back
  // so the repository's compare-and-set only releases this exact claim,
  // never a fresher one taken by someone else since.
  string claimed_at = 14;
  repeated FileEdit edits = 15;
  // resolved_node_ids is the failing nodes this try addresses, sorted;
  // node_id is their representative.
  repeated string resolved_node_ids = 16;
  // project is the owning-project group this claim covers, echoing the
  // request's project; "" is the legacy whole-fix group.
  string project = 17;
  // approvers is who must approve the claim's fix: the fix's approvers of
  // the nodes in resolved_node_ids, sorted by node_id. A node the fix
  // records no approver for has no entry.
  repeated Approver approvers = 18;
  // round is the round of the claimed fix's try.
  int32 round = 19;
}

// RecordPullRequestRequest stores the PR metadata after a PR is opened.
message RecordPullRequestRequest {
  string id = 1;
  string pr_url = 2;
  int32 pr_number = 3;
  string opened_by = 4;
  // project is the owning-project group this PR covers; "" is the legacy
  // whole-fix group.
  string project = 5;
}

message RecordPullRequestResponse {}

// FailPullRequestRequest identifies the claim whose pull request could not be opened.
message FailPullRequestRequest {
  string id = 1;
  // claimed_at is an RFC3339-formatted timestamp string: the claimed_at
  // BeginPullRequest returned for this claim. The repository compares it
  // against the row's current pr_claimed_at before resetting anything, so a
  // claim already released and re-claimed by someone else is left untouched
  // instead of being reset out from under its new owner.
  string claimed_at = 2;
  // project is the owning-project group this claim covers; "" is the legacy
  // whole-fix group.
  string project = 3;
}

message FailPullRequestResponse {
  // released reports whether this call's compare-and-set matched and reset
  // the claim. false means the claim had already moved on — recorded, or
  // already failed by another caller — by the time this call ran; that is
  // not an error.
  bool released = 1;
}

// One proposed file change. content_uri/diff_uri point at S3 objects
// holding the full corrected file content and its unified diff.
message FileEdit {
  string path = 1;
  string content_uri = 2;
  string diff_uri = 3;
  // target_node_id is the node whose source this edit changes; for a
  // shared-upstream fix it is the changed ancestor, which may not have failed.
  string target_node_id = 4;
  // renamed_from is the path the file is moved from: the pull request deletes
  // it and writes path. Empty for an edit that changes path in place.
  string renamed_from = 5;
}

// NodeOutcome is how one failing node's try ended: verifying, proposed,
// failed, skipped, or escalated, with the reason for that outcome. code is the
// handover_reason vocabulary value that says why the node was handed over when
// its outcome is not part of a verified fix, and is empty otherwise.
message NodeOutcome {
  string status = 1;
  string reason = 2;
  string code = 3;
}

// Approver is who must approve what a try did with one node: the node's
// owner, as source says where it was read from. source is "bundle" (the owner
// the release's code bundle records for the node), "contract_file" (the team of
// the node's contract file in the repository) or "none" (no owner was found),
// and owner is empty when source is "none".
message Approver {
  string node_id = 1;
  string owner = 2;
  string source = 3;
}

// ReleaseCheck is the release check of the fix for one edited project and the
// durable summary of how it went. phase is queued | running | passed |
// failed (empty before the first read); check_id is the release check's id;
// activated_at is RFC 3339 or empty; error is the named per-node errors of a
// failed check.
message ReleaseCheck {
  string project = 1;
  string kind = 2;
  string check_id = 3;
  string phase = 4;
  string activated_at = 5;
  string error = 6;
}

// PullRequest is one pull request opened from a fix, mirroring
// fix.PullRequest. One entry per (fix, project) split; project =
// "" is the legacy whole-fix group.
message PullRequest {
  string project = 1;
  string repo = 2;
  string branch = 3;
  string pr_url = 4;
  int32 pr_number = 5;
  // pr_state is the terminal state from GitHub: "merged" or "rejected", or
  // "open" while the PR has not yet closed.
  string pr_state = 6;
  // pr_opened_at is an RFC3339-formatted timestamp string, empty when not
  // yet set.
  string pr_opened_at = 7;
  string pr_opened_by = 8;
  // pr_closed_at is an RFC3339-formatted timestamp string, empty until the
  // PR reaches a terminal outcome (pr_state 'merged' or 'rejected').
  string pr_closed_at = 9;
}
