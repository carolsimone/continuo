syntax = "proto3";

package remediation.v1;

option go_package = "github.com/carolsimone/continuo/agent-remediation/api/remediation/v1;remediationv1";

// RemediationProposals serves the proposal read-path and pull-request lifecycle
// for the agent-remediation. The UI reads proposals via ListProposals/GetProposal
// and drives the PR workflow via BeginPullRequest/RecordPullRequest/FailPullRequest.
service RemediationProposals {
  // ListProposals returns proposals filtered by status, pr_state, release_id,
  // service, and limit.
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  // GetProposal returns a single proposal by ID.
  rpc GetProposal(GetProposalRequest) returns (Proposal);
  // BeginPullRequest atomically claims a proposal for PR creation and returns
  // the data needed to open a GitHub pull-request.
  rpc BeginPullRequest(BeginPullRequestRequest) returns (BeginPullRequestResponse);
  // RecordPullRequest stores the PR URL, number, and opener after a PR is opened.
  rpc RecordPullRequest(RecordPullRequestRequest) returns (RecordPullRequestResponse);
  // FailPullRequest marks a proposal's PR attempt as failed.
  rpc FailPullRequest(FailPullRequestRequest) returns (FailPullRequestResponse);
}

// Proposal is a read-only projection of a remediation proposal row, including
// all PR-lifecycle columns. Fields mirror proposal.View (snake_case).
message Proposal {
  string id = 1;
  string source = 2;
  string release_id = 3;
  string node_id = 4;
  string error_signature = 5;
  int32 attempt = 6;
  string status = 7;
  string confidence = 8;
  string rationale = 9;
  // single-file view of the proposal: edits[0]'s content_uri when edits is
  // non-empty, otherwise the candidate-only fix artifact
  string proposed_sql_uri = 10;
  // single-file view of the proposal: edits[0]'s diff_uri when edits is
  // non-empty, otherwise the diff of the candidate-only fix artifact
  string diff_uri = 11;
  string candidate_fix_sql_uri = 12;
  string candidate_fix_diff_uri = 13;
  bool source_resolved = 14;
  string repo = 15;
  string commit_sha = 16;
  // single-file view of the proposal: edits[0]'s path when edits is
  // non-empty, empty when the proposal carries only a candidate fix
  string file_path = 17;
  string model = 18;
  // created_at is an RFC3339-formatted timestamp string.
  string created_at = 19;
  string pr_url = 20;
  int32 pr_number = 21;
  string pr_state = 22;
  // pr_opened_at is an RFC3339-formatted timestamp string, empty when not yet set.
  string pr_opened_at = 23;
  string pr_opened_by = 24;
  // pr_closed_at is an RFC3339-formatted timestamp string, empty until the PR
  // reaches a terminal outcome (pr_state 'merged' or 'rejected').
  string pr_closed_at = 25;
  repeated FileEdit edits = 26;
  // verification_run_id names the pipeline run that verified this attempt's
  // fix — the first of `verifications`. Set while the attempt is 'verifying'
  // and kept on the row it became. Empty on an attempt judged without one.
  string verification_run_id = 27;
  // verify_error is why that release rejected the fix — the reason a python
  // contract attempt reached 'failed', and the evidence the next attempt is
  // shown. Empty unless verification failed.
  string verify_error = 28;
  // remediation_round is the release's remediation round this attempt belongs to.
  int32 remediation_round = 29;
  // resolved_node_ids is the failing nodes this attempt addresses, sorted;
  // node_id is their representative.
  repeated string resolved_node_ids = 30;
  // node_outcomes is, per failing node, how this attempt ended for it — a
  // cluster whose fixer skipped or failed leaves its members
  // skipped/failed while other members verify.
  map<string, NodeOutcome> node_outcomes = 31;
  // verifications is one fix-verification run per edited service; the first
  // entry is the view mirrored onto verification_run_id.
  repeated Verification verifications = 32;
  // pull_requests is one entry per (proposal, service) pull request; empty
  // for a proposal that never entered the PR lifecycle. service = "" is the
  // legacy whole-proposal group. The singular pr_* fields above mirror
  // pull_requests[0] for old readers that predate the per-service split.
  repeated PullRequest pull_requests = 33;
  // pr_services is the sorted owning-service groups this proposal's pull
  // requests split into; [""] for a legacy (unsplit) proposal.
  repeated string pr_services = 34;
  // services is every service this attempt touched — the failing nodes'
  // services plus the edited ones, sorted — the same set the
  // ListProposalsRequest.service filter matches a proposal on.
  repeated string services = 35;
}

// ListProposalsRequest filters the proposal list. Empty fields are ignored.
message ListProposalsRequest {
  string status = 1;
  string pr_state = 2;
  int32 limit = 3;
  string release_id = 4; // when set, only proposals of this release
  string service = 5; // when set, only proposals whose services contain it
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
}

message GetProposalRequest {
  string id = 1;
}

// BeginPullRequestRequest identifies the proposal to claim for PR creation.
message BeginPullRequestRequest {
  string id = 1;
  // service is the owning-service group to claim; "" is the legacy
  // whole-proposal group. Must be one of the proposal's pr_services.
  string service = 2;
}

// BeginPullRequestResponse carries all data needed to open a GitHub pull-request.
message BeginPullRequestResponse {
  string proposal_id = 1;
  string repo = 2;
  string commit_sha = 3;
  // single-file view of the proposal: edits[0]'s path when edits is
  // non-empty, empty when the proposal carries only a candidate fix
  string file_path = 4;
  // single-file view of the proposal: edits[0]'s content_uri when edits is
  // non-empty, otherwise the candidate-only fix artifact
  string proposed_sql_uri = 5;
  // single-file view of the proposal: edits[0]'s diff_uri when edits is
  // non-empty, otherwise the diff of the candidate-only fix artifact
  string diff_uri = 6;
  string release_id = 7;
  string node_id = 8;
  int32 attempt = 9;
  string rationale = 10;
  string confidence = 11;
  string model = 12;
  // branch is the git branch name to open the PR from.
  string branch = 13;
  // claimed_at is an RFC3339-formatted timestamp string: the pr_claimed_at
  // value this claim actually persisted. FailPullRequest must echo it back
  // so the repository's compare-and-set only releases this exact claim,
  // never a fresher one taken by someone else since.
  string claimed_at = 14;
  repeated FileEdit edits = 15;
  // resolved_node_ids is the failing nodes this attempt addresses, sorted;
  // node_id is their representative.
  repeated string resolved_node_ids = 16;
  // service is the owning-service group this claim covers, echoing the
  // request's service; "" is the legacy whole-proposal group.
  string service = 17;
}

// RecordPullRequestRequest stores the PR metadata after a PR is opened.
message RecordPullRequestRequest {
  string id = 1;
  string pr_url = 2;
  int32 pr_number = 3;
  string opened_by = 4;
  // service is the owning-service group this PR covers; "" is the legacy
  // whole-proposal group.
  string service = 5;
}

message RecordPullRequestResponse {}

// FailPullRequestRequest identifies the proposal whose PR attempt failed.
message FailPullRequestRequest {
  string id = 1;
  // claimed_at is an RFC3339-formatted timestamp string: the claimed_at
  // BeginPullRequest returned for this claim. The repository compares it
  // against the row's current pr_claimed_at before resetting anything, so a
  // claim already released and re-claimed by someone else is left untouched
  // instead of being reset out from under its new owner.
  string claimed_at = 2;
  // service is the owning-service group this claim covers; "" is the legacy
  // whole-proposal group.
  string service = 3;
}

message FailPullRequestResponse {
  // released reports whether this call's compare-and-set matched and reset
  // the claim. false means the claim had already moved on — recorded, or
  // already failed by another caller — by the time this call ran; that is
  // not an error.
  bool released = 1;
}

// One proposed file change. content_uri/diff_uri point at S3 objects
// holding the full corrected file content and its unified diff.
message FileEdit {
  string path = 1;
  string content_uri = 2;
  string diff_uri = 3;
  // target_node_id is the node whose source this edit changes; for a
  // shared-upstream fix it is the changed ancestor, which may not have failed.
  string target_node_id = 4;
}

// NodeOutcome is how one failing node's attempt ended: verifying, proposed,
// failed, skipped, or escalated, with the reason for that outcome.
message NodeOutcome {
  string status = 1;
  string reason = 2;
}

// Verification is one fix-verification run per edited service and the
// durable summary of how it went. phase is queued | running | passed |
// failed (empty before the first read); activated_at is RFC 3339 or empty;
// error is the named per-node errors on a failed run.
message Verification {
  string service = 1;
  string kind = 2;
  string run_id = 3;
  string phase = 4;
  string activated_at = 5;
  string error = 6;
}

// PullRequest is one pull request opened from a proposal, mirroring
// proposal.PullRequest. One entry per (proposal, service) split; service =
// "" is the legacy whole-proposal group.
message PullRequest {
  string service = 1;
  string repo = 2;
  string branch = 3;
  string pr_url = 4;
  int32 pr_number = 5;
  // pr_state is the terminal state from GitHub: "merged" or "rejected", or
  // "open" while the PR has not yet closed.
  string pr_state = 6;
  // pr_opened_at is an RFC3339-formatted timestamp string, empty when not
  // yet set.
  string pr_opened_at = 7;
  string pr_opened_by = 8;
  // pr_closed_at is an RFC3339-formatted timestamp string, empty until the
  // PR reaches a terminal outcome (pr_state 'merged' or 'rejected').
  string pr_closed_at = 9;
}
