syntax = "proto3";

package state.v1;

option go_package = "github.com/carolsimone/continuo/state/api/state/v1;statev1";

import "google/protobuf/timestamp.proto";

// StateService provides state tracking for schedulers and tasks
service StateService {
  // Scheduler operations
  rpc GetScheduler(GetSchedulerRequest) returns (SchedulerResponse);
  rpc CancelScheduler(CancelSchedulerRequest) returns (SchedulerResponse);

  // Trigger operations
  rpc ActivateSchedule(ActivateScheduleRequest) returns (ActivateScheduleResponse);

  // Schedule catalog operations
  rpc ListAllSchedules(ListAllSchedulesRequest) returns (ListAllSchedulesResponse);
  rpc TriggerSchedule(TriggerScheduleRequest) returns (TriggerScheduleResponse);
  // CancelSchedule cancels the active run of a named schedule.
  // Errors: INVALID_ARGUMENT (empty name), FAILED_PRECONDITION (no active run or run not cancellable).
  rpc CancelSchedule(CancelScheduleRequest) returns (CancelScheduleResponse);

  // Task operations
  rpc GetTask(GetTaskRequest) returns (TaskResponse);
  rpc GetTaskByScheduleAndNode(GetTaskByScheduleAndNodeRequest) returns (TaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // GetSchedulerInitStatus returns initialization_status for a scheduler:
  // completed once the run's tasks are stored.
  rpc GetSchedulerInitStatus(GetSchedulerInitStatusRequest) returns (GetSchedulerInitStatusResponse);

  // TriggerRerun creates a run that re-executes a failed or cancelled run's
  // tasks that did not succeed, and their descendants, on the source run's
  // release, and dispatches the ready ones in the transaction that creates it.
  rpc TriggerRerun(TriggerRerunRequest) returns (TriggerRerunResponse);

  // TriggerSingleNodeRun creates a synthesised single-node run that
  // executes exactly one task with no downstream pickup. Two modes,
  // selected via the `metadata_source` field on the request:
  //   - "latest" (default): the node as the live release holds it
  //   - "snapshot_of_run" (stale): the node as the source run's release
  //     holds it; requires `source_run_id`
  // Errors:
  //   INVALID_ARGUMENT — empty/malformed identity, unknown metadata_source,
  //                      "snapshot_of_run" without source_run_id, "latest"
  //                      with non-empty source_run_id, or a full_refresh of
  //                      a node type that cannot be rebuilt from scratch.
  //   NOT_FOUND — "snapshot_of_run" + source_run_id has no scheduler_tracker
  //               row, or no task_tracker row matching the identity; or the
  //               release holds no such node of that service.
  //   FAILED_PRECONDITION — "snapshot_of_run" + source run not terminal or
  //                         naming no release; or a test of a node with no
  //                         data tests.
  rpc TriggerSingleNodeRun(TriggerSingleNodeRunRequest)
      returns (TriggerSingleNodeRunResponse);

  // TriggerRebase creates a new run on the source's schedule and the live
  // release that restarts the source from its failure. It re-executes the
  // source's tasks that did not succeed (failed/cancelled/skipped) whose node
  // the live schedule still holds, the live schedule's nodes the source never
  // ran, every descendant of those and, with include_changed_upstream, every
  // changed node upstream of anything it re-executes, until no changed
  // ancestor is left out. A node is changed when its content_hash, node_type,
  // secret_ref or upstream nodes differ between the live release and the
  // release the source's result for the node was built on: the source's
  // release, or for a success the source inherited, the release of the run
  // that built it. image_tag alone is not a change. Every other source
  // success is inherited. The new run reuses the source's schedule_name. A
  // non-empty expected_release_id must name the live release.
  // Errors:
  //   INVALID_ARGUMENT — empty or malformed source_run_id.
  //   NOT_FOUND — source_run_id doesn't exist in scheduler_tracker.
  //   FAILED_PRECONDITION — source not in {FAILED, CANCELLED}; OR source has
  //                         zero non-SUCCEEDED tasks; OR an active run already
  //                         exists on the source's schedule_name; OR the
  //                         source names no release, is a test run, or leaves
  //                         nothing to re-execute; OR the live release is not
  //                         expected_release_id (message "the live release
  //                         changed; preview again").
  rpc TriggerRebase(TriggerRebaseRequest) returns (TriggerRebaseResponse);

  // PreviewRebase reports what TriggerRebase would run for the same
  // source_run_id and include_changed_upstream on the live release, without
  // creating a run: the live release, how many nodes run and why, and the
  // changed upstream nodes with what each feeds and its last successful
  // duration. changed_nodes lists every changed upstream node the option
  // would add, whether or not include_changed_upstream is set. Maintenance
  // mode does not refuse it.
  // Errors: as TriggerRebase, except that an active run on the schedule does
  // not refuse a preview and no release is compared.
  rpc PreviewRebase(PreviewRebaseRequest) returns (PreviewRebaseResponse);

  // ListNodeRuns returns the most recent task instances for a node, ordered by
  // scheduler_tracker.created_at DESC. Identity fields are required; limit is
  // capped server-side at 50 (0 uses the default of 50).
  rpc ListNodeRuns(ListNodeRunsRequest) returns (ListNodeRunsResponse);

  // ListNodes returns the node catalog: one summary row per node that has run,
  // with stats aggregated over each node's most recent 50 runs. Supports a
  // case-insensitive substring `search` on "service.schema.table", an exact
  // `service_name` filter, and limit/offset paging. `total_count` reports the
  // full match count (before paging).
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // ListNodeNames returns the distinct table names of nodes that have run,
  // optionally filtered by service. Powers the Nodes-tab search autocomplete
  // (the complete name list, independent of the paginated catalog).
  rpc ListNodeNames(ListNodeNamesRequest) returns (ListNodeNamesResponse);

  // ListNodeServices returns the distinct service names of nodes that have run.
  // Powers the catalog and Remediation-tab service filters (the complete
  // service list, independent of the paginated catalog).
  rpc ListNodeServices(ListNodeServicesRequest) returns (ListNodeServicesResponse);

  // GetRunGraph returns a run's tasks as nodes and the dependencies among them
  // in the run's own release, with the promotion seq that release was live
  // under and the live one. Edges point from the dependent node to its
  // dependency; node ids are "service.schema.table". An unknown run returns no
  // nodes and run_promotion_seq 0; a run that names no release returns its
  // nodes, no edges and run_promotion_seq 0. Consumers treat 0 as "drift
  // unknown". Empty or malformed run_id is INVALID_ARGUMENT.
  rpc GetRunGraph(GetRunGraphRequest) returns (GetRunGraphResponse);

  // ListRuns returns a schedule's completed runs, newest first. page_size is
  // clamped to [1, 200], 0 meaning 50; a negative page_offset is 0.
  // total_count counts every completed run of the schedule. Empty
  // schedule_name is INVALID_ARGUMENT.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);

  // ListActiveRunDrifts returns the live promotion seq and every schedule's
  // newest pending or running run with the promotion seq its release was live
  // under (0 when it names no release).
  rpc ListActiveRunDrifts(ListActiveRunDriftsRequest) returns (ListActiveRunDriftsResponse);

  // ListTaskAttempts returns one page of a run's task attempts, or of one of
  // its tasks when task_id is set, ordered by task_id then attempt.
  // page_size is clamped to [1, 200], 0 meaning 50; a negative page_offset is
  // 0. total_count counts every attempt the filter matches. An empty or
  // malformed run_id, or a malformed task_id, is INVALID_ARGUMENT.
  rpc ListTaskAttempts(ListTaskAttemptsRequest) returns (ListTaskAttemptsResponse);
}

// ============================================================================
// ENUMS
// ============================================================================

enum SchedulerStatus {
  SCHEDULER_STATUS_UNSPECIFIED = 0;
  SCHEDULER_STATUS_PENDING = 1;
  SCHEDULER_STATUS_RUNNING = 2;
  SCHEDULER_STATUS_SUCCEEDED = 3;
  SCHEDULER_STATUS_FAILED = 4;
  SCHEDULER_STATUS_CANCELLED = 5;
  SCHEDULER_STATUS_SKIPPED = 6;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCEEDED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_CANCELLED = 5;
  TASK_STATUS_SKIPPED = 6;
  TASK_STATUS_DISPATCHED = 7;  // an attempt was sent to execution-controller, which has not acknowledged it
  TASK_STATUS_QUEUED = 8;      // execution-controller accepted the attempt; it waits for a slot
}

// ============================================================================
// DOMAIN MESSAGES
// ============================================================================

message Scheduler {
  string schedule_id = 1;
  string schedule_name = 2;
  SchedulerStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  google.protobuf.Timestamp last_heartbeat_at = 7;
  google.protobuf.Timestamp cancelled_at = 8;
  string cancelled_by = 9;
  string cancellation_reason = 10;
  string initialization_status = 11;  // 'pending', 'in_progress', 'completed', 'failed'
  string failure_reason = 12;  // why a failed run failed when no task of it did: stalled | empty_selection | invalid_node_type; empty otherwise
}

message Task {
  string task_id = 1;
  string schedule_id = 2;
  google.protobuf.Timestamp created_at = 3;
  string service_name = 4;
  string schema_name = 5;
  string table_name = 6;
  string job_name = 7;  // K8s job identifier (computed from service-schema-table)
  TaskStatus status = 8;
  int32 attempt = 9;  // 0-based number of the task's current attempt
  int32 max_retries = 10;
  google.protobuf.Timestamp cancelled_at = 11;
  string cancelled_by = 12;
}

// TaskAttempt is one attempt of a task: one dispatch of its Kubernetes Job.
message TaskAttempt {
  string task_id = 1;
  int32 attempt = 2;                              // 0-based attempt number
  string job_name = 3;                            // Kubernetes Job of this attempt
  string status = 4;                              // dispatched | queued | running | succeeded | failed | cancelled
  string failure_class = 5;                       // why the attempt failed; "" unless failed
  string failure_reason = 6;                      // the specific failure within failure_class; "" unless failed
  // exit_code is the container's exit code, 0 when unknown: a 0 is a clean
  // exit only for a succeeded attempt, so read it together with status and
  // failure_reason.
  int32 exit_code = 7;
  google.protobuf.Timestamp dispatched_at = 8;    // when state dispatched the attempt
  google.protobuf.Timestamp queued_at = 9;        // unset until reported
  google.protobuf.Timestamp started_at = 10;      // unset until reported
  google.protobuf.Timestamp finished_at = 11;     // unset until the attempt finished
  double execution_seconds = 12;                  // 0 until recorded
  string error_message = 13;                      // "" when none
  string log_s3_key = 14;                         // S3 object key of the pod log; "" when none
  string run_results_uri = 15;                    // S3 object key of the structured result block; "" when none
}

// ============================================================================
// SCHEDULER REQUESTS/RESPONSES
// ============================================================================

message GetSchedulerRequest {
  string schedule_id = 1;              // Required
}

message CancelSchedulerRequest {
  string schedule_id = 1;              // Required
  string cancelled_by = 2;             // Optional
  string cancellation_reason = 3;      // Optional
}

message SchedulerResponse {
  Scheduler scheduler = 1;
}

// ============================================================================
// TASK REQUESTS/RESPONSES
// ============================================================================

message GetTaskRequest {
  string task_id = 1;                  // Required
}

message GetTaskByScheduleAndNodeRequest {
  string schedule_id = 1;              // Required
  string service_name = 2;             // Required
  string schema_name = 3;              // Required
  string table_name = 4;               // Required
}

message ListTasksRequest {
  string schedule_id = 1;              // Required
  TaskStatus status = 2;               // Optional filter
  int32 page_size = 3;                 // Pagination (default 50)
  int32 page_offset = 4;               // Pagination offset
}

message ListTasksResponse {
  repeated Task tasks = 1;
  int32 total_count = 2;
}

message TaskResponse {
  Task task = 1;
}

// ============================================================================
// TASK ATTEMPT REQUESTS/RESPONSES
// ============================================================================

message ListTaskAttemptsRequest {
  string run_id = 1;       // Required
  string task_id = 2;      // Optional: "" lists every task of the run
  int32  page_size = 3;    // Clamped to [1, 200]; 0 means 50
  int32  page_offset = 4;  // Negative values are treated as 0
}

message ListTaskAttemptsResponse {
  repeated TaskAttempt attempts = 1;
  int32 total_count = 2;   // attempts matching the filter, ignoring paging
}

// ============================================================================
// TRIGGER REQUESTS/RESPONSES
// ============================================================================

message ActivateScheduleRequest {
  string schedule_name = 1;  // Required: name of the schedule to activate
}

message ActivateScheduleResponse {
  string schedule_id = 1;   // UUID of the created scheduler_tracker record
                             // Empty string if a run was already active (no-op)
}

// ============================================================================
// SCHEDULE CATALOG REQUESTS/RESPONSES
// ============================================================================

message ListAllSchedulesRequest {}

// ScheduleSummary merges catalog data, last-run data, and cron config.
// last_run_status uses lowercase strings ("succeeded", "failed", "cancelled")
// matching the domain model — intentionally not the SchedulerStatus enum
// to decouple this message from scheduler_tracker internals.
message ScheduleSummary {
  string schedule_name   = 1;
  string cron_expression = 2;  // empty if not in schedules.yaml
  string description     = 3;  // from schedules.yaml; empty if not found
  string timezone        = 4;  // top-level timezone from schedules.yaml
  bool   is_running      = 5;
  google.protobuf.Timestamp last_run_at = 6;  // null if never run
  string last_run_status = 7;  // "succeeded"/"failed"/"cancelled"; empty if never run
  string last_run_id = 8;  // schedule_id of most recent run; empty string if never run
}

message ListAllSchedulesResponse {
  repeated ScheduleSummary schedules = 1;
}

message TriggerScheduleRequest {
  string schedule_name = 1;
  string operation = 2;  // Optional: "" | "run" | "test" | "build". "full_refresh" is single-node only and rejected here (INVALID_ARGUMENT).
}

// schedule_id is always non-empty on success.
// Errors: NOT_FOUND (schedule not in catalog), FAILED_PRECONDITION (already running).
message TriggerScheduleResponse {
  string schedule_id = 1;
}

message CancelScheduleRequest {
  string schedule_name       = 1;  // Required
  string cancelled_by        = 2;  // Optional
  string cancellation_reason = 3;  // Optional
}

message CancelScheduleResponse {
  string schedule_id = 1;  // schedule_id of the cancelled run
}

message GetSchedulerInitStatusRequest {
  string schedule_id = 1;
}

message GetSchedulerInitStatusResponse {
  string initialization_status = 1;
}

message TriggerRerunRequest {
  string source_run_id = 1;  // schedule_id of the failed/cancelled run to rerun
}

message TriggerRerunResponse {
  string run_id        = 1;  // schedule_id of the new rerun run
  string schedule_name = 2;  // copied verbatim from source's schedule_name
}

message TriggerSingleNodeRunRequest {
  string service_name    = 1;  // Required
  string schema_name     = 2;  // Required
  string table_name      = 3;  // Required
  string metadata_source = 4;  // Required: "latest" | "snapshot_of_run"
  string source_run_id   = 5;  // Required iff metadata_source == "snapshot_of_run"
  string operation       = 6;  // Optional: "" | "run" | "test" | "build" | "full_refresh" (default run). full_refresh rebuilds a dbt model or seed from scratch.
}

message TriggerSingleNodeRunResponse {
  string run_id        = 1;  // synthesized scheduler_tracker.schedule_id (uuid)
  string schedule_name = 2;  // "single-node-run-<short-uuid>"
}

message TriggerRebaseRequest {
  string source_run_id            = 1;  // schedule_id of the failed/cancelled run to rebase from
  bool   include_changed_upstream = 2;  // also re-execute the changed nodes upstream of what re-executes
  string expected_release_id      = 3;  // the live release the caller previewed; "" skips the check
}

message TriggerRebaseResponse {
  string run_id        = 1;  // schedule_id of the new rebase run
  string schedule_name = 2;  // copied verbatim from source's schedule_name
}

message PreviewRebaseRequest {
  string source_run_id            = 1;  // schedule_id of the failed/cancelled run to rebase from
  bool   include_changed_upstream = 2;  // as TriggerRebaseRequest.include_changed_upstream
}

// ChangedUpstreamNode is a changed node upstream of what a rebase re-executes.
message ChangedUpstreamNode {
  string service_name         = 1;
  string schema_name          = 2;
  string table_name           = 3;
  int32  downstream           = 4;  // nodes below it in the live schedule
  double last_success_seconds = 5;  // execution_time_seconds of its latest successful run; 0 when it has none
}

message PreviewRebaseResponse {
  string release_id        = 1;  // the live release previewed; send it as TriggerRebaseRequest.expected_release_id
  int64  promotion_seq     = 2;  // that release's promotion_seq
  int32  total_nodes       = 3;  // tasks of the rebase: re-executed plus inherited
  int32  will_run          = 4;  // tasks it re-executes: the sum of the four counts below
  int32  failed_or_skipped = 5;  // source tasks that did not succeed
  int32  new_nodes         = 6;  // live schedule nodes the source never ran
  int32  changed_upstream  = 7;  // changed upstream nodes it re-executes; 0 without include_changed_upstream
  int32  downstream        = 8;  // every other re-executed node, each below one counted above
  int32  inherited         = 9;  // source successes carried over
  repeated ChangedUpstreamNode changed_nodes = 10;  // ordered by service, schema, table
}

message ListNodeRunsRequest {
  string service_name = 1;
  string schema_name  = 2;
  string table_name   = 3;
  int32  limit        = 4;  // 0 → server default 50; max 50
  string operation    = 5;  // run | test | build; "" = run
}

message ListNodeRunsResponse {
  repeated NodeRun runs = 1;
}

message NodeRun {
  string run_id           = 1;
  string schedule_name    = 2;
  string kind             = 3;  // cron | trigger | rerun | rebase | single_node_run
  string terminal_status  = 4;  // "" while in flight
  string task_id          = 5;
  string task_status      = 6;  // pending | running | succeeded | failed | cancelled
  int32  attempt          = 7;  // 0-based number of the task's current attempt
  string image_tag        = 8;
  reserved 9;
  reserved "manifest_version";
  string created_at       = 10; // RFC3339
  string started_at       = 11; // RFC3339, "" if no execution yet
  string completed_at     = 12; // RFC3339, "" if not finished
  string error_message    = 13; // "" when none
  string log_s3_key       = 14; // "" when none
  string operation        = 15; // run | test | build | full_refresh
  string run_results_uri  = 16; // "" when none
  string content_hash     = 17; // node's content hash in the run's release; "" when the run names no release
  string failure_class    = 18; // why the latest attempt failed; "" unless it failed
  string failure_reason   = 19; // the specific failure within failure_class; "" unless it failed
}

message ListNodesRequest {
  string search       = 1;  // case-insensitive substring on "service.schema.table"; "" = no filter
  string service_name = 2;  // exact service filter; "" = all services
  int32  limit        = 3;  // page size; 0 -> default 50, clamped to max 200
  int32  offset       = 4;  // page offset; default 0
  string operation    = 5;  // run | test | build; "" = run (model)
}

message ListNodesResponse {
  repeated NodeSummary nodes = 1;
  int32 total_count          = 2;  // total nodes matching the filter, ignoring limit/offset
}

message NodeSummary {
  string service_name     = 1;
  string schema_name      = 2;
  string table_name       = 3;
  int32  run_count        = 4;   // task instances in the stats window (<= 50)
  int32  success_rate_pct = 5;   // -1 when no terminal runs in window
  int32  avg_duration_sec = 6;   // -1 when no measurable run
  int32  p95_duration_sec = 7;   // -1 when no measurable run
  int32  flaky_rate_pct   = 8;   // % of window runs with attempt > 0; 0 when none
  string last_status      = 9;   // succeeded|failed|running|cancelled|pending
  string last_run_at      = 10;  // RFC3339 of the most recent run's created_at
  string operation        = 11;  // run | test | build
  int32  timeout_seconds  = 12;  // the task timeout the node's tasks get: its declared timeout in the live release, else the install default
  bool   timeout_declared = 13;  // true when the live release declares the node's timeout; false when its tasks get the install default
}

message ListNodeNamesRequest {
  string service_name = 1;  // exact service filter; "" = all services
}

message ListNodeNamesResponse {
  repeated string table_names = 1;  // distinct, sorted ascending
}

message ListNodeServicesRequest {}

message ListNodeServicesResponse {
  repeated string service_names = 1;  // distinct, sorted ascending
}

message RunGraphNode {
  string service_name  = 1;
  string schema_name   = 2;
  string table_name    = 3;
  string schedule_name = 4;  // the node's schedule in the run's release; "" when unknown
  string node_type     = 5;  // "" when the run names no release
  string status        = 6;  // the task's status: pending | running | succeeded | failed | cancelled | skipped
  string task_id       = 7;
}

message RunGraphEdge {
  string from_node_id = 1;  // the dependent node, "service.schema.table"
  string to_node_id   = 2;  // its dependency, "service.schema.table"
}

message GetRunGraphRequest { string run_id = 1; }

message GetRunGraphResponse {
  repeated RunGraphNode nodes = 1;
  repeated RunGraphEdge edges = 2;
  int64 run_promotion_seq     = 3;  // 0 when the run is unknown or names no release
  int64 latest_promotion_seq  = 4;  // the live promotion seq; 0 when no release is live
}

message ListRunsRequest {
  string schedule_name = 1;
  int32  page_size     = 2;
  int32  page_offset   = 3;
}

message RunSummary {
  string run_id          = 1;
  string schedule_name   = 2;
  string terminal_status = 3;  // succeeded | failed | cancelled | skipped
  string created_at      = 4;  // RFC3339, UTC, seconds
  string completed_at    = 5;  // RFC3339, UTC, seconds
  string failure_reason  = 6;  // stalled | empty_selection | invalid_node_type when the run failed without a failed task; empty otherwise
}

message ListRunsResponse {
  repeated RunSummary runs = 1;
  int32 total_count        = 2;
}

message ListActiveRunDriftsRequest {}

message ActiveRunDrift {
  string schedule_name    = 1;
  string run_id           = 2;
  int64 run_promotion_seq = 3;  // 0 when the run names no release
}

message ListActiveRunDriftsResponse {
  int64 latest_promotion_seq          = 1;
  repeated ActiveRunDrift active_runs = 2;
}
