nodes:
  # Same unbindable-read failure as svc-py-e2e's py_bad_read, declared under a
  # second service so the two remediation scenarios never share a contract
  # directory: the packaging step merges a whole directory, so one still-broken
  # node beside the node under repair would sink the other scenario's
  # verification run.
  #
  # The node is repaired over two attempts: the canned model in
  # tests/e2e/stub-llm answers a first attempt with a read that still cannot
  # bind, and answers a retry — one whose prompt carries what the rejected
  # attempt changed and why it was rejected — with a read that binds.
  #
  # Nothing in this file decides which of those two answers comes back. The
  # stub reads only the sections the prompt assembler writes AROUND this file,
  # so no comment here can change what a test observes.
  - schema: e2e_schema
    table: py_loop_read
    owner: e2e
    schedule: daily
    criticality: SECONDARY
    script: scripts/py_loop_read.py
    description: "python node whose declared read cannot bind, repaired over two attempts"
    reads:
      missing: select id from public.loop_wrong_name
    output_columns:
      - {name: id, type: INTEGER, nullable: false}
