# python-csv node: no script. The runtime harness fetches csvSource itself
# (RUN) and the validation runner range-fetches only its header (VALIDATE) to
# check it against the declared columns before materializing an empty table.
apiVersion: v3.2.0
kind: DataContract
id: e2e_schema.py_csv
name: py_csv
version: "0"
description:
  purpose: csv-sourced python node for the e2e run path
team:
  name: e2e
customProperties:
  - {vendor: continuo, property: kind, value: python-csv}
  - {vendor: continuo, property: schedule, value: daily}
  - {vendor: continuo, property: criticality, value: SECONDARY}
  - {vendor: continuo, property: csvSource, value: "s3://continuo/fixtures/orders.csv"}
# The bindings below tie the table and its columns to the thing CsvOrder of
# fixtures/ontology/ontology.yaml. An install whose ontology switch is off stores
# the contract without them.
schema:
  - name: py_csv
    physicalType: table
    customProperties:
      - {vendor: continuo, property: entity, value: CsvOrder}
    properties:
      - {name: order_id, physicalType: INTEGER, required: true, customProperties: [{vendor: continuo, property: property, value: CsvOrder.order_id}]}
      - {name: amount, physicalType: DOUBLE PRECISION, customProperties: [{vendor: continuo, property: property, value: CsvOrder.amount}]}
