# Non-conforming node: passes validation, which only creates an empty typed
# table from the declared columns and never runs the script, then fails at run
# time with ConformError when the harness's strict cast rejects the result.
apiVersion: v3.2.0
kind: DataContract
id: e2e_schema.py_bad_shape
name: py_bad_shape
version: "0"
description:
  purpose: python node whose script returns a non-conforming column type
team:
  name: e2e
customProperties:
  - {vendor: continuo, property: schedule, value: daily}
  - {vendor: continuo, property: criticality, value: SECONDARY}
  - {vendor: continuo, property: script, value: scripts/py_bad_shape.py}
  - vendor: continuo
    property: readQueries
    value:
      tables: select schemaname from pg_catalog.pg_tables
# The bindings below tie the table and its columns to the thing BadShapeRow of
# fixtures/ontology/ontology.yaml. An install whose ontology switch is off stores
# the contract without them.
schema:
  - name: py_bad_shape
    physicalType: table
    customProperties:
      - {vendor: continuo, property: entity, value: BadShapeRow}
    properties:
      - {name: id, physicalType: INTEGER, required: true, customProperties: [{vendor: continuo, property: property, value: BadShapeRow.id}]}
