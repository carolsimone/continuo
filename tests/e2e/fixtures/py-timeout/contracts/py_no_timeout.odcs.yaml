# Declares no timeout, so its topology entry carries none.
apiVersion: v3.2.0
kind: DataContract
id: e2e_schema.py_no_timeout
name: py_no_timeout
version: "0"
description:
  purpose: python node that declares no task timeout
team:
  name: e2e
customProperties:
  - {vendor: continuo, property: schedule, value: daily}
  - {vendor: continuo, property: criticality, value: SECONDARY}
  - {vendor: continuo, property: script, value: scripts/py_timeout.py}
  - vendor: continuo
    property: readQueries
    value:
      tables: select schemaname from pg_catalog.pg_tables
schema:
  - name: py_no_timeout
    physicalType: table
    properties:
      - {name: id, physicalType: INTEGER, required: true}
