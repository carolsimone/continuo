apiVersion: v1
kind: ConfigMap
metadata:
  name: dbt-commands
  namespace: default
data:
  dbt-commands.yaml: |
    default:
      run:        ["dbt", "run", "--select", "{{ node }}"]
      seed:       ["dbt", "seed", "--select", "{{ node }}"]
      snapshot:   ["dbt", "snapshot", "--select", "{{ node }}"]
      test:       ["dbt", "test", "--select", "{{ node }}"]
      build:      ["dbt", "build", "--select", "{{ node }}"]
      seed_build: ["dbt", "seed", "--select", "{{ node }}"]
      compile:
        command:       ["dbt", "compile", "--profiles-dir", "/project"]
        manifest_path: "/project/target/manifest.json"
    services:
      service-1:
        run:        ["wise-dbt", "run", "--select", "{{ node }}"]
        seed:       ["wise-dbt", "seed", "--select", "{{ node }}"]
        snapshot:   ["wise-dbt", "snapshot", "--select", "{{ node }}"]
        test:       ["wise-dbt", "test", "--select", "{{ node }}"]
        build:      ["wise-dbt", "build", "--select", "{{ node }}"]
        # seed_build reuses seed: plain dbt has no schema flag, so the always-set
        # DBT_TARGET_SCHEMA env var routes the candidate schema, not the argv.
        seed_build: ["wise-dbt", "seed", "--select", "{{ node }}"]
        compile:
          command:       ["wise-dbt", "compile", "--profiles-dir", "/project"]
          manifest_path: "/project/target/manifest.json"
        # wise-dbt leaves dbt's partial parse where dbt writes it (beside
        # manifest.json), so partial_parse_path derives and the cache is reusable.
        worker:
          wrapper_cache: required
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: executor-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor-controller
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  # A worker pool is a Deployment the reconciler creates and resizes.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update"]
  # Each pool's credential lives in its own Secret, written before the Deployment
  # that mounts it and rewritten when the pool is rotated.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  # A worker pod is stopped by name when the task it holds is taken back.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor-controller
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: executor-controller
subjects:
  - kind: ServiceAccount
    name: executor-controller
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-controller
  namespace: default
  labels:
    app: executor-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: executor-controller
  template:
    metadata:
      labels:
        app: executor-controller
    spec:
      serviceAccountName: executor-controller
      containers:
        - name: executor-controller
          image: continuo-executor-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/executor-controller/bin/executor-controller"]
          ports:
            - containerPort: 8084
              name: health
          env:
            - name: REDIS_HOST
              value: "${DOCKER_BRIDGE_IP}"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "continuo"
            - name: POSTGRES_HOST
              value: "${DOCKER_BRIDGE_IP}"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "continuo_executor"
            - name: POSTGRES_USER
              value: "continuo_svc"
            - name: POSTGRES_PASSWORD
              value: "continuo"
            - name: K8S_NAMESPACE
              value: "default"
            # Validation Job images are side-loaded into the kind node cache
            # (kind load), and the mutable service tags exist in no registry, so
            # validation pods must use the cached image. PullAlways would fail
            # with ErrImagePull here; production omits this and defaults to Always.
            - name: VALIDATION_IMAGE_PULL_POLICY
              value: "IfNotPresent"
            - name: VALIDATION_IMAGE
              value: "validation-runner:latest"
            - name: S3_SIDECAR_IMAGE
              value: "s3-sidecar:latest"
            - name: MAX_CONCURRENT_EXECUTIONS
              value: "50"
            # How production records reach dbt. jobs gives every task its own K8s
            # Job; workers has tasks claimed from a pool of reusable pods. The
            # overrides pin individual services: with the default jobs and an
            # empty map, no task is routed to workers, so no pool is registered
            # and no worker pod runs. The worker canary sets the overrides in its
            # own test setup rather than here.
            - name: EXECUTION_MODE
              value: "jobs"
            - name: EXECUTION_MODE_OVERRIDES_JSON
              value: "{}"
            # Worker pool tuning. The durations are Go duration strings; a bare
            # number is discarded for the in-code default.
            - name: WORKER_IDLE_TIMEOUT
              value: "300s"
            - name: WORKER_LEASE_TTL
              value: "60s"
            - name: WORKER_HEARTBEAT_INTERVAL
              value: "15s"
            - name: WORKER_CLAIM_WAIT
              value: "20s"
            # The base URL worker pods call back on, baked into every pod a pool
            # creates. Unlike the S3 endpoint below, this one is reached from
            # inside the cluster, so it resolves through the executor's own
            # ClusterIP Service rather than the docker bridge.
            - name: WORKER_CONTROL_PLANE_URL
              value: "http://executor-controller:8084"
            - name: HTTP_PORT
              value: "8084"
            - name: ENV
              value: "local"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DBT_POSTGRES_DB
              value: "continuo_dbt"
            - name: DBT_COMMANDS_CONFIG_PATH
              value: "/etc/continuo/dbt-commands.yaml"
            # S3 access for the validation Job: the executor forwards these into
            # each validation pod so validation_runner.py can fetch the candidate
            # SQL from CANDIDATE_SQL_URI. The endpoint points at LocalStack via the
            # docker bridge so the in-kind Job can reach it.
            - name: S3_ENDPOINT_URL
              value: "http://${DOCKER_BRIDGE_IP}:4566"
            - name: S3_BUCKET
              value: "continuo"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: CANCELLED_SCHEDULES_TTL_HOURS
              value: "24"
            - name: CANCELLED_SCHEDULES_SWEEP_INTERVAL_MINUTES
              value: "60"
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: dbt-commands
              mountPath: /etc/continuo
              readOnly: true
      volumes:
        - name: dbt-commands
          configMap:
            name: dbt-commands
---
apiVersion: v1
kind: Service
metadata:
  name: executor-controller
  namespace: default
spec:
  selector:
    app: executor-controller
  ports:
    - port: 8084
      targetPort: 8084
      name: health
  type: ClusterIP