apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-controller
  namespace: default
  labels:
    app: release-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-controller
  template:
    metadata:
      labels:
        app: release-controller
    spec:
      containers:
        - name: release-controller
          image: continuo-release-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/release-controller/bin/release-controller"]
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: REDIS_HOST
              value: "${DOCKER_BRIDGE_IP}"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "continuo"
            - name: POSTGRES_HOST
              value: "${DOCKER_BRIDGE_IP}"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "continuo_release"
            - name: POSTGRES_USER
              value: "continuo_svc"
            - name: POSTGRES_PASSWORD
              value: "continuo"
            - name: HTTP_PORT
              value: "8088"
            - name: ENV
              value: "local"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: release-controller
  namespace: default
spec:
  selector:
    app: release-controller
  ports:
    - port: 8088
      targetPort: 8088
      name: http
  type: ClusterIP
