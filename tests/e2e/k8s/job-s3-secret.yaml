# S3 keys for the Job pods. execution-controller names this Secret via
# JOB_S3_SECRET_NAME and every Job pod it creates reads AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY from it by reference, so no Job object holds a key as a
# value. In e2e/local the keys are the MinIO root keys of the compose stack.
apiVersion: v1
kind: Secret
metadata:
  name: continuo-job-s3
  namespace: default
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
