# Warehouse credentials for the validation runner pods. In production the operator
# owns this Secret; in e2e/local it is generated from the same values the executor
# previously forwarded inline, so validation targets the identical warehouse. The
# executor names it via VALIDATION_WAREHOUSE_SECRET and attaches it with envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: continuo-warehouse-validation
  namespace: default
type: Opaque
stringData:
  DBT_POSTGRES_HOST: "${DOCKER_BRIDGE_IP}"
  DBT_POSTGRES_PORT: "5432"
  DBT_POSTGRES_DB: "continuo_dbt"
  DBT_POSTGRES_USER: "continuo_svc"
  DBT_POSTGRES_PASSWORD: "continuo"
