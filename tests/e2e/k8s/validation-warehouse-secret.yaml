# Warehouse credentials for the validation runner pods. In production the operator
# owns this Secret; in e2e/local it names the shared dbt database (continuo_dbt on
# the compose Postgres, reached over the docker bridge), the one the run Jobs read,
# so validation targets the same warehouse. execution-controller names the Secret
# via VALIDATION_WAREHOUSE_SECRET and attaches it with envFrom; the postgres runner
# reads the POSTGRES_* keys.
apiVersion: v1
kind: Secret
metadata:
  name: continuo-warehouse-validation
  namespace: default
type: Opaque
stringData:
  POSTGRES_HOST: "${DOCKER_BRIDGE_IP}"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "continuo_dbt"
  POSTGRES_USER: "continuo_svc"
  POSTGRES_PASSWORD: "continuo"
