# dbt command dialect for executor-created Kubernetes Jobs.
#
# Every configured block must be COMPLETE: the `default` block is required and
# must define all seven command keys, and every `services.<name>` override must
# define all seven too. There is no per-key fallback — a team that overrides its
# CLI declares the full set so no job can fall through to a command its image
# cannot run. An incomplete block is a fatal boot error.
#
# Keys: run / seed / snapshot (selected by node_type for operation=run),
# test / build (node-agnostic operations), seed_build (candidate-schema seed leg;
# schema routed via the DBT_TARGET_SCHEMA env var + generate_schema_name macro),
# compile (validation-pipeline leg: command + absolute manifest_path).
# Placeholders: {{ node }} (required in run/seed/snapshot/test/build/seed_build),
# {{ target_schema }} (seed_build only).
#
# Optional per block:
#   compile.partial_parse_path — absolute path where the team's tool leaves dbt's
#     partial parse. Omit it (as below) when the tool leaves it where dbt writes
#     it: beside manifest.json.
#
# Optional per services.<name> block only:
#   worker.wrapper_cache — "required" when the team's wrapper reliably writes a
#     reusable partial parse at that path, "opaque" when its cache behaviour is
#     unknown. Absent, or a worker block with no wrapper_cache, means opaque:
#     a reusable parse cache is only assumed when the owning team claims one.
#     It describes one team's wrapper, so a worker block on the `default` block
#     (which describes plain dbt) is a fatal boot error. Native dbt ignores the
#     key — it changes nothing about the argv that runs.
default:
  run:        ["dbt", "run", "--select", "{{ node }}"]
  seed:       ["dbt", "seed", "--select", "{{ node }}"]
  snapshot:   ["dbt", "snapshot", "--select", "{{ node }}"]
  test:       ["dbt", "test", "--select", "{{ node }}"]
  build:      ["dbt", "build", "--select", "{{ node }}"]
  seed_build: ["dbt", "seed", "--select", "{{ node }}"]
  compile:
    command:       ["dbt", "compile", "--profiles-dir", "/project"]
    manifest_path: "/project/target/manifest.json"
