version: "2"

linters:
  # `standard` = the default set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose  # HTTP response bodies must be closed
    - gosec      # security-focused static analysis
  exclusions:
    # Skip files carrying the "// Code generated ... DO NOT EDIT." header.
    generated: lax
    # Explicit safety net for generated code without a header.
    paths:
      - cli/proto          # generated gRPC stubs (state, orchestrator)
      - ".*\\.gen\\.go$"   # e.g. pkg/streams/streams.gen.go
      - ".*\\.pb\\.go$"    # protobuf stubs
